name: AI Short Story Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate, critique, repair and plan story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p output .github/data

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          HISTORY_FILE = ".github/data/story_history.json"

          MIN_WORDS = 105
          MAX_WORDS = 405
          WORDS_PER_MINUTE = 135
          MIN_DURATION = 45
          MAX_DURATION = 180

          API_KEY = os.environ["GROQ_API_KEY"]

          rng = random.SystemRandom()

          # ============================================================
          # CREATIVE VARIETY
          # ============================================================

          STORY_MODES = [
              "quiet human drama",
              "unexpected kindness",
              "second chance",
              "small sacrifice with a big consequence",
              "regret and reconciliation",
              "ordinary person facing an impossible choice",
              "misunderstanding that becomes meaningful",
              "quiet perseverance after failure",
              "a promise almost broken",
              "unexpected courage",
              "a small decision changing two lives",
              "an overlooked person finally being seen",
              "a lost item revealing an important truth",
              "a difficult goodbye",
              "a reunion after years apart",
              "a stranger helping at exactly the right moment",
              "a mistake leading to an unexpected opportunity",
              "quiet honesty",
              "forgiveness after a misunderstanding",
              "someone choosing kindness when it costs them"
          ]

          EMOTIONS = [
              "warmth",
              "hope",
              "regret",
              "relief",
              "wonder",
              "gratitude",
              "sadness turning into comfort",
              "quiet joy",
              "fear turning into courage",
              "belonging",
              "forgiveness",
              "surprise",
              "nostalgia",
              "determination",
              "compassion"
          ]

          HOOKS = [
              "start at the most intriguing moment",
              "start with a specific time or place",
              "start with a surprising action",
              "start with a concrete mystery",
              "start with a consequence before explaining its cause",
              "start with an unusual object and why it matters",
              "start with a promise that seems impossible",
              "start with someone making a decision they may regret"
          ]

          SETTINGS = [
              "a nearly empty bus station before sunrise",
              "a small neighborhood repair shop",
              "a rainy apartment building hallway",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a community clinic waiting room",
              "a laundromat on a cold evening",
              "a tiny apartment above a busy street",
              "a corner bakery before opening",
              "a local market just before closing",
              "a parking lot during a summer storm",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a neighborhood bus stop at midnight",
              "a small hotel lobby",
              "a mechanic's garage at closing time"
          ]

          CONFLICTS = [
              "a missed opportunity",
              "a financial problem that must be hidden",
              "a lost item with emotional value",
              "an important message that never arrived",
              "a promise made to someone who is no longer around",
              "a difficult decision between pride and kindness",
              "a misunderstanding that risks a relationship",
              "one last attempt after repeated failure",
              "helping someone without being noticed",
              "an impossible deadline",
              "a goodbye neither person is ready for",
              "a small mistake with unexpectedly large consequences",
              "deciding whether to tell an uncomfortable truth",
              "choosing between convenience and doing what is right"
          ]

          TWISTS = [
              "the person who seemed unimportant was the key to the solution",
              "the ignored object carried the real emotional meaning",
              "the protagonist misunderstood what the other person needed",
              "an earlier kindness quietly returns at the perfect moment",
              "the apparent failure prevents a worse outcome",
              "the person receiving help had helped the protagonist first",
              "a small sacrifice restores something much more important",
              "the final detail changes the meaning of the opening",
              "an ordinary object reveals an unexpected connection",
              "the protagonist discovers the other person planned for them too"
          ]

          ENDINGS = [
              "a quiet emotional realization",
              "a visual callback to the opening moment",
              "a brief line that changes the meaning of the story",
              "a small action instead of a speech",
              "an earned moment of relief",
              "an understated act of forgiveness",
              "a hopeful but believable final image",
              "a final detail that makes the viewer rethink the story"
          ]

          brief = {
              "mode": rng.choice(STORY_MODES),
              "emotion": rng.choice(EMOTIONS),
              "hook": rng.choice(HOOKS),
              "setting": rng.choice(SETTINGS),
              "conflict": rng.choice(CONFLICTS),
              "twist": rng.choice(TWISTS),
              "ending": rng.choice(ENDINGS),
          }

          # ============================================================
          # HISTORY
          # ============================================================

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(HISTORY_FILE, encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          previous = "\n".join(
              f"- {item.get('title', '')} | {item.get('premise', '')}"
              for item in history[-40:]
          ) or "NONE"

          # ============================================================
          # STORY SCHEMA
          # ============================================================

          story_schema = {
              "type": "object",
              "properties": {
                  "title": {
                      "type": "string"
                  },
                  "hook": {
                      "type": "string"
                  },
                  "setting": {
                      "type": "string"
                  },
                  "conflict": {
                      "type": "string"
                  },
                  "turning_point": {
                      "type": "string"
                  },
                  "payoff": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {
                                  "type": "string"
                              },
                              "role": {
                                  "type": "string"
                              },
                              "visual_identity": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "name",
                              "role",
                              "visual_identity"
                          ],
                          "additionalProperties": False
                      }
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {
                                  "type": "integer"
                              },
                              "narration": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "scene",
                              "narration"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "conflict",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes"
              ],
              "additionalProperties": False
          }

          # ============================================================
          # CRITIC SCHEMA
          # ============================================================

          critic_schema = {
              "type": "object",
              "properties": {
                  "pass": {
                      "type": "boolean"
                  },
                  "hook_score": {
                      "type": "integer"
                  },
                  "originality_score": {
                      "type": "integer"
                  },
                  "believability_score": {
                      "type": "integer"
                  },
                  "emotional_score": {
                      "type": "integer"
                  },
                  "conflict_score": {
                      "type": "integer"
                  },
                  "ending_score": {
                      "type": "integer"
                  },
                  "visual_score": {
                      "type": "integer"
                  },
                  "issues": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  }
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues"
              ],
              "additionalProperties": False
          }

          # ============================================================
          # VISUAL SCHEMA
          # ============================================================

          visual_schema = {
              "type": "object",
              "properties": {
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {
                                  "type": "integer"
                              },
                              "visual_prompt": {
                                  "type": "string"
                              },
                              "camera": {
                                  "type": "string"
                              },
                              "on_screen_text": {
                                  "type": "string"
                              },
                              "sfx": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "scene",
                              "visual_prompt",
                              "camera",
                              "on_screen_text",
                              "sfx"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "scenes"
              ],
              "additionalProperties": False
          }

          # ============================================================
          # GROQ CALL
          # ============================================================

          def call_groq(prompt, schema, temperature, max_tokens):
              payload = {
                  "model": "openai/gpt-oss-20b",
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  print(f"HTTP ERROR: {e.code}")
                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
                  raise

              message = result["choices"][0]["message"]

              content = message.get("content", "")

              if not content:
                  raise RuntimeError(
                      "Groq returned empty content."
                  )

              return json.loads(content)

          # ============================================================
          # LOCAL STORY CHECKS
          # ============================================================

          def local_story_checks(story):
              scenes = story["scenes"]

              if not 7 <= len(scenes) <= 18:
                  raise ValueError(
                      f"Expected 7-18 scenes, got {len(scenes)}."
                  )

              word_counts = [
                  len(scene["narration"].split())
                  for scene in scenes
              ]

              total_words = sum(word_counts)

              if not MIN_WORDS <= total_words <= MAX_WORDS:
                  raise ValueError(
                      f"Story has {total_words} words; "
                      f"allowed {MIN_WORDS}-{MAX_WORDS}."
                  )

              text = (
                  story["title"] + " " +
                  story["hook"] + " " +
                  story["turning_point"] + " " +
                  story["payoff"] + " " +
                  " ".join(
                      scene["narration"]
                      for scene in scenes
                  )
              ).lower()

              banned = [
                  "believe in yourself",
                  "never give up",
                  "the human spirit",
                  "everything happens for a reason",
                  "when one door closes",
                  "follow your dreams",
                  "little did they know",
                  "a testament to",
                  "in the end, it was not about",
                  "the power of hope"
              ]

              found = [
                  phrase
                  for phrase in banned
                  if phrase in text
              ]

              if found:
                  raise ValueError(
                      "Cliche phrase detected: " +
                      ", ".join(found)
                  )

              # Basic guards against the specific implausible patterns
              # we've already encountered.
              implausible = [
                  "trapped in a freezer",
                  "inside a freezer",
                  "stuck in a freezer",
                  "locked inside a freezer"
              ]

              found = [
                  phrase
                  for phrase in implausible
                  if phrase in text
              ]

              if found:
                  raise ValueError(
                      "Implausible premise detected: " +
                      ", ".join(found)
                  )

              return word_counts, total_words

          # ============================================================
          # STORY GENERATION
          # ============================================================

          story_prompt = f"""
          Create ONE completely original cinematic emotional story for a
          vertical YouTube Short.

          This must feel like a real short film in miniature,
          NOT a motivational poem.

          CREATIVE BRIEF

          Story mode:
          {brief['mode']}

          Primary emotion:
          {brief['emotion']}

          Hook style:
          {brief['hook']}

          Setting:
          {brief['setting']}

          Conflict seed:
          {brief['conflict']}

          Twist direction:
          {brief['twist']}

          Ending style:
          {brief['ending']}

          RECENT STORIES:

          {previous}

          Do NOT repeat a recent story's:
          - premise
          - setting
          - central object
          - title pattern
          - emotional beat
          - twist
          - ending idea

          STORY REQUIREMENTS

          - 105-405 spoken words.
          - Natural runtime roughly 45-180 seconds.
          - Do not pad a short story.
          - Do not stretch a complete story.
          - Give the protagonist a concrete goal or problem.
          - Make something concrete happen.
          - Create a believable conflict.
          - Give the protagonist a meaningful choice,
            consequence, or sacrifice.
          - Build logical escalation.
          - Make the turning point earned.
          - Make the ending pay off the setup.
          - Let the meaning emerge naturally from the events.
          - Prefer one strong plot.
          - Every scene must advance the plot.
          - Keep all events physically plausible.
          - No unexplained miracles.
          - No absurd coincidences.
          - No random charity/medical/helping reveal added only
            to manufacture emotion.
          - No celebrities.
          - No existing fictional characters.
          - No movie plots.
          - No song lyrics.
          - No copied internet stories.
          - No calls to action.

          AVOID:

          "believe in yourself"
          "never give up"
          "the human spirit"
          "everything happens for a reason"
          "when one door closes"
          "follow your dreams"
          "little did they know"
          "a testament to"

          FACELESS DESIGN

          The final video must work without identifiable faces.

          Use meaningful actions, hands, silhouettes, backs,
          objects, body language, shadows, reflections and environments.

          Create 7-18 scenes.

          Each scene must contain only:
          - scene number
          - narration

          Return ONLY the story JSON.
          """

          story = call_groq(
              story_prompt,
              story_schema,
              0.85,
              6500
          )

          word_counts, total_words = local_story_checks(story)

          # ============================================================
          # FIRST CRITIC
          # ============================================================

          critic_prompt = f"""
          You are a ruthless senior short-film editor.

          Evaluate this proposed YouTube Short for real viewer enjoyment.

          STORY:

          {json.dumps(story, ensure_ascii=False)}

          Score every category from 0 to 10:

          - hook
          - originality
          - believability
          - emotional impact
          - conflict
          - ending
          - visual potential

          PASS only if ALL scores are at least 7.

          Also fail it if there is:
          - a serious plot hole
          - an implausible premise
          - an obvious/no-choice conflict
          - a disconnected reveal
          - a pasted-on moral
          - generic AI motivational language
          - weak cause-and-effect
          - a weak or predictable hook
          - a weak ending
          - no meaningful protagonist choice
          - major repetition with the supplied recent stories

          Be strict.

          Return ONLY critic JSON.
          """

          critique = call_groq(
              critic_prompt,
              critic_schema,
              0.2,
              2500
          )

          # ============================================================
          # AUTOMATIC REPAIR
          # ============================================================

          if not critique["pass"]:
              print("========================================")
              print("⚠️ STORY FAILED FIRST QUALITY REVIEW")
              print("========================================")
              print(
                  "Issues:",
                  json.dumps(
                      critique["issues"],
                      ensure_ascii=False
                  )
              )

              repair_prompt = f"""
              You are the final story editor.

              Rewrite the supplied story to fix EVERY issue listed
              by the critic.

              ORIGINAL STORY:

              {json.dumps(story, ensure_ascii=False)}

              CRITIC REPORT:

              {json.dumps(critique, ensure_ascii=False)}

              Every item in the critic's "issues" list is a mandatory
              repair requirement.

              FINAL QUALITY BAR:

              - believable human situation
              - strong first line
              - specific protagonist
              - concrete problem or goal
              - meaningful conflict
              - real choice or consequence
              - logical escalation
              - earned turning point
              - satisfying payoff
              - ending connected to the opening
              - no fake moral
              - no disconnected reveal
              - no impossible premise
              - no generic motivational writing
              - no filler
              - no calls to action
              - naturally filmable without identifiable faces
              - 105-405 spoken words
              - 7-18 scenes

              Do NOT merely rephrase weak passages.
              Fix the underlying story.

              Return ONLY the corrected story JSON.
              """

              story = call_groq(
                  repair_prompt,
                  story_schema,
                  0.65,
                  6500
              )

              word_counts, total_words = local_story_checks(
                  story
              )

              # ========================================================
              # SECOND CRITIC
              # ========================================================

              second_critic_prompt = f"""
              Perform the FINAL publication-readiness review.

              STORY:

              {json.dumps(story, ensure_ascii=False)}

              Be extremely strict.

              PASS requires every score to be 7 or higher and no
              serious issue.

              Check especially:

              1. Does the hook create curiosity immediately?
              2. Is the protagonist's situation specific?
              3. Is the conflict genuinely difficult?
              4. Is the turning point caused by earlier events?
              5. Does the ending resolve the central problem?
              6. Does the emotional payoff feel earned?
              7. Is the story believable?
              8. Does it avoid generic AI motivation?
              9. Could viewers visualize it without faces?
              10. Is it materially different from common clichés?

              Return ONLY critic JSON.
              """

              final_critique = call_groq(
                  second_critic_prompt,
                  critic_schema,
                  0.15,
                  2500
              )

              if not final_critique["pass"]:
                  raise RuntimeError(
                      "Story failed FINAL quality review. "
                      "Issues: " +
                      json.dumps(
                          final_critique["issues"],
                          ensure_ascii=False
                      )
                  )

              quality_report = final_critique

          else:
              quality_report = critique

          # ============================================================
          # VISUAL PLAN
          # ============================================================

          visual_schema_input = {
              "title": story["title"],
              "setting": story["setting"],
              "characters": story["characters"],
              "scenes": story["scenes"]
          }

          visual_prompt = f"""
          Create the production-ready visual plan for this APPROVED
          original faceless YouTube Short.

          STORY:

          {json.dumps(
              visual_schema_input,
              ensure_ascii=False
          )}

          Create exactly one visual plan for every scene.

          RULES:

          - Every visual must directly match the narration.
          - Never invent a new event.
          - Never contradict the story.
          - Never require a visible identifiable face.
          - Prefer backs, silhouettes, hands, objects, reflections,
            shadows, close-ups, wide environmental shots and
            over-the-shoulder framing.
          - Maintain the same character clothing, props, location
            and time of day.
          - Make prompts cinematic and production-ready.
          - Specify subject, action, environment, lighting,
            mood and composition.
          - Camera movement must be physically plausible.
          - SFX must match the action.
          - On-screen text should be short and used sparingly.

          Return ONLY the visual-plan JSON.
          """

          visuals = call_groq(
              visual_prompt,
              visual_schema,
              0.45,
              5000
          )

          visual_by_number = {
              item["scene"]: item
              for item in visuals["scenes"]
          }

          if len(visual_by_number) != len(story["scenes"]):
              raise RuntimeError(
                  "Visual scene count does not match story scene count."
              )

          for scene in story["scenes"]:
              number = scene["scene"]

              if number not in visual_by_number:
                  raise RuntimeError(
                      f"Missing visual plan for scene {number}."
                  )

              scene.update(
                  visual_by_number[number]
              )

          # ============================================================
          # ADAPTIVE RUNTIME
          # ============================================================

          estimated_duration = round(
              total_words /
              WORDS_PER_MINUTE *
              60
          )

          estimated_duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  estimated_duration
              )
          )

          base_duration = len(story["scenes"]) * 3

          if base_duration > estimated_duration:
              raise RuntimeError(
                  "Too many scenes for estimated runtime."
              )

          extra_duration = (
              estimated_duration -
              base_duration
          )

          weights = [
              len(scene["narration"].split())
              for scene in story["scenes"]
          ]

          weight_sum = sum(weights)

          raw = [
              extra_duration * weight / weight_sum
              for weight in weights
          ]

          extras = [
              int(value)
              for value in raw
          ]

          leftover = (
              extra_duration -
              sum(extras)
          )

          order = sorted(
              range(len(raw)),
              key=lambda i:
                  raw[i] - extras[i],
              reverse=True
          )

          for index in order[:leftover]:
              extras[index] += 1

          durations = [
              3 + value
              for value in extras
          ]

          for index, scene in enumerate(
              story["scenes"]
          ):
              scene["scene"] = index + 1
              scene["duration_seconds"] = durations[index]

          story["story"] = " ".join(
              scene["narration"].strip()
              for scene in story["scenes"]
          )

          story["word_count"] = total_words
          story["estimated_duration_seconds"] = estimated_duration
          story["quality_checked"] = True
          story["quality_scores"] = quality_report

          # ============================================================
          # SAVE FILES
          # ============================================================

          with open(
              "output/story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(story["title"])

          with open(
              "output/script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(story["story"])

          with open(
              "output/description.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(story["description"])

          with open(
              "output/scenes.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story["scenes"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # HISTORY
          # ============================================================

          premise = (
              story["setting"] +
              " | " +
              story["conflict"] +
              " | " +
              story["turning_point"]
          )

          fingerprint = hashlib.sha256(
              (
                  story["title"] +
                  "|" +
                  premise
              ).encode("utf-8")
          ).hexdigest()[:16]

          history.append(
              {
                  "title": story["title"],
                  "premise": premise,
                  "fingerprint": fingerprint,
                  "timestamp": int(time.time())
              }
          )

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history[-50:],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("========================================")
          print("✅ STORY PASSED FULL QUALITY PIPELINE")
          print("========================================")
          print("Title:", story["title"])
          print("Scenes:", len(story["scenes"]))
          print("Words:", total_words)
          print(
              "Estimated duration:",
              estimated_duration,
              "seconds"
          )
          print("Durations:", durations)
          print("Quality checked: YES")
          print("========================================")
          PY

      - name: Save story history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/data/story_history.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update AI story history"
            git push
          fi

      - name: Upload story package
        uses: actions/upload-artifact@v7
        with:
          name: ai-short-story
          path: output/
          retention-days: 7
