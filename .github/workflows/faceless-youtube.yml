name: AI Short Story Generator

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Generate original 60-second story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p output

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          TARGET_SECONDS = 58

          api_key = os.environ["GROQ_API_KEY"]

          schema = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "story": {"type": "string"},
                  "ending": {"type": "string"},
                  "description": {"type": "string"},

                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": [
                              "name",
                              "role",
                              "visual_identity"
                          ],
                          "additionalProperties": False
                      }
                  },

                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                              "visual_prompt": {"type": "string"},
                              "camera": {"type": "string"},
                              "on_screen_text": {"type": "string"},
                              "sfx": {"type": "string"}
                          },
                          "required": [
                              "scene",
                              "narration",
                              "visual_prompt",
                              "camera",
                              "on_screen_text",
                              "sfx"
                          ],
                          "additionalProperties": False
                      }
                  }
              },

              "required": [
                  "title",
                  "hook",
                  "story",
                  "ending",
                  "description",
                  "characters",
                  "scenes"
              ],

              "additionalProperties": False
          }

          system_prompt = """
          You are an expert writer of original cinematic motivational
          micro-stories for YouTube Shorts.

          Create completely ORIGINAL fiction.

          The story must:
          - feel human and emotionally believable
          - open with a strong curiosity hook
          - contain one clear conflict
          - build emotional tension
          - contain a meaningful turning point
          - end with a memorable emotional payoff
          - be advertiser-friendly
          - avoid graphic violence
          - avoid celebrities
          - avoid famous fictional characters
          - avoid copyrighted universes
          - avoid copied internet stories
          - avoid generic quote compilations
          - avoid preachy writing

          The video is FACELESS.

          Visuals should use:
          - silhouettes
          - backs of people
          - hands
          - close-ups
          - objects
          - environments
          - shadows
          - reflections
          - cinematic wide shots
          - over-the-shoulder framing without visible faces

          Maintain visual continuity across scenes.

          IMPORTANT:
          Do not calculate scene durations.
          Only provide scene narration and visual instructions.
          """

          user_prompt = """
          Create one original emotional/motivational YouTube Short.

          TARGET:
          About 55-60 seconds when narrated naturally.

          NARRATION:
          Target approximately 125-140 spoken words total.

          STRUCTURE:
          1. Immediate hook
          2. Situation
          3. Conflict
          4. Escalation
          5. Turning point
          6. Emotional payoff
          7. Memorable final line

          SCENES:
          Create 8-10 scenes.
          Each scene must contain only the narration assigned to that scene
          plus its visual instructions.

          Do NOT provide duration_seconds.

          Avoid:
          - "Hey guys"
          - filler
          - generic motivational quotes
          - like/subscribe requests
          - engagement bait
          """

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "reasoning_effort": "low",
              "reasoning_format": "hidden",
              "temperature": 0.85,
              "max_completion_tokens": 4500,
              "response_format": {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "short_story_package",
                      "strict": True,
                      "schema": schema
                  }
              }
          }

          request = urllib.request.Request(
              API_URL,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "Aladdin-YT-Auto/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )
          except urllib.error.HTTPError as e:
              print(f"HTTP ERROR: {e.code}")
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )
              raise

          message = result["choices"][0]["message"]
          content = message.get("content", "")

          if not content:
              raise RuntimeError("Groq returned empty content.")

          data = json.loads(content)

          scenes = data["scenes"]

          if not 8 <= len(scenes) <= 10:
              raise RuntimeError(
                  f"Expected 8-10 scenes, got {len(scenes)}."
              )

          # ------------------------------------------------------------
          # Build complete narration from scenes.
          # ------------------------------------------------------------

          scene_words = []

          for scene in scenes:
              text = scene["narration"].strip()
              words = len(text.split())

              if words < 2:
                  raise RuntimeError(
                      f"Scene {scene['scene']} has too little narration."
                  )

              scene_words.append(words)

          total_words = sum(scene_words)

          if not 115 <= total_words <= 155:
              raise RuntimeError(
                  f"Generated narration has {total_words} words. "
                  f"Expected approximately 125-140."
              )

          # ------------------------------------------------------------
          # Deterministically assign EXACTLY 58 seconds.
          #
          # Approx. 2 sec minimum per scene, remaining time distributed
          # according to narration length.
          # ------------------------------------------------------------

          number_of_scenes = len(scenes)

          minimum_per_scene = 2

          if number_of_scenes * minimum_per_scene >= TARGET_SECONDS:
              raise RuntimeError(
                  "Too many scenes for the target duration."
              )

          remaining = TARGET_SECONDS - (
              number_of_scenes * minimum_per_scene
          )

          raw_extra = [
              remaining * (w / total_words)
              for w in scene_words
          ]

          extra = [int(x) for x in raw_extra]

          leftover = remaining - sum(extra)

          fractions = sorted(
              range(number_of_scenes),
              key=lambda i: raw_extra[i] - extra[i],
              reverse=True
          )

          for i in fractions[:leftover]:
              extra[i] += 1

          durations = [
              minimum_per_scene + x
              for x in extra
          ]

          if sum(durations) != TARGET_SECONDS:
              raise RuntimeError(
                  "Internal duration calculation failed."
              )

          # ------------------------------------------------------------
          # Save final scene data.
          # ------------------------------------------------------------

          for index, scene in enumerate(scenes):
              scene["scene"] = index + 1
              scene["duration_seconds"] = durations[index]

          output_dir = "output"

          with open(
              f"{output_dir}/story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              f"{output_dir}/title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data["title"])

          with open(
              f"{output_dir}/script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data["story"])

          with open(
              f"{output_dir}/description.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data["description"])

          with open(
              f"{output_dir}/scenes.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  scenes,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("===================================")
          print("✅ STORY GENERATED")
          print("===================================")
          print("Title:", data["title"])
          print("Scenes:", len(scenes))
          print("Words:", total_words)
          print("Duration:", sum(durations), "seconds")
          print("Durations:", durations)
          print("===================================")
          PY

      - name: Upload story package
        uses: actions/upload-artifact@v4
        with:
          name: ai-short-story
          path: output/
          retention-days: 7
