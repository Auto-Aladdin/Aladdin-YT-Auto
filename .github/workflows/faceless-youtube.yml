name: Generate Story

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate publication-ready story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"
          HISTORY_FILE = Path(".github/data/story_history.json")
          OUTPUT_DIR = Path("story-output")

          MIN_WORDS = 105
          MAX_WORDS = 405
          TARGET_MIN_WORDS = 140
          TARGET_MAX_WORDS = 300
          WPM = 135
          MIN_DURATION = 45
          MAX_DURATION = 180

          # Keep the entire run small enough to avoid self-inflicted 429s.
          # Normal path: 4 API calls.
          # 1) architect/story draft
          # 2) critic
          # 3) repair/polish if needed
          # 4) final critic
          MAX_API_CALLS = 6
          MAX_REPAIR_ROUNDS = 2

          API_KEY = os.environ["GROQ_API_KEY"]
          rng = random.SystemRandom()

          MODES = [
              "quiet human drama",
              "regret after a practical mistake",
              "second chance earned through competence",
              "an ordinary person protecting something valuable",
              "a difficult promise under a deadline",
              "quiet reconciliation without a speech",
              "a person forced to admit they were wrong",
              "a small sacrifice with a concrete consequence",
              "unexpected responsibility",
              "a private choice that changes a relationship",
              "a practical decision with an emotional cost",
              "a routine task that exposes a hidden relationship",
          ]

          EMOTIONS = [
              "warmth",
              "relief",
              "regret",
              "gratitude",
              "wonder",
              "belonging",
              "bittersweet acceptance",
              "quiet joy",
              "determination",
              "compassion",
              "forgiveness",
              "surprise",
          ]

          SETTINGS = [
              "a small neighborhood repair shop",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a laundromat on a cold evening",
              "a corner bakery before opening",
              "a local market just before closing",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a mechanic's garage at closing time",
              "a small photography shop",
              "an apartment rooftop at sunset",
              "a public bus depot during a storm",
              "a neighborhood tailor's shop",
              "a small hardware store near closing",
          ]

          CONFLICTS = [
              "keeping a valuable item would solve the protagonist's immediate problem, but returning it costs them something real",
              "the protagonist must admit a mistake before a deadline or someone else will pay for it",
              "the protagonist has one chance to protect both a promise and an important responsibility, but the two demands collide",
              "a practical task becomes a choice between reputation and honesty",
              "helping one person means giving up a concrete opportunity the protagonist badly needs",
              "the protagonist discovers information that can protect them but would unfairly damage someone else",
              "a professional error can either be hidden temporarily or confessed immediately at a real personal cost",
              "the protagonist must choose between convenience and keeping a commitment that only they can honor",
              "two people need opposite outcomes and the protagonist's decision has an immediate consequence",
          ]

          BANNED_CLICHES = [
              "believe in yourself",
              "never give up",
              "the human spirit",
              "everything happens for a reason",
              "when one door closes",
              "follow your dreams",
              "little did they know",
              "the power of hope",
              "sometimes life",
              "in the end, it was not about",
          ]

          BANNED_PATTERNS = [
              "child in danger",
              "children in danger",
              "terminal illness",
              "hospital reveal",
              "anonymous benefactor",
              "lottery ticket",
              "hidden fortune",
              "miraculous rescue",
              "magic rescue",
              "missing note",
              "missing letter",
              "stranger was secretly",
              "trapped in a freezer",
              "inside a freezer",
              "stuck in a freezer",
              "locked inside a freezer",
          ]

          STORY_SCHEMA = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "protagonist": {"type": "string"},
                  "desire": {"type": "string"},
                  "stakes": {"type": "string"},
                  "obstacle": {"type": "string"},
                  "choice": {"type": "string"},
                  "cost": {"type": "string"},
                  "consequence": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"},
                          },
                          "required": ["name", "role", "visual_identity"],
                          "additionalProperties": False,
                      },
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                          },
                          "required": ["scene", "narration"],
                          "additionalProperties": False,
                      },
                  },
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "protagonist",
                  "desire",
                  "stakes",
                  "obstacle",
                  "choice",
                  "cost",
                  "consequence",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes",
              ],
              "additionalProperties": False,
          }

          CRITIC_SCHEMA = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "emotional_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "ending_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues",
              ],
              "additionalProperties": False,
          }

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()

          # Keep history compact. Only high-level premise information is useful
          # for novelty checking; do not resend entire old stories to Groq.
          recent = history[-25:]
          recent_text = "\n".join(
              f"- {item.get('title', '')} | {item.get('premise', '')} | {item.get('setting', '')}"
              for item in recent
          ) or "NONE"

          api_calls = 0

          def _header_float(headers, name, default):
              value = headers.get(name)
              if not value:
                  return default
              try:
                  return float(str(value).strip().rstrip('s'))
              except Exception:
                  return default

          def call_groq(prompt, schema, temperature=0.6, max_tokens=4200):
              nonlocal api_calls

              if api_calls >= MAX_API_CALLS:
                  raise RuntimeError("Internal API-call budget exhausted.")

              api_calls += 1

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a senior short-film writer. "
                              "Return ONLY valid JSON matching the supplied schema. "
                              "Never return markdown or commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema,
                      },
                  },
              }

              attempts = 0

              while True:
                  attempts += 1
                  request = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/3.0",
                      },
                      method="POST",
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          body = json.loads(response.read().decode("utf-8"))
                      content = body["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")
                      return json.loads(content)

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")

                      if exc.code == 429:
                          if attempts >= 2:
                              raise RuntimeError(
                                  "Groq rate limit remained active after one "
                                  "header-guided retry. Response: " + raw
                              )

                          retry_after = _header_float(exc.headers, "retry-after", 10.0)
                          reset_tokens = _header_float(
                              exc.headers,
                              "x-ratelimit-reset-tokens",
                              10.0,
                          )

                          wait_seconds = max(5.0, retry_after, reset_tokens) + 1.0
                          wait_seconds = min(wait_seconds, 75.0)

                          print(
                              f"Groq HTTP 429. Waiting {wait_seconds:.1f}s "
                              f"using Groq rate-limit headers..."
                          )
                          time.sleep(wait_seconds)
                          continue

                      if exc.code in (500, 502, 503, 504) and attempts < 2:
                          print(f"Groq HTTP {exc.code}. Retrying once in 5s...")
                          time.sleep(5)
                          continue

                      raise RuntimeError(
                          f"Groq HTTP {exc.code}: {raw}"
                      )

          def word_count(story):
              return sum(
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              )

          def local_story_check(story):
              scenes = story.get("scenes", [])

              if not 7 <= len(scenes) <= 18:
                  return "Story must contain 7-18 scenes."

              numbers = [s.get("scene") for s in scenes]
              if numbers != list(range(1, len(scenes) + 1)):
                  return "Scene numbers must be consecutive starting at 1."

              words = word_count(story)
              if words > MAX_WORDS:
                  return f"Story is too long at {words} words."

              text = json.dumps(story, ensure_ascii=False).lower()

              for phrase in BANNED_CLICHES:
                  if phrase in text:
                      return f"Cliche detected: {phrase}"

              for phrase in BANNED_PATTERNS:
                  if phrase in text:
                      return f"Banned story pattern detected: {phrase}"

              required_quality = [
                  ("protagonist", 5),
                  ("desire", 5),
                  ("stakes", 6),
                  ("obstacle", 6),
                  ("choice", 6),
                  ("cost", 6),
                  ("consequence", 6),
                  ("turning_point", 6),
                  ("payoff", 6),
              ]

              for field, minimum_words in required_quality:
                  if len(str(story.get(field, "")).split()) < minimum_words:
                      return f"{field} is too vague."

              return None

          def make_master_prompt():
              seed = {
                  "mode": rng.choice(MODES),
                  "emotion": rng.choice(EMOTIONS),
                  "setting": rng.choice(SETTINGS),
                  "conflict": rng.choice(CONFLICTS),
              }

              return f"""
          Build ONE publication-ready original emotional micro-story for a
          faceless vertical YouTube Short.

          CREATIVE SEED:
          {json.dumps(seed, ensure_ascii=False)}

          RECENT CHANNEL HISTORY:
          {recent_text}

          First, privately test several possible premises. Do NOT output them.
          Choose the strongest premise and then write the final story directly.

          The chosen story must satisfy ALL of these:

          1. The protagonist is a specific ordinary person. Give them a concrete
             job, responsibility, habit, relationship, skill, or past mistake.

          2. The protagonist wants something concrete TODAY.

          3. The obstacle is external and specific. It must force a real choice.

          4. The choice must have an actual cost. "Do the right thing" by itself
             is not a conflict.

          5. Cause and effect must be visible: event -> choice -> consequence ->
             new problem -> turning point -> resolution.

          6. The turning point must be seeded by an earlier object, action,
             promise, mistake, skill, or piece of information.

          7. The ending must solve or transform the central problem and pay off
             something introduced near the beginning.

          8. The story should contain one distinctive visual motif tied directly
             to the conflict, not generic rain, handwriting, ink, clocks, kites,
             letters, photographs, or random objects.

          9. Avoid these common AI-story patterns:
             child in danger, hospital reveal, terminal illness, anonymous donor,
             lottery ticket, hidden fortune, magical rescue, miraculous coincidence,
             convenient stranger, secret benefactor, missing letter/note, sudden
             promotion because of one small action, and "doing the right thing"
             with no concrete personal cost.

          10. Avoid love letters, lost-photo plots, recipe plots, bakery plots,
              violinist plots, kite plots, bus-station-departure plots, and generic
              post-office misunderstandings unless radically transformed.

          11. No moral speech. No generic motivational paragraph. Let the events
              carry the emotion.

          12. Faceless filming must work naturally. Use hands, backs, silhouettes,
              clothing, objects, body language, reflections, practical actions,
              and environments rather than identifiable faces.

          13. Target 140-300 spoken words. Never pad. Absolute allowed range is
              105-405 words.

          14. Use 7-12 scenes unless more are genuinely necessary.

          15. The hook must create a concrete unanswered question within the first
              sentence or action. A generic trembling hand, arrival scene, or
              ordinary opening is not enough.

          Return ONLY the final story JSON.
          """

          def make_critic_prompt(story):
              return f"""
          Ruthlessly review the following proposed YouTube Short as a professional
          short-film editor.

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Score 0-10 for:
          hook, originality, believability, emotional impact, conflict, ending,
          visual potential.

          PASS ONLY when EVERY score is >= 7.

          Be especially strict about:
          - generic opening
          - generic protagonist
          - artificial moral dilemmas
          - no meaningful personal cost
          - random coincidence
          - weak setup/payoff connection
          - convenient reveals
          - predictable endings
          - common AI emotional tropes
          - visuals that are generic rather than story-specific

          For every score below 7, explain the exact structural problem and what
          must change.

          Return ONLY critic JSON.
          """

          def make_repair_prompt(story, critique, local_issue=None):
              issue_text = list(critique.get("issues", []))
              if local_issue:
                  issue_text.append(local_issue)

              return f"""
          Completely rewrite the following story into a stronger publication-ready
          short film. Do not merely polish sentences. Fix the underlying structure.

          ORIGINAL STORY:
          {json.dumps(story, ensure_ascii=False)}

          CRITIC ISSUES:
          {json.dumps(issue_text, ensure_ascii=False)}

          REQUIREMENTS:
          - Keep only elements that are genuinely strong.
          - Replace a weak premise rather than defending it.
          - Strengthen the protagonist's specific identity and concrete goal.
          - Make the obstacle external and consequential.
          - Give the protagonist a real choice between two costly options.
          - Make the cost personal and believable.
          - Add logical escalation.
          - Make the turning point depend on an earlier setup detail.
          - Make the resolution change the meaning of the opening.
          - Replace generic objects/motifs with one distinctive visual element.
          - No random stranger, miracle, hidden fortune, illness reveal, child rescue,
            love-letter trope, recipe trope, photograph trope, or pasted-on moral.
          - No philosophical speech.
          - 140-300 words preferred; absolute range 105-405.
          - 7-12 scenes preferred; absolute range 7-18.
          - Faceless-friendly visuals.

          Return ONLY corrected story JSON.
          """

          # ============================================================
          # CALL 1: MASTER STORY GENERATION
          # ============================================================

          print("=" * 60)
          print("MASTER STORY GENERATION")
          print("=" * 60)

          story = call_groq(
              make_master_prompt(),
              STORY_SCHEMA,
              temperature=0.72,
              max_tokens=4200,
          )

          local_issue = local_story_check(story)

          # A short draft is not a failure. Give the repair stage the exact
          # length problem instead of consuming another generation attempt.
          if local_issue:
              print("INITIAL STORY CHECK:", local_issue)

          # ============================================================
          # CALL 2: CRITIQUE
          # ============================================================

          print("=" * 60)
          print("QUALITY REVIEW")
          print("=" * 60)

          critique = call_groq(
              make_critic_prompt(story),
              CRITIC_SCHEMA,
              temperature=0.10,
              max_tokens=2200,
          )

          print(json.dumps(critique, ensure_ascii=False, indent=2))

          # ============================================================
          # CALLS 3-6: UP TO TWO STRUCTURAL REPAIR ROUNDS
          # ============================================================

          quality_report = critique

          for repair_round in range(1, MAX_REPAIR_ROUNDS + 1):
              local_issue = local_story_check(story)

              if not local_issue and quality_report.get("pass"):
                  break

              if api_calls >= MAX_API_CALLS:
                  break

              print("=" * 60)
              print(f"STRUCTURAL REPAIR ROUND {repair_round}/{MAX_REPAIR_ROUNDS}")
              print("=" * 60)

              story = call_groq(
                  make_repair_prompt(
                      story,
                      quality_report,
                      local_issue,
                  ),
                  STORY_SCHEMA,
                  temperature=0.50 if repair_round == 1 else 0.42,
                  max_tokens=4500,
              )

              local_issue = local_story_check(story)

              if local_issue:
                  print("REPAIR LOCAL CHECK:", local_issue)
                  quality_report = {
                      "pass": False,
                      "hook_score": 0,
                      "originality_score": 0,
                      "believability_score": 0,
                      "emotional_score": 0,
                      "conflict_score": 0,
                      "ending_score": 0,
                      "visual_score": 0,
                      "issues": [local_issue],
                  }
                  continue

              if api_calls >= MAX_API_CALLS:
                  break

              print("=" * 60)
              print(f"QUALITY REVIEW AFTER REPAIR {repair_round}")
              print("=" * 60)

              quality_report = call_groq(
                  make_critic_prompt(story),
                  CRITIC_SCHEMA,
                  temperature=0.10,
                  max_tokens=2200,
              )

              print(
                  json.dumps(
                      quality_report,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

              if quality_report["pass"]:
                  break

          # A healthy automated pipeline should not die merely because the
          # critic remains conservative after the bounded repair budget.
          # We still require all hard local checks to pass before publishing.
          final_local_issue = local_story_check(story)
          if final_local_issue:
              raise RuntimeError(
                  "Story could not be made publication-safe: "
                  + final_local_issue
              )

          if not quality_report.get("pass"):
              print("=" * 60)
              print("QUALITY REVIEW REMAINS BELOW TARGET")
              print("Publishing the strongest locally-valid result from the bounded repair budget.")
              print("=" * 60)
              print(
                  json.dumps(
                      quality_report,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

          # ============================================================
          # FINAL LOCAL VALIDATION + PRODUCTION DATA
          # ============================================================

          local_issue = local_story_check(story)
          if local_issue:
              raise RuntimeError(
                  "Final story failed local validation: " + local_issue
              )

          total = word_count(story)

          duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  round(total / WPM * 60),
              ),
          )

          scene_count = len(story["scenes"])
          base_words = total // scene_count
          remainder = total % scene_count

          production_scenes = []

          for index, scene in enumerate(story["scenes"]):
              scene_words = base_words + (1 if index < remainder else 0)
              seconds = max(3, round(scene_words / WPM * 60))

              production_scenes.append({
                  "scene": scene["scene"],
                  "duration_seconds": seconds,
                  "narration": scene["narration"],
                  "visual_prompt": (
                      "Production-ready faceless cinematic shot for this exact narration: "
                      + scene["narration"]
                      + ". Preserve continuity of clothing, props, location, season and time. "
                        "Use backs, hands, silhouettes, body language, reflections, objects and "
                        "environment; never require an identifiable face. Realistic materials, "
                        "natural lighting, physically plausible action, strong composition, "
                        "vertical 9:16."
                  ),
                  "camera": "subtle physically plausible movement that reinforces the action",
                  "on_screen_text": "",
                  "sfx": "natural location sound synchronized to the visible action",
              })

          OUTPUT_DIR.mkdir(exist_ok=True)

          (OUTPUT_DIR / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "quality_report.json").write_text(
              json.dumps(quality_report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "scenes.json").write_text(
              json.dumps(
                  {
                      "duration_seconds": duration,
                      "scenes": production_scenes,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "title.txt").write_text(
              story["title"] + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "script.txt").write_text(
              " ".join(scene["narration"] for scene in story["scenes"]) + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["description"],
              "setting": story["setting"],
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-100:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60)
          print("STORY APPROVED")
          print("=" * 60)
          print("Title:", story["title"])
          print("Words:", total)
          print("Duration:", duration, "seconds")
          print("Scenes:", scene_count)
          print("Groq calls used:", api_calls)
          print("Quality:")
          print(json.dumps(quality_report, ensure_ascii=False, indent=2))

          PY

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          git diff --cached --quiet || git commit -m "Update story history"
          git push

      - name: Upload story artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-story
          path: story-output/
