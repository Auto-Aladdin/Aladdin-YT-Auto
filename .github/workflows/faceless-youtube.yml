name: Daily Faceless Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir edge-tts

      - name: Generate story, images, voice and video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # ============================================================
          # MISSION
          # ============================================================
          # One daily faceless motivational/emotional Short:
          # story -> scene image -> free TTS -> captions -> motion video
          #
          # Designed for GitHub Actions so the user's computer does not
          # need to stay online.
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          ROOT = Path(".")
          OUT = ROOT / "short-output"
          ASSETS = OUT / "assets"
          IMAGES = ASSETS / "images"
          SCENES = ASSETS / "clips"

          HISTORY_FILE = ROOT / ".github" / "data" / "story_history.json"

          API_KEY = os.environ["GROQ_API_KEY"]
          POLLINATIONS_API_KEY = os.environ.get("POLLINATIONS_API_KEY", "").strip()

          MIN_WORDS = 170
          MAX_WORDS = 230
          SCENES_MIN = 10
          SCENES_MAX = 10
          SCENE_MIN_WORDS = 14
          SCENE_MAX_WORDS = 26
          TARGET_SCENE_MIN_WORDS = 17
          TARGET_SCENE_MAX_WORDS = 21

          HTTP_TIMEOUT = 45
          MAX_RETRIES = 2
          MAX_STORY_CALLS = 1
          MIN_GAP = 1.0

          IMAGE_WIDTH = 768
          IMAGE_HEIGHT = 1365
          VIDEO_WIDTH = 1080
          VIDEO_HEIGHT = 1920
          FPS = 30

          # ------------------------------------------------------------
          # Story controls — intentionally simple and broad enough to
          # create motivational / emotional / human-interest Shorts.
          # ------------------------------------------------------------

          DOMAINS = [
              "quiet personal responsibility",
              "adult sibling relationship",
              "mentor and former apprentice",
              "neighbor helping neighbor",
              "small business relationship",
              "customer and specialist",
              "community responsibility",
              "friendship after a long misunderstanding",
              "adult family obligation",
              "ordinary person making a difficult choice",
          ]

          SETTINGS = [
              "small repair shop",
              "quiet neighborhood office",
              "local library workroom",
              "modest bakery before opening",
              "small tailoring studio",
              "community hall",
              "neighborhood bookstore",
              "shared workshop",
              "small photography studio",
              "local market back room",
          ]

          EMOTIONS = [
              "quiet determination",
              "earned respect",
              "bittersweet relief",
              "acceptance",
              "belonging",
              "forgiveness",
              "quiet pride",
              "surprise",
          ]

          BANNED = [
              "magic",
              "magical",
              "supernatural",
              "miracle",
              "miraculous",
              "destiny",
              "fate",
              "hospital",
              "terminal illness",
              "child in danger",
              "lottery",
              "hidden fortune",
              "benefactor",
              "anonymous donor",
              "bonus",
              "promotion",
              "applause",
              "thank-you note",
              "elevator",
              "blackout",
              "concert",
              "audition",
              "train platform",
              "coffee shop",
              "ticking clock",
              "glowing object",
              "red ribbon",
              "random stranger",
          ]

          def run_cmd(args, timeout=120, capture=True):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
                  timeout=timeout,
                  check=False,
              )
              if p.returncode != 0:
                  raise RuntimeError(
                      f"Command failed ({p.returncode}): {' '.join(args)}\n"
                      f"{p.stdout[-4000:] if p.stdout else ''}"
                  )
              return p.stdout or ""

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()
          recent = history[-20:]
          recent_text = "\n".join(
              f"- {x.get('title','')} | {x.get('premise','')} | {x.get('setting','')}"
              for x in recent
          ) or "NONE"

          last_call = 0.0

          STORY_SCHEMA = {
              "name": "publication_story",
              "schema": {
                  "type": "object",
                  "properties": {
                      "title": {"type": "string"},
                      "hook": {"type": "string"},
                      "description": {"type": "string"},
                      "protagonist": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "age": {"type": "integer"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "age", "role", "visual_identity"],
                          "additionalProperties": False
                      },
                      "setting": {"type": "string"},
                      "scenes": {
                          "type": "array",
                          "minItems": 10,
                          "maxItems": 10,
                          "items": {
                              "type": "object",
                              "properties": {
                                  "scene": {"type": "integer"},
                                  "narration": {"type": "string"},
                                  "visual_prompt": {"type": "string"}
                              },
                              "required": ["scene", "narration", "visual_prompt"],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["title", "hook", "description", "protagonist", "setting", "scenes"],
                  "additionalProperties": False
              }
          }

          def groq_json(prompt, max_tokens=2000, temperature=0.55, label="groq", response_schema=None):
              global last_call

              gap = time.monotonic() - last_call
              if gap < MIN_GAP:
                  time.sleep(MIN_GAP - gap)

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return ONLY one valid JSON object. "
                              "Never return markdown. Never return a top-level array. "
                              "No commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": (
                      {
                          "type": "json_schema",
                          "json_schema": {
                              "name": response_schema["name"],
                              "strict": True,
                              "schema": response_schema["schema"],
                          },
                      }
                      if response_schema
                      else {"type": "json_object"}
                  ),
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  last_call = time.monotonic()

                  print(
                      f"[Groq] {label} attempt {attempt}/{MAX_RETRIES}",
                      flush=True,
                  )

                  req = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V1",
                      },
                      method="POST",
                  )

                  started = time.monotonic()

                  try:
                      with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                          data = json.loads(r.read().decode("utf-8"))

                      content = data["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")

                      try:
                          obj = json.loads(content)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(f"Groq returned invalid JSON: {exc}") from exc

                      if isinstance(obj, list) and len(obj) == 1 and isinstance(obj[0], dict):
                          obj = obj[0]

                      if not isinstance(obj, dict):
                          raise RuntimeError(
                              f"{label} must return a JSON object, got {type(obj).__name__}"
                          )

                      print(
                          f"[Groq] {label} success in {time.monotonic()-started:.2f}s",
                          flush=True,
                      )
                      return obj

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      elapsed = time.monotonic() - started
                      print(
                          f"[Groq] HTTP {exc.code} {label} after {elapsed:.2f}s",
                          flush=True,
                      )

                      if exc.code == 429:
                          low = raw.lower()
                          if "tokens per day" in low or "(tpd)" in low:
                              raise RuntimeError(
                                  "Groq daily token limit reached. "
                                  "Wait for the quota reset before rerunning.\n"
                                  + raw
                              ) from exc

                          if attempt < MAX_RETRIES:
                              time.sleep(2.0 * attempt)
                              continue

                      if exc.code in (408, 409, 425, 500, 502, 503, 504) and attempt < MAX_RETRIES:
                          time.sleep(2.0 * attempt)
                          continue

                      raise RuntimeError(f"Groq HTTP {exc.code}: {raw}") from exc

          def banned(text):
              lower = text.lower()
              for phrase in BANNED:
                  if phrase in lower:
                      return phrase
              return None

          def words(text):
              return len(str(text).split())

          def validate_story(story):
              if not isinstance(story, dict):
                  return "Story is not an object."

              required = [
                  "title", "hook", "description", "protagonist",
                  "setting", "scenes"
              ]
              for k in required:
                  if k not in story:
                      return f"Missing field: {k}"

              protagonist = story["protagonist"]
              if not isinstance(protagonist, dict):
                  return "Protagonist must be an object."

              if not str(protagonist.get("name", "")).strip():
                  return "Missing protagonist name."

              try:
                  age = int(protagonist.get("age"))
              except Exception:
                  return "Invalid protagonist age."

              if not 21 <= age <= 70:
                  return "Protagonist age must be 21-70."

              role = str(protagonist.get("role", "")).strip()
              if len(role.split()) < 2:
                  return "Protagonist role needs at least 2 words."

              scenes = story["scenes"]
              if not isinstance(scenes, list):
                  return "Scenes must be an array."

              if len(scenes) != 10:
                  return "Story must contain exactly 10 scenes."

              total = 0
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      return f"Scene {i} is not an object."

                  narration = str(scene.get("narration", "")).strip()
                  count = words(narration)
                  total += count

                  if count < SCENE_MIN_WORDS or count > SCENE_MAX_WORDS:
                      return (
                          f"Scene {i} has {count} words; "
                          f"allowed {SCENE_MIN_WORDS}-{SCENE_MAX_WORDS}."
                      )

                  visual = str(scene.get("visual_prompt", "")).strip()
                  if len(visual.split()) < 8:
                      return f"Scene {i} visual prompt is too short."

              if total < MIN_WORDS:
                  return f"Story is too short at {total} words; minimum {MIN_WORDS}."
              if total > MAX_WORDS:
                  return f"Story is too long at {total} words; maximum {MAX_WORDS}."

              hook = str(story["hook"]).strip()
              if words(hook) < 10 or words(hook) > 24:
                  return "Hook must be 10-24 words."

              description = str(story["description"]).strip()
              if words(description) < 20 or words(description) > 90:
                  return "Description must be 20-90 words."

              blob = json.dumps(story, ensure_ascii=False)
              bad = banned(blob)
              if bad:
                  return f"Banned pattern: {bad}"

              title = str(story["title"]).strip()
              if words(title) > 12:
                  return "Title is too long."

              return None

          def create_story():
              prompt = f"""
                    Create ONE original faceless YouTube Short package.

                    IMPORTANT:
                    - This is for an automated daily channel.
                    - It must feel human, emotional and memorable.
                    - Do not make it a generic motivational speech.
                    - The lesson must come from what the protagonist DOES and the CONSEQUENCE.
                    - No facial expressions are needed.
                    - Every scene must be easy to create from one cinematic still image.
                    - We will animate the still images with camera motion later.
                    - The story should work for a broad international audience.

                    CREATIVE SEEDS
                    Domain: {random.choice(DOMAINS)}
                    Setting: {random.choice(SETTINGS)}
                    Emotion: {random.choice(EMOTIONS)}

                    RECENT HISTORY
                    {recent_text}

                    Return exactly this top-level JSON object:

                    {{
                      "title": "short hooky title, 3-9 words",
                      "hook": "10-20 word opening that creates immediate curiosity",
                      "description": "2-3 natural sentences for the YouTube description",
                      "protagonist": {{
                        "name": "specific adult name",
                        "age": 21-70,
                        "role": "specific adult role with at least two words",
                        "visual_identity": "stable clothing/appearance description without showing the face"
                      }},
                      "setting": "specific physical setting",
                      "scenes": [
                        {{
                          "scene": 1,
                          "narration": "16-24 spoken words",
                          "visual_prompt": "cinematic faceless still-image prompt; include subject, environment, action, lighting and camera framing"
                        }}
                      ]
                    }}

                    SCENE REQUIREMENTS
                    - Exactly 10 scenes.
                    - Target 17-21 words per narration.
                    - Hard limit: 14-26 words per narration.
                    - Total narration target: 180-210 words; hard limit 170-230.
                    - Scenes must form one continuous causal story.
                    - Scene 1 must contain the hook moment visually.
                    - Scene 2-3 establish the human problem.
                    - Middle scenes escalate the choice.
                    - Scenes 4-7 escalate the dilemma through visible action and a real choice.
                    - Scene 8 shows the decision or its immediate cost.
                    - Scenes 9-10 show the consequence and an earned, imperfect emotional payoff.
                    - No scene may depend on a facial expression.
                    - Use hands, backs, silhouettes, clothing, props, environments, posture and actions.

                    STORY REQUIREMENTS
                    - Adult protagonist.
                    - One meaningful adult relationship.
                    - Concrete goal.
                    - Real external obstacle.
                    - Two plausible options with different costs.
                    - The chosen option creates a lasting consequence.
                    - The ending changes the situation without a magical reward.
                    - No preachy moral at the end.
                    - The final narration should land naturally in one memorable sentence.

                    BANNED:
                    magic, supernatural, miracles, illness, hospitals, children in danger,
                    benefactors, hidden fortunes, lottery, romance as the main engine,
                    honesty-vs-lying, parent-vs-work, money-returning, elevator, blackout,
                    concert, audition, train platform, coffee shop, ticking clock, glowing object,
                    red ribbon, bonus, promotion, applause, thank-you note, random stranger,
                    generic office puzzle, generic maintenance job, generic "believe in yourself"
                    style motivational speech.

                    Do NOT mention these instructions in the JSON.
                    """

              for call_number in range(1, MAX_STORY_CALLS + 1):
                  story = groq_json(
                      prompt,
                      max_tokens=2000,
                      temperature=0.65,
                      label=f"story-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[validator] {issue}", flush=True)

                  repair_prompt = f"""
                    Repair this story so it passes ALL deterministic requirements.

                    CURRENT PROBLEM:
                    {issue}

                    IMPORTANT:
                    Do not only fix the named problem.
                    Re-check EVERY requirement before returning.
                    Keep the same core premise and characters.
                    Do not replace the story with a different generic story.

                    Hard requirements:
                    - top-level JSON OBJECT only
                    - title
                    - hook
                    - description
                    - protagonist object with fields: name, age, role, visual_identity
                    - setting
                    - exactly 10 scenes
                    - each scene has scene, narration, visual_prompt
                    - each narration should target 17-21 words; hard allowance 14-26
                    - total narration should target 180-210 words; hard allowance 170-230
                    - protagonist role is at least 2 words
                    - hook is 10-24 words
                    - description is 20-90 words
                    - all scenes are faceless-filmable
                    - preserve all 10 scenes; never delete scenes to fix word count
                    - no banned patterns

                    STORY:
                    {json.dumps(story, ensure_ascii=False)}

                    Return ONLY the corrected JSON object.
                    """

                  story = groq_json(
                      repair_prompt,
                      max_tokens=1700,
                      temperature=0.25,
                      label=f"repair-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[repair-validator] {issue}", flush=True)

              raise RuntimeError(
                  "The story could not pass deterministic validation "
                  "after the allowed generation/repair calls."
              )

          story = create_story()

          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)
          IMAGES.mkdir(parents=True, exist_ok=True)
          SCENES.mkdir(parents=True, exist_ok=True)

          (OUT / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          script = "\n".join(
              scene["narration"] for scene in story["scenes"]
          ).strip() + "\n"

          (OUT / "script.txt").write_text(script, encoding="utf-8")
          (OUT / "title.txt").write_text(story["title"] + "\n", encoding="utf-8")
          (OUT / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # FREE TTS: edge-tts
          # ============================================================

          voice = "en-US-AvaNeural"

          run_cmd([
              sys.executable,
              "-m",
              "edge_tts",
              "--voice",
              voice,
              "--rate",
              "+2%",
              "--pitch",
              "0Hz",
              "--text",
              script,
              "--write-media",
              str(OUT / "voice.mp3"),
              "--write-subtitles",
              str(OUT / "captions.srt"),
          ], timeout=180)

          # ============================================================
          # FREE AI IMAGES: Pollinations anonymous image endpoint
          # We intentionally use still images + FFmpeg camera motion.
          # This avoids paid image/video-generation APIs.
          # ============================================================

          def download(url, path, timeout=90):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      headers = {
                          "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V2",
                          "Accept": "image/*",
                      }
                      if POLLINATIONS_API_KEY:
                          headers["Authorization"] = f"Bearer {POLLINATIONS_API_KEY}"
                      else:
                          raise RuntimeError(
                              "POLLINATIONS_API_KEY is not configured. "
                              "Current Pollinations image generation requires an API key."
                          )

                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                          content_type = (r.headers.get("Content-Type") or "").lower()

                      if len(data) < 10000:
                          raise RuntimeError(
                              f"Image response for {path.name} is suspiciously small ({len(data)} bytes)."
                          )
                      if "image" not in content_type and not data.startswith(b"\x89PNG") and not data.startswith(b"\xff\xd8") and not data.startswith(b"RIFF"):
                          raise RuntimeError(
                              f"Image response for {path.name} is not an image (Content-Type: {content_type})."
                          )

                      path.write_bytes(data)
                      return
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          time.sleep(2 * attempt)
              raise RuntimeError(f"Image download failed for {path.name}: {last_error}")

          for index, scene in enumerate(story["scenes"], 1):
              output = IMAGES / f"scene_{index:02d}.png"
              prompt = (
                  scene["visual_prompt"]
                  + ", vertical 9:16, cinematic photography, "
                    "realistic materials, natural lighting, "
                    "faceless composition, no text, no watermark"
              )

              encoded = urllib.parse.quote(prompt, safe="")
              url = (
                  "https://gen.pollinations.ai/image/"
                  + encoded
                  + f"?model=flux&width={IMAGE_WIDTH}&height={IMAGE_HEIGHT}"
              )

              print(f"[image] scene {index}: generating", flush=True)
              download(url, output)

          # ============================================================
          # CREATE MOTION CLIPS
          # ============================================================

          audio_duration_text = run_cmd([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(OUT / "voice.mp3"),
          ])

          audio_duration = float(audio_duration_text.strip())
          scene_word_counts = [
              words(scene["narration"]) for scene in story["scenes"]
          ]
          total_scene_words = sum(scene_word_counts)

          durations = [
              audio_duration * count / total_scene_words
              for count in scene_word_counts
          ]

          for i, (scene, duration) in enumerate(
              zip(story["scenes"], durations),
              1
          ):
              image = IMAGES / f"scene_{i:02d}.png"
              clip = SCENES / f"clip_{i:02d}.mp4"

              frames = max(1, round(duration * FPS))

              # Alternating direction prevents the whole Short from
              # looking mechanically identical.
              direction = 1 if i % 2 else -1

              zoom_expr = (
                  "min(zoom+0.0008,1.12)"
                  if direction == 1
                  else "max(zoom-0.0008,1.00)"
              )

              vf = (
                  f"scale=1200:2133,"
                  f"crop=1080:1920,"
                  f"zoompan="
                  f"z='{zoom_expr}':"
                  f"d={frames}:"
                  f"x='iw/2-(iw/zoom/2)':"
                  f"y='ih/2-(ih/zoom/2)':"
                  f"s={VIDEO_WIDTH}x{VIDEO_HEIGHT}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-t", f"{duration:.3f}",
                  "-vf", vf,
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-movflags", "+faststart",
                  str(clip),
              ], timeout=120)

          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join(
                  f"file '{(SCENES / f'clip_{i:02d}.mp4').resolve()}'\n"
                  for i in range(1, len(story["scenes"]) + 1)
              ),
              encoding="utf-8",
          )

          silent_video = OUT / "video_silent.mp4"
          final_video = OUT / "final_short.mp4"

          run_cmd([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video),
          ], timeout=180)

          # Burn captions and mux voice in one final pass.
          run_cmd([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(OUT / "voice.mp3"),
              "-vf", (
                  f"subtitles={str((OUT / 'captions.srt').resolve())}:"
                  "force_style='FontName=DejaVu Sans,FontSize=18,"
                  "PrimaryColour=&H00FFFFFF,OutlineColour=&H80000000,"
                  "BorderStyle=1,Outline=2,Shadow=0,"
                  "Alignment=2,MarginV=110'"
              ),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "22",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ], timeout=240)

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["hook"],
              "setting": story["setting"],
              "words": words(script),
              "scenes": len(story["scenes"]),
              "created_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-50:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60, flush=True)
          print("DAILY FACELESS SHORT READY", flush=True)
          print("=" * 60, flush=True)
          print("Title:", story["title"], flush=True)
          print("Scenes:", len(story["scenes"]), flush=True)
          print("Words:", words(script), flush=True)
          print("Voice:", voice, flush=True)
          print("Video:", final_video, flush=True)
          PY

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Generate daily faceless short history"
            git push
          fi

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-faceless-short
          path: short-output/
          if-no-files-found: error
