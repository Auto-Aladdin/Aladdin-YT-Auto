name: AI Short Story Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate story and visual plan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p output .github/data

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          API_URL = "https://api.groq.com/openai/v1/chat/completions"

          HISTORY_FILE = ".github/data/story_history.json"

          MIN_WORDS = 105
          MAX_WORDS = 405

          WORDS_PER_MINUTE = 135

          MIN_DURATION = 45
          MAX_DURATION = 180

          api_key = os.environ["GROQ_API_KEY"]

          rng = random.SystemRandom()

          # ============================================================
          # CREATIVE VARIETY
          # ============================================================

          story_modes = [
              "quiet human drama",
              "unexpected kindness",
              "second chance",
              "small sacrifice with a big consequence",
              "regret and reconciliation",
              "ordinary person facing an impossible choice",
              "misunderstanding that becomes meaningful",
              "quiet perseverance after failure",
              "a promise almost broken",
              "unexpected courage",
              "a small decision changing two lives",
              "an overlooked person finally being seen",
              "a lost item revealing an important truth",
              "a difficult goodbye",
              "a reunion after years apart",
              "a stranger helping at exactly the right moment",
              "a mistake leading to an unexpected opportunity",
              "quiet honesty",
              "forgiveness after a misunderstanding",
              "someone choosing kindness when it costs them"
          ]

          emotions = [
              "warmth",
              "hope",
              "regret",
              "relief",
              "wonder",
              "gratitude",
              "sadness turning into comfort",
              "quiet joy",
              "fear turning into courage",
              "belonging",
              "forgiveness",
              "surprise",
              "nostalgia",
              "determination",
              "compassion"
          ]

          hooks = [
              "start at the most intriguing moment",
              "start with a specific time or place",
              "start with a surprising action",
              "start with a concrete mystery",
              "start with a consequence before explaining its cause",
              "start with an unusual object and why it matters",
              "start with a promise that seems impossible",
              "start with someone making a decision they may regret"
          ]

          settings = [
              "a nearly empty bus station before sunrise",
              "a small neighborhood repair shop",
              "a rainy apartment building hallway",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a community clinic waiting room",
              "a laundromat on a cold evening",
              "a tiny apartment above a busy street",
              "a corner bakery before opening",
              "a local market just before closing",
              "a parking lot during a summer storm",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a neighborhood bus stop at midnight",
              "a small hotel lobby",
              "a mechanic's garage at closing time"
          ]

          conflicts = [
              "a missed opportunity",
              "a financial problem that must be hidden",
              "a lost item with emotional value",
              "an important message that never arrived",
              "a promise made to someone who is no longer around",
              "a difficult decision between pride and kindness",
              "a misunderstanding that risks a relationship",
              "one last attempt after repeated failure",
              "helping someone without being noticed",
              "an impossible deadline",
              "a goodbye neither person is ready for",
              "a small mistake with unexpectedly large consequences",
              "deciding whether to tell an uncomfortable truth",
              "choosing between convenience and doing what is right"
          ]

          twists = [
              "the person who seemed unimportant was the key to the solution",
              "the ignored object carried the real emotional meaning",
              "the protagonist misunderstood what the other person needed",
              "an earlier kindness quietly returns at the perfect moment",
              "the apparent failure prevents a worse outcome",
              "the person receiving help had helped the protagonist first",
              "a small sacrifice restores something much more important",
              "the final detail changes the meaning of the opening",
              "an ordinary object reveals an unexpected connection",
              "the protagonist discovers the other person planned for them too"
          ]

          endings = [
              "a quiet emotional realization",
              "a visual callback to the opening moment",
              "a brief line that changes the meaning of the story",
              "a small action instead of a speech",
              "an earned moment of relief",
              "an understated act of forgiveness",
              "a hopeful but believable final image",
              "a final detail that makes the viewer rethink the story"
          ]

          brief = {
              "mode": rng.choice(story_modes),
              "emotion": rng.choice(emotions),
              "hook": rng.choice(hooks),
              "setting": rng.choice(settings),
              "conflict": rng.choice(conflicts),
              "twist": rng.choice(twists),
              "ending": rng.choice(endings)
          }

          # ============================================================
          # HISTORY
          # ============================================================

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(HISTORY_FILE, encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          previous = "\n".join(
              f"- {item.get('title', '')} | "
              f"{item.get('premise', '')}"
              for item in history[-30:]
          ) or "NONE"

          # ============================================================
          # STORY SCHEMA
          # ============================================================

          story_schema = {
              "type": "object",
              "properties": {
                  "title": {
                      "type": "string"
                  },
                  "hook": {
                      "type": "string"
                  },
                  "setting": {
                      "type": "string"
                  },
                  "conflict": {
                      "type": "string"
                  },
                  "turning_point": {
                      "type": "string"
                  },
                  "payoff": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {
                                  "type": "string"
                              },
                              "role": {
                                  "type": "string"
                              },
                              "visual_identity": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "name",
                              "role",
                              "visual_identity"
                          ],
                          "additionalProperties": False
                      }
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {
                                  "type": "integer"
                              },
                              "narration": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "scene",
                              "narration"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "conflict",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes"
              ],
              "additionalProperties": False
          }

          # ============================================================
          # VISUAL SCHEMA
          # ============================================================

          visual_schema = {
              "type": "object",
              "properties": {
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {
                                  "type": "integer"
                              },
                              "visual_prompt": {
                                  "type": "string"
                              },
                              "camera": {
                                  "type": "string"
                              },
                              "on_screen_text": {
                                  "type": "string"
                              },
                              "sfx": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "scene",
                              "visual_prompt",
                              "camera",
                              "on_screen_text",
                              "sfx"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "scenes"
              ],
              "additionalProperties": False
          }

          # ============================================================
          # GROQ REQUEST FUNCTION
          # ============================================================

          def call_groq(prompt, schema, temperature, max_tokens):

              payload = {
                  "model": "openai/gpt-oss-20b",

                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],

                  "reasoning_effort": "low",

                  "reasoning_format": "hidden",

                  "temperature": temperature,

                  "max_completion_tokens": max_tokens,

                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      body = response.read().decode("utf-8")

                      result = json.loads(body)

              except urllib.error.HTTPError as e:

                  print(f"HTTP ERROR: {e.code}")

                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  raise

              content = (
                  result["choices"][0]["message"]
                  .get("content", "")
              )

              if not content:
                  raise RuntimeError(
                      "Groq returned empty content."
                  )

              return json.loads(content)

          # ============================================================
          # STORY PROMPT
          # ============================================================

          story_prompt = f"""
          Create ONE completely original cinematic emotional story for a
          vertical YouTube Short.

          This is a REAL MINI-STORY, NOT a motivational poem.

          Creative direction for this episode:

          Story mode:
          {brief['mode']}

          Primary emotion:
          {brief['emotion']}

          Hook style:
          {brief['hook']}

          Setting:
          {brief['setting']}

          Conflict:
          {brief['conflict']}

          Twist direction:
          {brief['twist']}

          Ending style:
          {brief['ending']}

          Previously produced stories:
          {previous}

          Do NOT repeat a previous premise, title pattern, setting,
          central object, emotional beat, twist, or ending idea.

          STORY RULES:

          - Choose the natural story length.
          - Spoken narration must be between 105 and 405 words.
          - Do not pad the story.
          - Do not cut a good story just to make it short.
          - 105-170 words should usually be a focused story.
          - 171-250 words should be used for a deeper story.
          - 251-405 words should be used only when the story genuinely
            deserves more development.

          Every story should contain:

          1. Immediate hook.
          2. Specific protagonist.
          3. Concrete desire/problem.
          4. Clear conflict.
          5. Escalation.
          6. Meaningful choice or turning point.
          7. Earned emotional payoff.
          8. Memorable final beat.

          Write natural spoken English.

          Avoid:

          - generic inspirational speeches
          - abstract philosophy
          - quote compilations
          - celebrity content
          - existing fictional characters
          - copied internet stories
          - movie plots
          - song lyrics
          - "believe in yourself"
          - "never give up"
          - "the human spirit"
          - "everything happens for a reason"
          - "when one door closes"
          - "follow your dreams"
          - "little did they know"
          - "a testament to"
          - generic calls to action

          FACELESS CHANNEL:

          The story may contain people, but the final visuals must NOT
          require identifiable faces.

          Characters should have consistent clothing, build, age range,
          props and environments throughout the story.

          Create 7-18 scenes depending on story length.

          IMPORTANT:

          For this first stage, each scene must contain ONLY:
          - scene number
          - narration

          Do not provide camera directions or visual prompts yet.

          Return ONLY the requested JSON.
          """

          story = call_groq(
              story_prompt,
              story_schema,
              temperature=0.9,
              max_tokens=6500
          )

          scenes = story["scenes"]

          if not 7 <= len(scenes) <= 18:
              raise RuntimeError(
                  f"Expected 7-18 scenes, got {len(scenes)}."
              )

          word_counts = [
              len(scene["narration"].split())
              for scene in scenes
          ]

          total_words = sum(word_counts)

          if not MIN_WORDS <= total_words <= MAX_WORDS:
              raise RuntimeError(
                  f"Story has {total_words} words. "
                  f"Allowed range: {MIN_WORDS}-{MAX_WORDS}."
              )

          # ============================================================
          # ANTI-CLICHE CHECK
          # ============================================================

          all_story_text = (
              story["title"] + " " +
              story["hook"] + " " +
              story["turning_point"] + " " +
              story["payoff"] + " " +
              " ".join(
                  scene["narration"]
                  for scene in scenes
              )
          ).lower()

          banned_phrases = [
              "believe in yourself",
              "never give up",
              "the human spirit",
              "everything happens for a reason",
              "when one door closes",
              "follow your dreams",
              "little did they know",
              "a testament to",
              "in the end, it was not about"
          ]

          for phrase in banned_phrases:

              if phrase in all_story_text:

                  raise RuntimeError(
                      "Overused phrase detected: " + phrase
                  )

          # ============================================================
          # VISUAL PLAN
          # ============================================================

          visual_input = json.dumps(
              {
                  "title": story["title"],
                  "setting": story["setting"],
                  "characters": story["characters"],
                  "scenes": scenes
              },
              ensure_ascii=False
          )

          visual_prompt = f"""
          Create the production-ready visual plan for this original
          faceless YouTube Short.

          STORY DATA:

          {visual_input}

          VISUAL REQUIREMENTS:

          Every scene must visually match its narration.

          Maintain continuity:

          - same characters
          - same clothing
          - same important props
          - same location
          - correct time of day
          - believable physical positions

          FACeless STYLE:

          Never require an identifiable face.

          Prefer:

          - backs
          - silhouettes
          - hands
          - close-ups
          - objects
          - environmental wide shots
          - reflections
          - shadows
          - over-the-shoulder shots
          - partial-body framing

          Each visual prompt must be detailed enough for a cinematic
          AI image/video generator.

          Include:

          subject
          environment
          lighting
          mood
          important objects
          clothing continuity
          composition
          realism

          Camera instructions should specify things such as:

          wide shot
          close-up
          macro
          tracking shot
          slow push-in
          overhead
          handheld
          rack focus

          On-screen text should be short and optional.

          SFX should be realistic and subtle.

          Use exactly the same scene numbers.

          Return ONLY the requested JSON.
          """

          visuals = call_groq(
              visual_prompt,
              visual_schema,
              temperature=0.65,
              max_tokens=5000
          )

          visual_scenes = visuals["scenes"]

          if len(visual_scenes) != len(scenes):
              raise RuntimeError(
                  "Visual scene count does not match story scene count."
              )

          visual_by_number = {
              scene["scene"]: scene
              for scene in visual_scenes
          }

          # ============================================================
          # MERGE + VALIDATE
          # ============================================================

          for scene in scenes:

              number = scene["scene"]

              if number not in visual_by_number:
                  raise RuntimeError(
                      f"Missing visual plan for scene {number}."
                  )

              visual = visual_by_number[number]

              scene.update({
                  "visual_prompt": visual["visual_prompt"],
                  "camera": visual["camera"],
                  "on_screen_text": visual["on_screen_text"],
                  "sfx": visual["sfx"]
              })

          # ============================================================
          # ADAPTIVE VIDEO LENGTH
          # ============================================================

          estimated_duration = round(
              total_words / WORDS_PER_MINUTE * 60
          )

          estimated_duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  estimated_duration
              )
          )

          minimum_scene_seconds = 3

          base_duration = (
              len(scenes) *
              minimum_scene_seconds
          )

          if base_duration > estimated_duration:

              raise RuntimeError(
                  "Too many scenes for estimated duration."
              )

          extra_duration = (
              estimated_duration -
              base_duration
          )

          raw_extra = [
              extra_duration *
              count /
              total_words
              for count in word_counts
          ]

          extras = [
              int(value)
              for value in raw_extra
          ]

          leftover = (
              extra_duration -
              sum(extras)
          )

          order = sorted(
              range(len(raw_extra)),
              key=lambda i:
                  raw_extra[i] - extras[i],
              reverse=True
          )

          for index in order[:leftover]:

              extras[index] += 1

          durations = [
              minimum_scene_seconds + value
              for value in extras
          ]

          for index, scene in enumerate(scenes):

              scene["scene"] = index + 1

              scene["duration_seconds"] = durations[index]

          story["story"] = " ".join(
              scene["narration"].strip()
              for scene in scenes
          )

          story["word_count"] = total_words

          story["estimated_duration_seconds"] = estimated_duration

          # ============================================================
          # SAVE FINAL OUTPUT
          # ============================================================

          with open(
              "output/story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/title.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(story["title"])

          with open(
              "output/script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(story["story"])

          with open(
              "output/description.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(story["description"])

          with open(
              "output/scenes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  scenes,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # UPDATE HISTORY
          # ============================================================

          premise = (
              story["setting"] +
              " | " +
              story["conflict"] +
              " | " +
              story["turning_point"]
          )

          fingerprint = hashlib.sha256(
              (
                  story["title"] +
                  "|" +
                  premise
              ).encode("utf-8")
          ).hexdigest()[:16]

          history.append({
              "title": story["title"],
              "premise": premise,
              "fingerprint": fingerprint,
              "timestamp": int(time.time())
          })

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history[-50:],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("========================================")
          print("✅ STORY PIPELINE SUCCESSFUL")
          print("========================================")
          print("Title:", story["title"])
          print("Scenes:", len(scenes))
          print("Words:", total_words)
          print(
              "Estimated duration:",
              estimated_duration,
              "seconds"
          )
          print("Scene durations:", durations)
          print("Story mode:", brief["mode"])
          print("Emotion:", brief["emotion"])
          print("========================================")
          PY

      - name: Save story history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/data/story_history.json

          if git diff --cached --quiet; then
            echo "No history update."
          else
            git commit -m "Update AI story history"
            git push
          fi

      - name: Upload story package
        uses: actions/upload-artifact@v7
        with:
          name: ai-short-story
          path: output/
          retention-days: 7
