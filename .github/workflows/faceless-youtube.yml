              )

              CONTINUITY_RULES = (
                  "CONTINUITY LOCK — treat this shot as part of one continuous film. "
                  "Preserve every returning character's face, hairstyle, clothing silhouette, garment colors, "
                  "shoes, accessories, age cues, and distinctive traits exactly as established. "
                  "If the scene blueprint names or describes a supporting character, render that person as a distinct, "
                  "consistent individual and never replace them with the protagonist. "
                  "SCENE CAST RULE — include only the people needed for this beat; the protagonist is not mandatory. "
                  "SUBJECT OWNERSHIP RULE — whichever person, object, place, clue, or consequence carries the narration "
                  "must visually own the frame through scale, focus, foreground placement, interaction, or composition. "
                  "Preserve spatial relationships and important object ownership/state between adjacent scenes. "
                  "Change framing, action, composition, subject focus, or object state between scenes rather than changing character design. "
              )

              shot_variations = [
                  "wide establishing composition with environmental storytelling and action clearly readable",
                  "medium action composition with the active character and important object clearly visible",
                  "over-the-shoulder interaction shot showing what the character is seeing and doing",
                  "close-to-medium clue shot with the important prop or action emphasized in the foreground",
                  "dynamic side-angle composition with visible movement and strong depth",
                  "two-shot interaction composition when two characters physically share the beat",
                  "profile or three-quarter action composition emphasizing the decisive physical action",
                  "reveal composition exposing the key visual information while keeping the character readable",
                  "payoff composition with a strong visual callback to an earlier object, place, or action",
                  "fresh environmental angle clearly different from the previous frame",
              ]
              shot_override = shot_variations[(index - 1) % len(shot_variations)]

              # Stable, scene-specific seed: same story is reproducible, but every
              # scene receives its own deterministic generation state.
              seed_material = (
                  f"{story['title']}|scene-{index}|"
                  f"{scene['narration']}|{scene['visual_prompt']}"
              )
              # Pollinations requires seed <= 2147483647 (signed 32-bit max).
              # Keep deterministic per-scene variation while guaranteeing a valid API value.
              seed = int(
                  hashlib.sha256(seed_material.encode("utf-8")).hexdigest()[:8],
                  16,
              ) % 2147483647
              if seed <= 0:
                  seed = 1

              prompt = (
                  MASTER_STYLE
                  + visual_anchor
                  + CONTINUITY_RULES
                  + " MANDATORY SCENE OVERRIDE — depict ONLY the exact scene-specific event below. "
                    "This is NOT a generic protagonist portrait. First identify the beat's true visual owner: "
                    "the active person, interaction, place, clue, object, or consequence. Make that the dominant subject. "
                    "Do NOT automatically include or center the protagonist. Do NOT reuse the previous scene's pose, camera, "
                    "framing, character lineup, or background composition. The exact narration, scene-specific action, "
                    "supporting characters, props, object state, and location override generic character defaults. "
                    "SHOT VARIATION — "
                  + shot_override
                  + ". NARRATION CONTEXT — "
                  + scene["narration"]
                  + " SCENE BLUEPRINT — "
                  + scene["visual_prompt"]
                  + " FINAL SCENE LOCK — the viewer must immediately recognize this as a DIFFERENT STORY BEAT "
                    "from the previous frame while all returning character designs and art style remain identical. "
                    "Audit the frame against the narration: every important named person, place, object, clue, action, "
                    "and visible consequence required for this beat must be represented correctly; omit people not needed. "
                    "Freeze this exact cinematic moment as the keyframe and make the cause-and-effect understandable with narration muted."
              )

              encoded = urllib.parse.quote(prompt, safe="")
              url = (
                  POLLINATIONS_BASE
                  + encoded
                  + f"?model=flux&width={IMAGE_WIDTH}&height={IMAGE_HEIGHT}"
                  + f"&seed={seed}"
                  + "&nologo=true"
              )

              print(f"[image] scene {index}: generating with Pollinations FLUX", flush=True)
              download_image(url, output)

          # ============================================================
          # CREATE MOTION CLIPS
          # ============================================================

          audio_duration_text = run_cmd([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(OUT / "voice.mp3"),
          ])

          audio_duration = float(audio_duration_text.strip())

          def parse_srt_timestamp(value):
              hh, mm, rest = value.split(":", 2)
              ss, ms = rest.split(",", 1)
              return int(hh) * 3600 + int(mm) * 60 + int(ss) + int(ms) / 1000.0

          raw_srt = (OUT / "captions.srt").read_text(encoding="utf-8")
          blocks = re.split(r"\n\s*\n", raw_srt.strip()) if raw_srt.strip() else []
          caption_items = []
          for block in blocks:
              lines = [line.strip("\ufeff") for line in block.splitlines() if line.strip()]
              if len(lines) < 3 or " --> " not in lines[1]:
                  continue
              start_text, end_text = lines[1].split(" --> ", 1)
              caption_text = " ".join(lines[2:]).strip()
              caption_items.append((parse_srt_timestamp(start_text), parse_srt_timestamp(end_text), caption_text))

          expected_scenes = len(story["scenes"])
          if len(caption_items) != expected_scenes:
              raise RuntimeError(
                  f"TTS subtitles produced {len(caption_items)} cues, but the story has "
                  f"{expected_scenes} scenes. Refusing to create mismatched scene timing."
              )

          # Use the real TTS sentence boundaries so each scene image runs while
          # its matching sentence is spoken. The next caption starts the next scene.
          scene_starts = [item[0] for item in caption_items]
          durations = []
          for i, start in enumerate(scene_starts):
              next_start = scene_starts[i + 1] if i + 1 < len(scene_starts) else audio_duration
              durations.append(max(0.05, next_start - start))

          # Normalize and rewrite the captions so the final video has exactly
          # one non-overlapping subtitle cue per scene.
          normalized_blocks = []

          def srt_time(seconds):
              millis = max(0, int(round(seconds * 1000)))
              hh = millis // 3600000
              millis %= 3600000
              mm = millis // 60000
              millis %= 60000
              ss = millis // 1000
              ms = millis % 1000
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"

          running = 0.0
          for i, (_, _, text) in enumerate(caption_items):
              start = running
              end = running + durations[i]
              running = end
              normalized_blocks.append(
                  f"{i + 1}\n{srt_time(start)} --> {srt_time(end)}\n{text}"
              )

          (OUT / "captions.srt").write_text(
              "\n\n".join(normalized_blocks) + "\n",
              encoding="utf-8",
          )

          # Build a dedicated ASS track so subtitle size and vertical position
          # are deterministic on the 1080x1920 Shorts canvas.
          def ass_time(seconds):
              total_cs = max(0, int(round(seconds * 100)))
              hh = total_cs // 360000
              total_cs %= 360000
              mm = total_cs // 6000
              total_cs %= 6000
              ss = total_cs // 100
              cs = total_cs % 100
              return f"{hh}:{mm:02d}:{ss:02d}.{cs:02d}"

          def ass_escape(text):
              return str(text).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}").replace("\n", " ")

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "ScaledBorderAndShadow: yes",
              "WrapStyle: 0",
              "YCbCr Matrix: TV.709",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Shorts,DejaVu Sans,32,&H00FFFFFF,&H00FFFFFF,&H90000000,&H70000000,0,0,0,0,100,100,0,0,3,2,0,2,80,80,210,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for i, (_, _, text) in enumerate(caption_items):
              start = 0.0 if i == 0 else sum(durations[:i])
              end = start + durations[i]
              ass_lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Shorts,,0,0,0,,{ass_escape(text)}"
              )

          (OUT / "captions.ass").write_text(
              "\n".join(ass_lines) + "\n",
              encoding="utf-8",
          )

          for i, (scene, duration) in enumerate(
              zip(story["scenes"], durations),
              1
          ):
              image = IMAGES / f"scene_{i:02d}.png"
              clip = SCENES / f"clip_{i:02d}.mp4"

              frames = max(1, round(duration * FPS))

              # Alternating direction prevents the whole Short from
              # looking mechanically identical.
              direction = 1 if i % 2 else -1

              zoom_expr = (
                  "min(zoom+0.0008,1.12)"
                  if direction == 1
                  else "if(eq(on,1),1.12,max(zoom-0.0008,1.00))"
              )

              vf = (
                  f"scale=1200:2133,"
                  f"crop=1080:1920,"
                  f"zoompan="
                  f"z='{zoom_expr}':"
                  f"d={frames}:"
                  f"x='iw/2-(iw/zoom/2)':"
                  f"y='ih/2-(ih/zoom/2)':"
                  f"s={VIDEO_WIDTH}x{VIDEO_HEIGHT}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-t", f"{duration:.3f}",
                  "-vf", vf,
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-movflags", "+faststart",
                  str(clip),
              ], timeout=120)

          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join(
                  f"file '{(SCENES / f'clip_{i:02d}.mp4').resolve()}'\n"
                  for i in range(1, len(story["scenes"]) + 1)
              ),
              encoding="utf-8",
          )

          silent_video = OUT / "video_silent.mp4"
          final_video = OUT / "final_short.mp4"

          run_cmd([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video),
          ], timeout=180)

          # Mux clean video + voice in one final pass. Captions remain as .srt/.ass artifacts only.
          run_cmd([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(OUT / "voice.mp3"),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "22",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ], timeout=240)

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["hook"],
              "setting": story["setting"],
              "words": words(script),
              "scenes": len(story["scenes"]),
              "created_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-50:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60, flush=True)
          print("DAILY FACELESS SHORT READY", flush=True)
          print("=" * 60, flush=True)
          print("Title:", story["title"], flush=True)
          print("Scenes:", len(story["scenes"]), flush=True)
          print("Words:", words(script), flush=True)
          print("Voice:", voice, flush=True)
          print("Video:", final_video, flush=True)
          PY

      - name: Persist history and Groq quota ledger
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Persist the quota ledger even when production fails so later runs
          # cannot forget tokens already consumed earlier in the same UTC day.
          git add .github/data/story_history.json .github/data/groq_usage.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No history or quota-ledger changes to commit."
          else
            git commit -m "Persist Shorts history and Groq quota ledger"
            git push
          fi

      - name: Upload finished Short
        id: upload_short
        uses: actions/upload-artifact@v4
        with:
          name: daily-faceless-short
          path: short-output/
          if-no-files-found: error
          retention-days: 7

      - name: Show download link
        if: ${{ success() }}
        run: |
          set -euo pipefail
          ARTIFACT_URL='${{ steps.upload_short.outputs.artifact-url }}'
          ARTIFACT_ID='${{ steps.upload_short.outputs.artifact-id }}'
          echo "Artifact ID: ${ARTIFACT_ID}"
          echo "Download: ${ARTIFACT_URL}"
          {
            echo "## Download"
            echo
            echo "[Download the finished Short](${ARTIFACT_URL})"
            echo
            echo "Artifact ID: ${ARTIFACT_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
