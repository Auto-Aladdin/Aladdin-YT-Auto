name: AI Short Story Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate, critique, repair and plan story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p output .github/data

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          HISTORY_FILE = ".github/data/story_history.json"

          MIN_WORDS = 105
          MAX_WORDS = 405

          WORDS_PER_MINUTE = 135

          MIN_DURATION = 45
          MAX_DURATION = 180

          api_key = os.environ["GROQ_API_KEY"]
          rng = random.SystemRandom()

          story_modes = [
              "quiet human drama",
              "unexpected kindness",
              "second chance",
              "small sacrifice with a big consequence",
              "regret and reconciliation",
              "ordinary person facing an impossible choice",
              "misunderstanding that becomes meaningful",
              "quiet perseverance after failure",
              "a promise almost broken",
              "unexpected courage",
              "a small decision changing two lives",
              "an overlooked person finally being seen",
              "a lost item revealing an important truth",
              "a difficult goodbye",
              "a reunion after years apart",
              "a stranger helping at exactly the right moment",
              "a mistake leading to an unexpected opportunity",
              "quiet honesty",
              "forgiveness after a misunderstanding",
              "someone choosing kindness when it costs them"
          ]

          emotions = [
              "warmth",
              "hope",
              "regret",
              "relief",
              "wonder",
              "gratitude",
              "sadness turning into comfort",
              "quiet joy",
              "fear turning into courage",
              "belonging",
              "forgiveness",
              "surprise",
              "nostalgia",
              "determination",
              "compassion"
          ]

          hooks = [
              "start at the most intriguing moment",
              "start with a specific time or place",
              "start with a surprising action",
              "start with a concrete mystery",
              "start with a consequence before explaining its cause",
              "start with an unusual object and why it matters",
              "start with a promise that seems impossible",
              "start with someone making a decision they may regret"
          ]

          settings = [
              "a nearly empty bus station before sunrise",
              "a small neighborhood repair shop",
              "a rainy apartment building hallway",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a community clinic waiting room",
              "a laundromat on a cold evening",
              "a tiny apartment above a busy street",
              "a corner bakery before opening",
              "a local market just before closing",
              "a parking lot during a summer storm",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a neighborhood bus stop at midnight",
              "a small hotel lobby",
              "a mechanic's garage at closing time"
          ]

          conflicts = [
              "a missed opportunity",
              "a financial problem that must be hidden",
              "a lost item with emotional value",
              "an important message that never arrived",
              "a promise made to someone who is no longer around",
              "a difficult decision between pride and kindness",
              "a misunderstanding that risks a relationship",
              "one last attempt after repeated failure",
              "helping someone without being noticed",
              "an impossible deadline",
              "a goodbye neither person is ready for",
              "a small mistake with unexpectedly large consequences",
              "deciding whether to tell an uncomfortable truth",
              "choosing between convenience and doing what is right"
          ]

          twists = [
              "the person who seemed unimportant was the key to the solution",
              "the ignored object carried the real emotional meaning",
              "the protagonist misunderstood what the other person needed",
              "an earlier kindness quietly returns at the perfect moment",
              "the apparent failure prevents a worse outcome",
              "the person receiving help had helped the protagonist first",
              "a small sacrifice restores something much more important",
              "the final detail changes the meaning of the opening",
              "an ordinary object reveals an unexpected connection",
              "the protagonist discovers the other person planned for them too"
          ]

          endings = [
              "a quiet emotional realization",
              "a visual callback to the opening moment",
              "a brief line that changes the meaning of the story",
              "a small action instead of a speech",
              "an earned moment of relief",
              "an understated act of forgiveness",
              "a hopeful but believable final image",
              "a final detail that makes the viewer rethink the story"
          ]

          brief = {
              "mode": rng.choice(story_modes),
              "emotion": rng.choice(emotions),
              "hook": rng.choice(hooks),
              "setting": rng.choice(settings),
              "conflict": rng.choice(conflicts),
              "twist": rng.choice(twists),
              "ending": rng.choice(endings),
          }

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(HISTORY_FILE, encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          previous = "\n".join(
              f"- {item.get('title','')} | {item.get('premise','')}"
              for item in history[-40:]
          ) or "NONE"

          story_schema = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "conflict": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": [
                              "name",
                              "role",
                              "visual_identity"
                          ],
                          "additionalProperties": False
                      }
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"}
                          },
                          "required": [
                              "scene",
                              "narration"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "conflict",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes"
              ],
              "additionalProperties": False
          }

          critic_schema = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "emotional_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "ending_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"}
                  },
                  "repair_instructions": {"type": "string"}
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues",
                  "repair_instructions"
              ],
              "additionalProperties": False
          }

          visual_schema = {
              "type": "object",
              "properties": {
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "visual_prompt": {"type": "string"},
                              "camera": {"type": "string"},
                              "on_screen_text": {"type": "string"},
                              "sfx": {"type": "string"}
                          },
                          "required": [
                              "scene",
                              "visual_prompt",
                              "camera",
                              "on_screen_text",
                              "sfx"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "scenes"
              ],
              "additionalProperties": False
          }

          def call_groq(prompt, schema, temperature, max_tokens):
              payload = {
                  "model": "openai/gpt-oss-20b",
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

              except urllib.error.HTTPError as e:
                  print(f"HTTP ERROR: {e.code}")
                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
                  raise

              content = result["choices"][0]["message"].get(
                  "content",
                  ""
              )

              if not content:
                  raise RuntimeError(
                      "Groq returned empty content."
                  )

              return json.loads(content)

          def local_story_checks(story):

              scenes = story["scenes"]

              if not 7 <= len(scenes) <= 18:
                  raise ValueError(
                      f"Expected 7-18 scenes, got {len(scenes)}."
                  )

              words = [
                  len(scene["narration"].split())
                  for scene in scenes
              ]

              total = sum(words)

              if not MIN_WORDS <= total <= MAX_WORDS:
                  raise ValueError(
                      f"Story has {total} words; "
                      f"allowed {MIN_WORDS}-{MAX_WORDS}."
                  )

              text = (
                  story["title"] + " " +
                  story["hook"] + " " +
                  story["turning_point"] + " " +
                  story["payoff"] + " " +
                  " ".join(
                      scene["narration"]
                      for scene in scenes
                  )
              ).lower()

              banned = [
                  "believe in yourself",
                  "never give up",
                  "the human spirit",
                  "everything happens for a reason",
                  "when one door closes",
                  "follow your dreams",
                  "little did they know",
                  "a testament to",
                  "in the end, it was not about",
                  "the power of hope"
              ]

              hits = [
                  phrase
                  for phrase in banned
                  if phrase in text
              ]

              if hits:
                  raise ValueError(
                      "Cliche phrase detected: " +
                      ", ".join(hits)
                  )

              implausible = [
                  "trapped in a freezer",
                  "inside a freezer",
                  "stuck in a freezer",
                  "trapped inside a freezer",
                  "locked inside a freezer"
              ]

              hits = [
                  phrase
                  for phrase in implausible
                  if phrase in text
              ]

              if hits:
                  raise ValueError(
                      "Implausible premise detected: " +
                      ", ".join(hits)
                  )

              return words, total

          # ------------------------------------------------------------
          # STORY GENERATION
          # ------------------------------------------------------------

          story_prompt = f"""
          Write ONE completely original cinematic emotional story for a
          vertical YouTube Short.

          This must feel like a real short film in miniature,
          NOT a motivational poem.

          CREATIVE BRIEF

          Story mode:
          {brief['mode']}

          Primary emotion:
          {brief['emotion']}

          Hook style:
          {brief['hook']}

          Setting seed:
          {brief['setting']}

          Conflict seed:
          {brief['conflict']}

          Twist seed:
          {brief['twist']}

          Ending style:
          {brief['ending']}

          RECENT STORIES:
          {previous}

          Do NOT repeat their premise, setting, central object,
          title pattern, emotional beat, twist, or ending idea.

          HARD RULES:

          - 105-405 spoken words.
          - Natural story duration about 45-180 seconds.
          - Do not pad a short story.
          - Do not stretch a story that is already complete.
          - Give the protagonist a concrete goal/problem.
          - Make something concrete happen.
          - Create a believable conflict.
          - Give the protagonist a meaningful choice or consequence.
          - Build a logical turning point.
          - Make the ending pay off the setup.
          - Let the meaning emerge from the events.
          - Prefer one strong plot over multiple weak subplots.
          - Every scene must advance the story.
          - Keep everything physically plausible.
          - No unexplained miracles.
          - No absurd coincidences.
          - No dangerous stunts presented casually.
          - No celebrities.
          - No existing fictional characters.
          - No movie plots.
          - No song lyrics.
          - No copied internet stories.
          - No calls to action.

          Avoid motivational cliches including:
          "believe in yourself",
          "never give up",
          "the human spirit",
          "everything happens for a reason",
          "when one door closes",
          "follow your dreams",
          "little did they know",
          "a testament to".

          FACELESS DESIGN:

          The story must naturally work without showing identifiable faces.
          Use meaningful actions, hands, objects, silhouettes, backs,
          body language and environments.

          Create 7-18 scenes.

          For this stage each scene must contain ONLY:
          - scene number
          - narration

          Return ONLY JSON matching the schema.
          """

          story = call_groq(
              story_prompt,
              story_schema,
              0.85,
              6500
          )

          # ------------------------------------------------------------
          # CRITIC
          # ------------------------------------------------------------

          critic_prompt = f"""
          You are a ruthless senior short-film editor.

          Evaluate this proposed YouTube Short for actual viewer enjoyment.

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Score every category from 0 to 10:

          - hook
          - originality
          - believability
          - emotional impact
          - conflict
          - ending
          - visual potential

          PASS only when:

          - every score is 7 or higher
          - the premise is physically plausible
          - the conflict is genuinely meaningful
          - the protagonist has a concrete goal/problem
          - the turning point is earned
          - the ending resolves the central story
          - there are no disconnected reveals
          - there is no fake moral pasted onto the ending
          - the story does not read like generic AI motivation
          - the story is understandable without outside context

          Look aggressively for:

          - plot holes
          - impossible situations
          - obvious/no-choice conflicts
          - random charity/helping reveals
          - disconnected morals
          - generic wording
          - weak hooks
          - repetitive ideas
          - weak titles
          - endings that do not pay off the opening

          Return only critic JSON.
          """

          critique = call_groq(
              critic_prompt,
              critic_schema,
              0.25,
              2500
          )

          # ------------------------------------------------------------
          # AUTOMATIC REPAIR
          # ------------------------------------------------------------

          if not critique["pass"]:

              repair_prompt = f"""
              You are the final story editor.

              Rewrite this story to fix EVERY issue in the critic report.

              ORIGINAL STORY:
              {json.dumps(story, ensure_ascii=False)}

              CRITIC:
              {json.dumps(critique, ensure_ascii=False)}

              FINAL QUALITY BAR:

              - believable human situation
              - strong first line
              - specific protagonist
              - concrete goal/problem
              - meaningful conflict
              - logical escalation
              - difficult or meaningful choice
              - earned turning point
              - satisfying payoff
              - ending connected to the opening
              - no fake moral
              - no random reveals
              - no impossible premise
              - no motivational cliches
              - no filler
              - no calls to action
              - naturally filmable without identifiable faces
              - 105-405 spoken words
              - 7-18 scenes

              Keep the strongest parts if they work.
              Replace weak parts instead of merely rewording them.

              Return ONLY the story JSON.
              """

              story = call_groq(
                  repair_prompt,
                  story_schema,
                  0.65,
                  6500
              )

              words, total_words = local_story_checks(
                  story
              )

              final_critic_prompt = f"""
              Perform the FINAL publication-readiness review.

              STORY:
              {json.dumps(story, ensure_ascii=False)}

              PASS only when every category is at least 7/10 and there is
              no serious plot hole, implausibility, weak conflict,
              disconnected ending, or generic motivational writing.

              Return only critic JSON.
              """

              final_critique = call_groq(
                  final_critic_prompt,
                  critic_schema,
                  0.15,
                  2500
              )

              if not final_critique["pass"]:
                  raise RuntimeError(
                      "Story failed final quality review: " +
                      json.dumps(
                          final_critique.get(
                              "issues",
                              []
                          ),
                          ensure_ascii=False
                      )
                  )

              quality_report = final_critique

          else:

              words, total_words = local_story_checks(
                  story
              )

              quality_report = critique

          # ------------------------------------------------------------
          # VISUAL PLANNING — ONLY AFTER STORY PASSES
          # ------------------------------------------------------------

          visual_prompt = f"""
          Create a production-ready visual plan for this approved
          original faceless YouTube Short.

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Create exactly one visual plan for every scene.

          IMPORTANT:

          - The visual must directly match the narration.
          - Never invent a new event.
          - Never contradict the story.
          - Never require an identifiable face.
          - Prefer backs, silhouettes, hands, objects, reflections,
            shadows, close-ups, over-the-shoulder shots and environments.
          - Keep characters, clothing, props, locations and time of day
            consistent.
          - Prompts must be concrete and cinematic.
          - Specify subject, action, setting, lighting, mood,
            composition and continuity.
          - Camera directions must be physically plausible.
          - SFX must match the action.
          - On-screen text must be short and used sparingly.

          Use exactly the same scene numbers.

          Return ONLY JSON matching the schema.
          """

          visuals = call_groq(
              visual_prompt,
              visual_schema,
              0.45,
              5000
          )

          visual_by_number = {
              scene["scene"]: scene
              for scene in visuals["scenes"]
          }

          if len(visual_by_number) != len(
              story["scenes"]
          ):
              raise RuntimeError(
                  "Visual plan count does not match story count."
              )

          for scene in story["scenes"]:

              number = scene["scene"]

              if number not in visual_by_number:
                  raise RuntimeError(
                      f"Missing visual plan for scene {number}."
                  )

              scene.update(
                  visual_by_number[number]
              )

          # ------------------------------------------------------------
          # ADAPTIVE RUNTIME
          # ------------------------------------------------------------

          duration = round(
              total_words /
              WORDS_PER_MINUTE *
              60
          )

          duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  duration
              )
          )

          base_duration = (
              len(story["scenes"]) * 3
          )

          if base_duration > duration:
              raise RuntimeError(
                  "Too many scenes for estimated runtime."
              )

          extra = (
              duration -
              base_duration
          )

          weights = [
              len(scene["narration"].split())
              for scene in story["scenes"]
          ]

          weight_sum = sum(weights)

          raw = [
              extra * weight / weight_sum
              for weight in weights
          ]

          whole = [
              int(value)
              for value in raw
          ]

          leftover = extra - sum(whole)

          order = sorted(
              range(len(raw)),
              key=lambda i:
                  raw[i] - whole[i],
              reverse=True
          )

          for index in order[:leftover]:
              whole[index] += 1

          durations = [
              3 + value
              for value in whole
          ]

          for index, scene in enumerate(
              story["scenes"]
          ):
              scene["scene"] = index + 1
              scene["duration_seconds"] = (
                  durations[index]
              )

          story["story"] = " ".join(
              scene["narration"].strip()
              for scene in story["scenes"]
          )

          story["word_count"] = total_words

          story["estimated_duration_seconds"] = (
              duration
          )

          story["quality_checked"] = True

          story["quality_scores"] = (
              quality_report
          )

          # ------------------------------------------------------------
          # SAVE OUTPUT
          # ------------------------------------------------------------

          with open(
              "output/story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  story["title"]
              )

          with open(
              "output/script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  story["story"]
              )

          with open(
              "output/description.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  story["description"]
              )

          with open(
              "output/scenes.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  story["scenes"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ------------------------------------------------------------
          # UPDATE HISTORY
          # ------------------------------------------------------------

          premise = (
              story["setting"] +
              " | " +
              story["conflict"] +
              " | " +
              story["turning_point"]
          )

          fingerprint = hashlib.sha256(
              (
                  story["title"] +
                  "|" +
                  premise
              ).encode(
                  "utf-8"
              )
          ).hexdigest()[:16]

          history.append(
              {
                  "title": story["title"],
                  "premise": premise,
                  "fingerprint": fingerprint,
                  "timestamp": int(time.time())
              }
          )

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history[-50:],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "========================================"
          )
          print(
              "✅ STORY PASSED FULL QUALITY PIPELINE"
          )
          print(
              "========================================"
          )
          print(
              "Title:",
              story["title"]
          )
          print(
              "Scenes:",
              len(story["scenes"])
          )
          print(
              "Words:",
              total_words
          )
          print(
              "Estimated duration:",
              duration,
              "seconds"
          )
          print(
              "Durations:",
              durations
          )
          print(
              "Quality checked: YES"
          )
          print(
              "========================================"
          )
          PY

      - name: Save story history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/data/story_history.json

          if git diff --cached --quiet; then
            echo "No history update."
          else
            git commit -m "Update AI story history"
            git push
          fi

      - name: Upload story package
        uses: actions/upload-artifact@v7
        with:
          name: ai-short-story
          path: output/
          retention-days: 7
