name: Daily Faceless Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.2.8

      - name: Generate story, images, voice and video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_API_KEY_2: ${{ secrets.POLLINATIONS_API_KEY_2 }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import hashlib
          import json
          import math
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # ============================================================
          # MISSION
          # ============================================================
          # One daily faceless motivational/emotional Short:
          # story -> scene image -> free TTS -> captions -> motion video
          #
          # Designed for GitHub Actions so the user's computer does not
          # need to stay online.
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          ROOT = Path(".")
          OUT = ROOT / "short-output"
          ASSETS = OUT / "assets"
          IMAGES = ASSETS / "images"
          SCENES = ASSETS / "clips"

          HISTORY_FILE = ROOT / ".github" / "data" / "story_history.json"
          GROQ_USAGE_FILE = ROOT / ".github" / "data" / "groq_usage.json"

          API_KEY = os.environ["GROQ_API_KEY"]

          MIN_WORDS = 165
          MAX_WORDS = 230
          SCENES_MIN = 8
          SCENES_MAX = 10
          SCENE_MIN_WORDS = 12
          SCENE_MAX_WORDS = 27
          TARGET_SCENE_MIN_WORDS = 17
          TARGET_SCENE_MAX_WORDS = 21

          HTTP_TIMEOUT = 45
          MAX_RETRIES = 2
          MAX_STORY_CALLS = 1
          MIN_GAP = 1.0

          IMAGE_WIDTH = 768
          IMAGE_HEIGHT = 1365
          VIDEO_WIDTH = 1080
          VIDEO_HEIGHT = 1920
          FPS = 30

          # ------------------------------------------------------------
          # Creative controls — these are diversified starting points,
          # NOT rigid templates. The writer must fuse or subvert them.
          # ------------------------------------------------------------

          DOMAINS = [
              "an ordinary person notices a tiny inconsistency that changes an entire situation",
              "a practical problem with an unexpectedly clever solution",
              "a social misunderstanding that escalates because everyone assumes the wrong thing",
              "a rivalry where the real advantage is hidden in plain sight",
              "a valuable-looking object that turns out to matter for a completely different reason",
              "a routine job interrupted by a problem nobody else notices",
              "two people trying to solve different parts of the same problem without realizing it",
              "a seemingly bad decision that becomes useful because of an earlier overlooked detail",
              "a small act with an unexpectedly large chain reaction",
              "a person who is underestimated and quietly proves why",
              "a missing item that is found through observation rather than luck",
              "a plan that fails for a believable reason and forces a better second plan",
              "a public misunderstanding resolved by a physical clue",
              "a competitive challenge where the obvious winning strategy is the trap",
              "an everyday rule that creates an unusual but logical consequence",
              "a near-mistake that reveals what was actually happening",
          ]

          SETTINGS = [
              "rainy downtown side street",
              "old neighborhood restaurant kitchen",
              "busy train station concourse",
              "small apartment building hallway",
              "independent mechanic garage",
              "backstage theater corridor",
              "crowded night market",
              "quiet suburban corner shop",
              "rooftop greenhouse",
              "community sports court",
              "independent bookstore",
              "warehouse loading bay",
              "farm road beside a barn",
              "hotel service corridor",
              "coastal fishing dock",
              "old cinema lobby",
              "public library reading room",
              "small bicycle repair shop",
              "city bus depot",
              "apartment rooftop laundry area",
          ]

          EMOTIONS = [
              "curiosity with quiet tension",
              "playful awkwardness",
              "contained suspense",
              "warm relief",
              "surprise",
              "earned determination",
              "wonder",
              "pressure and uncertainty",
              "dry humor",
              "earned trust",
              "quiet emotional impact",
              "clever triumph",
              "embarrassment turning into relief",
              "gentle irony",
              "high-stakes focus without melodrama",
          ]

          HOOK_MODES = [
              "begin with a natural everyday action, then reveal one specific detail that suddenly matters",
              "open on a character already making a decision whose consequence is not yet clear",
              "start with a believable interruption that changes the character's immediate plan",
              "begin with a small visual anomaly and let the audience notice it with the protagonist",
              "open on a social misunderstanding already forming, then reveal what one person actually knows",
              "start one beat before a plan goes wrong, but make the plan and goal understandable first",
              "begin with a character noticing that something is out of place in an ordinary environment",
              "open with a simple task that becomes unexpectedly difficult for a concrete reason",
              "start with a confident choice that immediately creates a new problem",
          ]

          TWIST_MODES = [
              "a background detail from earlier becomes the key to the problem",
              "the protagonist misunderstood what another character actually wanted",
              "the apparent obstacle is not the real obstacle",
              "the failed first attempt creates the clue needed for the successful second attempt",
              "two characters were working from different assumptions",
              "the person who seemed least important has the missing piece",
              "the obvious solution would make the situation worse",
              "an earlier small choice changes the meaning of the final scene",
              "the opening detail returns in a new context and explains what really happened",
              "the apparent loss turns out to have prevented a larger problem",
          ]

          ENDING_MODES = [
              "a clever payoff caused by an earlier clue",
              "a warm human payoff earned through a concrete choice",
              "a funny reversal that still makes perfect logical sense",
              "a quiet reveal that reinterprets the opening",
              "an unexpected consequence that closes the causal loop",
              "a visual callback that completes the story without a lecture",
              "a small victory that reveals what the character actually valued",
              "a satisfying reversal where the audience realizes the clue was visible all along",
              "an understated final beat that lets the situation speak for itself",
          ]

          BANNED = [
              "magic",
              "magical",
              "supernatural",
              "miracle",
              "miraculous",
              "destiny",
              "fate",
              "hospital",
              "terminal illness",
              "child in danger",
              "lottery",
              "hidden fortune",
              "anonymous donor",
              "bonus",
              "thank-you note",
              "elevator",
              "blackout",
              "concert",
              "audition",
              "train platform",
              "coffee shop",
              "ticking clock",
              "glowing object",
              "red ribbon",
              "random stranger",
              "life lesson",
              "lesson in",
              "moral of the story",
              "everything happens for a reason",
              "you won't believe",
              "watch until the end",
          ]

          def run_cmd(args, timeout=120, capture=True):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
                  timeout=timeout,
                  check=False,
              )
              if p.returncode != 0:
                  raise RuntimeError(
                      f"Command failed ({p.returncode}): {' '.join(args)}\n"
                      f"{p.stdout[-4000:] if p.stdout else ''}"
                  )
              return p.stdout or ""

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          def load_groq_usage():
              today = time.strftime("%Y-%m-%d", time.gmtime())
              try:
                  data = json.loads(GROQ_USAGE_FILE.read_text(encoding="utf-8"))
                  if data.get("utc_date") == today:
                      return {"utc_date": today, "tokens": int(data.get("tokens", 0) or 0)}
              except Exception:
                  pass
              return {"utc_date": today, "tokens": 0}

          def save_groq_usage(state):
              GROQ_USAGE_FILE.parent.mkdir(parents=True, exist_ok=True)
              GROQ_USAGE_FILE.write_text(json.dumps(state, indent=2), encoding="utf-8")

          history = load_history()
          recent = history[-12:]
          recent_text = "\n".join(
              f"- {str(x.get('title','')).strip()[:90]} | "
              f"{str(x.get('premise','')).strip()[:180]} | "
              f"{str(x.get('setting','')).strip()[:90]}"
              for x in recent
          ) or "NONE"

          last_call = 0.0

          STORY_SCHEMA = {
              "name": "publication_story",
              "schema": {
                  "type": "object",
                  "properties": {
                      "title": {"type": "string"},
                      "hook": {"type": "string"},
                      "description": {"type": "string"},
                      "protagonist": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "age": {"type": "integer"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "age", "role", "visual_identity"],
                          "additionalProperties": False
                      },
                      "setting": {"type": "string"},
                      "scenes": {
                          "type": "array",
                          # Keep scene count constrained at generation time so a
                          # short structural miss does not trigger a full repair call.
                          "minItems": 8,
                          "maxItems": 10,
                          "items": {
                              "type": "object",
                              "properties": {
                                  "scene": {"type": "integer"},
                                  "narration": {"type": "string"},
                                  "visual_prompt": {"type": "string"}
                              },
                              "required": ["scene", "narration", "visual_prompt"],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["title", "hook", "description", "protagonist", "setting", "scenes"],
                  "additionalProperties": False
              }
          }

          # ------------------------------------------------------------
          # Token-aware Groq dispatcher
          # Groq is the ONLY LLM provider in this workflow.
          # ------------------------------------------------------------

          groq_usage_today = load_groq_usage()
          primary_disabled_for_run = False
          groq_remaining_tpm = None

          def estimate_tokens(text):
              # Conservative approximation for English/JSON.
              return max(1, math.ceil(len(text) / 4.0))

          def parse_provider_usage(data):
              usage = data.get("usage") if isinstance(data, dict) else None
              if not isinstance(usage, dict):
                  return 0
              try:
                  return int(usage.get("total_tokens") or 0)
              except Exception:
                  return 0

          def groq_daily_exhausted(raw):
              low = raw.lower()
              return (
                  "tokens per day" in low
                  or "(tpd)" in low
                  or ("rate_limit_exceeded" in low and "200000" in low)
              )

          def make_payload(prompt, max_tokens, temperature, response_schema):
              return {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return ONLY one valid JSON object. "
                              "Never return markdown. Never return a top-level array. "
                              "No commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": (
                      {
                          "type": "json_schema",
                          "json_schema": {
                              "name": response_schema["name"],
                              "strict": True,
                              "schema": response_schema["schema"],
                          },
                      }
                      if response_schema
                      else {"type": "json_object"}
                  ),
              }

          class ProviderHTTPError(RuntimeError):
              def __init__(self, provider, code, raw):
                  self.provider = provider
                  self.code = code
                  self.raw = raw
                  super().__init__(f"{provider} HTTP {code}: {raw}")

          def post_json(url, key, payload, provider_name):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V1",
                  },
                  method="POST",
              )
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                      data = json.loads(r.read().decode("utf-8"))
                      headers = {k.lower(): v for k, v in r.headers.items()}
                  return data, headers, time.monotonic() - started
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  raise ProviderHTTPError(provider_name, exc.code, raw) from exc

          def groq_json(prompt, max_tokens=2000, temperature=0.55, label="groq", response_schema=None):
              global last_call, primary_disabled_for_run, groq_remaining_tpm, groq_usage_today

              gap = time.monotonic() - last_call
              if gap < MIN_GAP:
                  time.sleep(MIN_GAP - gap)

              estimate = estimate_tokens(prompt) + max_tokens

              if primary_disabled_for_run:
                  raise RuntimeError(
                      "Groq has been disabled for this run after a daily token-limit response."
                  )

              # Groq is the source of truth for live limits; do not locally reject
              # requests using stale persisted usage or token estimates.
              payload = make_payload(prompt, max_tokens, temperature, response_schema)
              print(f"[Groq] {label} estimated request tokens ≈ {estimate}", flush=True)
              print(f"[Groq] {label} attempt 1/2", flush=True)
              last_call = time.monotonic()

              try:
                  data, headers, elapsed = post_json(API_URL, API_KEY, payload, "Groq")
                  content = data["choices"][0]["message"].get("content", "")
                  if not content:
                      raise RuntimeError("Groq returned empty content.")
                  try:
                      obj = json.loads(content)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError(f"Groq returned invalid JSON: {exc}") from exc
                  if isinstance(obj, list) and len(obj) == 1 and isinstance(obj[0], dict):
                      obj = obj[0]
                  if not isinstance(obj, dict):
                      raise RuntimeError(f"{label} must return a JSON object, got {type(obj).__name__}")

                  actual_tokens = parse_provider_usage(data)
                  accounted_tokens = actual_tokens if actual_tokens > 0 else estimate
                  groq_usage_today["tokens"] += accounted_tokens
                  save_groq_usage(groq_usage_today)
                  remaining_tpm = headers.get("x-ratelimit-remaining-tokens")
                  if remaining_tpm:
                      try:
                          groq_remaining_tpm = int(remaining_tpm)
                      except (TypeError, ValueError):
                          groq_remaining_tpm = None
                      print(f"[Groq] {label} TPM remaining: {remaining_tpm}", flush=True)

                  print(
                      f"[Groq] {label} success in {elapsed:.2f}s "
                      f"(usage={actual_tokens or 'unknown'} tokens)",
                      flush=True,
                  )
                  return obj

              except ProviderHTTPError as exc:
                  print(f"[Groq] HTTP {exc.code} {label}", flush=True)

                  # TPD exhaustion is deterministic: do not retry and do not
                  # silently switch to a paid provider.
                  if exc.code == 429 and groq_daily_exhausted(exc.raw):
                      primary_disabled_for_run = True
                      used_match = re.search(r"Used\s+(\d+)", exc.raw)
                      if used_match:
                          try:
                              reported_used = int(used_match.group(1))
                              groq_usage_today["tokens"] = max(groq_usage_today["tokens"], reported_used)
                              save_groq_usage(groq_usage_today)
                          except ValueError:
                              pass
                      raise RuntimeError(
                          "Groq daily token limit reached during " + label + ". "
                          "This workflow is intentionally Groq-only, so it stops cleanly.\n"
                          + exc.raw
                      ) from exc

                  # Keep one retry for transient 429s that are NOT daily TPD.
                  if exc.code == 429:
                      time.sleep(2.0)
                      retry_data, retry_headers, retry_elapsed = post_json(
                          API_URL, API_KEY, payload, "Groq"
                      )
                      retry_content = retry_data["choices"][0]["message"].get("content", "")
                      if not retry_content:
                          raise RuntimeError("Groq returned empty content on retry.")
                      try:
                          retry_obj = json.loads(retry_content)
                      except json.JSONDecodeError as retry_exc:
                          raise RuntimeError(
                              f"Groq returned invalid JSON on retry: {retry_exc}"
                          ) from retry_exc
                      if isinstance(retry_obj, list) and len(retry_obj) == 1 and isinstance(retry_obj[0], dict):
                          retry_obj = retry_obj[0]
                      if not isinstance(retry_obj, dict):
                          raise RuntimeError(f"{label} retry returned non-object JSON.")
                      actual_tokens = parse_provider_usage(retry_data)
                      accounted_tokens = actual_tokens if actual_tokens > 0 else estimate
                      groq_usage_today["tokens"] += accounted_tokens
                      save_groq_usage(groq_usage_today)
                      retry_remaining_tpm = retry_headers.get("x-ratelimit-remaining-tokens")
                      if retry_remaining_tpm:
                          try:
                              groq_remaining_tpm = int(retry_remaining_tpm)
                          except (TypeError, ValueError):
                              groq_remaining_tpm = None
                      print(
                          f"[Groq] {label} retry success in {retry_elapsed:.2f}s "
                          f"(usage={actual_tokens or 'unknown'} tokens)",
                          flush=True,
                      )
                      return retry_obj

                  raise

          def banned(text):
              lower = text.lower()
              for phrase in BANNED:
                  if phrase in lower:
                      return phrase
              return None

          def words(text):
              return len(str(text).split())

          def is_one_sentence(text):
              value = str(text).strip()
              if not value:
                  return False
              if ";" in value or "—" in value or "–" in value:
                  return False
              if not re.search(r"[.!?](?:[\"\'\)\]])*$", value):
                  return False

              # Do not mistake normal abbreviations for sentence endings.
              check = re.sub(
                  r"\b(?:Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|e\.g|i\.e)\.",
                  lambda m: m.group(0).replace(".", "<DOT>"),
                  value,
                  flags=re.IGNORECASE,
              )

              # A terminal punctuation mark may be followed by closing quotes or brackets.
              check = re.sub(r"[.!?](?=[\"\'\)\]]*$)", "<END>", check)
              return not bool(re.search(r"[.!?]\s+", check))

          def normalize_narration(text):
              """Keep a generated scene narration as one spoken TTS cue.

              This is a local, deterministic cleanup only; it avoids spending
              another Groq call when the model accidentally uses two short
              sentences or a forbidden dash/semicolon.
              """
              value = re.sub(r"\s+", " ", str(text).strip())
              if not value:
                  return value

              parts = re.split(r"(?<=[.!?])\s+(?=[A-Z0-9\"'])", value)
              if len(parts) > 1:
                  cleaned = []
                  for part in parts:
                      part = part.strip().rstrip(".!?")
                      if part:
                          cleaned.append(part)
                  value = ", and ".join(cleaned)

              value = re.sub(r"\s*;\s*", ", and ", value)
              value = re.sub(r"\s*[—–]\s*", ", and ", value)
              value = re.sub(r"\s{2,}", " ", value).strip()

              if value and value[-1] not in ".!?":
                  value += "."
              elif value:
                  value = value[:-1] + "."
              return value

          def normalize_story_narrations(story):
              for scene in story.get("scenes", []):
                  if isinstance(scene, dict) and "narration" in scene:
                      scene["narration"] = normalize_narration(scene["narration"])

          def validate_story(story):
              if not isinstance(story, dict):
                  return "Story is not an object."

              required = [
                  "title", "hook", "description", "protagonist",
                  "setting", "scenes"
              ]
              for k in required:
                  if k not in story:
                      return f"Missing field: {k}"

              protagonist = story["protagonist"]
              if not isinstance(protagonist, dict):
                  return "Protagonist must be an object."

              if not str(protagonist.get("name", "")).strip():
                  return "Missing protagonist name."

              try:
                  age = int(protagonist.get("age"))
              except Exception:
                  return "Invalid protagonist age."

              if not 21 <= age <= 70:
                  return "Protagonist age must be 21-70."

              role = str(protagonist.get("role", "")).strip()
              if not role:
                  return "Missing protagonist role."

              scenes = story["scenes"]
              if not isinstance(scenes, list):
                  return "Scenes must be an array."

              if len(scenes) < SCENES_MIN or len(scenes) > SCENES_MAX:
                  return (
                      f"Story must contain {SCENES_MIN}-{SCENES_MAX} scenes; got {len(scenes)}."
                  )

              total = 0
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      return f"Scene {i} is not an object."

                  narration = str(scene.get("narration", "")).strip()
                  count = words(narration)
                  total += count

                  if count < SCENE_MIN_WORDS or count > SCENE_MAX_WORDS:
                      return (
                          f"Scene {i} has {count} words; "
                          f"allowed {SCENE_MIN_WORDS}-{SCENE_MAX_WORDS}."
                      )

                  if not is_one_sentence(narration):
                      return f"Scene {i} narration must be exactly one simple sentence."

                  visual = str(scene.get("visual_prompt", "")).strip()
                  if len(visual.split()) < 8:
                      return f"Scene {i} visual prompt is too short."

              if total < MIN_WORDS:
                  return f"Story is too short at {total} words; minimum {MIN_WORDS}."
              if total > MAX_WORDS:
                  return f"Story is too long at {total} words; maximum {MAX_WORDS}."

              hook = str(story["hook"]).strip()
              if words(hook) < 10:
                  return "Hook is too short."

              # Only genuinely disallowed patterns reach this check. Harmless vocabulary
              # such as "applause" is intentionally not a ban because it is not a quality
              # or policy failure and should never trigger a full-token LLM repair.
              blob = json.dumps(story, ensure_ascii=False)
              bad = banned(blob)
              if bad:
                  return f"Banned pattern: {bad}"

              title = str(story["title"]).strip()
              if words(title) > 12:
                  return "Title is too long."

              return None

          def create_story():
              prompt = f"""
              Create ONE original 35–60 second animated Short that feels authored, visual, emotional, and easy to follow.

              STORY: Write a clear, original mini-story with a human situation viewers can understand immediately: a concrete goal, obstacle, attempt, setback/reveal, meaningful choice, consequence, and earned payoff. The protagonist must cause the outcome. Make this story materially different from RECENT STORIES in premise, profession, central object, conflict, twist, emotional progression, and ending. No generic moral, random luck, convenient stranger, recycled rescue, fake cliffhanger, copied viral/Reddit plot, or near-duplicate retelling.

              OPENING HOOK: Scene 1 must orient the viewer before escalating. In natural spoken English, quickly establish WHO the main person is, WHERE or WHAT ordinary situation they are in, and ONE specific change/problem/detail that makes us want the next scene. The opening may use the person's name, job, routine, relationship, possession, or immediate task when useful. Vary the sentence structure every story; do NOT repeatedly start with "There was...", "One day...", "Meet...", or the same formula. Prefer concrete human details over vague mystery language. The hook must promise only what the story actually delivers.

              NARRATION: Natural, simple spoken English; one sentence per scene. Every sentence advances cause-and-effect with new information, a clue, emotion, decision, or consequence. Target 23–25 words per scene and 190–200 total words across EXACTLY 8 scenes. This target is deliberate: keep every scene safely below the 27-word validator ceiling while preserving enough detail for a strong voiceover. Generate all 8 scenes, numbered 1–8; never stop early. Scene 8 must contain the final consequence and earned payoff. Avoid filler, awkward punctuation, broken names, and confusing pronouns.

              CHARACTER CONSISTENCY: Create one specific adult protagonist with fixed age, name, role, face, eyes, brows, hair, skin tone, build, outfit/colors, shoes, and ONE signature accessory. Lock those traits for every scene in THIS story. If the protagonist happens to be a recurring named character such as Alina, preserve the same established identity rather than redesigning her. Do not force the same protagonist name into every new story unless the premise naturally calls for a recurring character. Give important supporting characters a small but distinctive visual identity on first appearance (for example age range, hair, clothing color, glasses, uniform, or other stable feature) and repeat those identifying traits whenever they reappear.

              VISUAL STYLE: Same premium hand-drawn 2D animated film in every scene: expressive stylized humans, believable exaggerated anatomy, large expressive eyes, clean dark ink outlines, painterly digital color, subtle cel shading, soft gradients, textured brushwork, rich slightly muted cinematic colors, strong depth, atmospheric light, realistic contact/cast shadows, polished environments. Avoid photorealistic, live-action, 3D CGI, anime, manga, chibi, flat vector, generic AI cartoon.

              SCENE-STORY MATCH: Treat every scene as a storyboard frame for THAT narration sentence, not as a protagonist portrait. The primary visual subject must be the person, place, object, clue, interaction, or consequence that carries the story beat. If another character performs the important action, make that character prominent. If an object or location is the important reveal, make it visually dominant. The protagonist may be off-center, secondary, partially visible, or absent when the narrated beat does not require them. Never add the protagonist merely because they are the main character. Show the correct supporting characters, props, object states, and location details mentioned or logically required by the narration.

              SCENE VARIETY: Every frame must communicate a genuinely different beat. Vary who owns the frame, shot size, angle, composition, number of visible characters, interaction, prop state, environment zone, foreground/midground/background information, and emotional focus. Avoid nine consecutive waist-up portraits, repeated crossed-arm poses, repeated empty bookstore/office backgrounds, or generic smiling-at-camera compositions. When a story beat is about a ledger, machine, letter, food order, bicycle, train board, key, customer, vendor, crowd, room, or other concrete element, visibly show that element as important.

              VISUAL_PROMPT: Write one compact, production-ready cinematic image prompt for each scene. It must describe the exact freeze-frame that best proves the narration visually.

              Every visual_prompt MUST naturally include:
              - the true primary visual subject for THIS beat
              - only the characters who should actually be on screen
              - stable identifying traits for every returning character who appears
              - the specific physical action, interaction, clue, object state, or visible consequence
              - the correct location/environment and meaningful story props
              - mood/emotion shown through visible behavior
              - camera shot/angle/composition chosen for this beat
              - lighting
              - continuity with established wardrobe, character identity, props, and setting
              - a distinct visual beat clearly different from adjacent scenes

              VISUAL OWNERSHIP RULE: Before writing each visual_prompt, ask "What must the viewer SEE to understand this exact narration with the sound muted?" Make that answer the focus. Do not default to the protagonist. Do not mention a supporting character in narration and then hide them in the background. Do not describe an important object in narration without showing it clearly.

              Do NOT use field labels, headings, bullet points, or repeated boilerplate inside visual_prompt.
              Do NOT restate the global art style in every scene.
              Do NOT repeat the protagonist's full description unless needed for continuity; use the saved identity consistently.
              Use concrete visual nouns and verbs instead of long adjective chains.
              Keep each visual_prompt approximately 30–48 words so supporting characters, props, locations, and actions have enough room to be explicit.
              Prioritize story accuracy and visual ownership over making the protagonist look attractive or centered.

              YOUTUBE SAFETY & ORIGINALITY: Keep the story fictional, family-friendly, and suitable for a broad audience. Do not glorify dangerous acts, scams, hate, graphic violence, sexual content, harmful challenges, illegal instructions, or deceptive claims. Do not imitate a real person's identity or present fabricated real-world claims as fact. Originality matters: automation is not permission to mass-produce near-identical plots, openings, scenes, titles, or endings.

              SEO METADATA: The `title` and `description` must accurately describe THIS exact story. Make the title concise, curiosity-driven, natural, and specific, with the strongest story concept or searchable phrase near the beginning when it fits; no false clickbait, ALL-CAPS spam, or misleading promise. Write a unique description in 2 concise sentences using 1–2 natural story-specific keywords that also appear or are clearly represented in the story. Do not keyword-stuff.

              IMPORTANT: In each scene object, the `scene` field MUST be a JSON integer (1, 2, 3...), never a quoted string.

              Use these creative starting points, not templates:
              Domain: {random.choice(DOMAINS)}
              Setting: {random.choice(SETTINGS)}
