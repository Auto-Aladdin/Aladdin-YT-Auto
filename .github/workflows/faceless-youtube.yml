                          16: " and the next decision suddenly became much harder than anyone expected at first",
                          17: " and the next decision suddenly became much harder than anyone had expected at first",
                          18: " and the next decision suddenly became much harder than anyone could have expected",
                          19: " and the next decision suddenly became much harder than anyone could have reasonably expected",
                          20: " and the next decision suddenly became much harder than anyone could have reasonably expected before",
                          21: " and the next decision suddenly became much harder than anyone could have reasonably expected before then",
                          22: " and the next decision suddenly became much harder than anyone could have reasonably expected at that moment",
                          23: " and the next decision suddenly became much harder than anyone could have reasonably expected in that exact moment",
                          24: " and the next decision suddenly became much harder than anyone could have reasonably expected in that exact situation",
                      }

                      if 1 <= shortfall <= 24 and story.get("scenes"):
                          target = story["scenes"][-1]
                          narration = str(target.get("narration", "")).strip()
                          clause = EXACT_CAUSAL_CLAUSES[shortfall]
                          candidate = narration.rstrip(".!? ") + clause + "."
                          if words(candidate) - words(narration) == shortfall:
                              target["narration"] = candidate
