name: Daily Faceless Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.2.8

      - name: Generate story, images, voice and video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # ============================================================
          # MISSION
          # ============================================================
          # One daily faceless motivational/emotional Short:
          # story -> scene image -> free TTS -> captions -> motion video
          #
          # Designed for GitHub Actions so the user's computer does not
          # need to stay online.
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          ROOT = Path(".")
          OUT = ROOT / "short-output"
          ASSETS = OUT / "assets"
          IMAGES = ASSETS / "images"
          SCENES = ASSETS / "clips"

          HISTORY_FILE = ROOT / ".github" / "data" / "story_history.json"

          API_KEY = os.environ["GROQ_API_KEY"]

          MIN_WORDS = 170
          MAX_WORDS = 230
          SCENES_MIN = 7
          SCENES_MAX = 16
          SCENE_MIN_WORDS = 12
          SCENE_MAX_WORDS = 26
          TARGET_SCENE_MIN_WORDS = 17
          TARGET_SCENE_MAX_WORDS = 21

          HTTP_TIMEOUT = 45
          MAX_RETRIES = 2
          MAX_STORY_CALLS = 1
          MIN_GAP = 1.0

          IMAGE_WIDTH = 768
          IMAGE_HEIGHT = 1365
          VIDEO_WIDTH = 1080
          VIDEO_HEIGHT = 1920
          FPS = 30

          # ------------------------------------------------------------
          # Story controls — intentionally simple and broad enough to
          # create motivational / emotional / human-interest Shorts.
          # ------------------------------------------------------------

          DOMAINS = [
              "unexpected mistake with escalating consequences",
              "clever rivalry between two determined people",
              "friendship tested by a surprising misunderstanding",
              "ordinary task that turns into an unusual challenge",
              "strange discovery that creates a practical problem",
              "competition where the obvious strategy fails",
              "small act that triggers an unexpected chain reaction",
              "missing object with a revealing search",
              "time-pressure decision with two believable choices",
              "failed plan that forces a smarter second attempt",
              "awkward public situation that becomes unexpectedly funny",
              "teamwork problem where people must improvise",
              "rivalry that reveals unexpected respect",
              "ordinary person protecting something important without superpowers",
              "misunderstanding that changes completely after one discovery",
          ]

          SETTINGS = [
              "busy repair workshop",
              "crowded apartment building",
              "small neighborhood market",
              "community sports facility",
              "compact design studio",
              "school-adjacent community space with adults present",
              "city rooftop workspace",
              "old theater backstage area",
              "weekend street market",
              "train-station service area",
              "small restaurant kitchen before opening",
              "delivery depot",
              "photography studio",
              "maker workshop",
              "apartment hallway and storage room",
          ]

          EMOTIONS = [
              "curiosity",
              "tension",
              "surprise",
              "humor",
              "relief",
              "determination",
              "awkwardness",
              "wonder without magic",
              "earned respect",
              "warmth",
              "triumph",
              "quiet emotional payoff",
          ]

          BANNED = [
              "magic",
              "magical",
              "supernatural",
              "miracle",
              "miraculous",
              "destiny",
              "fate",
              "hospital",
              "terminal illness",
              "child in danger",
              "lottery",
              "hidden fortune",
              "benefactor",
              "anonymous donor",
              "bonus",
              "promotion",
              "applause",
              "thank-you note",
              "elevator",
              "blackout",
              "concert",
              "audition",
              "train platform",
              "coffee shop",
              "ticking clock",
              "glowing object",
              "red ribbon",
              "random stranger",
              "reverie",
              "poignant",
              "tentative",
              "fragile peace",
              "scars remain",
              "healing",
              "silent apology",
              "unspoken pain",
              "haunting memory",
              "life lesson",
              "lesson in",
              "moral of the story",
          ]

          def run_cmd(args, timeout=120, capture=True):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
                  timeout=timeout,
                  check=False,
              )
              if p.returncode != 0:
                  raise RuntimeError(
                      f"Command failed ({p.returncode}): {' '.join(args)}\n"
                      f"{p.stdout[-4000:] if p.stdout else ''}"
                  )
              return p.stdout or ""

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()
          recent = history[-20:]
          recent_text = "\n".join(
              f"- {x.get('title','')} | {x.get('premise','')} | {x.get('setting','')}"
              for x in recent
          ) or "NONE"

          last_call = 0.0

          STORY_SCHEMA = {
              "name": "publication_story",
              "schema": {
                  "type": "object",
                  "properties": {
                      "title": {"type": "string"},
                      "hook": {"type": "string"},
                      "description": {"type": "string"},
                      "protagonist": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "age": {"type": "integer"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "age", "role", "visual_identity"],
                          "additionalProperties": False
                      },
                      "setting": {"type": "string"},
                      "scenes": {
                          "type": "array",
                          # Scene count is intentionally NOT constrained here.
                          # Groq must return the complete JSON object first; our
                          # deterministic validator applies the adaptive scene-count
                          # rule afterward. This prevents schema-level HTTP 400 errors
                          # when the model naturally produces a few more scenes.
                          "items": {
                              "type": "object",
                              "properties": {
                                  "scene": {"type": "integer"},
                                  "narration": {"type": "string"},
                                  "visual_prompt": {"type": "string"}
                              },
                              "required": ["scene", "narration", "visual_prompt"],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["title", "hook", "description", "protagonist", "setting", "scenes"],
                  "additionalProperties": False
              }
          }

          def groq_json(prompt, max_tokens=2000, temperature=0.55, label="groq", response_schema=None):
              global last_call

              gap = time.monotonic() - last_call
              if gap < MIN_GAP:
                  time.sleep(MIN_GAP - gap)

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return ONLY one valid JSON object. "
                              "Never return markdown. Never return a top-level array. "
                              "No commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": (
                      {
                          "type": "json_schema",
                          "json_schema": {
                              "name": response_schema["name"],
                              "strict": True,
                              "schema": response_schema["schema"],
                          },
                      }
                      if response_schema
                      else {"type": "json_object"}
                  ),
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  last_call = time.monotonic()

                  print(
                      f"[Groq] {label} attempt {attempt}/{MAX_RETRIES}",
                      flush=True,
                  )

                  req = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V1",
                      },
                      method="POST",
                  )

                  started = time.monotonic()

                  try:
                      with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                          data = json.loads(r.read().decode("utf-8"))

                      content = data["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")

                      try:
                          obj = json.loads(content)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(f"Groq returned invalid JSON: {exc}") from exc

                      if isinstance(obj, list) and len(obj) == 1 and isinstance(obj[0], dict):
                          obj = obj[0]

                      if not isinstance(obj, dict):
                          raise RuntimeError(
                              f"{label} must return a JSON object, got {type(obj).__name__}"
                          )

                      print(
                          f"[Groq] {label} success in {time.monotonic()-started:.2f}s",
                          flush=True,
                      )
                      return obj

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      elapsed = time.monotonic() - started
                      print(
                          f"[Groq] HTTP {exc.code} {label} after {elapsed:.2f}s",
                          flush=True,
                      )

                      if exc.code == 429:
                          low = raw.lower()
                          if "tokens per day" in low or "(tpd)" in low:
                              raise RuntimeError(
                                  "Groq daily token limit reached. "
                                  "Wait for the quota reset before rerunning.\n"
                                  + raw
                              ) from exc

                          if attempt < MAX_RETRIES:
                              time.sleep(2.0 * attempt)
                              continue

                      if exc.code in (408, 409, 425, 500, 502, 503, 504) and attempt < MAX_RETRIES:
                          time.sleep(2.0 * attempt)
                          continue

                      raise RuntimeError(f"Groq HTTP {exc.code}: {raw}") from exc

          def banned(text):
              lower = text.lower()
              for phrase in BANNED:
                  if phrase in lower:
                      return phrase
              return None

          def words(text):
              return len(str(text).split())

          def is_one_sentence(text):
              value = str(text).strip()
              if not value:
                  return False
              if ";" in value or "—" in value or "–" in value:
                  return False
              if not re.search(r"[.!?](?:[\"\'\)\]])*$", value):
                  return False

              # Do not mistake normal abbreviations for sentence endings.
              check = re.sub(
                  r"\b(?:Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|e\.g|i\.e)\.",
                  lambda m: m.group(0).replace(".", "<DOT>"),
                  value,
                  flags=re.IGNORECASE,
              )

              # A terminal punctuation mark may be followed by closing quotes or brackets.
              check = re.sub(r"[.!?](?=[\"\'\)\]]*$)", "<END>", check)
              return not bool(re.search(r"[.!?]\s+", check))

          def normalize_narration(text):
              """Keep a generated scene narration as one spoken TTS cue.

              This is a local, deterministic cleanup only; it avoids spending
              another Groq call when the model accidentally uses two short
              sentences or a forbidden dash/semicolon.
              """
              value = re.sub(r"\s+", " ", str(text).strip())
              if not value:
                  return value

              parts = re.split(r"(?<=[.!?])\s+(?=[A-Z0-9\"'])", value)
              if len(parts) > 1:
                  cleaned = []
                  for part in parts:
                      part = part.strip().rstrip(".!?")
                      if part:
                          cleaned.append(part)
                  value = ", and ".join(cleaned)

              value = re.sub(r"\s*;\s*", ", and ", value)
              value = re.sub(r"\s*[—–]\s*", ", and ", value)
              value = re.sub(r"\s{2,}", " ", value).strip()

              if value and value[-1] not in ".!?":
                  value += "."
              elif value:
                  value = value[:-1] + "."
              return value

          def normalize_story_narrations(story):
              for scene in story.get("scenes", []):
                  if isinstance(scene, dict) and "narration" in scene:
                      scene["narration"] = normalize_narration(scene["narration"])

          def validate_story(story):
              if not isinstance(story, dict):
                  return "Story is not an object."

              required = [
                  "title", "hook", "description", "protagonist",
                  "setting", "scenes"
              ]
              for k in required:
                  if k not in story:
                      return f"Missing field: {k}"

              protagonist = story["protagonist"]
              if not isinstance(protagonist, dict):
                  return "Protagonist must be an object."

              if not str(protagonist.get("name", "")).strip():
                  return "Missing protagonist name."

              try:
                  age = int(protagonist.get("age"))
              except Exception:
                  return "Invalid protagonist age."

              if not 21 <= age <= 70:
                  return "Protagonist age must be 21-70."

              role = str(protagonist.get("role", "")).strip()
              if len(role.split()) < 2:
                  return "Protagonist role needs at least 2 words."

              scenes = story["scenes"]
              if not isinstance(scenes, list):
                  return "Scenes must be an array."

              if len(scenes) < SCENES_MIN or len(scenes) > SCENES_MAX:
                  return (
                      f"Story must contain {SCENES_MIN}-{SCENES_MAX} scenes; got {len(scenes)}."
                  )

              total = 0
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      return f"Scene {i} is not an object."

                  narration = str(scene.get("narration", "")).strip()
                  count = words(narration)
                  total += count

                  if count < SCENE_MIN_WORDS or count > SCENE_MAX_WORDS:
                      return (
                          f"Scene {i} has {count} words; "
                          f"allowed {SCENE_MIN_WORDS}-{SCENE_MAX_WORDS}."
                      )

                  if not is_one_sentence(narration):
                      return f"Scene {i} narration must be exactly one simple sentence."

                  visual = str(scene.get("visual_prompt", "")).strip()
                  if len(visual.split()) < 8:
                      return f"Scene {i} visual prompt is too short."

              if total < MIN_WORDS:
                  return f"Story is too short at {total} words; minimum {MIN_WORDS}."
              if total > MAX_WORDS:
                  return f"Story is too long at {total} words; maximum {MAX_WORDS}."

              hook = str(story["hook"]).strip()
              if words(hook) < 10:
                  return "Hook is too short."

              blob = json.dumps(story, ensure_ascii=False)
              bad = banned(blob)
              if bad:
                  return f"Banned pattern: {bad}"

              title = str(story["title"]).strip()
              if words(title) > 12:
                  return "Title is too long."

              return None

          def create_story():
              prompt = f"""
                    You are the lead writer and story editor for a premium global animated-Shorts studio.
                    Create ONE original short animated film package. Think like a professional screenwriter,
                    story editor, storyboard director, and retention-focused Shorts creator working together.

                    PRIMARY GOAL
                    Make the viewer think within the first seconds: "Wait... what is happening?" and keep
                    watching because the next action matters. The story must feel complete, visual, surprising,
                    emotionally satisfying, and worth rewatching. It must never feel like a generic AI story.

                    NON-NEGOTIABLE ORIGINALITY
                    - The new story must be materially different from recent history, not a renamed version.
                    - Change the core situation, conflict, central object, relationship dynamic, setting,
                      escalation mechanism, turning point, and ending pattern whenever they overlap with recent work.
                    - Never copy, paraphrase, imitate, or reproduce any existing video, creator, channel, or viral story.
                    - Do not use a fixed "good person helps someone and gets rewarded" formula.
                    - Do not reuse the same hook shape, twist type, object, or final emotional beat repeatedly.

                    RETENTION-FIRST STORY DESIGN
                    Build a clear causal chain, not disconnected events:
                    HOOK -> IMMEDIATE PROBLEM/QUESTION -> CONCRETE GOAL -> ATTEMPT -> COMPLICATION ->
                    ESCALATION -> IMPORTANT CHOICE -> CONSEQUENCE -> SURPRISE/REVERSAL -> PAYOFF.
                    The exact structure may flex when a better story demands it, but every beat must earn its place.
                    Every 1-2 scenes, something meaningfully changes: information, plan, risk, location, relationship,
                    object, consequence, or objective. Do not pad scenes.

                    HOOK RULES
                    - Scene 1 starts in the middle of an observable action.
                    - Name or clearly identify the protagonist, show a concrete action, and reveal a specific problem,
                      strange event, risky situation, goal, mistake, or unanswered question immediately.
                    - The opening must create a clear curiosity gap, not generic atmosphere.
                    - Never begin with weather, sunrise, scenery, biography, "one day", or long setup.
                    - The viewer should understand the basic situation visually even before the sentence finishes.

                    STORY QUALITY
                    - One primary protagonist; up to two important supporting characters.
                    - Give the protagonist personality through choices and behavior, not exposition.
                    - Give the protagonist a concrete visible objective.
                    - Use a real obstacle with understandable stakes.
                    - Include at least one failed attempt, setback, reversal, or unexpected complication.
                    - Give the protagonist an active choice with a believable cost.
                    - The payoff must result from earlier actions, clues, objects, or decisions; never from random luck.
                    - Prefer smart reveals, visual irony, clever problem-solving, funny consequences, human warmth,
                      rivalry, curiosity, adventure, awkwardness, or emotional reversals over preachy motivation.
                    - The ending should make the opening feel more meaningful when remembered.
                    - No generic moral, life-lesson speech, quote-poster ending, fake inspirational slogan, or narrator lecture.

                    INTERNATIONAL CLARITY
                    - Use simple everyday English that is easy to understand on first listen.
                    - Use concrete nouns and strong verbs: grabs, hides, drops, opens, races, blocks, swaps, searches,
                      misses, notices, chooses, fixes, follows, catches, returns, refuses, reveals.
                    - Avoid literary language, vague symbolism, complicated metaphors, dense backstory, and abstract psychology.
                    - Make important information visible through actions, objects, staging, and consequences.

                    VISUAL-FIRST STORYTELLING
                    - Every scene must work as ONE strong frozen movie frame.
                    - Each scene has one dominant action and one obvious visual purpose.
                    - Avoid scenes that only explain thoughts or dialogue that cannot be visualized.
                    - Vary shot scale and composition across scenes: wide establishing action, medium interaction, close detail,
                      over-shoulder, low angle, high angle, tracking-feel composition, silhouette, foreground obstruction, etc.
                    - Vary locations, props, lighting moods, color accents, and staging while preserving character identity.
                    - Keep the world premium, polished, cinematic, stylized 3D animation for teens and adults; never preschool,
                      babyish, chibi, anime, or live-action/photorealistic.
                    - Faces may be expressive, but the story must remain understandable through body language, pose, props,
                      staging, and action even when a face is partially hidden.

                    CHARACTER BIBLE
                    Create a protagonist with a stable visual identity that can be repeated exactly across scenes: age 21-35,
                    hairstyle, hair color, skin tone, body build, signature outfit colors, footwear, and one distinctive accessory.
                    Give supporting characters equally concise, visually distinct descriptions inside the visual prompts.
                    Do not randomly change clothing, hair, age, body type, or accessories between scenes.

                    SAFETY / TONE
                    No graphic violence, gore, sexual content, hateful content, dangerous instructional content, child endangerment,
                    terminal illness, hospital-rescue melodrama, supernatural powers, magic, miracles, impossible rewards, or traumatic shock bait.
                    Keep tension suitable for broad audiences and entertainment-focused.

                    CREATIVE SEEDS (USE AS INPUT, NOT A TEMPLATE)
                    Domain: {random.choice(DOMAINS)}
                    Setting: {random.choice(SETTINGS)}
                    Emotional flavor: {random.choice(EMOTIONS)}

                    RECENT HISTORY
                    {recent_text}

                    FINAL SELF-CHECK BEFORE JSON
                    Quietly verify: Is the hook immediate? Is the goal concrete? Is there real escalation? Is there a meaningful choice?
                    Does the payoff come from the story itself? Could a viewer recognize this story as different from recent uploads?
                    Could every scene be illustrated as one distinct frame? Remove anything generic or filler before returning JSON.

                    OUTPUT CONTRACT
                    Return ONLY this top-level JSON object and nothing else:
                    {{
                      "title": "short memorable hook title, 3-9 words",
                      "hook": "10-20 word opening that creates immediate curiosity",
                      "description": "2-3 natural sentences describing the finished Short without clickbait spam",
                      "protagonist": {{
                        "name": "specific adult name",
                        "age": 21-35,
                        "role": "specific role with at least two words",
                        "visual_identity": "stable hairstyle, hair color, skin tone, body build, signature outfit colors, footwear, distinctive accessory"
                      }},
                      "setting": "specific physical setting",
                      "scenes": [
                        {{
                          "scene": 1,
                          "narration": "one natural spoken sentence, 12-26 words",
                          "visual_prompt": "detailed animated-film frame prompt with character identity, action, environment, composition, camera, lighting, mood, depth, and exact visual continuity"
                        }}
                      ]
                    }}

                    SCENE CONTRACT
                    - Use 7-16 scenes based on natural pacing.
                    - Target about 17-21 narration words per scene when practical; hard range is 12-26.
                    - Total narration must remain 170-230 words without filler.
                    - Every narration is exactly ONE natural spoken sentence.
                    - Scene 1: protagonist + action + immediate problem/question/stakes.
                    - Scene 2: make the problem concrete.
                    - Scene 3: establish the real goal, risk, or difficult choice.
                    - Middle: attempt, complication, setback, discovery, reversal, or escalation.
                    - Final: consequence + payoff that directly connects to earlier events.
                    - Every scene must introduce new visual information or meaningful change.
                    - Never repeat essentially the same action in consecutive scenes.
                    - Never use filler reaction shots with no story function.
                    - Avoid abbreviations such as Mr., Mrs., Ms., Dr., St., etc. in narration when possible.
                    - No semicolons, em dashes, or multiple sentence-ending marks inside a scene narration.
              """

              for call_number in range(1, MAX_STORY_CALLS + 1):
                  story = groq_json(
                      prompt,
                      max_tokens=2200,
                      temperature=0.65,
                      label=f"story-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  normalize_story_narrations(story)
                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[validator] {issue}", flush=True)

                  repair_prompt = f"""
                    Repair this story so it passes ALL deterministic requirements.

                    CURRENT PROBLEM:
                    {issue}

                    IMPORTANT:
                    Do not only fix the named problem.
                    Re-check EVERY requirement before returning.
                    Keep the same core premise and characters.
                    Do not replace the story with a different generic story.

                    Hard requirements:
                    - top-level JSON OBJECT only
                    - title
                    - hook
                    - description
                    - protagonist object with fields: name, age, role, visual_identity
                    - setting
                    - between 7 and 16 scenes, choosing the count that fits the story
                    - each scene has scene, narration, visual_prompt
                    - narration lengths should be natural for the chosen scene count; target roughly 17-21 words when practical, with hard allowance 14-26 per scene
                    - total narration should target 180-210 words; hard allowance 170-230, with natural variation in scene lengths when the chosen scene count requires it
                    - scene count must remain within 7-16 and should match the natural pacing of the story
                    - never add filler scenes solely to reach a target count
                    - each narration must be exactly ONE simple sentence
                    - avoid abbreviations such as Mr., Mrs., Ms., Dr., St., etc. inside narration when possible
                    - no semicolons, em dashes, multiple sentences, literary wording, or vague metaphors
                    - use simple everyday English and concrete visible actions
                    - protagonist role is at least 2 words
                    - hook is 10-24 words
                    - description is 20-90 words
                    - all scenes are faceless-filmable
                    - preserve the story's natural scene count; do not add filler scenes or delete meaningful scenes just to hit a number
                    - no banned patterns

                    STORY:
                    {json.dumps(story, ensure_ascii=False)}

                    Return ONLY the corrected JSON object.
                    """

                  story = groq_json(
                      repair_prompt,
                      max_tokens=2000,
                      temperature=0.25,
                      label=f"repair-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  normalize_story_narrations(story)
                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[repair-validator] {issue}", flush=True)

              raise RuntimeError(
                  "The story could not pass deterministic validation "
                  "after the allowed generation/repair calls."
              )

          story = create_story()

          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)
          IMAGES.mkdir(parents=True, exist_ok=True)
          SCENES.mkdir(parents=True, exist_ok=True)

          (OUT / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          script = "\n".join(
              scene["narration"] for scene in story["scenes"]
          ).strip() + "\n"

          (OUT / "script.txt").write_text(script, encoding="utf-8")
          (OUT / "title.txt").write_text(story["title"] + "\n", encoding="utf-8")
          (OUT / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # FREE TTS: edge-tts
          # ============================================================

          voice = "en-US-GuyNeural"

          run_cmd([
              sys.executable,
              "-m",
              "edge_tts",
              "--voice",
              voice,
              "--rate",
              "+2%",
              "--text",
              script,
              "--write-media",
              str(OUT / "voice.mp3"),
              "--write-subtitles",
              str(OUT / "captions.srt"),
          ], timeout=180)

          # ============================================================
          # AI IMAGES: Pollinations authenticated API
          # Primary model: FLUX (Pollinations model id: flux)
          # Still images are animated with FFmpeg camera motion.
          # ============================================================

          POLLINATIONS_KEY = os.environ.get("POLLINATIONS_API_KEY", "").strip()
          if not POLLINATIONS_KEY:
              raise RuntimeError(
                  "Missing POLLINATIONS_API_KEY GitHub secret. "
                  "Add the secret before running the workflow."
              )

          POLLINATIONS_BASE = "https://gen.pollinations.ai/image/"

          def download_image(url, path, timeout=120):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Authorization": f"Bearer {POLLINATIONS_KEY}",
                              "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V3",
                              "Accept": "image/png,image/jpeg,image/webp,image/*",
                          },
                          method="GET",
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                          content_type = (r.headers.get("Content-Type") or "").lower()

                      if len(data) < 10000:
                          raise RuntimeError(
                              f"Image response for {path.name} is suspiciously small ({len(data)} bytes)."
                          )

                      valid_magic = (
                          data.startswith(b"\x89PNG")
                          or data.startswith(b"\xff\xd8")
                          or data.startswith(b"RIFF")
                      )
                      if "image" not in content_type and not valid_magic:
                          preview = data[:160].decode("utf-8", errors="replace")
                          raise RuntimeError(
                              f"Image response for {path.name} is not an image "
                              f"(Content-Type: {content_type}, body starts: {preview!r})."
                          )

                      path.write_bytes(data)
                      print(
                          f"[image] saved {path.name} ({len(data)/1024:.1f} KiB)",
                          flush=True,
                      )
                      return

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"HTTP {exc.code}: {raw[:1200]}"
                      )
                      print(
                          f"[image] attempt {attempt}/3 HTTP {exc.code} for {path.name}",
                          flush=True,
                      )
                  except Exception as exc:
                      last_error = exc
                      print(
                          f"[image] attempt {attempt}/3 failed for {path.name}: {exc}",
                          flush=True,
                      )

                  if attempt < 3:
                      time.sleep(2 * attempt)

              raise RuntimeError(
                  f"Pollinations image generation failed for {path.name}: {last_error}"
              )

          for index, scene in enumerate(story["scenes"], 1):
              output = IMAGES / f"scene_{index:02d}.png"
              visual_anchor = (
                  f"LOCKED CHARACTER DESIGN: {story['protagonist']['name']}, age {story['protagonist']['age']}, "
                  f"{story['protagonist']['role']}, {story['protagonist']['visual_identity']}. "
                  "Keep this exact character design, outfit colors, hairstyle, body proportions, and signature accessory in every scene. "
              )
              prompt = (
                  visual_anchor
                  + scene["visual_prompt"]
                  + ", premium stylized 3D animated feature-film frame, sophisticated global entertainment aesthetic, "
                    "single frozen moment, one dominant readable action, strong visual storytelling, expressive but believable character design, "
                    "consistent protagonist identity exactly matching the character bible, same age, face design, hairstyle, hair color, skin tone, body build, "
                    "outfit colors, footwear and signature accessory in every scene, supporting characters visually distinct and consistent, "
                    "specific environment details that support the story, carefully staged foreground midground and background layers, "
                    "cinematic camera composition chosen for this scene, varied shot scale and angle across the story, natural perspective, "
                    "clear subject silhouette, hands visibly performing the stated action, props positioned logically, believable object scale and contact, "
                    "correct anatomy, natural neck-to-head connection, aligned spine and torso, plausible shoulders elbows wrists hips knees and hands, "
                    "correct limb count, believable weight and balance, physically coherent pose, consistent left-right orientation, "
                    "no twisted neck, no broken wrists, no fused fingers, no extra fingers, no duplicate limbs, no duplicate people, no mirrored body, "
                    "no accidental extra props, no floating objects unless clearly justified by the action, no impossible geometry, "
                    "lighting and color palette tailored to the story beat, cinematic key light, controlled rim light, atmospheric depth, polished materials, "
                    "subtle depth of field, high detail without visual clutter, emotionally readable body language, premium 3D animation, "
                    "not live-action, not photorealistic human photography, not anime, not chibi, not preschool cartoon, not low-detail CGI, "
                    "vertical 9:16, no readable text, no logos, no watermark"
              )

              encoded = urllib.parse.quote(prompt, safe="")
              url = (
                  POLLINATIONS_BASE
                  + encoded
                  + f"?model=flux&width={IMAGE_WIDTH}&height={IMAGE_HEIGHT}"
                  + "&nologo=true"
              )

              print(f"[image] scene {index}: generating with Pollinations FLUX", flush=True)
              download_image(url, output)

          # ============================================================
          # CREATE MOTION CLIPS
          # ============================================================

          audio_duration_text = run_cmd([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(OUT / "voice.mp3"),
          ])

          audio_duration = float(audio_duration_text.strip())

          def parse_srt_timestamp(value):
              hh, mm, rest = value.split(":", 2)
              ss, ms = rest.split(",", 1)
              return int(hh) * 3600 + int(mm) * 60 + int(ss) + int(ms) / 1000.0

          raw_srt = (OUT / "captions.srt").read_text(encoding="utf-8")
          blocks = re.split(r"\n\s*\n", raw_srt.strip()) if raw_srt.strip() else []
          caption_items = []
          for block in blocks:
              lines = [line.strip("\ufeff") for line in block.splitlines() if line.strip()]
              if len(lines) < 3 or " --> " not in lines[1]:
                  continue
              start_text, end_text = lines[1].split(" --> ", 1)
              caption_text = " ".join(lines[2:]).strip()
              caption_items.append((parse_srt_timestamp(start_text), parse_srt_timestamp(end_text), caption_text))

          expected_scenes = len(story["scenes"])
          if len(caption_items) != expected_scenes:
              raise RuntimeError(
                  f"TTS subtitles produced {len(caption_items)} cues, but the story has "
                  f"{expected_scenes} scenes. Refusing to create mismatched scene timing."
              )

          # Use the real TTS sentence boundaries so each scene image runs while
          # its matching sentence is spoken. The next caption starts the next scene.
          scene_starts = [item[0] for item in caption_items]
          durations = []
          for i, start in enumerate(scene_starts):
              next_start = scene_starts[i + 1] if i + 1 < len(scene_starts) else audio_duration
              durations.append(max(0.05, next_start - start))

          # Normalize and rewrite the captions so the final video has exactly
          # one non-overlapping subtitle cue per scene.
          normalized_blocks = []

          def srt_time(seconds):
              millis = max(0, int(round(seconds * 1000)))
              hh = millis // 3600000
              millis %= 3600000
              mm = millis // 60000
              millis %= 60000
              ss = millis // 1000
              ms = millis % 1000
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"

          running = 0.0
          for i, (_, _, text) in enumerate(caption_items):
              start = running
              end = running + durations[i]
              running = end
              normalized_blocks.append(
                  f"{i + 1}\n{srt_time(start)} --> {srt_time(end)}\n{text}"
              )

          (OUT / "captions.srt").write_text(
              "\n\n".join(normalized_blocks) + "\n",
              encoding="utf-8",
          )

          # Build a dedicated ASS track so subtitle size and vertical position
          # are deterministic on the 1080x1920 Shorts canvas.
          def ass_time(seconds):
              total_cs = max(0, int(round(seconds * 100)))
              hh = total_cs // 360000
              total_cs %= 360000
              mm = total_cs // 6000
              total_cs %= 6000
              ss = total_cs // 100
              cs = total_cs % 100
              return f"{hh}:{mm:02d}:{ss:02d}.{cs:02d}"

          def ass_escape(text):
              return str(text).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}").replace("\n", " ")

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "ScaledBorderAndShadow: yes",
              "WrapStyle: 0",
              "YCbCr Matrix: TV.709",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Shorts,DejaVu Sans,32,&H00FFFFFF,&H00FFFFFF,&H90000000,&H70000000,0,0,0,0,100,100,0,0,3,2,0,2,80,80,210,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for i, (_, _, text) in enumerate(caption_items):
              start = 0.0 if i == 0 else sum(durations[:i])
              end = start + durations[i]
              ass_lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Shorts,,0,0,0,,{ass_escape(text)}"
              )

          (OUT / "captions.ass").write_text(
              "\n".join(ass_lines) + "\n",
              encoding="utf-8",
          )

          for i, (scene, duration) in enumerate(
              zip(story["scenes"], durations),
              1
          ):
              image = IMAGES / f"scene_{i:02d}.png"
              clip = SCENES / f"clip_{i:02d}.mp4"

              frames = max(1, round(duration * FPS))

              # Alternating direction prevents the whole Short from
              # looking mechanically identical.
              direction = 1 if i % 2 else -1

              zoom_expr = (
                  "min(zoom+0.0008,1.12)"
                  if direction == 1
                  else "if(eq(on,1),1.12,max(zoom-0.0008,1.00))"
              )

              vf = (
                  f"scale=1200:2133,"
                  f"crop=1080:1920,"
                  f"zoompan="
                  f"z='{zoom_expr}':"
                  f"d={frames}:"
                  f"x='iw/2-(iw/zoom/2)':"
                  f"y='ih/2-(ih/zoom/2)':"
                  f"s={VIDEO_WIDTH}x{VIDEO_HEIGHT}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-t", f"{duration:.3f}",
                  "-vf", vf,
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-movflags", "+faststart",
                  str(clip),
              ], timeout=120)

          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join(
                  f"file '{(SCENES / f'clip_{i:02d}.mp4').resolve()}'\n"
                  for i in range(1, len(story["scenes"]) + 1)
              ),
              encoding="utf-8",
          )

          silent_video = OUT / "video_silent.mp4"
          final_video = OUT / "final_short.mp4"

          run_cmd([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video),
          ], timeout=180)

          # Burn captions and mux voice in one final pass.
          run_cmd([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(OUT / "voice.mp3"),
              "-vf", (
                  f"ass={str((OUT / 'captions.ass').resolve())}"
              ),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "22",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ], timeout=240)

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["hook"],
              "setting": story["setting"],
              "words": words(script),
              "scenes": len(story["scenes"]),
              "created_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-50:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60, flush=True)
          print("DAILY FACELESS SHORT READY", flush=True)
          print("=" * 60, flush=True)
          print("Title:", story["title"], flush=True)
          print("Scenes:", len(story["scenes"]), flush=True)
          print("Words:", words(script), flush=True)
          print("Voice:", voice, flush=True)
          print("Video:", final_video, flush=True)
          PY

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Generate daily faceless short history"
            git push
          fi

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-faceless-short
          path: short-output/
          if-no-files-found: error
