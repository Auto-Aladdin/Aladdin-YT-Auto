name: Faceless YouTube Agent

on:
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Generate YouTube package
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p output

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          api_key = os.environ["GROQ_API_KEY"]

          prompt = """
          Create one original faceless YouTube video package about one surprising,
          evergreen topic with broad worldwide appeal.

          Requirements:
          - Strong curiosity hook.
          - Natural narration suitable for AI voice.
          - About 700-900 words of narration.
          - No "hey guys" and no filler.
          - Create 8-12 numbered visual scenes.
          - Every scene needs narration and a visual description.
          - Create a compelling YouTube title.
          - Create a YouTube description.
          - Keep the content advertiser-friendly and broadly suitable for YouTube.

          Return the requested structured fields only.
          """

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "reasoning_effort": "low",
              "reasoning_format": "hidden",
              "temperature": 0.7,
              "max_completion_tokens": 5000,
              "response_format": {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "youtube_package",
                      "strict": True,
                      "schema": {
                          "type": "object",
                          "properties": {
                              "topic": {
                                  "type": "string"
                              },
                              "title": {
                                  "type": "string"
                              },
                              "description": {
                                  "type": "string"
                              },
                              "script": {
                                  "type": "string"
                              },
                              "scenes": {
                                  "type": "array",
                                  "items": {
                                      "type": "object",
                                      "properties": {
                                          "scene": {
                                              "type": "integer"
                                          },
                                          "narration": {
                                              "type": "string"
                                          },
                                          "visual": {
                                              "type": "string"
                                          }
                                      },
                                      "required": [
                                          "scene",
                                          "narration",
                                          "visual"
                                      ],
                                      "additionalProperties": False
                                  }
                              }
                          },
                          "required": [
                              "topic",
                              "title",
                              "description",
                              "script",
                              "scenes"
                          ],
                          "additionalProperties": False
                      }
                  }
              }
          }

          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "Aladdin-YT-Auto/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP ERROR: {e.code}")
              print(e.read().decode("utf-8", errors="replace"))
              raise

          content = result["choices"][0]["message"].get("content", "")

          if not content:
              raise RuntimeError("Groq returned empty content.")

          data = json.loads(content)

          required = [
              "topic",
              "title",
              "description",
              "script",
              "scenes"
          ]

          for key in required:
              if key not in data:
                  raise RuntimeError(f"Missing required field: {key}")

          with open("output/content.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          with open("output/topic.txt", "w", encoding="utf-8") as f:
              f.write(data["topic"])

          with open("output/title.txt", "w", encoding="utf-8") as f:
              f.write(data["title"])

          with open("output/description.txt", "w", encoding="utf-8") as f:
              f.write(data["description"])

          with open("output/script.txt", "w", encoding="utf-8") as f:
              f.write(data["script"])

          with open("output/scenes.json", "w", encoding="utf-8") as f:
              json.dump(data["scenes"], f, ensure_ascii=False, indent=2)

          print("✅ AI CONTENT GENERATED")
          print("Topic:", data["topic"])
          print("Title:", data["title"])
          print("Scenes:", len(data["scenes"]))
          PY

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: youtube-content
          path: output/
          retention-days: 7
