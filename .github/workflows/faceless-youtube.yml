name: AI Short Story Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate and quality-check story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p output .github/data

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          # ============================================================
          # SETTINGS
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          HISTORY_FILE = ".github/data/story_history.json"

          # A normal finished story must eventually fall in this range.
          MIN_FINAL_WORDS = 105
          MAX_FINAL_WORDS = 405

          # Initial drafts are allowed to be a little shorter because
          # we automatically repair them before quality review.
          MIN_DRAFT_WORDS = 85

          WORDS_PER_MINUTE = 135

          MIN_DURATION = 45
          MAX_DURATION = 180

          MODEL = "openai/gpt-oss-20b"

          API_KEY = os.environ["GROQ_API_KEY"]

          rng = random.SystemRandom()

          # ============================================================
          # CREATIVE VARIETY
          # ============================================================

          STORY_MODES = [
              "quiet human drama",
              "unexpected kindness",
              "second chance",
              "small sacrifice with a big consequence",
              "regret and reconciliation",
              "ordinary person facing an impossible choice",
              "misunderstanding that becomes meaningful",
              "quiet perseverance after failure",
              "a promise almost broken",
              "unexpected courage",
              "a small decision changing two lives",
              "an overlooked person finally being seen",
              "a lost item revealing an important truth",
              "a difficult goodbye",
              "a reunion after years apart",
              "a stranger helping at exactly the right moment",
              "a mistake leading to an unexpected opportunity",
              "quiet honesty",
              "forgiveness after a misunderstanding",
              "someone choosing kindness when it costs them",
              "a secret finally revealed",
              "a sacrifice nobody notices",
              "an ordinary day interrupted by an extraordinary choice"
          ]

          EMOTIONS = [
              "warmth",
              "hope",
              "regret",
              "relief",
              "wonder",
              "gratitude",
              "sadness turning into comfort",
              "quiet joy",
              "fear turning into courage",
              "belonging",
              "forgiveness",
              "surprise",
              "nostalgia",
              "determination",
              "compassion",
              "bittersweet acceptance"
          ]

          HOOK_STYLES = [
              "start at the most intriguing moment",
              "start with a specific time and place",
              "start with a surprising action",
              "start with a concrete mystery",
              "start with a consequence before explaining its cause",
              "start with an unusual object and why it matters",
              "start with a promise that seems impossible",
              "start with someone making a decision they may regret",
              "start with a sentence that creates an immediate unanswered question"
          ]

          SETTINGS = [
              "a nearly empty bus station before sunrise",
              "a small neighborhood repair shop",
              "a rainy apartment building hallway",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a community clinic waiting room",
              "a laundromat on a cold evening",
              "a tiny apartment above a busy street",
              "a corner bakery before opening",
              "a local market just before closing",
              "a parking lot during a summer storm",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a neighborhood bus stop at midnight",
              "a small hotel lobby",
              "a mechanic's garage at closing time",
              "a public park just before rain",
              "a nearly empty convenience store",
              "a small photography shop",
              "an apartment rooftop at sunset"
          ]

          CONFLICTS = [
              "a missed opportunity",
              "a financial problem that must be hidden",
              "a lost item with emotional value",
              "an important message that never arrived",
              "a promise made to someone who is no longer around",
              "a difficult decision between pride and kindness",
              "a misunderstanding that risks a relationship",
              "one last attempt after repeated failure",
              "helping someone without being noticed",
              "an impossible deadline",
              "a goodbye neither person is ready for",
              "a small mistake with unexpectedly large consequences",
              "deciding whether to tell an uncomfortable truth",
              "choosing between convenience and doing what is right",
              "a personal promise conflicting with an immediate responsibility",
              "a person having to admit they were wrong"
          ]

          TWISTS = [
              "the person who seemed unimportant was the key to the solution",
              "the ignored object carried the real emotional meaning",
              "the protagonist misunderstood what the other person needed",
              "an earlier kindness quietly returns at the perfect moment",
              "the apparent failure prevents a worse outcome",
              "the person receiving help had helped the protagonist first",
              "a small sacrifice restores something much more important",
              "the final detail changes the meaning of the opening",
              "an ordinary object reveals an unexpected connection",
              "the protagonist discovers the other person planned for them too",
              "a decision made earlier in the story suddenly matters",
              "the person who appeared cold had a reason the protagonist never knew"
          ]

          ENDINGS = [
              "a quiet emotional realization",
              "a visual callback to the opening moment",
              "a brief line that changes the meaning of the story",
              "a small action instead of a speech",
              "an earned moment of relief",
              "an understated act of forgiveness",
              "a hopeful but believable final image",
              "a final detail that makes the viewer rethink the story",
              "a subtle emotional reversal"
          ]

          # ============================================================
          # HISTORY
          # ============================================================

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(HISTORY_FILE, "r", encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          previous_stories = history[-40:]

          previous_text = "\n".join(
              f"- Title: {item.get('title', '')} | "
              f"Premise: {item.get('premise', '')}"
              for item in previous_stories
          )

          if not previous_text:
              previous_text = "NONE"

          # ============================================================
          # RANDOM CREATIVE BRIEF
          # ============================================================

          brief = {
              "mode": rng.choice(STORY_MODES),
              "emotion": rng.choice(EMOTIONS),
              "hook": rng.choice(HOOK_STYLES),
              "setting": rng.choice(SETTINGS),
              "conflict": rng.choice(CONFLICTS),
              "twist": rng.choice(TWISTS),
              "ending": rng.choice(ENDINGS),
          }

          # ============================================================
          # SCHEMAS
          # ============================================================

          story_schema = {
              "type": "object",
              "properties": {
                  "title": {
                      "type": "string"
                  },
                  "hook": {
                      "type": "string"
                  },
                  "setting": {
                      "type": "string"
                  },
                  "conflict": {
                      "type": "string"
                  },
                  "turning_point": {
                      "type": "string"
                  },
                  "payoff": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {
                                  "type": "string"
                              },
                              "role": {
                                  "type": "string"
                              },
                              "visual_identity": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "name",
                              "role",
                              "visual_identity"
                          ],
                          "additionalProperties": False
                      }
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {
                                  "type": "integer"
                              },
                              "narration": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "scene",
                              "narration"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "conflict",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes"
              ],
              "additionalProperties": False
          }

          critic_schema = {
              "type": "object",
              "properties": {
                  "pass": {
                      "type": "boolean"
                  },
                  "hook_score": {
                      "type": "integer"
                  },
                  "originality_score": {
                      "type": "integer"
                  },
                  "believability_score": {
                      "type": "integer"
                  },
                  "emotional_score": {
                      "type": "integer"
                  },
                  "conflict_score": {
                      "type": "integer"
                  },
                  "ending_score": {
                      "type": "integer"
                  },
                  "visual_score": {
                      "type": "integer"
                  },
                  "issues": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  }
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues"
              ],
              "additionalProperties": False
          }

          visual_schema = {
              "type": "object",
              "properties": {
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {
                                  "type": "integer"
                              },
                              "visual_prompt": {
                                  "type": "string"
                              },
                              "camera": {
                                  "type": "string"
                              },
                              "on_screen_text": {
                                  "type": "string"
                              },
                              "sfx": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "scene",
                              "visual_prompt",
                              "camera",
                              "on_screen_text",
                              "sfx"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "scenes"
              ],
              "additionalProperties": False
          }

          # ============================================================
          # GROQ CALL
          # ============================================================

          def call_groq(
              prompt,
              schema,
              temperature,
              max_tokens
          ):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema
                      }
                  }
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      response_body = response.read().decode("utf-8")

                      result = json.loads(response_body)

              except urllib.error.HTTPError as e:

                  print(f"HTTP ERROR: {e.code}")

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(body)

                  raise

              message = result["choices"][0]["message"]

              content = message.get("content", "")

              if not content:
                  raise RuntimeError(
                      "Groq returned empty content."
                  )

              return json.loads(content)

          # ============================================================
          # HELPERS
          # ============================================================

          def story_word_counts(story):
              return [
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              ]

          def total_story_words(story):
              return sum(
                  story_word_counts(story)
              )

          def validate_story_structure(story):
              if not 7 <= len(story["scenes"]) <= 18:
                  raise ValueError(
                      "Story must contain 7-18 scenes."
                  )

              words = total_story_words(story)

              if words > MAX_FINAL_WORDS:
                  raise ValueError(
                      f"Story is too long: {words} words."
                  )

              if words < MIN_DRAFT_WORDS:
                  raise ValueError(
                      f"Story is extremely short: {words} words."
                  )

          def validate_story_content(story):
              text = (
                  story["title"] + " " +
                  story["hook"] + " " +
                  story["setting"] + " " +
                  story["conflict"] + " " +
                  story["turning_point"] + " " +
                  story["payoff"] + " " +
                  " ".join(
                      scene["narration"]
                      for scene in story["scenes"]
                  )
              ).lower()

              banned_phrases = [
                  "believe in yourself",
                  "never give up",
                  "the human spirit",
                  "everything happens for a reason",
                  "when one door closes",
                  "follow your dreams",
                  "little did they know",
                  "a testament to",
                  "in the end, it was not about",
                  "the power of hope",
                  "sometimes life"
              ]

              for phrase in banned_phrases:
                  if phrase in text:
                      raise ValueError(
                          "Cliche detected: " + phrase
                      )

              implausible_patterns = [
                  "trapped in a freezer",
                  "inside a freezer",
                  "stuck in a freezer",
                  "locked inside a freezer",
                  "trapped inside a freezer"
              ]

              for phrase in implausible_patterns:
                  if phrase in text:
                      raise ValueError(
                          "Implausible premise detected: " + phrase
                      )

          # ============================================================
          # 1. GENERATE FIRST DRAFT
          # ============================================================

          story_prompt = f"""
          Write ONE completely original cinematic emotional story for a
          vertical YouTube Short.

          This must feel like a real short film in miniature,
          not a motivational poem.

          CREATIVE BRIEF

          Story mode:
          {brief['mode']}

          Primary emotion:
          {brief['emotion']}

          Hook style:
          {brief['hook']}

          Setting:
          {brief['setting']}

          Conflict seed:
          {brief['conflict']}

          Twist direction:
          {brief['twist']}

          Ending style:
          {brief['ending']}

          RECENT CHANNEL STORIES

          {previous_text}

          Do not repeat a recent story's premise, setting, object,
          title pattern, emotional beat, twist, or ending.

          STORY REQUIREMENTS

          - Spoken narration should naturally support a 45-180 second video.
          - Initial draft should be at least 85 words.
          - Final production target will be 105-405 words.
          - Never pad a story.
          - Do not stretch a complete story unnecessarily.
          - Give the protagonist a concrete problem or desire.
          - Make something concrete happen.
          - Create genuine conflict.
          - Give the protagonist a meaningful choice, consequence,
            sacrifice, or realization.
          - Build logical escalation.
          - Make the turning point earned.
          - Make the ending pay off the setup.
          - Let the meaning emerge naturally from the events.
          - Prefer one strong plot over several weak subplots.
          - Every scene must advance the story.
          - Keep events physically plausible.
          - No unexplained miracles.
          - No absurd coincidences.
          - No random charity or medical reveal inserted only to create emotion.
          - No celebrities.
          - No existing fictional characters.
          - No movie plots.
          - No song lyrics.
          - No copied internet stories.
          - No calls to action.

          AVOID THESE CLICHES:

          "believe in yourself"
          "never give up"
          "the human spirit"
          "everything happens for a reason"
          "when one door closes"
          "follow your dreams"
          "little did they know"
          "a testament to"
          "the power of hope"

          FACELESS DESIGN

          The eventual video must work without identifiable faces.

          Use meaningful actions, hands, silhouettes, backs, objects,
          body language, shadows, reflections and environments.

          Create 7-18 scenes.

          For this stage, every scene must contain ONLY:
          - scene number
          - narration

          Return ONLY JSON matching the supplied schema.
          """

          story = call_groq(
              story_prompt,
              story_schema,
              0.85,
              6500
          )

          validate_story_structure(story)

          # ============================================================
          # 2. LENGTH REPAIR
          # ============================================================

          initial_words = total_story_words(story)

          if initial_words < MIN_FINAL_WORDS:

              print("========================================")
              print("⚠️ STORY IS TOO SHORT")
              print("========================================")
              print(
                  "Initial words:",
                  initial_words
              )
              print(
                  "Running automatic length repair..."
              )

              length_prompt = f"""
              Improve the following story so its spoken narration
              naturally becomes between 105 and 180 words.

              Do not create filler.

              ORIGINAL STORY:

              {json.dumps(
                  story,
                  ensure_ascii=False
              )}

              CURRENT WORD COUNT:
              {initial_words}

              Expand by improving the EXISTING STORY.

              Add only useful material such as:

              - concrete actions
              - meaningful character reaction
              - necessary context
              - a stronger conflict
              - a better setup
              - a better transition to the turning point
              - a more earned emotional payoff

              Do NOT:

              - create a new subplot
              - add generic motivation
              - add philosophical speeches
              - add calls to action
              - repeat information
              - change the central premise unnecessarily

              Keep the same characters and core story.

              Return ONLY corrected story JSON.
              """

              story = call_groq(
                  length_prompt,
                  story_schema,
                  0.55,
                  5000
              )

          # ============================================================
          # 3. HARD LOCAL CHECK
          # ============================================================

          validate_story_structure(story)

          final_story_words = total_story_words(story)

          if not MIN_FINAL_WORDS <= final_story_words <= MAX_FINAL_WORDS:
              raise RuntimeError(
                  f"Story after repair has "
                  f"{final_story_words} words. "
                  f"Allowed: {MIN_FINAL_WORDS}-{MAX_FINAL_WORDS}."
              )

          validate_story_content(story)

          # ============================================================
          # 4. FIRST QUALITY CRITIC
          # ============================================================

          critic_prompt = f"""
          You are a ruthless senior short-film editor.

          Evaluate this proposed YouTube Short for actual viewer enjoyment.

          STORY:

          {json.dumps(
              story,
              ensure_ascii=False
          )}

          Score these categories from 0 to 10:

          - hook
          - originality
          - believability
          - emotional impact
          - conflict
          - ending
          - visual potential

          PASS only if ALL scores are at least 7.

          FAIL it if there is:

          - a serious plot hole
          - an implausible premise
          - an obvious conflict with no real choice
          - a disconnected reveal
          - a pasted-on moral
          - generic motivational language
          - weak cause-and-effect
          - weak hook
          - weak ending
          - no meaningful protagonist choice
          - major similarity to common AI story patterns
          - major repetition with the supplied recent stories

          Be strict.

          Return ONLY critic JSON.
          """

          critique = call_groq(
              critic_prompt,
              critic_schema,
              0.2,
              2500
          )

          # ============================================================
          # 5. AUTOMATIC STORY REPAIR
          # ============================================================

          if not critique["pass"]:

              print("========================================")
              print("⚠️ STORY FAILED QUALITY REVIEW")
              print("========================================")

              print(
                  json.dumps(
                      critique,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              repair_prompt = f"""
              You are an expert story editor.

              The following story failed a professional quality review.

              ORIGINAL STORY:

              {json.dumps(
                  story,
                  ensure_ascii=False
              )}

              CRITIC REPORT:

              {json.dumps(
                  critique,
                  ensure_ascii=False
              )}

              Every item in the critic's "issues" list is a
              mandatory repair requirement.

              REWRITE THE UNDERLYING STORY, not merely the wording.

              FINAL REQUIREMENTS:

              - believable human situation
              - strong first line
              - specific protagonist
              - concrete goal/problem
              - meaningful conflict
              - real choice or consequence
              - logical escalation
              - earned turning point
              - satisfying payoff
              - ending connected to the opening
              - no fake moral
              - no random reveal
              - no impossible premise
              - no generic motivational writing
              - no filler
              - no call to action
              - 105-405 words
              - 7-18 scenes
              - naturally filmable without identifiable faces

              Preserve the strongest original elements when they work.

              Return ONLY corrected story JSON.
              """

              story = call_groq(
                  repair_prompt,
                  story_schema,
                  0.65,
                  6500
              )

              validate_story_structure(story)
              validate_story_content(story)

              repaired_words = total_story_words(story)

              if not MIN_FINAL_WORDS <= repaired_words <= MAX_FINAL_WORDS:
                  raise RuntimeError(
                      "Repaired story has invalid word count: "
                      f"{repaired_words}"
                  )

              # ========================================================
              # 6. FINAL QUALITY REVIEW
              # ========================================================

              final_critic_prompt = f"""
              Perform the FINAL publication-readiness review.

              STORY:

              {json.dumps(
                  story,
                  ensure_ascii=False
              )}

              PASS only if every score is at least 7.

              Check especially:

              1. Does the hook create immediate curiosity?
              2. Is the protagonist specific?
              3. Is the conflict genuinely meaningful?
              4. Is there a real choice or consequence?
              5. Does the turning point come from earlier events?
              6. Does the ending resolve the central problem?
              7. Is the emotional payoff earned?
              8. Is the situation believable?
              9. Is it visually filmable?
              10. Does it avoid generic AI motivation?
              11. Is the story clearly different from the channel history?

              Return ONLY critic JSON.
              """

              final_critique = call_groq(
                  final_critic_prompt,
                  critic_schema,
                  0.15,
                  2500
              )

              if not final_critique["pass"]:
                  raise RuntimeError(
                      "Story failed FINAL quality review. "
                      "Issues: " +
                      json.dumps(
                          final_critique["issues"],
                          ensure_ascii=False
                      )
                  )

              quality_report = final_critique

          else:

              quality_report = critique

          # ============================================================
          # 7. VISUAL PLANNING
          # ============================================================

          visual_schema_input = {
              "title": story["title"],
              "setting": story["setting"],
              "characters": story["characters"],
              "scenes": story["scenes"]
          }

          visual_prompt = f"""
          Create the production-ready visual plan for this APPROVED
          original faceless YouTube Short.

          STORY:

          {json.dumps(
              visual_schema_input,
              ensure_ascii=False
          )}

          Create exactly one visual plan for every story scene.

          IMPORTANT:

          - Every visual must directly match its narration.
          - Never invent a new event.
          - Never contradict the story.
          - Never require an identifiable face.
          - Prefer backs, silhouettes, hands, objects, reflections,
            shadows, close-ups, wide environmental shots and
            over-the-shoulder framing.
          - Maintain the same clothing, props, location and time of day.
          - Use believable physical positions.
          - Make prompts cinematic and production-ready.
          - Specify subject, action, environment, lighting,
            mood and composition.
          - Camera movement must be physically plausible.
          - SFX must match the visible action.
          - On-screen text should be short and used sparingly.

          EXACTLY match the existing scene numbers.

          Return ONLY JSON matching the supplied visual schema.
          """

          visuals = call_groq(
              visual_prompt,
              visual_schema,
              0.45,
              5000
          )

          if len(visuals["scenes"]) != len(
              story["scenes"]
          ):
              raise RuntimeError(
                  "Visual scene count does not match story scene count."
              )

          visual_by_number = {
              item["scene"]: item
              for item in visuals["scenes"]
          }

          for scene in story["scenes"]:

              scene_number = scene["scene"]

              if scene_number not in visual_by_number:
                  raise RuntimeError(
                      f"Missing visual plan for scene "
                      f"{scene_number}."
                  )

              scene.update(
                  visual_by_number[scene_number]
              )

          # ============================================================
          # 8. ADAPTIVE RUNTIME
          # ============================================================

          total_words = total_story_words(story)

          estimated_duration = round(
              total_words /
              WORDS_PER_MINUTE *
              60
          )

          estimated_duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  estimated_duration
              )
          )

          scene_count = len(story["scenes"])

          minimum_per_scene = 3

          base_duration = (
              scene_count *
              minimum_per_scene
          )

          if base_duration > estimated_duration:
              raise RuntimeError(
                  "Too many scenes for estimated runtime."
              )

          extra_duration = (
              estimated_duration -
              base_duration
          )

          weights = [
              len(
                  scene["narration"].split()
              )
              for scene in story["scenes"]
          ]

          weight_sum = sum(weights)

          raw_extra = [
              extra_duration * weight / weight_sum
              for weight in weights
          ]

          extra = [
              int(value)
              for value in raw_extra
          ]

          leftover = (
              extra_duration -
              sum(extra)
          )

          remainder_order = sorted(
              range(
                  len(raw_extra)
              ),
              key=lambda i:
                  raw_extra[i] - extra[i],
              reverse=True
          )

          for index in remainder_order[:leftover]:
              extra[index] += 1

          durations = [
              minimum_per_scene + value
              for value in extra
          ]

          if sum(durations) != estimated_duration:
              raise RuntimeError(
                  "Internal duration allocation failed."
              )

          for index, scene in enumerate(
              story["scenes"]
          ):

              scene["scene"] = index + 1

              scene["duration_seconds"] = (
                  durations[index]
              )

          story["story"] = " ".join(
              scene["narration"].strip()
              for scene in story["scenes"]
          )

          story["word_count"] = total_words

          story["estimated_duration_seconds"] = (
              estimated_duration
          )

          story["quality_checked"] = True

          story["quality_scores"] = (
              quality_report
          )

          # ============================================================
          # 9. SAVE FINAL OUTPUT
          # ============================================================

          with open(
              "output/story.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/title.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  story["title"]
              )

          with open(
              "output/script.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  story["story"]
              )

          with open(
              "output/description.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  story["description"]
              )

          with open(
              "output/scenes.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  story["scenes"],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # 10. STORY HISTORY
          # ============================================================

          premise = (
              story["setting"] +
              " | " +
              story["conflict"] +
              " | " +
              story["turning_point"]
          )

          fingerprint = hashlib.sha256(
              (
                  story["title"] +
                  "|" +
                  premise
              ).encode("utf-8")
          ).hexdigest()[:16]

          history.append(
              {
                  "title": story["title"],
                  "premise": premise,
                  "fingerprint": fingerprint,
                  "timestamp": int(time.time())
              }
          )

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  history[-50:],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ============================================================
          # FINAL LOG
          # ============================================================

          print("")
          print("========================================")
          print("✅ STORY PASSED FULL QUALITY PIPELINE")
          print("========================================")
          print(
              "Title:",
              story["title"]
          )
          print(
              "Scenes:",
              len(story["scenes"])
          )
          print(
              "Words:",
              total_words
          )
          print(
              "Estimated duration:",
              estimated_duration,
              "seconds"
          )
          print(
              "Scene durations:",
              durations
          )
          print(
              "Quality checked: YES"
          )
          print("========================================")
          PY

      - name: Save story history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/data/story_history.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update AI story history"
            git push
          fi

      - name: Upload story package
        uses: actions/upload-artifact@v7
        with:
          name: ai-short-story
          path: output/
          retention-days: 7
