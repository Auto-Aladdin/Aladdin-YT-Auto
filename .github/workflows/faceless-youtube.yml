name: Daily Faceless Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.2.8

      - name: Generate story, images, voice and video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # ============================================================
          # MISSION
          # ============================================================
          # One daily faceless motivational/emotional Short:
          # story -> scene image -> free TTS -> captions -> motion video
          #
          # Designed for GitHub Actions so the user's computer does not
          # need to stay online.
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          ROOT = Path(".")
          OUT = ROOT / "short-output"
          ASSETS = OUT / "assets"
          IMAGES = ASSETS / "images"
          SCENES = ASSETS / "clips"

          HISTORY_FILE = ROOT / ".github" / "data" / "story_history.json"

          API_KEY = os.environ["GROQ_API_KEY"]

          MIN_WORDS = 165
          MAX_WORDS = 230
          SCENES_MIN = 7
          SCENES_MAX = 16
          SCENE_MIN_WORDS = 12
          SCENE_MAX_WORDS = 27
          TARGET_SCENE_MIN_WORDS = 17
          TARGET_SCENE_MAX_WORDS = 21

          HTTP_TIMEOUT = 45
          MAX_RETRIES = 2
          MAX_STORY_CALLS = 1
          MIN_GAP = 1.0

          IMAGE_WIDTH = 768
          IMAGE_HEIGHT = 1365
          VIDEO_WIDTH = 1080
          VIDEO_HEIGHT = 1920
          FPS = 30

          # ------------------------------------------------------------
          # Story controls — intentionally simple and broad enough to
          # create motivational / emotional / human-interest Shorts.
          # ------------------------------------------------------------

          DOMAINS = [
              "mystery in an ordinary place",
              "clever escape from an unexpected problem",
              "awkward social misunderstanding",
              "rivalry with a surprising reversal",
              "strange object that creates a real-world problem",
              "impossible-looking task solved through observation",
              "friendship tested by a risky choice",
              "family secret revealed through an everyday object",
              "small mistake that spirals into chaos",
              "unexpected rescue with a clever payoff",
              "competitive challenge with a hidden rule",
              "ordinary job interrupted by something bizarre",
              "lost item mystery with a human payoff",
              "chase caused by a misunderstanding",
              "unexpected act of courage without a speech",
              "funny chain reaction with emotional payoff",
          ]

          SETTINGS = [
              "rainy downtown alley",
              "old neighborhood restaurant",
              "crowded train station concourse",
              "small apartment building",
              "local mechanic garage",
              "backstage theater corridor",
              "night market",
              "quiet suburban street",
              "rooftop greenhouse",
              "school-free community sports court",
              "independent bookstore",
              "warehouse loading area",
              "farm road and barn",
              "hotel service corridor",
              "coastal fishing dock",
              "old cinema lobby",
          ]

          EMOTIONS = [
              "suspense",
              "curiosity",
              "awkward humor",
              "warm relief",
              "surprise",
              "determination",
              "wonder",
              "tension",
              "quiet heartbreak",
              "triumph",
              "playful embarrassment",
              "earned trust",
          ]

          HOOK_MODES = [
              "start during a chase or escape",
              "start the instant something goes unexpectedly wrong",
              "start with a character discovering a strange detail",
              "start with a risky decision already being made",
              "start with an object being opened, dropped, swapped, or revealed",
              "start at the exact moment a plan begins to fail",
              "start with a surprising accusation or misunderstanding",
              "start with an ordinary task interrupted by a bizarre event",
          ]

          TWIST_MODES = [
              "the apparent threat has a different purpose",
              "the protagonist misunderstood one critical detail",
              "an earlier background detail suddenly becomes the key",
              "the person who seemed to lose actually caused the outcome",
              "the obvious solution creates the real problem",
              "a small choice earlier changes the final outcome",
              "two characters were solving different versions of the same problem",
              "the final reveal is funny but logically earned",
          ]

          ENDING_MODES = [
              "clever payoff",
              "warm human payoff",
              "funny reversal",
              "quiet emotional reveal",
              "unexpected but logical consequence",
              "satisfying visual callback to the opening",
              "small victory with a larger implication",
              "ending that reframes the first scene",
          ]

          BANNED = [
              "magic",
              "magical",
              "supernatural",
              "miracle",
              "miraculous",
              "destiny",
              "fate",
              "hospital",
              "terminal illness",
              "child in danger",
              "lottery",
              "hidden fortune",
              "benefactor",
              "anonymous donor",
              "bonus",
              "applause",
              "thank-you note",
              "elevator",
              "blackout",
              "concert",
              "audition",
              "train platform",
              "coffee shop",
              "ticking clock",
              "glowing object",
              "red ribbon",
              "random stranger",
              "reverie",
              "poignant",
              "tentative",
              "fragile peace",
              "scars remain",
              "healing",
              "silent apology",
              "unspoken pain",
              "haunting memory",
              "life lesson",
              "lesson in",
              "moral of the story",
          ]

          def run_cmd(args, timeout=120, capture=True):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
                  timeout=timeout,
                  check=False,
              )
              if p.returncode != 0:
                  raise RuntimeError(
                      f"Command failed ({p.returncode}): {' '.join(args)}\n"
                      f"{p.stdout[-4000:] if p.stdout else ''}"
                  )
              return p.stdout or ""

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()
          recent = history[-20:]
          recent_text = "\n".join(
              f"- {x.get('title','')} | {x.get('premise','')} | {x.get('setting','')}"
              for x in recent
          ) or "NONE"

          last_call = 0.0

          STORY_SCHEMA = {
              "name": "publication_story",
              "schema": {
                  "type": "object",
                  "properties": {
                      "title": {"type": "string"},
                      "hook": {"type": "string"},
                      "description": {"type": "string"},
                      "protagonist": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "age": {"type": "integer"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "age", "role", "visual_identity"],
                          "additionalProperties": False
                      },
                      "setting": {"type": "string"},
                      "scenes": {
                          "type": "array",
                          # Scene count is intentionally NOT constrained here.
                          # Groq must return the complete JSON object first; our
                          # deterministic validator applies the adaptive scene-count
                          # rule afterward. This prevents schema-level HTTP 400 errors
                          # when the model naturally produces a few more scenes.
                          "items": {
                              "type": "object",
                              "properties": {
                                  "scene": {"type": "integer"},
                                  "narration": {"type": "string"},
                                  "visual_prompt": {"type": "string"}
                              },
                              "required": ["scene", "narration", "visual_prompt"],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["title", "hook", "description", "protagonist", "setting", "scenes"],
                  "additionalProperties": False
              }
          }

          def groq_json(prompt, max_tokens=2000, temperature=0.55, label="groq", response_schema=None):
              global last_call

              gap = time.monotonic() - last_call
              if gap < MIN_GAP:
                  time.sleep(MIN_GAP - gap)

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return ONLY one valid JSON object. "
                              "Never return markdown. Never return a top-level array. "
                              "No commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": (
                      {
                          "type": "json_schema",
                          "json_schema": {
                              "name": response_schema["name"],
                              "strict": True,
                              "schema": response_schema["schema"],
                          },
                      }
                      if response_schema
                      else {"type": "json_object"}
                  ),
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  last_call = time.monotonic()

                  print(
                      f"[Groq] {label} attempt {attempt}/{MAX_RETRIES}",
                      flush=True,
                  )

                  req = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V1",
                      },
                      method="POST",
                  )

                  started = time.monotonic()

                  try:
                      with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                          data = json.loads(r.read().decode("utf-8"))

                      content = data["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")

                      try:
                          obj = json.loads(content)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(f"Groq returned invalid JSON: {exc}") from exc

                      if isinstance(obj, list) and len(obj) == 1 and isinstance(obj[0], dict):
                          obj = obj[0]

                      if not isinstance(obj, dict):
                          raise RuntimeError(
                              f"{label} must return a JSON object, got {type(obj).__name__}"
                          )

                      print(
                          f"[Groq] {label} success in {time.monotonic()-started:.2f}s",
                          flush=True,
                      )
                      return obj

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      elapsed = time.monotonic() - started
                      print(
                          f"[Groq] HTTP {exc.code} {label} after {elapsed:.2f}s",
                          flush=True,
                      )

                      if exc.code == 429:
                          low = raw.lower()
                          if "tokens per day" in low or "(tpd)" in low:
                              raise RuntimeError(
                                  "Groq daily token limit reached. "
                                  "Wait for the quota reset before rerunning.\n"
                                  + raw
                              ) from exc

                          if attempt < MAX_RETRIES:
                              time.sleep(2.0 * attempt)
                              continue

                      if exc.code in (408, 409, 425, 500, 502, 503, 504) and attempt < MAX_RETRIES:
                          time.sleep(2.0 * attempt)
                          continue

                      raise RuntimeError(f"Groq HTTP {exc.code}: {raw}") from exc

          def banned(text):
              lower = text.lower()
              for phrase in BANNED:
                  if phrase in lower:
                      return phrase
              return None

          def words(text):
              return len(str(text).split())

          def is_one_sentence(text):
              value = str(text).strip()
              if not value:
                  return False
              if ";" in value or "—" in value or "–" in value:
                  return False
              if not re.search(r"[.!?](?:[\"\'\)\]])*$", value):
                  return False

              # Do not mistake normal abbreviations for sentence endings.
              check = re.sub(
                  r"\b(?:Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|e\.g|i\.e)\.",
                  lambda m: m.group(0).replace(".", "<DOT>"),
                  value,
                  flags=re.IGNORECASE,
              )

              # A terminal punctuation mark may be followed by closing quotes or brackets.
              check = re.sub(r"[.!?](?=[\"\'\)\]]*$)", "<END>", check)
              return not bool(re.search(r"[.!?]\s+", check))

          def normalize_narration(text):
              """Keep a generated scene narration as one spoken TTS cue.

              This is a local, deterministic cleanup only; it avoids spending
              another Groq call when the model accidentally uses two short
              sentences or a forbidden dash/semicolon.
              """
              value = re.sub(r"\s+", " ", str(text).strip())
              if not value:
                  return value

              parts = re.split(r"(?<=[.!?])\s+(?=[A-Z0-9\"'])", value)
              if len(parts) > 1:
                  cleaned = []
                  for part in parts:
                      part = part.strip().rstrip(".!?")
                      if part:
                          cleaned.append(part)
                  value = ", and ".join(cleaned)

              value = re.sub(r"\s*;\s*", ", and ", value)
              value = re.sub(r"\s*[—–]\s*", ", and ", value)
              value = re.sub(r"\s{2,}", " ", value).strip()

              if value and value[-1] not in ".!?":
                  value += "."
              elif value:
                  value = value[:-1] + "."
              return value

          def normalize_story_narrations(story):
              for scene in story.get("scenes", []):
                  if isinstance(scene, dict) and "narration" in scene:
                      scene["narration"] = normalize_narration(scene["narration"])

          def validate_story(story):
              if not isinstance(story, dict):
                  return "Story is not an object."

              required = [
                  "title", "hook", "description", "protagonist",
                  "setting", "scenes"
              ]
              for k in required:
                  if k not in story:
                      return f"Missing field: {k}"

              protagonist = story["protagonist"]
              if not isinstance(protagonist, dict):
                  return "Protagonist must be an object."

              if not str(protagonist.get("name", "")).strip():
                  return "Missing protagonist name."

              try:
                  age = int(protagonist.get("age"))
              except Exception:
                  return "Invalid protagonist age."

              if not 21 <= age <= 70:
                  return "Protagonist age must be 21-70."

              role = str(protagonist.get("role", "")).strip()
              if len(role.split()) < 2:
                  return "Protagonist role needs at least 2 words."

              scenes = story["scenes"]
              if not isinstance(scenes, list):
                  return "Scenes must be an array."

              if len(scenes) < SCENES_MIN or len(scenes) > SCENES_MAX:
                  return (
                      f"Story must contain {SCENES_MIN}-{SCENES_MAX} scenes; got {len(scenes)}."
                  )

              total = 0
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      return f"Scene {i} is not an object."

                  narration = str(scene.get("narration", "")).strip()
                  count = words(narration)
                  total += count

                  if count < SCENE_MIN_WORDS or count > SCENE_MAX_WORDS:
                      return (
                          f"Scene {i} has {count} words; "
                          f"allowed {SCENE_MIN_WORDS}-{SCENE_MAX_WORDS}."
                      )

                  if not is_one_sentence(narration):
                      return f"Scene {i} narration must be exactly one simple sentence."

                  visual = str(scene.get("visual_prompt", "")).strip()
                  if len(visual.split()) < 8:
                      return f"Scene {i} visual prompt is too short."

              if total < MIN_WORDS:
                  return f"Story is too short at {total} words; minimum {MIN_WORDS}."
              if total > MAX_WORDS:
                  return f"Story is too long at {total} words; maximum {MAX_WORDS}."

              hook = str(story["hook"]).strip()
              if words(hook) < 10:
                  return "Hook is too short."

              blob = json.dumps(story, ensure_ascii=False)
              bad = banned(blob)
              if bad:
                  return f"Banned pattern: {bad}"

              title = str(story["title"]).strip()
              if words(title) > 12:
                  return "Title is too long."

              return None

          def create_story():
              prompt = f"""
                    You are the lead writer, story editor, storyboard director, and retention strategist
                    for a premium global animated Shorts studio. Write ONE completely original short animated
                    mini-film that is entertaining even when understood visually without perfect language comprehension.

                    CORE MISSION
                    Make the viewer think immediately: "WAIT — WHAT IS HAPPENING?"
                    Then make every next scene answer one question while creating another. The story must feel
                    intentionally written by a professional human entertainment team, never like an interchangeable AI template.

                    ORIGINALITY IS NON-NEGOTIABLE
                    - The story must be materially different from recent uploads. Changing names, clothing, or location alone is NOT variation.
                    - Deliberately vary genre flavor, hook mechanism, conflict type, central object, relationship dynamic, setting, escalation, twist logic,
                      visual motif, and ending style.
                    - Never copy, paraphrase, imitate, or reconstruct another creator's story, viral Short, movie scene, or recognizable plot.
                    - Never repeat the same moral formula, rescue formula, misunderstanding formula, chase formula, reveal formula, or emotional ending back-to-back.
                    - Do not make every protagonist a helpless victim who is rewarded for being kind.
                    - Do not make every story about money, helping strangers, lost valuables, apologies, or workplace lessons.

                    RETENTION ENGINE
                    Design a causal chain with escalating consequences:
                    HOOK -> QUESTION -> GOAL -> FIRST MOVE -> COMPLICATION -> ESCALATION -> CHOICE -> CONSEQUENCE ->
                    REVEAL/REVERSAL -> PAYOFF.
                    The structure may bend when a stronger story needs it, but nothing may feel like filler.
                    Every 1-2 scenes must introduce a meaningful change in information, risk, plan, location, relationship, object, or consequence.
                    At least one attempt should fail or create a worse problem. The protagonist must actively influence what happens.
                    - Every scene must have ONE clearly identified PRIMARY VISUAL SUBJECT: the person or object whose action is the focus of that scene. The visual_prompt must make this subject explicit.
                    - When narration says the protagonist calls, warns, spots, follows, passes something to, hands something to, speaks to, or waits for another character, the next visual beat must visually introduce or focus on that other character as the PRIMARY VISUAL SUBJECT when that character is the reason the scene exists. Do not keep showing the protagonist alone for a beat that is actually about the other character.
                    - When an action transfers from one character to another, transfer the camera focus with it: show the receiving character clearly, or show both characters only when the interaction itself is the important visual action.
                    - Do not place the PRIMARY VISUAL SUBJECT as a tiny background figure while another character occupies the visual focus.
                    - Do not reuse the protagonist's face, body, clothing, or pose as a stand-in for a different named character. Every named character must have a distinct visual identity.
                    - Crowd/background characters must remain generic and must never duplicate the protagonist or any named supporting character.

                    HOOK + STORYTELLER OPENING
                    Scene 1 must sound like the FIRST SENTENCE OF A REAL PERSON TELLING AN INTERESTING STORY, not like an image prompt, trailer, synopsis, or puzzle.
                    The audience should meet the protagonist naturally before the unusual event becomes clear. Use a warm, conversational setup when it fits: introduce the person, what they normally enjoy/do, and then let one specific event interrupt that ordinary moment.
                    A natural pattern such as "There was a boy named Noah who loved basketball, and one afternoon everything changed when..." is a REFERENCE STYLE only, never a fixed template. Do not repeat that wording or force the same opening structure every time.
                    Other valid openings can begin with a girl walking home, a man closing his shop, a student heading to practice, a mechanic finishing a job, two friends joking around, or another believable everyday moment.
                    The key is: PERSON + ORDINARY CONTEXT/PERSONAL DETAIL + SPECIFIC TURNING EVENT + IMMEDIATE CURIOSITY.
                    Do not jump straight into an unexplained shadow, object, chase, accusation, or abstract mystery unless the audience first understands who is involved and what they were doing.
                    Do not make every story begin in the exact middle of action; alternate between natural character introductions, ordinary routines interrupted by trouble, relationship-based openings, and immediate-action openings.
                    The first sentence must still create a reason to keep listening, but the curiosity should come from a clear human situation, not forced clickbait.
                    The opening must sound effortless when spoken aloud, as if a skilled storyteller is telling a friend what happened.
                    Avoid generic weather/scenery openings, biography dumps, waking-up clichés, empty suspense, trailer voice, quotes, morals, viewer-directed questions, and repeated "one day" formulas.

                    PROFESSIONAL STORY LOGIC
                    - One primary protagonist with clear personality shown through behavior and decisions.
                    - Maximum two important supporting characters unless the story truly needs more.
                    - One concrete visible goal.
                    - One understandable external obstacle.
                    - One meaningful choice with a cost.
                    - At least one setback, failed attempt, reversal, or discovery.
                    - The final payoff must be CAUSED by earlier actions, clues, objects, promises, mistakes, or choices.
                    - Never resolve the story with random luck, unexplained coincidence, magical intervention, sudden wealth, or a stranger appearing solely to fix everything.
                    - The ending should reward attention: an earlier visual/detail should become important later whenever possible.
                    - Prefer suspense, humor, clever problem solving, rivalry, awkwardness, adventure, mystery, irony, warmth, and emotional reversals.
                    - Meaning should emerge naturally from what happened; NEVER append a lecture or generic life lesson.

                    NATURAL STORY VOICE
                    - Write exactly like a skilled human storyteller casually recounting a surprising, funny, tense, or touching event to a friend.
                    - Prefer plain spoken English over literary prose: "she was heading home when...", "then she noticed...", "he tried to... but..." when natural.
                    - Let the voice feel warm, curious, confident, and effortless, never robotic, theatrical, or overly dramatic.
                    - Use concrete people, objects, actions, and consequences. Name the person early so the audience can follow immediately.
                    - Vary sentence openings and rhythm, but keep every sentence easy to understand on the first listen.
                    - Avoid overloaded sentences with many clauses, stacked descriptions, semicolons, or strings of actions joined by commas.
                    - One scene should usually communicate one main action or beat plus its immediate consequence.
                    - Use small natural details that make the event feel specific, but never bury the plot under description.
                    - Do not narrate every movement the image already shows. Add the reason, surprise, danger, joke, clue, or consequence that makes the image matter.
                    - Do not sound like a news report, essay, lecture, children's moral lesson, trailer voice, quote page, or AI-generated summary.
                    - Avoid forced catchphrases, fake cliffhangers, "you won't believe", "watch until the end", or obvious clickbait.
                    - The ending should sound like a storyteller finishing an interesting incident, not a motivational speech.

                    INTERNATIONAL VISUAL CLARITY
                    - A viewer should understand the main action from the image alone.
                    - Every scene must contain ONE dominant visual action and a clear reason it matters.
                    - Show cause-and-effect physically: objects move, doors open, people chase, hands grab, evidence appears, plans fail, etc.
                    - Avoid scenes based only on thoughts, narration, or invisible emotions.

                    CHARACTER BIBLE — LOCK IT
                    Create a highly distinctive protagonist with an exact repeatable visual identity:
                    age, gender presentation, face shape, eye shape/color, eyebrow shape, hairstyle, hair color, skin tone, body build, height impression,
                    signature outfit, exact main clothing colors, shoes, and ONE distinctive accessory/prop.
                    The visual_identity must be concrete and stable enough for an image model to repeat.
                    Once established, NEVER change those identity traits between scenes. No random hairstyle changes, no different jacket, no different body shape,
                    no age drift, no changing colors, no disappearing accessory.
                    Wardrobe must remain tasteful, age-appropriate, everyday, and family-friendly: no micro-shorts, underwear-like bottoms, transparent clothing,
                    extreme cutouts, deep plunging necklines, lingerie-like outfits, or clothing designed to sexualize the character. Prefer practical casual clothes,
                    jeans or full-length trousers, knee-length or longer skirts/dresses, hoodies, sweaters, jackets, shirts, sneakers, boots, and similar normal outfits.
                    If a supporting character returns, keep that character visually identical too and describe the returning details again inside the scene visual prompt.

                    MASTER VISUAL UNIVERSE
                    Every generated image must look as though the SAME professional 2D cartoon artist illustrated the entire series.
                    Use this exact art direction in every scene:
                    premium cinematic hand-drawn 2D cartoon illustration; expressive stylized human characters; slightly exaggerated but believable anatomy;
                    large highly expressive eyes; strong readable eyebrows and mouths; distinctive facial shapes; clean confident dark ink outlines with varied line weight;
                    painterly digital coloring; subtle cel shading; soft tonal gradients; gentle textured brushwork; rich but slightly muted cinematic colors;
                    natural warm/cool color harmony; detailed believable environments; accurate perspective; strong foreground/midground/background depth;
                    atmospheric lighting; realistic cast and contact shadows; cinematic composition; polished storytelling detail; charming, slightly gritty, premium entertainment look.
                    Never drift into photorealism, 3D CGI, anime, manga, chibi, flat vector, preschool art, generic AI cartoon art, or clip-art. Preserve the same linework, proportions, palette, shading, facial design, and rendering quality across scenes.

                    SCENE-TO-IMAGE CONTRACT
                    For every scene, create the visual_prompt using these exact labeled fields in this order:
                    SCENE: [specific single frozen moment that can be understood without narration]
                    PRIMARY VISUAL SUBJECT: [the ONE person or object the camera is mainly following in this scene]
                    ON-SCREEN CHARACTERS: [list EVERY named or story-relevant character who must physically appear in the frame, with a short unique visual identity for each; do not omit a person merely because the protagonist is easier to draw]
                    CHARACTER: [full locked protagonist identity when the protagonist is present; if the primary subject is a supporting character, put that character's full locked identity first]
                    ACTION: [one dominant physical action and exactly who is doing it, receiving it, watching it, or reacting to it]
                    LOCATION: [specific environment plus important objects]
                    MOOD: [emotion and atmosphere expressed visually]
                    CAMERA: [shot size, camera height, angle, lens feel, composition and whose face/body has visual priority]
                    LIGHTING: [key light, color temperature, time/weather, shadows]
                    CONTINUITY: [exact clothing/prop/appearance details that must match earlier scenes for EVERY returning character and important object]
                    VISUAL DIFFERENTIATION: [what visibly changes from the previous scene: subject, location, camera, action, character interaction, prop state, or composition]
                    Each scene must be a genuinely new visual beat, not another portrait of the same character in the same location. Character identity stays locked, but framing, subject, interaction, environment, action, and composition must change when the story changes.
                    If narration mentions a second character performing an action, receiving an object, being called, arriving, speaking, chasing, warning, passing something, or becoming the reason for the scene, that character MUST be visible and visually important in that scene unless the story intentionally withholds them as a mystery.
                    If two characters interact, show the interaction itself; do not replace the second character with the protagonist alone.

                    IMAGE COMPOSITION RULES
                    - Wardrobe must stay tasteful, modest, practical, and story-appropriate in every generated frame; do not shorten skirts/shorts or alter necklines between scenes.
                    - Do not pose characters like passport photos unless the story specifically requires a portrait.
                    - Prefer active poses, clear silhouettes, readable hands, believable weight, and purposeful eye-lines.
                    - Vary camera angle and shot scale across the story while preserving the same art style.
                    - Keep important action inside the vertical 9:16 frame.
                    - Use foreground objects, depth layers, perspective, environmental storytelling, and lighting to create cinematic richness.
                    - Avoid clutter, random extra people, duplicate props, floating objects, broken anatomy, impossible hand positions, or disconnected shadows.

                    SAFETY / TONE
                    No graphic gore, sexual content, hateful content, child endangerment, supernatural powers, magic, miracles, or traumatic shock bait.
                    Tension, suspense, danger, crime-like situations, weapons appearing in a story, or chase scenes may exist when non-graphic and story-relevant,
                    but do not provide real-world instructions for wrongdoing or harm.

                    CREATIVE CONTROL INPUTS — USE THESE AS STARTING DIVERSIFIERS, NOT TEMPLATES
                    Domain: {random.choice(DOMAINS)}
                    Setting: {random.choice(SETTINGS)}
                    Emotional flavor: {random.choice(EMOTIONS)}
                    Hook mode: {random.choice(HOOK_MODES)}
                    Twist mode: {random.choice(TWIST_MODES)}
                    Ending mode: {random.choice(ENDING_MODES)}

                    RECENT HISTORY
                    {recent_text}

                    FINAL SELF-CHECK
                    Before returning JSON, silently verify: strong immediate hook; active protagonist; clear goal/problem; every scene changes the situation; at least one setback/reversal; earned payoff; material difference from recent history; consistent character/art style; natural storyteller voice; every scene visually filmable. Delete filler and repetition.

                    OUTPUT CONTRACT
                    Return ONLY this top-level JSON object and nothing else:
                    {{
                      "title": "short memorable hook title, 3-9 words",
                      "hook": "10-20 word opening that creates immediate curiosity",
                      "description": "2-3 natural sentences describing the finished Short without clickbait spam",
                      "protagonist": {{
                        "name": "specific adult name",
                        "age": 21-35,
                        "role": "specific role with at least two words",
                        "visual_identity": "exact face shape, eye description, hairstyle, hair color, skin tone, body build, outfit colors, footwear, distinctive accessory"
                      }},
                      "setting": "specific physical setting",
                      "scenes": [
                        {{
                          "scene": 1,
                          "narration": "one natural spoken sentence, 12-26 words",
                          "visual_prompt": "SCENE: ... CHARACTER: ... ACTION: ... LOCATION: ... MOOD: ... CAMERA: ... LIGHTING: ... CONTINUITY: ..."
                        }}
                      ]
                    }}

                    SCENE CONTRACT
                    - Plan 8-10 scenes when practical; never fewer than 7 or more than 16, and never pad with filler.
                    - Target 17-21 narration words per scene; hard range 12-26. Count every scene before returning.
                    - Total narration 170-230 words without filler.
                    - Every narration is exactly ONE natural spoken sentence.
                    - Scene 1: naturally introduce the protagonist in the middle of an ordinary or unusual action, then immediately reveal the problem, interruption, clue, risk, or question that makes the viewer need the next scene.
                    - Scene 2: make the problem concrete.
                    - Scene 3: establish the real goal, risk, or difficult choice.
                    - Middle: attempts, complications, clues, setbacks, discoveries, reversals, or escalation.
                    - Final scenes: consequence + satisfying payoff directly connected to earlier events.
                    - Never repeat essentially the same action in consecutive scenes.
                    - Never use filler reaction shots with no story function.
                    - VISUAL BEAT OWNERSHIP: Before returning each scene, silently identify WHO the viewer should be watching and WHY. The PRIMARY VISUAL SUBJECT must be the character performing or receiving the action named by the narration.
                    - SCENE DIFFERENCE CHECK: Compare each scene with the previous one. If the setting, dominant action, primary subject, supporting characters, and camera composition are effectively the same, rewrite the visual beat before returning JSON.
                    - CHARACTER ENTRY CHECK: Whenever a new named character becomes important, establish that character visually in the scene where they matter, with a distinct face, hairstyle, clothing, body build, and role; do not leave the supporting character only in narration.
                    - CHARACTER TRANSFER CHECK: When narration transfers attention from the protagonist to a friend, opponent, teammate, customer, sibling, parent, teacher, owner, or other character, transfer the visual focus too. The protagonist must not remain the default subject.
                    - GROUP CHECK: Background crowds must never contain duplicate copies of the protagonist or named supporting characters. Keep background people generic and visually distinct.
                    - Avoid abbreviations such as Mr., Mrs., Ms., Dr., St., etc. in narration when possible.
                    - No semicolons, em dashes, or multiple sentence-ending marks inside a scene narration.
              """

              for call_number in range(1, MAX_STORY_CALLS + 1):
                  story = groq_json(
                      prompt,
                      max_tokens=2800,
                      temperature=0.65,
                      label=f"story-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  normalize_story_narrations(story)
                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[validator] {issue}", flush=True)

                  repair_prompt = f"""
                    Repair the SAME story so it passes deterministic validation; do not replace the premise with a generic story.

                    CURRENT PROBLEM: {issue}

                    Keep the same protagonist, relationship, setting, tone, hook, and visual identity unless a minimal correction is necessary. Return the COMPLETE JSON object.

                    HARD CHECKS:
                    - 7-16 scenes; prefer 8-10; never add filler.
                    - Every scene has scene, narration, visual_prompt.
                    - Narration: exactly ONE natural spoken sentence, 12-26 words, target 17-21.
                    - Total narration MUST be at least 170 words and at most 230 words. Before returning JSON, count all scene narration words. If the total is below 170, expand the existing scenes naturally until it is at least 170; never return an under-170 story.
                    - Total narration target: 180-210 words when practical, without filler.
                    - Simple spoken English; concrete actions; no semicolons, em dashes, multiple sentences, literary wording, or vague metaphors.
                    - Preserve causal flow, strongest hook, character continuity, modest family-friendly wardrobe, and original visual style.
                    - No banned patterns.
                    - Before returning JSON, silently re-check scene count, every scene word count, total word count, sentence count, required fields, and valid JSON.

                    STORY:
                    {json.dumps(story, ensure_ascii=False)}

                    Return ONLY the corrected JSON object.
                  """

                  story = groq_json(
                      repair_prompt,
                      max_tokens=2600,
                      temperature=0.25,
                      label=f"repair-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  normalize_story_narrations(story)
                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[repair-validator] {issue}", flush=True)

              raise RuntimeError(
                  "The story could not pass deterministic validation "
                  "after the allowed generation/repair calls."
              )

          story = create_story()

          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)
          IMAGES.mkdir(parents=True, exist_ok=True)
          SCENES.mkdir(parents=True, exist_ok=True)

          (OUT / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          script = "\n".join(
              scene["narration"] for scene in story["scenes"]
          ).strip() + "\n"

          (OUT / "script.txt").write_text(script, encoding="utf-8")
          (OUT / "title.txt").write_text(story["title"] + "\n", encoding="utf-8")
          (OUT / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # FREE TTS: edge-tts
          # ============================================================

          voice = "en-US-GuyNeural"

          run_cmd([
              sys.executable,
              "-m",
              "edge_tts",
              "--voice",
              voice,
              "--rate",
              "+0%",
              "--text",
              script,
              "--write-media",
              str(OUT / "voice.mp3"),
              "--write-subtitles",
              str(OUT / "captions.srt"),
          ], timeout=180)

          # ============================================================
          # AI IMAGES: Pollinations authenticated API
          # Primary model: FLUX (Pollinations model id: flux)
          # Still images are animated with FFmpeg camera motion.
          # ============================================================

          POLLINATIONS_KEY = os.environ.get("POLLINATIONS_API_KEY", "").strip()
          if not POLLINATIONS_KEY:
              raise RuntimeError(
                  "Missing POLLINATIONS_API_KEY GitHub secret. "
                  "Add the secret before running the workflow."
              )

          POLLINATIONS_BASE = "https://gen.pollinations.ai/image/"

          def download_image(url, path, timeout=120):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Authorization": f"Bearer {POLLINATIONS_KEY}",
                              "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V3",
                              "Accept": "image/png,image/jpeg,image/webp,image/*",
                          },
                          method="GET",
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                          content_type = (r.headers.get("Content-Type") or "").lower()

                      if len(data) < 10000:
                          raise RuntimeError(
                              f"Image response for {path.name} is suspiciously small ({len(data)} bytes)."
                          )

                      valid_magic = (
                          data.startswith(b"\x89PNG")
                          or data.startswith(b"\xff\xd8")
                          or data.startswith(b"RIFF")
                      )
                      if "image" not in content_type and not valid_magic:
                          preview = data[:160].decode("utf-8", errors="replace")
                          raise RuntimeError(
                              f"Image response for {path.name} is not an image "
                              f"(Content-Type: {content_type}, body starts: {preview!r})."
                          )

                      path.write_bytes(data)
                      print(
                          f"[image] saved {path.name} ({len(data)/1024:.1f} KiB)",
                          flush=True,
                      )
                      return

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"HTTP {exc.code}: {raw[:1200]}"
                      )
                      print(
                          f"[image] attempt {attempt}/3 HTTP {exc.code} for {path.name}",
                          flush=True,
                      )
                  except Exception as exc:
                      last_error = exc
                      print(
                          f"[image] attempt {attempt}/3 failed for {path.name}: {exc}",
                          flush=True,
                      )

                  if attempt < 3:
                      time.sleep(2 * attempt)

              raise RuntimeError(
                  f"Pollinations image generation failed for {path.name}: {last_error}"
              )

          for index, scene in enumerate(story["scenes"], 1):
              output = IMAGES / f"scene_{index:02d}.png"
              visual_anchor = (
                  f"CHARACTER LOCK — {story['protagonist']['name']}; age {story['protagonist']['age']}; "
                  f"role {story['protagonist']['role']}; EXACT IDENTITY: {story['protagonist']['visual_identity']}. "
                  "Repeat these identity traits exactly in this image: same face shape, same eyes, same eyebrows, same hair, same skin tone, "
                  "same body build, same clothing design and exact clothing colors, same shoes, same distinctive accessory. "
                  "Do not redesign or reinterpret the character. "
              )

              MASTER_STYLE = (
                  "MASTER STYLE — premium cinematic hand-drawn 2D cartoon illustration in one consistent visual universe; "
                  "expressive stylized human characters; slightly exaggerated but believable anatomy; large highly expressive eyes; "
                  "strong readable eyebrows and mouths; distinctive facial shapes; clean confident dark ink outlines with varied line weight; "
                  "painterly digital coloring; subtle cel shading; soft tonal gradients; gentle textured brushwork; "
                  "rich but slightly muted cinematic colors; natural warm/cool color harmony; detailed environments; believable perspective; "
                  "strong foreground-midground-background depth; atmospheric lighting; realistic cast and contact shadows; dramatic story-driven composition; "
                  "same linework, proportions, brushwork, shading language, color grading, rendering quality and imaginative feel in every scene. "
                  "Never photorealistic, never live-action, never 3D CGI, never anime, never manga, never chibi, never flat vector art, "
                  "never preschool art, never generic cartoon styling. "
              )

              CONTINUITY_RULES = (
                  "CONTINUITY LOCK — this is the SAME recurring character from the previous and next scenes. "
                  "Preserve exact face shape, eye shape and color, eyebrows, hairstyle, hair color, skin tone, age, body proportions, clothing silhouette, "
                  "exact garment colors, shoes and signature accessory. Keep left-right relationships and prop ownership consistent. "
                  "If a returning supporting character is described in this scene, preserve that character's earlier appearance exactly. "
                  "Do not invent a new outfit, haircut, body type, accessory, age, facial structure, or color palette. "
              )

              prompt = (
                  MASTER_STYLE
                  + visual_anchor
                  + CONTINUITY_RULES
                  + " VISUAL SUBJECT RULE — obey the scene's PRIMARY VISUAL SUBJECT and ON-SCREEN CHARACTERS fields exactly. The primary subject must be the dominant visible subject. Every named or story-relevant character required by the scene must actually appear as a distinct person when the scene calls for them; do not substitute the protagonist for a friend, opponent, teammate, customer, or other character. If the narration transfers attention to another character, transfer camera focus to that character. When two characters interact, show the physical interaction clearly. Never duplicate a named character, never reuse the protagonist as a crowd member, and never fill the frame with extra versions of the same person. "
                  + " NARRATION CONTEXT — "
                  + scene["narration"]
                  + " SCENE BLUEPRINT — "
                  + scene["visual_prompt"]
                  + ", frozen cinematic moment, one dominant physical action, clear cause-and-effect staging, "
                    "purposeful pose, readable hands, believable weight and balance, correct anatomy, natural neck-head connection, aligned spine and torso, "
                    "plausible shoulders elbows wrists hips knees and hands, correct limb count, coherent left-right orientation, "
                    "no twisted neck, no broken wrists, no fused fingers, no extra fingers, no duplicate limbs, no duplicate people, no mirrored bodies, "
                    "no floating objects, no impossible geometry, no accidental text, no logo, no watermark, vertical 9:16. "
                    "Choose camera angle and shot scale specifically for the described action; do not repeat the same composition automatically. "
                    "Use atmospheric storytelling detail, foreground depth, midground action and background context without clutter. "
                    "Keep every character's expression and body language readable, natural and consistent with the exact story beat."
              )

              encoded = urllib.parse.quote(prompt, safe="")
              url = (
                  POLLINATIONS_BASE
                  + encoded
                  + f"?model=flux&width={IMAGE_WIDTH}&height={IMAGE_HEIGHT}"
                  + "&nologo=true"
              )

              print(f"[image] scene {index}: generating with Pollinations FLUX", flush=True)
              download_image(url, output)

          # ============================================================
          # CREATE MOTION CLIPS
          # ============================================================

          audio_duration_text = run_cmd([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(OUT / "voice.mp3"),
          ])

          audio_duration = float(audio_duration_text.strip())

          def parse_srt_timestamp(value):
              hh, mm, rest = value.split(":", 2)
              ss, ms = rest.split(",", 1)
              return int(hh) * 3600 + int(mm) * 60 + int(ss) + int(ms) / 1000.0

          raw_srt = (OUT / "captions.srt").read_text(encoding="utf-8")
          blocks = re.split(r"\n\s*\n", raw_srt.strip()) if raw_srt.strip() else []
          caption_items = []
          for block in blocks:
              lines = [line.strip("\ufeff") for line in block.splitlines() if line.strip()]
              if len(lines) < 3 or " --> " not in lines[1]:
                  continue
              start_text, end_text = lines[1].split(" --> ", 1)
              caption_text = " ".join(lines[2:]).strip()
              caption_items.append((parse_srt_timestamp(start_text), parse_srt_timestamp(end_text), caption_text))

          expected_scenes = len(story["scenes"])
          if len(caption_items) != expected_scenes:
              raise RuntimeError(
                  f"TTS subtitles produced {len(caption_items)} cues, but the story has "
                  f"{expected_scenes} scenes. Refusing to create mismatched scene timing."
              )

          # Use the real TTS sentence boundaries so each scene image runs while
          # its matching sentence is spoken. The next caption starts the next scene.
          scene_starts = [item[0] for item in caption_items]
          durations = []
          for i, start in enumerate(scene_starts):
              next_start = scene_starts[i + 1] if i + 1 < len(scene_starts) else audio_duration
              durations.append(max(0.05, next_start - start))

          # Normalize and rewrite the captions so the final video has exactly
          # one non-overlapping subtitle cue per scene.
          normalized_blocks = []

          def srt_time(seconds):
              millis = max(0, int(round(seconds * 1000)))
              hh = millis // 3600000
              millis %= 3600000
              mm = millis // 60000
              millis %= 60000
              ss = millis // 1000
              ms = millis % 1000
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"

          running = 0.0
          for i, (_, _, text) in enumerate(caption_items):
              start = running
              end = running + durations[i]
              running = end
              normalized_blocks.append(
                  f"{i + 1}\n{srt_time(start)} --> {srt_time(end)}\n{text}"
              )

          (OUT / "captions.srt").write_text(
              "\n\n".join(normalized_blocks) + "\n",
              encoding="utf-8",
          )

          # Build a dedicated ASS track so subtitle size and vertical position
          # are deterministic on the 1080x1920 Shorts canvas.
          def ass_time(seconds):
              total_cs = max(0, int(round(seconds * 100)))
              hh = total_cs // 360000
              total_cs %= 360000
              mm = total_cs // 6000
              total_cs %= 6000
              ss = total_cs // 100
              cs = total_cs % 100
              return f"{hh}:{mm:02d}:{ss:02d}.{cs:02d}"

          def ass_escape(text):
              return str(text).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}").replace("\n", " ")

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "ScaledBorderAndShadow: yes",
              "WrapStyle: 0",
              "YCbCr Matrix: TV.709",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Shorts,DejaVu Sans,32,&H00FFFFFF,&H00FFFFFF,&H90000000,&H70000000,0,0,0,0,100,100,0,0,3,2,0,2,80,80,210,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for i, (_, _, text) in enumerate(caption_items):
              start = 0.0 if i == 0 else sum(durations[:i])
              end = start + durations[i]
              ass_lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Shorts,,0,0,0,,{ass_escape(text)}"
              )

          (OUT / "captions.ass").write_text(
              "\n".join(ass_lines) + "\n",
              encoding="utf-8",
          )

          for i, (scene, duration) in enumerate(
              zip(story["scenes"], durations),
              1
          ):
              image = IMAGES / f"scene_{i:02d}.png"
              clip = SCENES / f"clip_{i:02d}.mp4"

              frames = max(1, round(duration * FPS))

              # Alternating direction prevents the whole Short from
              # looking mechanically identical.
              direction = 1 if i % 2 else -1

              zoom_expr = (
                  "min(zoom+0.0008,1.12)"
                  if direction == 1
                  else "if(eq(on,1),1.12,max(zoom-0.0008,1.00))"
              )

              vf = (
                  f"scale=1200:2133,"
                  f"crop=1080:1920,"
                  f"zoompan="
                  f"z='{zoom_expr}':"
                  f"d={frames}:"
                  f"x='iw/2-(iw/zoom/2)':"
                  f"y='ih/2-(ih/zoom/2)':"
                  f"s={VIDEO_WIDTH}x{VIDEO_HEIGHT}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-t", f"{duration:.3f}",
                  "-vf", vf,
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-movflags", "+faststart",
                  str(clip),
              ], timeout=120)

          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join(
                  f"file '{(SCENES / f'clip_{i:02d}.mp4').resolve()}'\n"
                  for i in range(1, len(story["scenes"]) + 1)
              ),
              encoding="utf-8",
          )

          silent_video = OUT / "video_silent.mp4"
          final_video = OUT / "final_short.mp4"

          run_cmd([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video),
          ], timeout=180)

          # Mux clean video + voice in one final pass. Captions remain as .srt/.ass artifacts only.
          run_cmd([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(OUT / "voice.mp3"),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "22",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ], timeout=240)

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["hook"],
              "setting": story["setting"],
              "words": words(script),
              "scenes": len(story["scenes"]),
              "created_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-50:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60, flush=True)
          print("DAILY FACELESS SHORT READY", flush=True)
          print("=" * 60, flush=True)
          print("Title:", story["title"], flush=True)
          print("Scenes:", len(story["scenes"]), flush=True)
          print("Words:", words(script), flush=True)
          print("Voice:", voice, flush=True)
          print("Video:", final_video, flush=True)
          PY

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Generate daily faceless short history"
            git push
          fi

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-faceless-short
          path: short-output/
          if-no-files-found: error
