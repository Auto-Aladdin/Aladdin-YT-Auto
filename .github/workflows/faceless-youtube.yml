name: Daily Faceless Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.2.8

      - name: Generate story, images, voice and video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # ============================================================
          # MISSION
          # ============================================================
          # One daily faceless motivational/emotional Short:
          # story -> scene image -> free TTS -> captions -> motion video
          #
          # Designed for GitHub Actions so the user's computer does not
          # need to stay online.
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          ROOT = Path(".")
          OUT = ROOT / "short-output"
          ASSETS = OUT / "assets"
          IMAGES = ASSETS / "images"
          SCENES = ASSETS / "clips"

          HISTORY_FILE = ROOT / ".github" / "data" / "story_history.json"

          API_KEY = os.environ["GROQ_API_KEY"]

          MIN_WORDS = 165
          MAX_WORDS = 230
          SCENES_MIN = 7
          SCENES_MAX = 16
          SCENE_MIN_WORDS = 12
          SCENE_MAX_WORDS = 27
          TARGET_SCENE_MIN_WORDS = 17
          TARGET_SCENE_MAX_WORDS = 21

          HTTP_TIMEOUT = 45
          MAX_RETRIES = 2
          MAX_STORY_CALLS = 1
          MIN_GAP = 1.0

          IMAGE_WIDTH = 768
          IMAGE_HEIGHT = 1365
          VIDEO_WIDTH = 1080
          VIDEO_HEIGHT = 1920
          FPS = 30

          # ------------------------------------------------------------
          # Creative controls — these are diversified starting points,
          # NOT rigid templates. The writer must fuse or subvert them.
          # ------------------------------------------------------------

          DOMAINS = [
              "an ordinary person notices a tiny inconsistency that changes an entire situation",
              "a practical problem with an unexpectedly clever solution",
              "a social misunderstanding that escalates because everyone assumes the wrong thing",
              "a rivalry where the real advantage is hidden in plain sight",
              "a valuable-looking object that turns out to matter for a completely different reason",
              "a routine job interrupted by a problem nobody else notices",
              "two people trying to solve different parts of the same problem without realizing it",
              "a seemingly bad decision that becomes useful because of an earlier overlooked detail",
              "a small act with an unexpectedly large chain reaction",
              "a person who is underestimated and quietly proves why",
              "a missing item that is found through observation rather than luck",
              "a plan that fails for a believable reason and forces a better second plan",
              "a public misunderstanding resolved by a physical clue",
              "a competitive challenge where the obvious winning strategy is the trap",
              "an everyday rule that creates an unusual but logical consequence",
              "a near-mistake that reveals what was actually happening",
          ]

          SETTINGS = [
              "rainy downtown side street",
              "old neighborhood restaurant kitchen",
              "busy train station concourse",
              "small apartment building hallway",
              "independent mechanic garage",
              "backstage theater corridor",
              "crowded night market",
              "quiet suburban corner shop",
              "rooftop greenhouse",
              "community sports court",
              "independent bookstore",
              "warehouse loading bay",
              "farm road beside a barn",
              "hotel service corridor",
              "coastal fishing dock",
              "old cinema lobby",
              "public library reading room",
              "small bicycle repair shop",
              "city bus depot",
              "apartment rooftop laundry area",
          ]

          EMOTIONS = [
              "curiosity with quiet tension",
              "playful awkwardness",
              "contained suspense",
              "warm relief",
              "surprise",
              "earned determination",
              "wonder",
              "pressure and uncertainty",
              "dry humor",
              "earned trust",
              "quiet emotional impact",
              "clever triumph",
              "embarrassment turning into relief",
              "gentle irony",
              "high-stakes focus without melodrama",
          ]

          HOOK_MODES = [
              "begin with a natural everyday action, then reveal one specific detail that suddenly matters",
              "open on a character already making a decision whose consequence is not yet clear",
              "start with a believable interruption that changes the character's immediate plan",
              "begin with a small visual anomaly and let the audience notice it with the protagonist",
              "open on a social misunderstanding already forming, then reveal what one person actually knows",
              "start one beat before a plan goes wrong, but make the plan and goal understandable first",
              "begin with a character noticing that something is out of place in an ordinary environment",
              "open with a simple task that becomes unexpectedly difficult for a concrete reason",
              "start with a confident choice that immediately creates a new problem",
          ]

          TWIST_MODES = [
              "a background detail from earlier becomes the key to the problem",
              "the protagonist misunderstood what another character actually wanted",
              "the apparent obstacle is not the real obstacle",
              "the failed first attempt creates the clue needed for the successful second attempt",
              "two characters were working from different assumptions",
              "the person who seemed least important has the missing piece",
              "the obvious solution would make the situation worse",
              "an earlier small choice changes the meaning of the final scene",
              "the opening detail returns in a new context and explains what really happened",
              "the apparent loss turns out to have prevented a larger problem",
          ]

          ENDING_MODES = [
              "a clever payoff caused by an earlier clue",
              "a warm human payoff earned through a concrete choice",
              "a funny reversal that still makes perfect logical sense",
              "a quiet reveal that reinterprets the opening",
              "an unexpected consequence that closes the causal loop",
              "a visual callback that completes the story without a lecture",
              "a small victory that reveals what the character actually valued",
              "a satisfying reversal where the audience realizes the clue was visible all along",
              "an understated final beat that lets the situation speak for itself",
          ]

          BANNED = [
              "magic",
              "magical",
              "supernatural",
              "miracle",
              "miraculous",
              "destiny",
              "fate",
              "hospital",
              "terminal illness",
              "child in danger",
              "lottery",
              "hidden fortune",
              "anonymous donor",
              "bonus",
              "applause",
              "thank-you note",
              "elevator",
              "blackout",
              "concert",
              "audition",
              "train platform",
              "coffee shop",
              "ticking clock",
              "glowing object",
              "red ribbon",
              "random stranger",
              "reverie",
              "poignant",
              "tentative",
              "fragile peace",
              "scars remain",
              "healing",
              "silent apology",
              "unspoken pain",
              "haunting memory",
              "life lesson",
              "lesson in",
              "moral of the story",
              "moral",
              "inspirational message",
              "never give up",
              "believe in yourself",
              "everything happens for a reason",
              "you won't believe",
              "watch until the end",
          ]

          def run_cmd(args, timeout=120, capture=True):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
                  timeout=timeout,
                  check=False,
              )
              if p.returncode != 0:
                  raise RuntimeError(
                      f"Command failed ({p.returncode}): {' '.join(args)}\n"
                      f"{p.stdout[-4000:] if p.stdout else ''}"
                  )
              return p.stdout or ""

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()
          recent = history[-20:]
          recent_text = "\n".join(
              f"- {x.get('title','')} | {x.get('premise','')} | {x.get('setting','')}"
              for x in recent
          ) or "NONE"

          last_call = 0.0

          STORY_SCHEMA = {
              "name": "publication_story",
              "schema": {
                  "type": "object",
                  "properties": {
                      "title": {"type": "string"},
                      "hook": {"type": "string"},
                      "description": {"type": "string"},
                      "protagonist": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "age": {"type": "integer"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "age", "role", "visual_identity"],
                          "additionalProperties": False
                      },
                      "setting": {"type": "string"},
                      "scenes": {
                          "type": "array",
                          # Keep scene count constrained at generation time so a
                          # short structural miss does not trigger a full repair call.
                          "minItems": 8,
                          "maxItems": 10,
                          "items": {
                              "type": "object",
                              "properties": {
                                  "scene": {"type": "integer"},
                                  "narration": {"type": "string"},
                                  "visual_prompt": {"type": "string"}
                              },
                              "required": ["scene", "narration", "visual_prompt"],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["title", "hook", "description", "protagonist", "setting", "scenes"],
                  "additionalProperties": False
              }
          }

          def groq_json(prompt, max_tokens=2000, temperature=0.55, label="groq", response_schema=None):
              global last_call

              gap = time.monotonic() - last_call
              if gap < MIN_GAP:
                  time.sleep(MIN_GAP - gap)

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return ONLY one valid JSON object. "
                              "Never return markdown. Never return a top-level array. "
                              "No commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": (
                      {
                          "type": "json_schema",
                          "json_schema": {
                              "name": response_schema["name"],
                              "strict": True,
                              "schema": response_schema["schema"],
                          },
                      }
                      if response_schema
                      else {"type": "json_object"}
                  ),
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  last_call = time.monotonic()

                  print(
                      f"[Groq] {label} attempt {attempt}/{MAX_RETRIES}",
                      flush=True,
                  )

                  req = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V1",
                      },
                      method="POST",
                  )

                  started = time.monotonic()

                  try:
                      with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                          data = json.loads(r.read().decode("utf-8"))

                      content = data["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")

                      try:
                          obj = json.loads(content)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(f"Groq returned invalid JSON: {exc}") from exc

                      if isinstance(obj, list) and len(obj) == 1 and isinstance(obj[0], dict):
                          obj = obj[0]

                      if not isinstance(obj, dict):
                          raise RuntimeError(
                              f"{label} must return a JSON object, got {type(obj).__name__}"
                          )

                      print(
                          f"[Groq] {label} success in {time.monotonic()-started:.2f}s",
                          flush=True,
                      )
                      return obj

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      elapsed = time.monotonic() - started
                      print(
                          f"[Groq] HTTP {exc.code} {label} after {elapsed:.2f}s",
                          flush=True,
                      )

                      if exc.code == 429:
                          low = raw.lower()
                          if "tokens per day" in low or "(tpd)" in low:
                              raise RuntimeError(
                                  "Groq daily token limit reached. "
                                  "Wait for the quota reset before rerunning.\n"
                                  + raw
                              ) from exc

                          if attempt < MAX_RETRIES:
                              time.sleep(2.0 * attempt)
                              continue

                      if exc.code in (408, 409, 425, 500, 502, 503, 504) and attempt < MAX_RETRIES:
                          time.sleep(2.0 * attempt)
                          continue

                      raise RuntimeError(f"Groq HTTP {exc.code}: {raw}") from exc

          def banned(text):
              lower = text.lower()
              for phrase in BANNED:
                  if phrase in lower:
                      return phrase
              return None

          def words(text):
              return len(str(text).split())

          def is_one_sentence(text):
              value = str(text).strip()
              if not value:
                  return False
              if ";" in value or "—" in value or "–" in value:
                  return False
              if not re.search(r"[.!?](?:[\"\'\)\]])*$", value):
                  return False

              # Do not mistake normal abbreviations for sentence endings.
              check = re.sub(
                  r"\b(?:Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|e\.g|i\.e)\.",
                  lambda m: m.group(0).replace(".", "<DOT>"),
                  value,
                  flags=re.IGNORECASE,
              )

              # A terminal punctuation mark may be followed by closing quotes or brackets.
              check = re.sub(r"[.!?](?=[\"\'\)\]]*$)", "<END>", check)
              return not bool(re.search(r"[.!?]\s+", check))

          def normalize_narration(text):
              """Keep a generated scene narration as one spoken TTS cue.

              This is a local, deterministic cleanup only; it avoids spending
              another Groq call when the model accidentally uses two short
              sentences or a forbidden dash/semicolon.
              """
              value = re.sub(r"\s+", " ", str(text).strip())
              if not value:
                  return value

              parts = re.split(r"(?<=[.!?])\s+(?=[A-Z0-9\"'])", value)
              if len(parts) > 1:
                  cleaned = []
                  for part in parts:
                      part = part.strip().rstrip(".!?")
                      if part:
                          cleaned.append(part)
                  value = ", and ".join(cleaned)

              value = re.sub(r"\s*;\s*", ", and ", value)
              value = re.sub(r"\s*[—–]\s*", ", and ", value)
              value = re.sub(r"\s{2,}", " ", value).strip()

              if value and value[-1] not in ".!?":
                  value += "."
              elif value:
                  value = value[:-1] + "."
              return value

          def normalize_story_narrations(story):
              for scene in story.get("scenes", []):
                  if isinstance(scene, dict) and "narration" in scene:
                      scene["narration"] = normalize_narration(scene["narration"])

          def validate_story(story):
              if not isinstance(story, dict):
                  return "Story is not an object."

              required = [
                  "title", "hook", "description", "protagonist",
                  "setting", "scenes"
              ]
              for k in required:
                  if k not in story:
                      return f"Missing field: {k}"

              protagonist = story["protagonist"]
              if not isinstance(protagonist, dict):
                  return "Protagonist must be an object."

              if not str(protagonist.get("name", "")).strip():
                  return "Missing protagonist name."

              try:
                  age = int(protagonist.get("age"))
              except Exception:
                  return "Invalid protagonist age."

              if not 21 <= age <= 70:
                  return "Protagonist age must be 21-70."

              role = str(protagonist.get("role", "")).strip()
              if len(role.split()) < 2:
                  return "Protagonist role needs at least 2 words."

              scenes = story["scenes"]
              if not isinstance(scenes, list):
                  return "Scenes must be an array."

              if len(scenes) < SCENES_MIN or len(scenes) > SCENES_MAX:
                  return (
                      f"Story must contain {SCENES_MIN}-{SCENES_MAX} scenes; got {len(scenes)}."
                  )

              total = 0
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      return f"Scene {i} is not an object."

                  narration = str(scene.get("narration", "")).strip()
                  count = words(narration)
                  total += count

                  if count < SCENE_MIN_WORDS or count > SCENE_MAX_WORDS:
                      return (
                          f"Scene {i} has {count} words; "
                          f"allowed {SCENE_MIN_WORDS}-{SCENE_MAX_WORDS}."
                      )

                  if not is_one_sentence(narration):
                      return f"Scene {i} narration must be exactly one simple sentence."

                  visual = str(scene.get("visual_prompt", "")).strip()
                  if len(visual.split()) < 8:
                      return f"Scene {i} visual prompt is too short."

              if total < MIN_WORDS:
                  return f"Story is too short at {total} words; minimum {MIN_WORDS}."
              if total > MAX_WORDS:
                  return f"Story is too long at {total} words; maximum {MAX_WORDS}."

              hook = str(story["hook"]).strip()
              if words(hook) < 10:
                  return "Hook is too short."

              blob = json.dumps(story, ensure_ascii=False)
              bad = banned(blob)
              if bad:
                  return f"Banned pattern: {bad}"

              title = str(story["title"]).strip()
              if words(title) > 12:
                  return "Title is too long."

              return None

          def create_story():
              prompt = f"""
                    ROLE
                    You are the showrunner, head writer, storyboard director, and visual-continuity supervisor
                    for a premium original animated Shorts studio. Create ONE memorable 35–60 second mini-film:
                    specific, visual, entertaining, emotionally earned, and authored rather than templated.

                    CORE STORY STANDARD
                    Build around specific people, a concrete visible goal, a visible obstacle, escalating consequences,
                    one meaningful choice, and an earned payoff. The viewer should understand the situation quickly,
                    care what happens, and feel the ending was worth waiting for.
                    Avoid AI-story fingerprints: generic lessons, convenient strangers, random luck, recycled rescues,
                    empty suspense, fake cliffhangers, over-explaining, and interchangeable plots.

                    ORIGINALITY — NON-NEGOTIABLE
                    Recent history is only a collision warning. Do NOT disguise an old story with new names, clothes,
                    colors, animals, or locations. Materially vary the underlying premise, protagonist motivation,
                    conflict mechanism, escalation path, visual motif, reversal logic, emotional register, and ending.
                    Do not repeat the same emotional arc or reveal type back-to-back. The protagonist must have agency:
                    what they notice, choose, attempt, or refuse must affect the outcome.
                    Never copy, paraphrase, imitate, or reconstruct another creator's video, film scene, viral story,
                    meme, Reddit story, or recognizable plot. Prefer one memorable "what if" specific to THIS people/place.

                    RETENTION WITHOUT CLICKBAIT
                    Use this flexible causal spine when useful:
                    HOOK → CLEAR SITUATION → QUESTION → GOAL → ATTEMPT → COMPLICATION → ESCALATION → CHOICE →
                    CONSEQUENCE → REVEAL/PAYOFF.
                    It is NOT a rigid template. Every 1–2 scenes should meaningfully change information, action, risk,
                    relationship, object state, or plan. At least one attempt must fail, backfire, or reveal a constraint.
                    The payoff must be caused by earlier actions, clues, objects, promises, mistakes, or choices.
                    Never solve the final problem with luck, coincidence, unexplained authority, sudden wealth,
                    magic, or a stranger who appears only to fix everything.

                    OPENING
                    Scene 1 must sound like the first sentence of a skilled person telling a friend something surprising.
                    Introduce the protagonist naturally inside a routine/action, then reveal a precise disruption,
                    discovery, mistake, decision, or problem. Let the audience know who is involved before the unusual
                    event fully unfolds. Vary opening mechanisms across episodes: ordinary routine interrupted,
                    relationship moment, confident decision with hidden cost, tiny visual inconsistency,
                    immediate practical problem, or social misunderstanding.
                    Never use fixed "There was a boy named..." / "One day..." openings, weather-only openings,
                    biography dumps, trailer narration, quotes, viewer-directed questions, or empty mystery language.

                    STORY LOGIC
                    - One primary adult protagonist with personality shown through behavior.
                    - Up to two important supporting characters unless more are truly necessary.
                    - One concrete visible goal and one understandable external obstacle.
                    - One meaningful choice with cost, risk, tradeoff, or social consequence.
                    - At least one setback, failed attempt, reversal, or discovery.
                    - Earlier details should become useful later whenever possible.
                    - Close the causal loop through action; never finish with a moral speech.
                    - Meaning must emerge from the event itself.

                    NATURAL NARRATION
                    Write spoken English, not literary prose: conversational, confident, vivid, easy to understand
                    on first listen. Use concrete names/actions early, with varied short-to-medium rhythm.
                    Each scene narration is ONE sentence. Narrate what the storyteller adds beyond the image:
                    reason, surprise, clue, consequence, or emotional meaning. Do not narrate every visible movement.
                    Avoid stiff/essay language, generic inspiration, fake suspense, "you won't believe", "watch until the end",
                    "life lesson", "moral of the story", and repetitive catchphrases.

                    VISUAL-FIRST STORYTELLING
                    This is an illustrated film, not a slideshow. Every scene must have ONE dominant physical action
                    or visible change understandable without narration. Show cause/effect physically: hands reach,
                    objects change state, paths are blocked, people react, evidence appears, plans fail, choices happen,
                    relationships shift. Do not spend scenes on invisible thoughts alone.

                    CHARACTER BIBLE — IMMUTABLE
                    Create a highly specific, repeatable adult protagonist: exact age; face shape; eye shape/color;
                    eyebrow shape; hairstyle/color; skin tone; body build; height impression; signature everyday outfit
                    with exact garment colors; exact shoes; ONE distinctive accessory/prop. Make it easy for an image model
                    to reproduce. LOCK every identity trait across the whole story: no hairstyle/age/body/wardrobe/color drift
                    and no missing accessory. Any returning supporting character gets the same locked treatment.
                    Wardrobes must stay practical, tasteful, family-friendly, and consistent.

                    MASTER VISUAL UNIVERSE — LOCKED
                    Every scene must look like the SAME premium hand-drawn 2D animated film:
                    expressive stylized humans; slightly exaggerated but believable anatomy; large expressive eyes;
                    readable eyebrows/mouths; distinctive facial shapes; clean confident dark ink outlines with varied
                    line weight; painterly digital color; subtle cel shading; soft gradients; gentle textured brushwork;
                    rich slightly muted cinematic colors; coherent warm/cool harmony; believable perspective;
                    strong foreground/midground/background depth; atmospheric lighting; realistic cast/contact shadows;
                    polished environmental detail; story-driven composition.
                    Never photorealistic, live-action, 3D CGI, anime, manga, chibi, flat vector, preschool art,
                    clip-art, or generic AI cartoon styling.

                    SCENE DESIGN
                    Every scene is a NEW film frame, not a portrait variant. Change the visual beat through action,
                    subject, composition, location zone, prop state, interaction, or camera language. Use visual rhythm
                    such as wide establish → medium action → close clue → reaction → interaction → dynamic angle → reveal → payoff,
                    but vary it naturally. Vary shot scale/angle while preserving the same art universe.
                    Keep important action readable in vertical 9:16. Favor active poses, clear silhouettes, believable hands,
                    purposeful eye-lines, grounded feet, realistic weight, depth layers, environmental storytelling,
                    and meaningful props. Avoid clutter, duplicate characters/props, broken anatomy, impossible hands,
                    floating objects, or random background faces.

                    PRIMARY SUBJECT RULE
                    Each scene has ONE PRIMARY VISUAL SUBJECT: the person/object whose action makes the frame necessary.
                    If narration says a supporting character arrives, speaks, warns, receives, searches, chases, hides,
                    fixes, or reacts, that character MUST be visible and visually important. Do not default to the protagonist
                    when the beat belongs to someone else. Show character interactions physically. Named characters must never
                    look like copies; crowds must remain generic and distinct.

                    SCENE BLUEPRINT
                    Every visual_prompt MUST use these labels in this order:
                    SCENE: one frozen cinematic moment
                    PRIMARY VISUAL SUBJECT: one person/object
                    ON-SCREEN CHARACTERS: every relevant visible character with unique identifiers
                    CHARACTER: full locked identity of the primary character when a person is central
                    ACTION: exactly what physically happens and who does it
                    LOCATION: specific environment + important objects
                    MOOD: emotion shown through face/body/light/atmosphere
                    CAMERA: shot size, angle, height, composition, visual priority
                    LIGHTING: key light, color temperature, time/weather, shadows
                    CONTINUITY: exact identity/wardrobe/prop details that MUST stay unchanged
                    VISUAL DIFFERENTIATION: what changed from the previous scene and why this frame is different
                    The prompt must be concrete enough for an illustrator to stage immediately; never rely on vague
                    "cinematic scene" wording. If a supporting character performs or receives the named action,
                    they must be the visual focus. If two characters interact, show the interaction itself.

                    SAFETY / TONE
                    No graphic gore, sexual content, hateful content, child endangerment, supernatural powers,
                    magic, miracles, or traumatic shock bait. Non-graphic tension, danger, crime-like situations,
                    weapons, or chase elements may exist when story-relevant, but never provide instructions for wrongdoing/harm.

                    DIVERSIFIERS — INGREDIENTS, NOT TEMPLATES
                    Domain: {random.choice(DOMAINS)}
                    Setting: {random.choice(SETTINGS)}
                    Emotional flavor: {random.choice(EMOTIONS)}
                    Hook mode: {random.choice(HOOK_MODES)}
                    Twist mode: {random.choice(TWIST_MODES)}
                    Ending mode: {random.choice(ENDING_MODES)}

                    RECENT HISTORY
                    {recent_text}

                    FINAL CHECK BEFORE JSON
                    Verify: specific/original premise; active protagonist; visible goal + obstacle; meaningful progression;
                    real setback/reversal; earned payoff; natural opening; distinct/locked characters; distinct visual beats;
                    filmable scenes; no filler; no repeated template.

                    OUTPUT — RETURN ONLY THIS JSON OBJECT
                    {{
                      "title": "short memorable title, 3-9 words",
                      "hook": "10-20 word curiosity-driven opening",
                      "description": "2-3 natural sentences describing the finished Short without clickbait spam",
                      "protagonist": {{
                        "name": "specific adult name",
                        "age": 21-35,
                        "role": "specific role with at least two words",
                        "visual_identity": "exact face shape, eye shape/color, eyebrow shape, hairstyle/color, skin tone, body build, outfit colors, footwear, distinctive accessory"
                      }},
                      "setting": "specific physical setting",
                      "scenes": [
                        {{
                          "scene": 1,
                          "narration": "one natural spoken sentence, 12-26 words",
                          "visual_prompt": "SCENE: ... PRIMARY VISUAL SUBJECT: ... ON-SCREEN CHARACTERS: ... CHARACTER: ... ACTION: ... LOCATION: ... MOOD: ... CAMERA: ... LIGHTING: ... CONTINUITY: ... VISUAL DIFFERENTIATION: ..."
                        }}
                      ]
                    }}

                    SCENE CONTRACT
                    - Produce 8-10 scenes; prefer 8 when sufficient; use 9-10 only when each adds genuine progression. Never pad.
                    - Target 18-22 narration words/scene; hard range 12-26.
                    - Target 185-205 total narration words so the first generation comfortably clears validation.
                    - If total is below 170, enrich existing scenes with useful cause/consequence/reaction/detail; do NOT add filler.
                    - Every narration is exactly ONE natural spoken sentence.
                    - Scene 1: natural character introduction + immediate specific disruption/question.
                    - Scene 2: problem becomes concrete. Scene 3: goal/risk/choice becomes clear.
                    - Middle: attempts, clues, complications, setbacks, discoveries, escalation, reversal.
                    - Final scenes: consequence + satisfying payoff caused by earlier events.
                    - Never repeat essentially the same action in consecutive scenes or add filler reaction shots.
                    - PRIMARY VISUAL SUBJECT must match the person/object performing or receiving the narrated action.
                    - Establish important new characters visually when they matter; transfer camera focus when attention transfers.
                    - Background crowds never duplicate named characters.
                    - Avoid Mr./Mrs./Ms./Dr./St. in narration when possible; no semicolons, em dashes, or multiple sentence-ending marks.
              """


              for call_number in range(1, MAX_STORY_CALLS + 1):
                  story = groq_json(
                      prompt,
                      max_tokens=2300,
                      temperature=0.65,
                      label=f"story-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  normalize_story_narrations(story)
                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[validator] {issue}", flush=True)

                  # Token-saving fast path: a small total-word-count miss is a
                  # mechanical formatting issue, not a creative-writing failure.
                  # Fix it locally instead of spending another full LLM request.
                  short_match = re.fullmatch(
                      r"Story is too short at (\d+) words; minimum (\d+)\.",
                      issue,
                  )
                  if short_match:
                      current_words = int(short_match.group(1))
                      minimum_words = int(short_match.group(2))
                      shortfall = minimum_words - current_words

                      if 1 <= shortfall <= 12:
                          padding_options = [
                              " making the next step harder than it first seemed",
                              " and the situation suddenly became harder to control",
                              " while the consequences became impossible to ignore",
                              " and that small change created a bigger problem",
                              " as the next decision became much more important",
                          ]

                          # Add a short, story-neutral causal clause to the
                          # scene that is closest to the climax/payoff. This
                          # preserves the existing premise instead of asking the
                          # model to rewrite the whole story.
                          target = story.get("scenes", [])[-1]
                          narration = str(target.get("narration", "")).strip()
                          if narration:
                              clause = padding_options[(current_words + shortfall) % len(padding_options)]
                              base = narration.rstrip(".!? ")
                              candidate = base + clause + "."
                              added = words(candidate) - words(narration)
                              if added == shortfall or (added < shortfall and shortfall - added <= 3):
                                  target["narration"] = candidate
                                  normalize_story_narrations(story)
                                  issue = validate_story(story)
                                  if not issue:
                                      print(
                                          f"[validator] fixed minor {shortfall}-word shortfall locally; no repair call used.",
                                          flush=True,
                                      )
                                      return story

                  repair_prompt = f"""
                    Perform a MINIMAL repair of the SAME story.

                    CURRENT PROBLEM: {issue}

                    Change only what is necessary to satisfy the validator. Do NOT rewrite the premise,
                    characters, setting, hook, visual identity, scene order, visual prompts, or payoff.
                    Keep 8-10 scenes. Keep every scene as ONE natural spoken sentence.

                    TARGETS:
                    - 12-26 narration words per scene, target 18-22.
                    - Total narration 165-230 words, target 185-205.
                    - Preserve the same causal story, continuity, tone, and visual plan.
                    - Do not add filler or invent a new plot point just to change word count.

                    STORY:
                    {json.dumps(story, ensure_ascii=False)}

                    Return ONLY the corrected JSON object.
                  """

                  story = groq_json(
                      repair_prompt,
                      max_tokens=1700,
                      temperature=0.25,
                      label=f"repair-{call_number}",
                      response_schema=STORY_SCHEMA,
                  )

                  normalize_story_narrations(story)
                  issue = validate_story(story)
                  if not issue:
                      return story

                  print(f"[repair-validator] {issue}", flush=True)

              raise RuntimeError(
                  "The story could not pass deterministic validation "
                  "after the allowed generation/repair calls."
              )

          story = create_story()

          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)
          IMAGES.mkdir(parents=True, exist_ok=True)
          SCENES.mkdir(parents=True, exist_ok=True)

          (OUT / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          script = "\n".join(
              scene["narration"] for scene in story["scenes"]
          ).strip() + "\n"

          (OUT / "script.txt").write_text(script, encoding="utf-8")
          (OUT / "title.txt").write_text(story["title"] + "\n", encoding="utf-8")
          (OUT / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # FREE TTS: edge-tts
          # ============================================================

          voice = "en-US-ChristopherNeural"

          run_cmd([
              sys.executable,
              "-m",
              "edge_tts",
              "--voice",
              voice,
              "--rate",
              "+0%",
              "--text",
              script,
              "--write-media",
              str(OUT / "voice.mp3"),
              "--write-subtitles",
              str(OUT / "captions.srt"),
          ], timeout=180)

          # ============================================================
          # AI IMAGES: Pollinations authenticated API
          # Primary model: FLUX (Pollinations model id: flux)
          # Creative direction is supplied by the story director above; FFmpeg adds motion afterward.
          # ============================================================

          POLLINATIONS_KEY = os.environ.get("POLLINATIONS_API_KEY", "").strip()
          if not POLLINATIONS_KEY:
              raise RuntimeError(
                  "Missing POLLINATIONS_API_KEY GitHub secret. "
                  "Add the secret before running the workflow."
              )

          POLLINATIONS_BASE = "https://gen.pollinations.ai/image/"

          def download_image(url, path, timeout=120):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Authorization": f"Bearer {POLLINATIONS_KEY}",
                              "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V3",
                              "Accept": "image/png,image/jpeg,image/webp,image/*",
                          },
                          method="GET",
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                          content_type = (r.headers.get("Content-Type") or "").lower()

                      if len(data) < 10000:
                          raise RuntimeError(
                              f"Image response for {path.name} is suspiciously small ({len(data)} bytes)."
                          )

                      valid_magic = (
                          data.startswith(b"\x89PNG")
                          or data.startswith(b"\xff\xd8")
                          or data.startswith(b"RIFF")
                      )
                      if "image" not in content_type and not valid_magic:
                          preview = data[:160].decode("utf-8", errors="replace")
                          raise RuntimeError(
                              f"Image response for {path.name} is not an image "
                              f"(Content-Type: {content_type}, body starts: {preview!r})."
                          )

                      path.write_bytes(data)
                      print(
                          f"[image] saved {path.name} ({len(data)/1024:.1f} KiB)",
                          flush=True,
                      )
                      return

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"HTTP {exc.code}: {raw[:1200]}"
                      )
                      print(
                          f"[image] attempt {attempt}/3 HTTP {exc.code} for {path.name}",
                          flush=True,
                      )
                  except Exception as exc:
                      last_error = exc
                      print(
                          f"[image] attempt {attempt}/3 failed for {path.name}: {exc}",
                          flush=True,
                      )

                  if attempt < 3:
                      time.sleep(2 * attempt)

              raise RuntimeError(
                  f"Pollinations image generation failed for {path.name}: {last_error}"
              )

          for index, scene in enumerate(story["scenes"], 1):
              output = IMAGES / f"scene_{index:02d}.png"
              visual_anchor = (
                  f"CHARACTER LOCK — {story['protagonist']['name']}; adult age {story['protagonist']['age']}; "
                  f"role {story['protagonist']['role']}; EXACT IDENTITY: {story['protagonist']['visual_identity']}. "
                  "Treat this identity as immutable. Preserve the exact face structure, eye design, eyebrow shape, "
                  "hair shape and color, skin tone, body proportions, wardrobe silhouette, garment colors, footwear, "
                  "and signature accessory in every frame where this character appears. "
                  "Do not redesign, age, beautify, simplify, or reinterpret the character. "
              )

              MASTER_STYLE = (
                  "STYLE LOCK — premium cinematic hand-drawn 2D cartoon feature-animation frame; "
                  "expressive stylized human characters; believable slightly exaggerated anatomy; "
                  "large expressive eyes; readable eyebrows and mouths; distinctive facial construction; "
                  "clean confident dark ink outlines with subtle line-weight variation; painterly digital color; "
                  "restrained cel shading; soft tonal gradients; gentle textured brushwork; rich slightly muted "
                  "cinematic palette; coherent warm/cool color harmony; nuanced skin and fabric rendering; "
                  "believable environments; accurate perspective; strong foreground/midground/background depth; "
                  "atmospheric light; realistic cast and contact shadows; polished storytelling detail; "
                  "premium animated-film composition with a handcrafted illustrated feel. "
                  "Every frame must look like it was made by the same artist, with the same character design language, "
                  "linework, proportions, brush texture, shading behavior, color grading, and visual imagination. "
                  "No photorealism, live action, 3D CGI, anime, manga, chibi, flat vector, generic AI cartoon, "
                  "clip-art, poster layout, or children's-book simplification. "
              )

              CONTINUITY_RULES = (
                  "CONTINUITY LOCK — treat this shot as part of one continuous film. "
                  "Preserve all returning characters, exact faces, hairstyles, clothing silhouettes, garment colors, "
                  "shoes, accessories, and important object ownership from the story. "
                  "If the scene blueprint gives a supporting character identity, render that character as a distinct, "
                  "consistent person and do not substitute the protagonist. "
                  "Preserve spatial relationships that matter to the action and keep props physically consistent "
                  "between adjacent scenes. "
                  "Use the visual_differentiation field to change framing, action, composition, subject focus, "
                  "or object state rather than changing character design. "
              )

              prompt = (
                  MASTER_STYLE
                  + visual_anchor
                  + CONTINUITY_RULES
                  + " SHOT DIRECTOR — obey the SCENE, PRIMARY VISUAL SUBJECT, ON-SCREEN CHARACTERS, ACTION, "
                    "LOCATION, MOOD, CAMERA, LIGHTING, CONTINUITY, and VISUAL DIFFERENTIATION fields exactly. "
                    "The primary visual subject must dominate the frame because they are the reason this shot exists. "
                    "Every character named as physically present must actually appear as a distinct person. "
                    "If two characters interact, make their physical relationship immediately readable. "
                    "Do not hide the acting character behind furniture or make them a tiny background figure. "
                    "Do not default to a centered portrait. Stage a specific cinematic moment with a readable action, "
                    "purposeful body language, clear eye-lines, believable hands, grounded feet, natural weight, "
                    "and an obvious relationship between foreground, subject, and background. "
                    "Prefer film grammar: wide establishing shot, medium action shot, over-the-shoulder, two-shot, "
                    "close-up of a clue, low angle, high angle, profile, tracking-style composition, or environmental shot "
                    "as appropriate to the scene. Choose the shot based on story function rather than repeating one angle. "
                    "Use depth layers and foreground framing to create richness without clutter. "
                    "Keep the important action in the safe vertical 9:16 area. "
                    "Avoid duplicated people, repeated protagonist faces in crowds, extra limbs, fused fingers, broken wrists, "
                    "twisted necks, incorrect joints, floating props, mirrored anatomy, inconsistent clothing, random text, "
                    "logos, watermarks, UI elements, borders, and meaningless background action. "
                    "NARRATION CONTEXT — "
                  + scene["narration"]
                  + " SCENE BLUEPRINT — "
                  + scene["visual_prompt"]
                  + " FREEZE this exact moment as a polished animation keyframe. "
                    "The image must communicate the scene's cause-and-effect visually even with the narration muted."
              )

              encoded = urllib.parse.quote(prompt, safe="")
              url = (
                  POLLINATIONS_BASE
                  + encoded
                  + f"?model=flux&width={IMAGE_WIDTH}&height={IMAGE_HEIGHT}"
                  + "&nologo=true"
              )

              print(f"[image] scene {index}: generating with Pollinations FLUX", flush=True)
              download_image(url, output)

          # ============================================================
          # CREATE MOTION CLIPS
          # ============================================================

          audio_duration_text = run_cmd([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(OUT / "voice.mp3"),
          ])

          audio_duration = float(audio_duration_text.strip())

          def parse_srt_timestamp(value):
              hh, mm, rest = value.split(":", 2)
              ss, ms = rest.split(",", 1)
              return int(hh) * 3600 + int(mm) * 60 + int(ss) + int(ms) / 1000.0

          raw_srt = (OUT / "captions.srt").read_text(encoding="utf-8")
          blocks = re.split(r"\n\s*\n", raw_srt.strip()) if raw_srt.strip() else []
          caption_items = []
          for block in blocks:
              lines = [line.strip("\ufeff") for line in block.splitlines() if line.strip()]
              if len(lines) < 3 or " --> " not in lines[1]:
                  continue
              start_text, end_text = lines[1].split(" --> ", 1)
              caption_text = " ".join(lines[2:]).strip()
              caption_items.append((parse_srt_timestamp(start_text), parse_srt_timestamp(end_text), caption_text))

          expected_scenes = len(story["scenes"])
          if len(caption_items) != expected_scenes:
              raise RuntimeError(
                  f"TTS subtitles produced {len(caption_items)} cues, but the story has "
                  f"{expected_scenes} scenes. Refusing to create mismatched scene timing."
              )

          # Use the real TTS sentence boundaries so each scene image runs while
          # its matching sentence is spoken. The next caption starts the next scene.
          scene_starts = [item[0] for item in caption_items]
          durations = []
          for i, start in enumerate(scene_starts):
              next_start = scene_starts[i + 1] if i + 1 < len(scene_starts) else audio_duration
              durations.append(max(0.05, next_start - start))

          # Normalize and rewrite the captions so the final video has exactly
          # one non-overlapping subtitle cue per scene.
          normalized_blocks = []

          def srt_time(seconds):
              millis = max(0, int(round(seconds * 1000)))
              hh = millis // 3600000
              millis %= 3600000
              mm = millis // 60000
              millis %= 60000
              ss = millis // 1000
              ms = millis % 1000
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"

          running = 0.0
          for i, (_, _, text) in enumerate(caption_items):
              start = running
              end = running + durations[i]
              running = end
              normalized_blocks.append(
                  f"{i + 1}\n{srt_time(start)} --> {srt_time(end)}\n{text}"
              )

          (OUT / "captions.srt").write_text(
              "\n\n".join(normalized_blocks) + "\n",
              encoding="utf-8",
          )

          # Build a dedicated ASS track so subtitle size and vertical position
          # are deterministic on the 1080x1920 Shorts canvas.
          def ass_time(seconds):
              total_cs = max(0, int(round(seconds * 100)))
              hh = total_cs // 360000
              total_cs %= 360000
              mm = total_cs // 6000
              total_cs %= 6000
              ss = total_cs // 100
              cs = total_cs % 100
              return f"{hh}:{mm:02d}:{ss:02d}.{cs:02d}"

          def ass_escape(text):
              return str(text).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}").replace("\n", " ")

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "ScaledBorderAndShadow: yes",
              "WrapStyle: 0",
              "YCbCr Matrix: TV.709",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Shorts,DejaVu Sans,32,&H00FFFFFF,&H00FFFFFF,&H90000000,&H70000000,0,0,0,0,100,100,0,0,3,2,0,2,80,80,210,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for i, (_, _, text) in enumerate(caption_items):
              start = 0.0 if i == 0 else sum(durations[:i])
              end = start + durations[i]
              ass_lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Shorts,,0,0,0,,{ass_escape(text)}"
              )

          (OUT / "captions.ass").write_text(
              "\n".join(ass_lines) + "\n",
              encoding="utf-8",
          )

          for i, (scene, duration) in enumerate(
              zip(story["scenes"], durations),
              1
          ):
              image = IMAGES / f"scene_{i:02d}.png"
              clip = SCENES / f"clip_{i:02d}.mp4"

              frames = max(1, round(duration * FPS))

              # Alternating direction prevents the whole Short from
              # looking mechanically identical.
              direction = 1 if i % 2 else -1

              zoom_expr = (
                  "min(zoom+0.0008,1.12)"
                  if direction == 1
                  else "if(eq(on,1),1.12,max(zoom-0.0008,1.00))"
              )

              vf = (
                  f"scale=1200:2133,"
                  f"crop=1080:1920,"
                  f"zoompan="
                  f"z='{zoom_expr}':"
                  f"d={frames}:"
                  f"x='iw/2-(iw/zoom/2)':"
                  f"y='ih/2-(ih/zoom/2)':"
                  f"s={VIDEO_WIDTH}x{VIDEO_HEIGHT}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-t", f"{duration:.3f}",
                  "-vf", vf,
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-movflags", "+faststart",
                  str(clip),
              ], timeout=120)

          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join(
                  f"file '{(SCENES / f'clip_{i:02d}.mp4').resolve()}'\n"
                  for i in range(1, len(story["scenes"]) + 1)
              ),
              encoding="utf-8",
          )

          silent_video = OUT / "video_silent.mp4"
          final_video = OUT / "final_short.mp4"

          run_cmd([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video),
          ], timeout=180)

          # Mux clean video + voice in one final pass. Captions remain as .srt/.ass artifacts only.
          run_cmd([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(OUT / "voice.mp3"),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "22",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ], timeout=240)

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["hook"],
              "setting": story["setting"],
              "words": words(script),
              "scenes": len(story["scenes"]),
              "created_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-50:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60, flush=True)
          print("DAILY FACELESS SHORT READY", flush=True)
          print("=" * 60, flush=True)
          print("Title:", story["title"], flush=True)
          print("Scenes:", len(story["scenes"]), flush=True)
          print("Words:", words(script), flush=True)
          print("Voice:", voice, flush=True)
          print("Video:", final_video, flush=True)
          PY

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Generate daily faceless short history"
            git push
          fi

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-faceless-short
          path: short-output/
          if-no-files-found: error
