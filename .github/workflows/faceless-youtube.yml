name: Faceless YouTube Agent

on:
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Generate YouTube package
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p output

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          api_key = os.environ["GROQ_API_KEY"]

          prompt = """
          Create one original faceless YouTube video package.

          Topic:
          Pick one surprising evergreen fact/topic with broad worldwide appeal.

          Requirements:
          - Strong curiosity hook.
          - 700-900 words of narration.
          - Natural voice-over language.
          - No "hey guys" or filler.
          - 8-12 numbered visual scenes.
          - Each scene needs narration and a visual description.
          - Compelling YouTube title.
          - YouTube description.
          - Return ONLY valid JSON.

          JSON structure:
          {
            "topic": "string",
            "title": "string",
            "description": "string",
            "script": "string",
            "scenes": [
              {
                "scene": 1,
                "narration": "string",
                "visual": "string"
              }
            ]
          }
          """

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "max_completion_tokens": 5000,
              "temperature": 0.7,
              "include_reasoning": False,
              "response_format": {
                  "type": "json_object"
              }
          }

          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  "User-Agent": "Aladdin-YT-Auto/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code)
              print(e.read().decode("utf-8"))
              raise

          message = result["choices"][0]["message"]
          content = message.get("content", "")

          if not content:
              raise RuntimeError("Groq returned empty content.")

          data = json.loads(content)

          required = [
              "topic",
              "title",
              "description",
              "script",
              "scenes"
          ]

          missing = [x for x in required if x not in data]

          if missing:
              raise RuntimeError(f"Missing fields: {missing}")

          with open("output/content.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          with open("output/topic.txt", "w", encoding="utf-8") as f:
              f.write(data["topic"])

          with open("output/title.txt", "w", encoding="utf-8") as f:
              f.write(data["title"])

          with open("output/description.txt", "w", encoding="utf-8") as f:
              f.write(data["description"])

          with open("output/script.txt", "w", encoding="utf-8") as f:
              f.write(data["script"])

          with open("output/scenes.json", "w", encoding="utf-8") as f:
              json.dump(data["scenes"], f, ensure_ascii=False, indent=2)

          print("✅ AI CONTENT GENERATED")
          print("Topic:", data["topic"])
          print("Title:", data["title"])
          print("Scenes:", len(data["scenes"]))

          PY

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: youtube-content
          path: output/
          retention-days: 7
