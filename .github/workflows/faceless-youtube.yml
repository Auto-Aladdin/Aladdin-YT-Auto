name: AI Short Story Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate adaptive-length story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p output .github/data

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          HISTORY_FILE = ".github/data/story_history.json"
          MIN_WORDS = 105
          MAX_WORDS = 405
          WORDS_PER_MINUTE = 135

          api_key = os.environ["GROQ_API_KEY"]
          rng = random.SystemRandom()

          story_modes = [
              "quiet human drama",
              "unexpected kindness",
              "second chance",
              "small sacrifice with a big consequence",
              "regret and reconciliation",
              "ordinary person facing an impossible choice",
              "misunderstanding that becomes meaningful",
              "quiet perseverance after failure",
              "a promise almost broken",
              "unexpected courage",
              "a small decision changing two lives",
              "an overlooked person finally being seen",
              "a lost item revealing an important truth",
              "a difficult goodbye",
              "a reunion after years apart",
              "a stranger helping at exactly the right moment",
              "a mistake leading to an unexpected opportunity",
              "quiet honesty"
          ]

          emotions = [
              "warmth",
              "hope",
              "regret",
              "relief",
              "wonder",
              "gratitude",
              "sadness turning into comfort",
              "quiet joy",
              "fear turning into courage",
              "belonging",
              "forgiveness",
              "surprise",
              "nostalgia",
              "determination",
              "compassion"
          ]

          hooks = [
              "start at the most intriguing moment",
              "start with a specific time or place",
              "start with a surprising action",
              "start with a concrete mystery",
              "start with a consequence before explaining its cause",
              "start with an unusual object and why it matters",
              "start with a promise that seems impossible",
              "start with someone making a decision they may regret"
          ]

          settings = [
              "a nearly empty bus station before sunrise",
              "a small neighborhood repair shop",
              "a rainy apartment building hallway",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a community clinic waiting room",
              "a laundromat on a cold evening",
              "a tiny apartment above a busy street",
              "a corner bakery before opening",
              "a local market just before closing",
              "a parking lot during a summer storm",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a neighborhood bus stop at midnight",
              "a small hotel lobby",
              "a mechanic's garage at closing time"
          ]

          conflicts = [
              "a missed opportunity",
              "a financial problem that must be hidden",
              "a lost item with emotional value",
              "an important message that never arrived",
              "a promise made to someone who is no longer around",
              "a difficult decision between pride and kindness",
              "a misunderstanding that risks a relationship",
              "one last attempt after repeated failure",
              "helping someone without being noticed",
              "an impossible deadline",
              "a goodbye neither person is ready for",
              "a small mistake with unexpectedly large consequences",
              "deciding whether to tell an uncomfortable truth",
              "choosing between convenience and doing what is right"
          ]

          twists = [
              "the person who seemed unimportant was the key to the solution",
              "the ignored object carried the real emotional meaning",
              "the protagonist misunderstood what the other person needed",
              "an earlier kindness quietly returns at the perfect moment",
              "the apparent failure prevents a worse outcome",
              "the person receiving help had helped the protagonist first",
              "a small sacrifice restores something much more important",
              "the final detail changes the meaning of the opening",
              "an ordinary object reveals an unexpected connection",
              "the protagonist discovers the other person planned for them too"
          ]

          endings = [
              "a quiet emotional realization",
              "a visual callback to the opening moment",
              "a brief line that changes the meaning of the story",
              "a small action instead of a speech",
              "an earned moment of relief",
              "an understated act of forgiveness",
              "a hopeful but believable final image",
              "a final detail that makes the viewer rethink the story"
          ]

          brief = {
              "mode": rng.choice(story_modes),
              "emotion": rng.choice(emotions),
              "hook": rng.choice(hooks),
              "setting": rng.choice(settings),
              "conflict": rng.choice(conflicts),
              "twist": rng.choice(twists),
              "ending": rng.choice(endings),
          }

          if os.path.exists(HISTORY_FILE):
              try:
                  with open(HISTORY_FILE, encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          previous = "\n".join(
              f"- {x.get('title','')} | {x.get('premise','')}"
              for x in history[-30:]
          ) or "NONE"

          schema = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "conflict": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "role", "visual_identity"],
                          "additionalProperties": False
                      }
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                              "visual_prompt": {"type": "string"},
                              "camera": {"type": "string"},
                              "on_screen_text": {"type": "string"},
                              "sfx": {"type": "string"}
                          },
                          "required": [
                              "scene",
                              "narration",
                              "visual_prompt",
                              "camera",
                              "on_screen_text",
                              "sfx"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "conflict",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes"
              ],
              "additionalProperties": False
          }

          prompt = f"""
          Create ONE completely original cinematic emotional/motivational story
          for a vertical YouTube Short.

          This is a REAL MINI-STORY, not a motivational poem and not a list of advice.

          Creative direction:
          - story mode: {brief['mode']}
          - primary emotion: {brief['emotion']}
          - hook style: {brief['hook']}
          - setting: {brief['setting']}
          - conflict: {brief['conflict']}
          - twist direction: {brief['twist']}
          - ending style: {brief['ending']}

          Previous channel stories:
          {previous}

          Make this clearly different from previous stories. Do not recycle a
          premise, title pattern, central object, setting, emotional beat,
          twist, or ending idea.

          LENGTH:
          Choose the natural length of the story yourself.
          Valid range: 105-405 spoken words.
          Do NOT pad the story to reach a target.
          Do NOT cut an interesting story just to make it short.

          Rough guide:
          - 105-170 words: focused short story
          - 171-250 words: deeper story
          - 251-405 words: substantial story only when the plot genuinely deserves it

          STORY:
          - immediate hook
          - specific protagonist and desire/problem
          - concrete events and choices
          - one clear conflict
          - escalating tension
          - meaningful turning point
          - earned emotional payoff
          - memorable final beat
          - natural spoken English
          - no filler

          AVOID:
          generic inspirational speeches, quote compilations, abstract
          philosophy, celebrity content, copyrighted characters, copied
          internet stories, "believe in yourself", "never give up",
          "the human spirit", "everything happens for a reason",
          "when one door closes", "follow your dreams", "little did they know",
          "in the end, it was not about", "a testament to", and calls to action.

          FACELESS VISUALS:
          Use backs, silhouettes, hands, objects, reflections, shadows,
          wide environments, close-ups, and over-the-shoulder framing.
          Do not show identifiable faces. Keep characters, clothing, props,
          locations and time of day consistent across scenes.

          SCENES:
          Create 7-18 scenes depending on story length.
          Do not assign durations. Every scene must advance the plot.
          Scene 1 contains the hook. The final scene contains the payoff.

          Return only the requested JSON.
          """

          payload = {
              "model": "openai/gpt-oss-20b",
              "messages": [{"role": "user", "content": prompt}],
              "reasoning_effort": "low",
              "include_reasoning": False,
              "temperature": 0.9,
              "max_completion_tokens": 7000,
              "response_format": {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "adaptive_short_story",
                      "strict": True,
                      "schema": schema
                  }
              }
          }

          req = urllib.request.Request(
              API_URL,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "User-Agent": "Aladdin-YT-Auto/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=180) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"HTTP ERROR: {e.code}")
              print(e.read().decode("utf-8", errors="replace"))
              raise

          content = result["choices"][0]["message"].get("content", "")
          if not content:
              raise RuntimeError("Groq returned empty content.")

          data = json.loads(content)
          scenes = data["scenes"]

          if not 7 <= len(scenes) <= 18:
              raise RuntimeError(f"Expected 7-18 scenes, got {len(scenes)}.")

          total_words = sum(
              len(s["narration"].split())
              for s in scenes
          )

          if not MIN_WORDS <= total_words <= MAX_WORDS:
              raise RuntimeError(
                  f"Story has {total_words} words; allowed range is "
                  f"{MIN_WORDS}-{MAX_WORDS}."
              )

          banned = [
              "believe in yourself",
              "never give up",
              "the human spirit",
              "everything happens for a reason",
              "when one door closes",
              "follow your dreams",
              "little did they know",
              "a testament to",
              "in the end, it was not about"
          ]

          all_text = (
              data["title"] + " " +
              data["hook"] + " " +
              data["turning_point"] + " " +
              data["payoff"] + " " +
              " ".join(s["narration"] for s in scenes)
          ).lower()

          hits = [
              phrase
              for phrase in banned
              if phrase in all_text
          ]

          if hits:
              raise RuntimeError(
                  "Overused phrase detected: " +
                  ", ".join(hits)
              )

          concrete_markers = [
              "door", "key", "letter", "phone", "train", "bus", "shop",
              "store", "school", "hospital", "wallet", "bag", "ticket",
              "box", "photo", "receipt", "car", "bike", "bench", "window",
              "coffee", "flower", "package", "umbrella", "coat", "clock",
              "watch", "ring", "book", "note", "cash", "food", "room",
              "street", "station", "restaurant", "library", "market",
              "cafe", "garage", "post office"
          ]

          concrete_hits = sum(
              1
              for marker in concrete_markers
              if marker in all_text
          )

          if concrete_hits < 3:
              raise RuntimeError(
                  "Story is too abstract; it needs more concrete events or objects."
              )

          # Estimate natural runtime from narration.
          duration = round(
              total_words / WORDS_PER_MINUTE * 60
          )

          if not 45 <= duration <= 180:
              raise RuntimeError(
                  f"Estimated duration is {duration}s; expected 45-180s."
              )

          # Allocate scene duration proportionally.
          minimum_scene_seconds = 3
          base = len(scenes) * minimum_scene_seconds

          if base > duration:
              raise RuntimeError(
                  "Too many scenes for the estimated duration."
              )

          extra_total = duration - base

          weights = [
              len(s["narration"].split())
              for s in scenes
          ]

          weight_sum = sum(weights)

          raw = [
              extra_total * weight / weight_sum
              for weight in weights
          ]

          extras = [
              int(value)
              for value in raw
          ]

          leftover = extra_total - sum(extras)

          order = sorted(
              range(len(raw)),
              key=lambda i: raw[i] - extras[i],
              reverse=True
          )

          for index in order[:leftover]:
              extras[index] += 1

          durations = [
              minimum_scene_seconds + value
              for value in extras
          ]

          for index, scene in enumerate(scenes):
              scene["scene"] = index + 1
              scene["duration_seconds"] = durations[index]

          data["story"] = " ".join(
              scene["narration"].strip()
              for scene in scenes
          )

          data["estimated_duration_seconds"] = duration
          data["word_count"] = total_words

          with open(
              "output/story.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              "output/title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data["title"])

          with open(
              "output/script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data["story"])

          with open(
              "output/description.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(data["description"])

          with open(
              "output/scenes.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  scenes,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          premise = (
              data["setting"] + " | " +
              data["conflict"] + " | " +
              data["turning_point"]
          )

          history.append({
              "title": data["title"],
              "premise": premise,
              "fingerprint": hashlib.sha256(
                  (data["title"] + "|" + premise).encode()
              ).hexdigest()[:16],
              "timestamp": int(time.time())
          })

          with open(
              HISTORY_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  history[-50:],
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("===================================")
          print("✅ STORY GENERATED")
          print("===================================")
          print("Title:", data["title"])
          print("Scenes:", len(scenes))
          print("Words:", total_words)
          print("Estimated duration:", duration, "seconds")
          print("Durations:", durations)
          print("Mode:", brief["mode"])
          print("Emotion:", brief["emotion"])
          print("===================================")
          PY

      - name: Commit story history
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update AI story history"
            git push
          fi

      - name: Upload story package
        uses: actions/upload-artifact@v4
        with:
          name: ai-short-story
          path: output/
          retention-days: 7
