name: Generate Story

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, random, time, urllib.error, urllib.request
          from pathlib import Path

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"
          HISTORY_FILE = Path(".github/data/story_history.json")

          MIN_WORDS = 105
          MAX_WORDS = 405
          WPM = 135
          MIN_SECONDS = 45
          MAX_SECONDS = 180
          MAX_ATTEMPTS = 3

          KEY = os.environ["GROQ_API_KEY"]

          MODES = [
              "quiet human drama",
              "unexpected kindness",
              "regret and reconciliation",
              "second chance",
              "ordinary person facing a costly choice",
              "misunderstanding with real consequences",
              "quiet perseverance after failure",
              "an overlooked person finally being seen",
              "a promise under pressure",
              "unexpected courage",
              "forgiveness after a mistake",
              "a practical act of care that changes a relationship",
          ]

          EMOTIONS = [
              "warmth", "relief", "regret", "gratitude", "wonder", "belonging",
              "bittersweet acceptance", "quiet joy", "determination",
              "compassion", "forgiveness", "surprise",
          ]

          SETTINGS = [
              "a small neighborhood repair shop",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a laundromat on a cold evening",
              "a corner bakery before opening",
              "a local market just before closing",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a mechanic's garage at closing time",
              "a small photography shop",
              "an apartment rooftop at sunset",
              "a public bus depot during a storm",
          ]

          CONFLICTS = [
              "a time-limited decision where helping someone costs the protagonist something concrete",
              "a valuable item is misdelivered and keeping it would solve the protagonist's immediate problem",
              "the protagonist must choose between protecting their reputation and admitting a mistake",
              "a promise conflicts with an immediate responsibility and both choices have a real cost",
              "a person needs practical help, but giving it risks losing an important opportunity",
              "the protagonist has one final chance to correct a mistake before a deadline",
              "two people have incompatible needs and the protagonist is the only person who can act",
              "the protagonist discovers information that could help them but would hurt someone they know",
              "a small professional mistake could cost the protagonist money or trust",
              "the protagonist must decide whether to return something they desperately need",
          ]

          HOOKS = [
              "open on an irreversible-looking choice already in progress",
              "open with a concrete object in the wrong place and a reason it matters",
              "open seconds before a deadline",
              "open with the protagonist about to make a decision they may regret",
              "open with a specific consequence before explaining its cause",
              "open with a small action that immediately raises a question",
              "open with a precise time and place and one abnormal detail",
          ]

          def load_history():
              try:
                  return json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
              except Exception:
                  return []

          history = load_history()
          recent = history[-40:]
          recent_text = "\n".join(
              f"- {x.get('title', '')} | {x.get('premise', '')} | {x.get('setting', '')}"
              for x in recent
          ) or "NONE"

          STORY_SCHEMA = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "protagonist": {"type": "string"},
                  "desire": {"type": "string"},
                  "stakes": {"type": "string"},
                  "conflict": {"type": "string"},
                  "choice": {"type": "string"},
                  "consequence": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"},
                          },
                          "required": ["name", "role", "visual_identity"],
                          "additionalProperties": False,
                      },
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                          },
                          "required": ["scene", "narration"],
                          "additionalProperties": False,
                      },
                  },
              },
              "required": [
                  "title", "hook", "setting", "protagonist", "desire", "stakes",
                  "conflict", "choice", "consequence", "turning_point", "payoff",
                  "description", "characters", "scenes",
              ],
              "additionalProperties": False,
          }

          CRITIC_SCHEMA = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "emotional_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "ending_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
              },
              "required": [
                  "pass", "hook_score", "originality_score", "believability_score",
                  "emotional_score", "conflict_score", "ending_score", "visual_score",
                  "issues",
              ],
              "additionalProperties": False,
          }

          def call_groq(prompt, schema, temperature=0.5, max_tokens=6000, retries=2):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": "Return only valid JSON matching the supplied schema. Do not include markdown.",
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema,
                      },
                  },
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/2.0",
                  },
                  method="POST",
              )

              last_error = None

              for attempt in range(retries + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          body = json.loads(response.read().decode("utf-8"))

                      content = body["choices"][0]["message"].get("content", "")

                      if not content:
                          raise RuntimeError("Groq returned empty content.")

                      return json.loads(content)

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"Groq HTTP {exc.code}: {raw}"
                      )

                      if exc.code in (429, 500, 502, 503, 504) and attempt < retries:
                          time.sleep(3 * (attempt + 1))
                          continue

                      raise last_error

              raise last_error or RuntimeError("Groq request failed.")

          def total_words(story):
              return sum(
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              )

          def validate_story(story):
              scene_count = len(story["scenes"])

              if not 7 <= scene_count <= 18:
                  raise RuntimeError("Story must contain 7-18 scenes.")

              count = total_words(story)

              if not MIN_WORDS <= count <= MAX_WORDS:
                  raise RuntimeError(
                      f"Story word count {count} outside {MIN_WORDS}-{MAX_WORDS}."
                  )

              numbers = [scene["scene"] for scene in story["scenes"]]

              if numbers != list(range(1, scene_count + 1)):
                  raise RuntimeError(
                      "Scene numbers must be consecutive starting at 1."
                  )

              text = json.dumps(
                  story,
                  ensure_ascii=False
              ).lower()

              banned = [
                  "believe in yourself",
                  "never give up",
                  "the human spirit",
                  "everything happens for a reason",
                  "when one door closes",
                  "follow your dreams",
                  "little did they know",
                  "the power of hope",
                  "sometimes life",
                  "in the end, it was not about",
              ]

              for phrase in banned:
                  if phrase in text:
                      raise RuntimeError(
                          f"Cliche detected: {phrase}"
                      )

              absurd = [
                  "trapped in a freezer",
                  "inside a freezer",
                  "stuck in a freezer",
                  "locked inside a freezer",
                  "magically",
                  "suddenly appeared out of nowhere",
              ]

              for phrase in absurd:
                  if phrase in text:
                      raise RuntimeError(
                          f"Implausible pattern detected: {phrase}"
                      )

              if len(story["protagonist"].split()) < 5:
                  raise RuntimeError(
                      "Protagonist description is too vague."
                  )

              if len(story["stakes"].split()) < 6:
                  raise RuntimeError(
                      "Stakes are too vague."
                  )

              if len(story["choice"].split()) < 6:
                  raise RuntimeError(
                      "Choice is too vague."
                  )

              if len(story["consequence"].split()) < 6:
                  raise RuntimeError(
                      "Consequence is too vague."
                  )

          def make_story_prompt(attempt, previous_issues):
              seed = {
                  "mode": random.choice(MODES),
                  "emotion": random.choice(EMOTIONS),
                  "setting": random.choice(SETTINGS),
                  "conflict": random.choice(CONFLICTS),
                  "hook": random.choice(HOOKS),
              }

              return f"""
          Create ONE original emotional micro-story for a faceless
          vertical YouTube Short.

          This is attempt {attempt} of {MAX_ATTEMPTS}.

          CREATIVE SEED:
          {json.dumps(seed, ensure_ascii=False)}

          RECENT CHANNEL HISTORY:
          {recent_text}

          PROBLEMS FROM THE LAST FAILED ATTEMPT:
          {json.dumps(previous_issues, ensure_ascii=False)}

          HARD STORY DESIGN RULES:

          1. The protagonist must be a specific ordinary person with a job,
             responsibility, habit, relationship, or personal history.

          2. Give them one concrete desire or problem that matters TODAY.

          3. Give the story a real external obstacle.
             The obstacle must force a meaningful choice.

          4. The choice must have a believable cost or risk.
             Avoid fake choices.

          5. Escalate through cause-and-effect:
             event -> decision -> consequence -> next decision.

          6. The turning point must be caused by something established earlier,
             not a random coincidence.

          7. The ending must resolve the central problem and emotionally
             reframe something from the beginning.

          8. Use a specific concrete object, deadline, task, or location
             to anchor the story.

          9. Avoid:
             children-in-danger,
             hospital reveals,
             terminal illness,
             anonymous benefactors,
             lottery wins,
             miraculous rescues,
             hidden fortunes,
             convenient strangers,
             weather miracles,
             missing-note revelations,
             sentimental charity twists.

          10. Avoid kite, violin, photograph, bus-station departure,
              and "stranger was secretly kind" story patterns unless
              the premise is radically unlike the common version.

          11. Do not write a moral lesson.
              Let the events create the meaning.

          12. Every scene must materially change the situation
              or reveal necessary information.

          13. The story must work with faces never shown:
              hands, backs, silhouettes, objects, reflections,
              posture, clothing, environments, and actions.

          14. No celebrities, existing characters, copied plots,
              song lyrics, or calls to action.

          15. Narration target: 105-405 words.
              Never pad.

          16. Prefer a strong 60-120 second story unless
              the plot genuinely needs more time.

          SILENT QUALITY TEST BEFORE YOU RETURN:

          - Is the opening impossible to ignore?
          - Is there a real thing the protagonist can lose?
          - Does the protagonist choose between two costly options?
          - Does the ending depend on something established earlier?
          - Would the story still feel specific if all names were removed?

          Return only the story JSON.
          """

          def make_critic_prompt(story):
              return f"""
          Act as a ruthless senior short-film editor.

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Score 0-10:

          hook
          originality
          believability
          emotional impact
          conflict
          ending
          visual potential

          PASS ONLY if every score is >= 7.

          Reject especially:

          - generic opening or "ordinary morning" setup
          - protagonist with no specific life detail
          - conflict that is only "should I help someone?"
          - choice with no meaningful cost
          - random coincidence used as the turning point
          - secret-reveal tricks with no setup
          - generic motivational language
          - melodramatic illness, charity, or child-rescue tropes
          - weak cause and effect
          - ending that merely explains the moral
          - visuals that require identifiable faces
          - similarity to recent channel stories

          Return only critic JSON with concrete issues.
          """

          best_story = None
          best_critique = None
          previous_issues = []

          for attempt in range(1, MAX_ATTEMPTS + 1):

              print("=" * 50)
              print(f"STORY ATTEMPT {attempt}/{MAX_ATTEMPTS}")
              print("=" * 50)

              story = call_groq(
                  make_story_prompt(
                      attempt,
                      previous_issues
                  ),
                  STORY_SCHEMA,
                  temperature=0.75 if attempt == 1 else 0.9,
                  max_tokens=6500,
              )

              try:
                  validate_story(story)

              except Exception as exc:
                  print(
                      "LOCAL STORY CHECK FAILED:",
                      exc
                  )

                  previous_issues = [str(exc)]
                  best_story = story
                  best_critique = {
                      "pass": False,
                      "issues": previous_issues,
                  }

                  continue

              critique = call_groq(
                  make_critic_prompt(story),
                  CRITIC_SCHEMA,
                  temperature=0.12,
                  max_tokens=2500,
              )

              print(
                  json.dumps(
                      critique,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              best_story = story
              best_critique = critique

              if critique["pass"]:
                  break

              previous_issues = critique["issues"]

              if attempt < MAX_ATTEMPTS:
                  print(
                      "Story rejected. "
                      "Generating a NEW story from scratch."
                  )

              else:
                  print(
                      "Final attempt still failed quality review."
                  )

          if (
              not best_story
              or not best_critique
              or not best_critique.get("pass")
          ):
              raise RuntimeError(
                  "No publication-ready story was produced after "
                  f"{MAX_ATTEMPTS} independent attempts. "
                  "Last issues: "
                  + json.dumps(
                      previous_issues,
                      ensure_ascii=False
                  )
              )

          # --------------------------------------------
          # DETERMINISTIC PRODUCTION METADATA
          # --------------------------------------------

          total = total_words(best_story)

          duration = max(
              MIN_SECONDS,
              min(
                  MAX_SECONDS,
                  round(total / WPM * 60)
              )
          )

          scene_count = len(best_story["scenes"])

          base_words = total // scene_count
          remainder = total % scene_count

          production_scenes = []

          for index, scene in enumerate(best_story["scenes"]):

              estimated_words = (
                  base_words
                  + (1 if index < remainder else 0)
              )

              scene_seconds = max(
                  3,
                  round(estimated_words / WPM * 60)
              )

              production_scenes.append({
                  "scene": scene["scene"],
                  "duration_seconds": scene_seconds,
                  "narration": scene["narration"],

                  "visual_prompt": (
                      "Faceless cinematic shot matching this exact narration: "
                      + scene["narration"]
                      + ". Show only believable physical actions, hands, backs, "
                        "silhouettes, objects, reflections and environment. "
                        "No identifiable faces. Realistic lighting, natural materials, "
                        "cinematic depth, physically plausible composition, vertical 9:16."
                  ),

                  "camera": (
                      "subtle physically plausible movement "
                      "matching the action"
                  ),

                  "on_screen_text": "",

                  "sfx": (
                      "natural location sound matching "
                      "the visible action"
                  ),
              })

          output = Path("story-output")
          output.mkdir(exist_ok=True)

          (output / "story.json").write_text(
              json.dumps(
                  best_story,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          (output / "quality_report.json").write_text(
              json.dumps(
                  best_critique,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          (output / "scenes.json").write_text(
              json.dumps(
                  {
                      "duration_seconds": duration,
                      "scenes": production_scenes,
                  },
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          (output / "title.txt").write_text(
              best_story["title"] + "\n",
              encoding="utf-8"
          )

          (output / "script.txt").write_text(
              " ".join(
                  s["narration"]
                  for s in best_story["scenes"]
              ) + "\n",
              encoding="utf-8"
          )

          (output / "description.txt").write_text(
              best_story["description"] + "\n",
              encoding="utf-8"
          )

          # --------------------------------------------
          # UPDATE STORY HISTORY
          # --------------------------------------------

          history.append({
              "title": best_story["title"],
              "premise": best_story["description"],
              "setting": best_story["setting"],
          })

          HISTORY_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          HISTORY_FILE.write_text(
              json.dumps(
                  history[-100:],
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("=" * 50)
          print("STORY APPROVED")
          print("=" * 50)
          print("Title:", best_story["title"])
          print("Words:", total)
          print("Estimated duration:", duration, "seconds")
          print("Scenes:", len(best_story["scenes"]))
          print(
              "Quality:",
              json.dumps(
                  best_critique,
                  ensure_ascii=False
              )
          )

          PY

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          git diff --cached --quiet || git commit -m "Update story history"
          git push

      - name: Upload story artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-story
          path: story-output/
