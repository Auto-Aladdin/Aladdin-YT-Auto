name: Daily Faceless Shorts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.2.8

      - name: Generate story, images, voice and video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import json
          import os
          import random
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # ============================================================
          # MISSION
          # ============================================================
          # One daily faceless motivational/emotional Short:
          # story -> scene image -> free TTS -> captions -> motion video
          #
          # Designed for GitHub Actions so the user's computer does not
          # need to stay online.
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          ROOT = Path(".")
          OUT = ROOT / "short-output"
          ASSETS = OUT / "assets"
          IMAGES = ASSETS / "images"
          SCENES = ASSETS / "clips"

          HISTORY_FILE = ROOT / ".github" / "data" / "story_history.json"

          API_KEY = os.environ["GROQ_API_KEY"]

          MIN_WORDS = 105
          MAX_WORDS = 230
          SCENES_MIN = 7
          SCENES_MAX = 16
          SCENE_MIN_WORDS = 10
          SCENE_MAX_WORDS = 32
          TARGET_SCENE_MIN_WORDS = 17
          TARGET_SCENE_MAX_WORDS = 21

          HTTP_TIMEOUT = 45
          MAX_RETRIES = 2
          MAX_STORY_CALLS = 1  # kept for configuration compatibility; no repair call is used
          MIN_GAP = 1.0

          IMAGE_WIDTH = 768
          IMAGE_HEIGHT = 1365
          VIDEO_WIDTH = 1080
          VIDEO_HEIGHT = 1920
          FPS = 30

          # ------------------------------------------------------------
          # Story controls — designed for varied, youthful, broadly appealing animated entertainment.
          # ------------------------------------------------------------

          DOMAINS = [
              "young friends trying to solve an unexpected problem",
              "older sibling helping a younger sibling through a strange situation",
              "first-job pressure and an unexpected opportunity",
              "roommates dealing with a surprising discovery",
              "young creator trying to finish something important before it goes wrong",
              "small neighborhood mystery with a personal connection",
              "friendship tested by a clever mistake",
              "young person protecting something that matters to someone else",
              "ordinary day interrupted by an unusual challenge",
              "small business run by a young adult facing an unexpected problem",
              "quiet rivalry that turns into an unexpected partnership",
              "young person making a risky but understandable choice",
          ]

          SETTINGS = [
              "small apartment with a cluttered work desk",
              "busy neighborhood street after school or work",
              "tiny animation or design studio",
              "back room of a family shop",
              "community sports court",
              "small repair garage",
              "local bookstore with a hidden back room",
              "rooftop workspace in a dense neighborhood",
              "modest music practice room",
              "small cafe kitchen before opening",
              "shared workshop filled with tools and unfinished projects",
              "quiet apartment hallway late in the evening",
          ]

          EMOTIONS = [
              "curiosity",
              "surprise",
              "playful tension",
              "quiet bravery",
              "relief",
              "unexpected friendship",
              "earned trust",
              "wonder",
              "clever satisfaction",
              "warm humor",
          ]

          BANNED = [
              "supernatural",
              "miracle",
              "miraculous",
              "destiny",
              "fate",
              "hospital",
              "terminal illness",
              "child in danger",
              "lottery",
              "hidden fortune",
              "benefactor",
              "anonymous donor",
              "bonus",
              "promotion",
              "applause",
              "thank-you note",
              "elevator",
              "blackout",
              "concert",
              "audition",
              "train platform",
              "coffee shop",
              "ticking clock",
              "glowing object",
              "red ribbon",
              "random stranger",
              "reverie",
              "poignant",
              "tentative",
              "fragile peace",
              "scars remain",
              "healing",
              "silent apology",
              "unspoken pain",
              "haunting memory",
              "life lesson",
              "lesson in",
              "moral of the story",
          ]

          def run_cmd(args, timeout=120, capture=True):
              p = subprocess.run(
                  args,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
                  timeout=timeout,
                  check=False,
              )
              if p.returncode != 0:
                  raise RuntimeError(
                      f"Command failed ({p.returncode}): {' '.join(args)}\n"
                      f"{p.stdout[-4000:] if p.stdout else ''}"
                  )
              return p.stdout or ""

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()
          recent = history[-20:]
          recent_text = "\n".join(
              f"- {x.get('title','')} | {x.get('premise','')} | {x.get('setting','')}"
              for x in recent
          ) or "NONE"

          last_call = 0.0

          STORY_SCHEMA = {
              "name": "publication_story",
              "schema": {
                  "type": "object",
                  "properties": {
                      "title": {"type": "string"},
                      "hook": {"type": "string"},
                      "description": {"type": "string"},
                      "protagonist": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "age": {"type": "integer"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"}
                          },
                          "required": ["name", "age", "role", "visual_identity"],
                          "additionalProperties": False
                      },
                      "setting": {"type": "string"},
                      "scenes": {
                          "type": "array",
                          # Scene count is intentionally NOT constrained here.
                          # Groq must return the complete JSON object first; our
                          # deterministic validator applies the adaptive scene-count
                          # rule afterward. This prevents schema-level HTTP 400 errors
                          # when the model naturally produces a few more scenes.
                          "items": {
                              "type": "object",
                              "properties": {
                                  "scene": {"type": "integer"},
                                  "narration": {"type": "string"},
                                  "visual_prompt": {"type": "string"}
                              },
                              "required": ["scene", "narration", "visual_prompt"],
                              "additionalProperties": False
                          }
                      }
                  },
                  "required": ["title", "hook", "description", "protagonist", "setting", "scenes"],
                  "additionalProperties": False
              }
          }

          def groq_json(prompt, max_tokens=2000, temperature=0.55, label="groq", response_schema=None):
              global last_call

              gap = time.monotonic() - last_call
              if gap < MIN_GAP:
                  time.sleep(MIN_GAP - gap)

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return ONLY one valid JSON object. "
                              "Never return markdown. Never return a top-level array. "
                              "No commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": (
                      {
                          "type": "json_schema",
                          "json_schema": {
                              "name": response_schema["name"],
                              "strict": True,
                              "schema": response_schema["schema"],
                          },
                      }
                      if response_schema
                      else {"type": "json_object"}
                  ),
              }

              for attempt in range(1, MAX_RETRIES + 1):
                  last_call = time.monotonic()

                  print(
                      f"[Groq] {label} attempt {attempt}/{MAX_RETRIES}",
                      flush=True,
                  )

                  req = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V1",
                      },
                      method="POST",
                  )

                  started = time.monotonic()

                  try:
                      with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                          data = json.loads(r.read().decode("utf-8"))

                      content = data["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")

                      try:
                          obj = json.loads(content)
                      except json.JSONDecodeError as exc:
                          raise RuntimeError(f"Groq returned invalid JSON: {exc}") from exc

                      if isinstance(obj, list) and len(obj) == 1 and isinstance(obj[0], dict):
                          obj = obj[0]

                      if not isinstance(obj, dict):
                          raise RuntimeError(
                              f"{label} must return a JSON object, got {type(obj).__name__}"
                          )

                      print(
                          f"[Groq] {label} success in {time.monotonic()-started:.2f}s",
                          flush=True,
                      )
                      return obj

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      elapsed = time.monotonic() - started
                      print(
                          f"[Groq] HTTP {exc.code} {label} after {elapsed:.2f}s",
                          flush=True,
                      )

                      if exc.code == 429:
                          low = raw.lower()
                          if "tokens per day" in low or "(tpd)" in low:
                              raise RuntimeError(
                                  "Groq daily token limit reached. "
                                  "Wait for the quota reset before rerunning.\n"
                                  + raw
                              ) from exc

                          if attempt < MAX_RETRIES:
                              time.sleep(2.0 * attempt)
                              continue

                      if exc.code in (408, 409, 425, 500, 502, 503, 504) and attempt < MAX_RETRIES:
                          time.sleep(2.0 * attempt)
                          continue

                      raise RuntimeError(f"Groq HTTP {exc.code}: {raw}") from exc

          def banned(text):
              lower = text.lower()
              for phrase in BANNED:
                  if phrase in lower:
                      return phrase
              return None

          def words(text):
              return len(str(text).split())

          def normalize_one_sentence(text):
              """Turn accidental multi-sentence narration into one spoken sentence locally.
              This avoids spending a second Groq call on punctuation-only repairs.
              """
              value = re.sub(r"\s+", " ", str(text).strip())
              if not value:
                  return ""

              # Protect common abbreviations so "Mr. Lee" is never split as two sentences.
              protected = re.sub(
                  r"\b(?:Mr|Mrs|Ms|Dr|St|Prof|Sr|Jr|vs|e\.g|i\.e)\.",
                  lambda m: m.group(0).replace(".", "<DOT>"),
                  value,
                  flags=re.IGNORECASE,
              )

              # Normalize common sentence-ending punctuation in the middle of the narration.
              parts = re.split(r"(?<=[.!?])\s+", protected)
              parts = [p.replace("<DOT>", ".") for p in parts]
              parts = [p.strip() for p in parts if p.strip()]
              if len(parts) <= 1:
                  return value

              merged = parts[0].rstrip(".!?")
              for part in parts[1:]:
                  clean = part.strip()
                  if not clean:
                      continue
                  if merged.endswith(","):
                      merged += " " + clean[0].lower() + clean[1:]
                  else:
                      merged += ", then " + clean[0].lower() + clean[1:]
              return merged.rstrip(".!?") + "."

          def validate_story(story):
              """Hard validation only for structural/runtime safety.
              Creative style issues must not consume extra Groq calls.
              """
              if not isinstance(story, dict):
                  return "Story is not an object."

              required = [
                  "title", "hook", "description", "protagonist",
                  "setting", "scenes"
              ]
              for k in required:
                  if k not in story:
                      return f"Missing field: {k}"

              protagonist = story["protagonist"]
              if not isinstance(protagonist, dict):
                  return "Protagonist must be an object."

              if not str(protagonist.get("name", "")).strip():
                  return "Missing protagonist name."

              try:
                  age = int(protagonist.get("age"))
              except Exception:
                  return "Invalid protagonist age."

              if not 16 <= age <= 45:
                  return "Protagonist age must be 16-45."

              if len(str(protagonist.get("role", "")).split()) < 2:
                  return "Protagonist role needs at least 2 words."

              scenes = story["scenes"]
              if not isinstance(scenes, list):
                  return "Scenes must be an array."

              if not (SCENES_MIN <= len(scenes) <= SCENES_MAX):
                  return f"Story must contain {SCENES_MIN}-{SCENES_MAX} scenes; got {len(scenes)}."

              total = 0
              for i, scene in enumerate(scenes, 1):
                  if not isinstance(scene, dict):
                      return f"Scene {i} is not an object."
                  narration = str(scene.get("narration", "")).strip()
                  visual = str(scene.get("visual_prompt", "")).strip()
                  if not narration:
                      return f"Scene {i} narration is empty."
                  if len(narration.split()) < SCENE_MIN_WORDS or len(narration.split()) > SCENE_MAX_WORDS:
                      return f"Scene {i} narration is outside the safe 10-32 word range."
                  if len(visual.split()) < 8:
                      return f"Scene {i} visual prompt is too short."
                  total += len(narration.split())

              if total < MIN_WORDS or total > MAX_WORDS:
                  return f"Story total length {total} is outside the safe {MIN_WORDS}-{MAX_WORDS} word range."

              if len(str(story["hook"]).split()) < 8:
                  return "Hook is too short."

              return None

          def create_story():
              prompt = f"""
                    Create ONE original stylized 3D animated YouTube Short package designed for strong viewer retention.

                    CORE MISSION — ENTERTAINMENT FIRST
                    - Make this feel like a tiny animated movie compressed into 35-70 seconds.
                    - The first seconds must create a strong "wait, what is happening?" reaction.
                    - The viewer should want the next scene before the current scene finishes.
                    - Build the story around curiosity, action, escalation, surprise, humor, emotion, cleverness, or a visually memorable problem.
                    - Do NOT write a generic motivational story, workplace anecdote, school essay, moral lesson, or narrated slideshow.
                    - The story may be funny, mysterious, adventurous, heartwarming, tense-but-safe, absurd, clever, or emotionally surprising.
                    - Use heightened animated-world logic when useful: unusual inventions, strange discoveries, visual gags, impossible-looking situations with an understandable internal logic, or clever twists.
                    - Do not become preschool-like, nursery-like, babyish, or overly cute; target teens, young adults, adults, and older viewers.

                    VIRAL-STYLE RETENTION PRINCIPLES
                    - Hook with a specific character, visible action, and an unanswered question or immediate problem.
                    - Give the viewer a clear reason to keep watching within the first sentence and first visual.
                    - Introduce one central mystery, challenge, object, secret, goal, or situation that the viewer can track.
                    - Escalate every 1-2 scenes: something changes, gets harder, becomes stranger, or reveals new information.
                    - Include at least one genuine surprise or reframe that changes what the viewer thought was happening.
                    - End with a satisfying payoff that directly connects to the opening setup.
                    - Prefer endings that make the viewer smile, gasp, laugh, feel something, or immediately want to replay the Short.
                    - Never rely on "wait for the end" wording, clickbait claims, or a fake cliffhanger with no payoff.
                    - Do not explain the moral; make the audience feel the meaning through the events.

                    OPENING — SCENE 1 MUST SELL THE VIDEO
                    - Start in the middle of an interesting action, not with background exposition.
                    - Sentence 1 must naturally identify the protagonist by name, show what they are physically doing, and reveal the unusual problem, discovery, risk, or strange situation in the same sentence.
                    - The first visual must show the same instant described by Sentence 1.
                    - Make the hook concrete enough to understand even with the sound muted.
                    - Avoid generic openings such as "Maya was having a normal day" or long descriptions of weather, buildings, rooms, or feelings.
                    - Example style only: "Ellina was repairing the old delivery robot when it suddenly locked the door behind her."
                    - Do not reuse the example or the same opening pattern every time.

                    STORY ENGINE
                    - Build a simple causal chain: hook -> immediate goal/question -> obstacle -> escalation -> harder choice -> consequence -> reveal/payoff.
                    - Keep one primary protagonist and one or two important supporting characters maximum.
                    - Give the protagonist a concrete goal that matters visually and emotionally.
                    - Make the obstacle active, not merely descriptive.
                    - Every scene must change the situation.
                    - Avoid technical exposition that makes the viewer stop caring about the characters.
                    - If technology, mystery, science, fantasy, or an invention appears, explain only what the viewer needs to understand the action.
                    - Do not introduce many unrelated objects, characters, clues, or locations.
                    - The viewer must be able to retell the whole story in 2-3 simple sentences after one listen.

                    CHARACTER BIBLE — LOCK THIS BEFORE WRITING SCENES
                    - Give the protagonist a memorable visual identity that can be recognized from silhouette and clothing alone.
                    - Specify: approximate age, body build, hairstyle, hair color, skin tone, clothing colors, one distinctive garment/accessory, and one recognizable prop when appropriate.
                    - Keep these details identical in every scene unless the plot explicitly changes them.
                    - Supporting characters must also have stable visual identities.
                    - Never invent a new hairstyle, outfit color, accessory, body type, or age in later scenes.

                    LANGUAGE
                    - Use simple international English with concrete verbs and short natural phrasing.
                    - Each narration must be exactly ONE natural spoken sentence.
                    - Do not use semicolons or em dashes inside narration.
                    - Avoid fancy literary wording, vague metaphors, abstract exposition, or inspirational speech.
                    - Avoid words like reverie, tentative, poignant, destiny, fate, healing, fragile, etc.

                    VISUAL-FIRST STORYTELLING
                    - The story must still make sense if the viewer hears only half the narration.
                    - Every scene should have a clear visible action, object interaction, spatial relationship, or visual consequence.
                    - Prefer visual beats such as opening, grabbing, hiding, dropping, chasing, building, breaking, revealing, swapping, escaping, discovering, catching, choosing, or reacting.
                    - Do not make a scene depend on a sentence explaining something that cannot be seen.

                    VISUAL STYLE
                    - Premium stylized 3D animated feature-film look, original and distinctive.
                    - Modern, cinematic, polished, appealing to teens and adults; not preschool, not chibi, not photorealistic.
                    - Strong silhouettes, attractive proportions, believable stylized anatomy, rich cinematic lighting, atmospheric depth, controlled color palette, expressive posing, and clear visual hierarchy.
                    - Faces may be visible when useful; use expressive but natural animation-style faces, and keep facial features consistent across scenes.
                    - Never imitate a specific studio, franchise, or copyrighted character design.

                    CREATIVE SEEDS
                    Domain: {random.choice(DOMAINS)}
                    Setting: {random.choice(SETTINGS)}
                    Emotion/Tone: {random.choice(EMOTIONS)}

                    RECENT HISTORY
                    {recent_text}

                    Return exactly this top-level JSON object:

                    {{
                      "title": "short memorable title, 2-8 words",
                      "hook": "10-24 word opening that creates immediate curiosity",
                      "description": "2-3 natural sentences for the YouTube description",
                      "protagonist": {{
                        "name": "specific character name",
                        "age": 16,
                        "role": "specific role or situation with at least two words",
                        "visual_identity": "stable appearance, clothing, colors, hairstyle, accessories and recognizable prop"
                      }},
                      "setting": "specific physical setting",
                      "scenes": [
                        {{
                          "scene": 1,
                          "narration": "12-26 spoken words",
                          "visual_prompt": "high-detail cinematic 3D animation frame prompt with exact action, characters, environment, composition, lighting, camera, continuity and visual storytelling"
                        }}
                      ]
                    }}

                    SCENE REQUIREMENTS
                    - Use 7-16 scenes, choosing the count that naturally fits the story.
                    - Target roughly 17-21 words per scene when practical, while respecting the hard 12-26 range and 170-230 total-word range.
                    - Scene 1 is the strongest hook and must show the opening event directly.
                    - Scene 2 deepens the problem or adds an immediate complication.
                    - Scene 3 makes the goal, mystery, or stakes unmistakable.
                    - Middle scenes escalate or reveal something new; do not merely describe travel or waiting.
                    - At least one scene must contain a genuine surprise, reversal, clever reveal, or unexpected visual consequence.
                    - Final scenes must pay off the opening setup in a satisfying way.
                    - No filler scenes and no repetitive beats.

                    IMAGE-PROMPT REQUIREMENTS FOR EVERY SCENE
                    - Each visual_prompt must describe ONE frozen moment, not a sequence of multiple actions.
                    - State exactly WHO is doing WHAT, WHERE they are, WHAT important object is involved, and WHAT just happened or is about to happen.
                    - Specify camera framing and composition: close-up, medium shot, wide shot, over-the-shoulder, low angle, top-down, etc.
                    - Keep the protagonist and supporting characters visually consistent with the character bible.
                    - Do not invent extra people or replace the protagonist with another character.
                    - The image must visually match the narration exactly; never show a different action from the spoken sentence.
                    - Prefer dynamic composition, depth, foreground/background separation, strong silhouette, and one clear visual focal point.
                    - Avoid scenes that are just "character standing in room" unless the standing pose itself is visually important.

                    STORY REQUIREMENTS
                    - One clear protagonist.
                    - No more than two important supporting characters.
                    - One central goal, mystery, object, challenge, or question.
                    - One active obstacle that escalates.
                    - At least one surprise/reveal.
                    - One meaningful choice with a consequence.
                    - A satisfying final payoff connected to the opening.
                    - No deus-ex-machina rescue, unexplained coincidence, sudden rich reward, or random stranger solving the story.
                    - No graphic violence, sexual content, extreme fear, or disturbing imagery.

                    AVOID
                    - Generic motivational speeches.
                    - Generic office/workplace stories unless the premise is highly unusual.
                    - Routine repair or shopping stories unless they contain a strong mystery, funny complication, or twist.
                    - Hospital or terminal-illness plots.
                    - Children in danger.
                    - Lottery, hidden fortune, anonymous benefactor, surprise money.
                    - Romance as the main engine.
                    - Repeating the same setting, opening structure, object, or twist from RECENT HISTORY.

                    Do NOT mention these instructions in the JSON.
                    """

              story = groq_json(
                  prompt,
                  max_tokens=2800,
                  temperature=0.65,
                  label="story-1",
                  response_schema=STORY_SCHEMA,
              )

              # Local deterministic cleanup: remove punctuation-only fragmentation
              # without consuming another Groq request.
              for scene in story.get("scenes", []):
                  scene["narration"] = normalize_one_sentence(scene.get("narration", ""))

              issue = validate_story(story)
              if issue:
                  raise RuntimeError(f"Generated story failed structural validation: {issue}")

              return story

          story = create_story()

          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)
          IMAGES.mkdir(parents=True, exist_ok=True)
          SCENES.mkdir(parents=True, exist_ok=True)

          (OUT / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          script = "\n".join(
              scene["narration"] for scene in story["scenes"]
          ).strip() + "\n"

          (OUT / "script.txt").write_text(script, encoding="utf-8")
          (OUT / "title.txt").write_text(story["title"] + "\n", encoding="utf-8")
          (OUT / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # FREE TTS: edge-tts
          # ============================================================

          voice = "en-US-AvaNeural"

          run_cmd([
              sys.executable,
              "-m",
              "edge_tts",
              "--voice",
              voice,
              "--rate",
              "+2%",
              "--text",
              script,
              "--write-media",
              str(OUT / "voice.mp3"),
              "--write-subtitles",
              str(OUT / "captions.srt"),
          ], timeout=180)

          # ============================================================
          # AI IMAGES: Pollinations authenticated API
          # Primary model: FLUX (Pollinations model id: flux)
          # Stylized 3D animation frames are animated with FFmpeg camera motion.
          # ============================================================

          POLLINATIONS_KEY = os.environ.get("POLLINATIONS_API_KEY", "").strip()
          if not POLLINATIONS_KEY:
              raise RuntimeError(
                  "Missing POLLINATIONS_API_KEY GitHub secret. "
                  "Add the secret before running the workflow."
              )

          POLLINATIONS_BASE = "https://gen.pollinations.ai/image/"

          def download_image(url, path, timeout=120):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "Authorization": f"Bearer {POLLINATIONS_KEY}",
                              "User-Agent": "Aladdin-YT-Auto/ShortsFactory-V3",
                              "Accept": "image/png,image/jpeg,image/webp,image/*",
                          },
                          method="GET",
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                          content_type = (r.headers.get("Content-Type") or "").lower()

                      if len(data) < 10000:
                          raise RuntimeError(
                              f"Image response for {path.name} is suspiciously small ({len(data)} bytes)."
                          )

                      valid_magic = (
                          data.startswith(b"\x89PNG")
                          or data.startswith(b"\xff\xd8")
                          or data.startswith(b"RIFF")
                      )
                      if "image" not in content_type and not valid_magic:
                          preview = data[:160].decode("utf-8", errors="replace")
                          raise RuntimeError(
                              f"Image response for {path.name} is not an image "
                              f"(Content-Type: {content_type}, body starts: {preview!r})."
                          )

                      path.write_bytes(data)
                      print(
                          f"[image] saved {path.name} ({len(data)/1024:.1f} KiB)",
                          flush=True,
                      )
                      return

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      last_error = RuntimeError(
                          f"HTTP {exc.code}: {raw[:1200]}"
                      )
                      print(
                          f"[image] attempt {attempt}/3 HTTP {exc.code} for {path.name}",
                          flush=True,
                      )
                  except Exception as exc:
                      last_error = exc
                      print(
                          f"[image] attempt {attempt}/3 failed for {path.name}: {exc}",
                          flush=True,
                      )

                  if attempt < 3:
                      time.sleep(2 * attempt)

              raise RuntimeError(
                  f"Pollinations image generation failed for {path.name}: {last_error}"
              )

          for index, scene in enumerate(story["scenes"], 1):
              output = IMAGES / f"scene_{index:02d}.png"
              protagonist = story["protagonist"]
              visual_anchor = (
                  f"LOCKED CHARACTER BIBLE: {protagonist['name']}, age {protagonist['age']}, "
                  f"role {protagonist['role']}, visual identity {protagonist['visual_identity']}. "
                  "Preserve the exact same age, body build, hairstyle, hair color, skin tone, clothing colors, "
                  "distinctive accessory and recognizable prop in every scene. "
              )
              prompt = (
                  "ONE FROZEN MOMENT ONLY. Match the narration and visual_prompt exactly. "
                  + visual_anchor
                  + "Scene action: " + scene["narration"] + " Visual direction: " + scene["visual_prompt"]
                  + ". Premium original stylized 3D animated feature-film frame, vertical 9:16, "
                    "dynamic cinematic composition, strong foreground-midground-background depth, clear focal point, "
                    "appealing modern character design, coherent stylized anatomy, correct head-neck-spine alignment, "
                    "natural hands and fingers, believable joints, correct limb count, physically coherent body orientation, "
                    "consistent facial features when the face is visible, consistent clothing and accessories, "
                    "expressive but natural pose, cinematic key light and rim light, atmospheric depth, polished materials, "
                    "rich controlled color palette, no random extra characters, no character replacement, "
                    "no duplicated objects, no twisted neck, no broken anatomy, no fused limbs, no extra fingers, "
                    "no deformed hands, no impossible pose, no text, no captions, no logos, no watermark, "
                    "not photorealistic, not preschool, not chibi"
              )

              encoded = urllib.parse.quote(prompt, safe="")
              url = (
                  POLLINATIONS_BASE
                  + encoded
                  + f"?model=flux&width={IMAGE_WIDTH}&height={IMAGE_HEIGHT}"
                  + "&nologo=true"
              )

              print(f"[image] scene {index}: generating with Pollinations FLUX", flush=True)
              download_image(url, output)

          # ============================================================
          # CREATE MOTION CLIPS
          # ============================================================

          audio_duration_text = run_cmd([
              "ffprobe", "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(OUT / "voice.mp3"),
          ])

          audio_duration = float(audio_duration_text.strip())

          def parse_srt_timestamp(value):
              hh, mm, rest = value.split(":", 2)
              ss, ms = rest.split(",", 1)
              return int(hh) * 3600 + int(mm) * 60 + int(ss) + int(ms) / 1000.0

          raw_srt = (OUT / "captions.srt").read_text(encoding="utf-8")
          blocks = re.split(r"\n\s*\n", raw_srt.strip()) if raw_srt.strip() else []
          caption_items = []
          for block in blocks:
              lines = [line.strip("\ufeff") for line in block.splitlines() if line.strip()]
              if len(lines) < 3 or " --> " not in lines[1]:
                  continue
              start_text, end_text = lines[1].split(" --> ", 1)
              caption_text = " ".join(lines[2:]).strip()
              caption_items.append((parse_srt_timestamp(start_text), parse_srt_timestamp(end_text), caption_text))

          expected_scenes = len(story["scenes"])
          if len(caption_items) != expected_scenes:
              raise RuntimeError(
                  f"TTS subtitles produced {len(caption_items)} cues, but the story has "
                  f"{expected_scenes} scenes. Refusing to create mismatched scene timing."
              )

          # Use the real TTS sentence boundaries so each scene image runs while
          # its matching sentence is spoken. The next caption starts the next scene.
          scene_starts = [item[0] for item in caption_items]
          durations = []
          for i, start in enumerate(scene_starts):
              next_start = scene_starts[i + 1] if i + 1 < len(scene_starts) else audio_duration
              durations.append(max(0.05, next_start - start))

          # Normalize and rewrite the captions so the final video has exactly
          # one non-overlapping subtitle cue per scene.
          normalized_blocks = []

          def srt_time(seconds):
              millis = max(0, int(round(seconds * 1000)))
              hh = millis // 3600000
              millis %= 3600000
              mm = millis // 60000
              millis %= 60000
              ss = millis // 1000
              ms = millis % 1000
              return f"{hh:02d}:{mm:02d}:{ss:02d},{ms:03d}"

          running = 0.0
          for i, (_, _, text) in enumerate(caption_items):
              start = running
              end = running + durations[i]
              running = end
              normalized_blocks.append(
                  f"{i + 1}\n{srt_time(start)} --> {srt_time(end)}\n{text}"
              )

          (OUT / "captions.srt").write_text(
              "\n\n".join(normalized_blocks) + "\n",
              encoding="utf-8",
          )

          # Build a dedicated ASS track so subtitle size and vertical position
          # are deterministic on the 1080x1920 Shorts canvas.
          def ass_time(seconds):
              total_cs = max(0, int(round(seconds * 100)))
              hh = total_cs // 360000
              total_cs %= 360000
              mm = total_cs // 6000
              total_cs %= 6000
              ss = total_cs // 100
              cs = total_cs % 100
              return f"{hh}:{mm:02d}:{ss:02d}.{cs:02d}"

          def ass_escape(text):
              return str(text).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}").replace("\n", " ")

          ass_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "ScaledBorderAndShadow: yes",
              "WrapStyle: 0",
              "YCbCr Matrix: TV.709",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Style: Shorts,DejaVu Sans,32,&H00FFFFFF,&H00FFFFFF,&H90000000,&H70000000,0,0,0,0,100,100,0,0,3,2,0,2,80,80,210,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
          ]

          for i, (_, _, text) in enumerate(caption_items):
              start = 0.0 if i == 0 else sum(durations[:i])
              end = start + durations[i]
              ass_lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Shorts,,0,0,0,,{ass_escape(text)}"
              )

          (OUT / "captions.ass").write_text(
              "\n".join(ass_lines) + "\n",
              encoding="utf-8",
          )

          for i, (scene, duration) in enumerate(
              zip(story["scenes"], durations),
              1
          ):
              image = IMAGES / f"scene_{i:02d}.png"
              clip = SCENES / f"clip_{i:02d}.mp4"

              frames = max(1, round(duration * FPS))

              # Alternating direction prevents the whole Short from
              # looking mechanically identical.
              direction = 1 if i % 2 else -1

              zoom_expr = (
                  "min(zoom+0.0008,1.12)"
                  if direction == 1
                  else "max(zoom-0.0008,1.00)"
              )

              vf = (
                  f"scale=1200:2133,"
                  f"crop=1080:1920,"
                  f"zoompan="
                  f"z='{zoom_expr}':"
                  f"d={frames}:"
                  f"x='iw/2-(iw/zoom/2)':"
                  f"y='ih/2-(ih/zoom/2)':"
                  f"s={VIDEO_WIDTH}x{VIDEO_HEIGHT}:"
                  f"fps={FPS},"
                  f"format=yuv420p"
              )

              run_cmd([
                  "ffmpeg", "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-t", f"{duration:.3f}",
                  "-vf", vf,
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-movflags", "+faststart",
                  str(clip),
              ], timeout=120)

          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join(
                  f"file '{(SCENES / f'clip_{i:02d}.mp4').resolve()}'\n"
                  for i in range(1, len(story["scenes"]) + 1)
              ),
              encoding="utf-8",
          )

          silent_video = OUT / "video_silent.mp4"
          final_video = OUT / "final_short.mp4"

          run_cmd([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", str(concat_file),
              "-c", "copy",
              str(silent_video),
          ], timeout=180)

          # Final mux: keep the animation clean and do NOT burn captions into the video.
          # captions.srt is still generated separately for timing/debugging and can be
          # supplied to a platform later if needed.
          run_cmd([
              "ffmpeg", "-y",
              "-i", str(silent_video),
              "-i", str(OUT / "voice.mp3"),
              "-map", "0:v:0",
              "-map", "1:a:0",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "22",
              "-c:a", "aac",
              "-b:a", "192k",
              "-shortest",
              "-movflags", "+faststart",
              str(final_video),
          ], timeout=240)

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["hook"],
              "setting": story["setting"],
              "words": words(script),
              "scenes": len(story["scenes"]),
              "created_utc": time.strftime(
                  "%Y-%m-%dT%H:%M:%SZ",
                  time.gmtime(),
              ),
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-50:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60, flush=True)
          print("DAILY FACELESS SHORT READY", flush=True)
          print("=" * 60, flush=True)
          print("Title:", story["title"], flush=True)
          print("Scenes:", len(story["scenes"]), flush=True)
          print("Words:", words(script), flush=True)
          print("Voice:", voice, flush=True)
          print("Video:", final_video, flush=True)
          print("Captions: captions.srt generated; not burned into video", flush=True)
          PY

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Generate daily faceless short history"
            git push
          fi

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-faceless-short
          path: short-output/
          if-no-files-found: error
