name: Generate Story

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate publication-ready story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          # ============================================================
          # SETTINGS
          # ============================================================

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"

          HISTORY_FILE = Path(".github/data/story_history.json")
          OUTPUT_DIR = Path("story-output")

          MIN_WORDS = 105
          MAX_WORDS = 405

          WPM = 135
          MIN_DURATION = 45
          MAX_DURATION = 180

          CONCEPT_ATTEMPTS = 5
          STORY_REPAIR_ATTEMPTS = 2

          API_KEY = os.environ["GROQ_API_KEY"]

          rng = random.SystemRandom()

          # ============================================================
          # CREATIVE INPUTS
          # ============================================================

          MODES = [
              "quiet human drama",
              "regret after a practical mistake",
              "second chance earned through competence",
              "an ordinary person protecting something valuable",
              "a difficult promise under a deadline",
              "quiet reconciliation without a speech",
              "a person forced to admit they were wrong",
              "small sacrifice with a concrete consequence",
              "unexpected responsibility",
              "a private choice that changes a relationship",
          ]

          EMOTIONS = [
              "relief",
              "regret",
              "gratitude",
              "belonging",
              "quiet joy",
              "bittersweet acceptance",
              "determination",
              "compassion",
              "forgiveness",
              "surprise",
          ]

          SETTINGS = [
              "a clock repair shop ten minutes before closing",
              "a locksmith kiosk inside an old market",
              "a dry cleaner during the final pickup hour",
              "a nearly empty ferry ticket office",
              "a theater prop storage room before opening night",
              "a night security control room",
              "a community radio booth after the final broadcast",
              "a small print shop with one urgent order left",
              "a public swimming pool maintenance corridor after closing",
              "a municipal lost-and-found room",
              "a shoe repair counter in a busy station",
              "a greenhouse just before the heating system is shut off",
              "a parking garage office during the final shift",
              "an independent photo-printing shop before collection time",
              "a small apartment building maintenance room",
              "a neighborhood tailor shop before a wedding pickup",
              "a roadside weighing station during a night shift",
              "an old bookstore storeroom before inventory closes",
          ]

          CONFLICTS = [
              "the protagonist must choose between keeping a promised deadline and correcting a mistake that could hurt someone else",
              "the protagonist has access to something they urgently need, but using it would break a promise they made",
              "a professional mistake is discovered just before a deadline, and admitting it has a concrete personal cost",
              "the protagonist can protect their own reputation only by allowing someone else to take the blame",
              "the protagonist has one realistic chance to repair damage they caused, but doing so means giving up something important",
              "two legitimate responsibilities collide and the protagonist must decide which one to fail",
              "the protagonist finds evidence that changes what they believed about a past decision, but acting on it creates an immediate cost",
              "a routine task becomes urgent when a small overlooked detail threatens a real person's plans",
              "the protagonist must return something useful to them even though they genuinely need it",
              "the protagonist discovers that a shortcut they took has a consequence they can no longer ignore",
          ]

          FORBIDDEN_TROPES = [
              "love letter",
              "misdelivered recipe",
              "photograph returned to owner",
              "kite",
              "violinist",
              "bus station goodbye",
              "mysterious note",
              "child in danger",
              "hospital reveal",
              "terminal illness",
              "lottery",
              "hidden fortune",
              "secret millionaire",
              "anonymous benefactor",
              "magical coincidence",
              "stranger secretly helping",
              "promotion because of one envelope",
              "bakery recipe",
              "random charity",
              "weather miracle",
              "dream that predicts the future",
          ]

          # ============================================================
          # HISTORY
          # ============================================================

          def load_history():
              try:
                  return json.loads(
                      HISTORY_FILE.read_text(encoding="utf-8")
                  )
              except Exception:
                  return []

          history = load_history()
          recent_history = history[-12:]

          recent_rows = []
          for item in recent_history:
              title = str(item.get("title", ""))[:100]
              premise = str(item.get("premise", ""))[:220]
              setting = str(item.get("setting", ""))[:120]
              recent_rows.append(
                  f"- {title} | {premise} | {setting}"
              )

          recent_text = "\n".join(recent_rows) or "NONE"

          # ============================================================
          # SCHEMAS
          # ============================================================

          concept_schema = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "protagonist": {"type": "string"},
                  "ordinary_life_detail": {"type": "string"},
                  "concrete_goal": {"type": "string"},
                  "unique_mechanism": {"type": "string"},
                  "external_obstacle": {"type": "string"},
                  "meaningful_choice": {"type": "string"},
                  "cost_of_choice": {"type": "string"},
                  "cause_and_effect": {"type": "string"},
                  "turning_point_setup": {"type": "string"},
                  "ending_callback": {"type": "string"},
                  "visual_motif": {"type": "string"},
                  "premise": {"type": "string"},
              },
              "required": [
                  "title",
                  "protagonist",
                  "ordinary_life_detail",
                  "concrete_goal",
                  "unique_mechanism",
                  "external_obstacle",
                  "meaningful_choice",
                  "cost_of_choice",
                  "cause_and_effect",
                  "turning_point_setup",
                  "ending_callback",
                  "visual_motif",
                  "premise",
              ],
              "additionalProperties": False,
          }

          concept_critic_schema = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "payoff_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "conflict_score",
                  "payoff_score",
                  "visual_score",
                  "issues",
              ],
              "additionalProperties": False,
          }

          story_schema = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "protagonist": {"type": "string"},
                  "desire": {"type": "string"},
                  "stakes": {"type": "string"},
                  "conflict": {"type": "string"},
                  "choice": {"type": "string"},
                  "consequence": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"},
                          },
                          "required": [
                              "name",
                              "role",
                              "visual_identity",
                          ],
                          "additionalProperties": False,
                      },
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                          },
                          "required": [
                              "scene",
                              "narration",
                          ],
                          "additionalProperties": False,
                      },
                  },
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "protagonist",
                  "desire",
                  "stakes",
                  "conflict",
                  "choice",
                  "consequence",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes",
              ],
              "additionalProperties": False,
          }

          story_critic_schema = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "emotional_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "ending_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues",
              ],
              "additionalProperties": False,
          }

          # ============================================================
          # GROQ
          # ============================================================

          def call_groq(
              prompt,
              schema,
              temperature=0.5,
              max_tokens=5000,
              retries=3,
          ):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a precision creative writing engine. "
                              "Return ONLY valid JSON matching the supplied "
                              "JSON Schema. Do not use markdown."
                          ),
                      },
                      {
                          "role": "user",
                          "content": prompt,
                      },
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema,
                      },
                  },
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(
                      payload,
                      ensure_ascii=False,
                  ).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "Aladdin-YT-Auto/3.0",
                  },
                  method="POST",
              )

              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180,
                      ) as response:
                          body = json.loads(
                              response.read().decode("utf-8")
                          )

                      content = body["choices"][0]["message"].get(
                          "content",
                          "",
                      )

                      if not content:
                          raise RuntimeError(
                              "Groq returned empty content."
                          )

                      return json.loads(content)

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                      # Retry transient service/rate-limit failures.
                      if exc.code in (
                          408,
                          409,
                          429,
                          500,
                          502,
                          503,
                          504,
                      ) and attempt < retries:
                          retry_after = exc.headers.get("Retry-After")
                          try:
                              wait = max(2, int(float(retry_after)))
                          except (TypeError, ValueError):
                              wait = 2 * attempt
                          print(
                              f"Groq HTTP {exc.code}; "
                              f"retrying in {wait}s..."
                          )
                          time.sleep(wait)
                          continue

                      last_error = RuntimeError(
                          f"Groq HTTP {exc.code}: {raw}"
                      )
                      break

                  except (
                      json.JSONDecodeError,
                      KeyError,
                      RuntimeError,
                  ) as exc:
                      last_error = exc

                      if attempt < retries:
                          wait = 2 * attempt
                          print(
                              f"Groq response problem; "
                              f"retrying in {wait}s..."
                          )
                          time.sleep(wait)
                          continue

                      break

              raise last_error or RuntimeError(
                  "Groq request failed."
              )

          # ============================================================
          # LOCAL VALIDATION
          # ============================================================

          def story_word_count(story):
              return sum(
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              )

          def validate_story(story):
              scene_count = len(story["scenes"])

              if not 7 <= scene_count <= 18:
                  raise ValueError(
                      f"Scene count {scene_count} outside 7-18."
                  )

              words = story_word_count(story)

              if not MIN_WORDS <= words <= MAX_WORDS:
                  raise ValueError(
                      f"Story word count {words} outside "
                      f"{MIN_WORDS}-{MAX_WORDS}."
                  )

              expected_numbers = list(
                  range(1, scene_count + 1)
              )

              actual_numbers = [
                  scene["scene"]
                  for scene in story["scenes"]
              ]

              if actual_numbers != expected_numbers:
                  raise ValueError(
                      "Scene numbers must be consecutive "
                      "starting at 1."
                  )

              combined = json.dumps(
                  story,
                  ensure_ascii=False,
              ).lower()

              banned_phrases = [
                  "believe in yourself",
                  "never give up",
                  "the human spirit",
                  "everything happens for a reason",
                  "when one door closes",
                  "follow your dreams",
                  "little did they know",
                  "the power of hope",
                  "sometimes life",
                  "in the end, it was not about",
                  "testament to",
              ]

              for phrase in banned_phrases:
                  if phrase in combined:
                      raise ValueError(
                          f"Cliche detected: {phrase}"
                      )

              for trope in FORBIDDEN_TROPES:
                  if trope in combined:
                      raise ValueError(
                          f"Forbidden trope detected: {trope}"
                      )

              required_fields = (
                  "protagonist",
                  "desire",
                  "stakes",
                  "conflict",
                  "choice",
                  "consequence",
                  "turning_point",
                  "payoff",
              )

              for field in required_fields:
                  if len(story[field].split()) < 7:
                      raise ValueError(
                          f"{field} is too vague."
                      )

          # ============================================================
          # PROMPTS
          # ============================================================

          def concept_prompt(attempt, previous_issues):
              seed = {
                  "mode": rng.choice(MODES),
                  "emotion": rng.choice(EMOTIONS),
                  "setting": rng.choice(SETTINGS),
                  "conflict_seed": rng.choice(CONFLICTS),
              }

              return f"""
          Design ONE genuinely distinctive short-film premise for a
          faceless emotional YouTube Short.

          THIS IS CONCEPT ATTEMPT {attempt}.

          CREATIVE SEED:
          {json.dumps(seed, ensure_ascii=False)}

          RECENT CHANNEL HISTORY:
          {recent_text}

          PREVIOUS FAILURE NOTES:
          {json.dumps(previous_issues, ensure_ascii=False)}

          DO NOT COPY OR LIGHTLY REMIX ANY RECENT STORY.

          FORBIDDEN TROPE LIST:
          {json.dumps(FORBIDDEN_TROPES, ensure_ascii=False)}

          The concept must satisfy ALL of these:

          1. The protagonist is an ordinary adult with a specific job,
             responsibility, habit, skill, or relationship.

          2. Give the protagonist a concrete goal that matters today.

          3. The external obstacle must be practical and believable.

          4. The protagonist must choose between two options where
             BOTH have a real cost.

          5. The choice must create a concrete consequence.

          6. The turning point must use information, an object, action,
             deadline, or relationship established earlier.

          7. The ending must resolve the central problem AND reinterpret
             an earlier detail.

          8. Include ONE distinctive mechanism or situation that would
             not naturally appear in a generic AI motivational story.

          9. Avoid romance-first plots unless romance is only a small
             consequence of the main conflict.

          10. Avoid letters, recipes, kites, violins, photographs,
              mysterious notes, surprise money, charity rescues,
              hospital twists, secret benefactors, and "stranger
              was secretly kind" structures.

          11. The story must be highly filmable without identifiable faces.

          12. The visual motif should be a concrete object, repeated action,
              texture, machine, workspace, or environment.

          13. Do not use a moral sentence as the ending.

          14. The premise must be strong enough to explain in one sentence
              and still make someone curious.

          Return ONLY the concept JSON.
          """

          def concept_critic_prompt(concept):
              return f"""
          You are a ruthless development editor.

          Evaluate this proposed short-film concept:

          {json.dumps(concept, ensure_ascii=False)}

          PASS ONLY if EVERY score is >= 8.

          Check:

          - Does the premise create immediate curiosity?
          - Is it genuinely different from common AI emotional stories?
          - Is the protagonist specific?
          - Is the conflict externally real?
          - Does the choice have a meaningful cost?
          - Is the situation believable?
          - Is the turning point seeded by earlier information?
          - Does the ending have a strong callback?
          - Is there a distinctive visual motif?
          - Could this become a compelling 60-120 second short?

          Be especially harsh about:
          love letters,
          recipes,
          returning photographs,
          helping strangers,
          children in danger,
          hospitals,
          secret wealth,
          anonymous kindness,
          promotion/reward reveals,
          random coincidences,
          convenient objects,
          and "do the right thing" morals.

          Return ONLY critic JSON.
          """

          def story_prompt(concept):
              return f"""
          Write the final narration of a faceless cinematic YouTube Short
          from this APPROVED CONCEPT.

          APPROVED CONCEPT:
          {json.dumps(concept, ensure_ascii=False)}

          RECENT CHANNEL HISTORY:
          {recent_text}

          The concept is the source of truth.
          Do NOT replace its central mechanism with a common trope.

          STORY REQUIREMENTS:

          - 105-405 spoken words.
          - Prefer 140-260 words when the plot allows.
          - 7-18 scenes.
          - Strong first sentence with immediate specificity.
          - Introduce the protagonist through a concrete action or detail.
          - Make the problem visible quickly.
          - Escalate through cause and effect.
          - Give the protagonist a real choice with a real cost.
          - Make the turning point depend on something established earlier.
          - Resolve the central problem.
          - End with a concrete image, action, or short line.
          - Never explain the lesson.
          - Never add a random reveal.
          - Never add illness, charity, secret wealth, child rescue,
            mysterious notes, love letters, recipes, kites, violins,
            returned photographs, anonymous benefactors, or magical luck.
          - Every scene must change the situation or reveal necessary information.
          - Faces must never be necessary. Use hands, backs, silhouettes,
            objects, reflections, clothing, posture, tools, spaces, and actions.
          - No celebrity, existing fictional character, copied plot,
            song lyric, or call to action.

          Return ONLY story JSON.
          """

          def story_critic_prompt(story, concept):
              return f"""
          You are the final publication editor for a premium faceless
          emotional YouTube Shorts channel.

          CONCEPT:
          {json.dumps(concept, ensure_ascii=False)}

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Score 0-10:

          hook
          originality
          believability
          emotional impact
          conflict
          ending
          visual potential

          PASS ONLY if ALL seven scores are >= 7.

          Reject if ANY of these are true:

          - generic hand-reaching/opening
          - vague protagonist
          - vague or artificial stakes
          - simple "help someone or be selfish" dilemma
          - no meaningful personal cost
          - random coincidence
          - unexplained logistical behavior
          - predictable moral
          - generic motivational prose
          - emotional payoff disconnected from setup
          - ending merely praises the protagonist
          - visual plan would look like generic stock footage
          - the concept was weakened during writing
          - any forbidden trope appears
          - story is significantly similar to recent channel stories

          Give concrete issues that a story editor can act on.

          Return ONLY critic JSON.
          """

          def repair_prompt(story, critique, concept):
              return f"""
          You are rewriting a story that failed a professional final review.

          APPROVED CONCEPT:
          {json.dumps(concept, ensure_ascii=False)}

          FAILED STORY:
          {json.dumps(story, ensure_ascii=False)}

          CRITIC ISSUES:
          {json.dumps(critique["issues"], ensure_ascii=False)}

          IMPORTANT:

          1. Preserve the approved concept's distinctive mechanism.
          2. Fix the actual structural problems, not just wording.
          3. If the critic says hook/originality/conflict is weak,
             rebuild the opening or the conflict substantially.
          4. Strengthen the protagonist's concrete personal stakes.
          5. Make the choice costly on both sides.
          6. Make every major event cause the next one.
          7. Seed the turning point earlier.
          8. Make the ending pay off a concrete detail from the opening.
          9. Do NOT add a new cliché subplot.
          10. Do NOT add a moral speech.
          11. Do NOT add random charity, illness, secret wealth,
              children in danger, mysterious notes, love letters,
              recipes, kites, violins, returned photographs,
              anonymous benefactors, or convenient strangers.
          12. Keep the story faceless and physically believable.
          13. Keep narration between 105 and 405 words.
          14. 7-18 scenes.

          Return ONLY corrected story JSON.
          """

          # ============================================================
          # MAIN CREATIVE LOOP
          # ============================================================

          best_story = None
          best_concept = None
          best_critique = None
          best_total_score = -1

          previous_issues = []

          for concept_attempt in range(
              1,
              CONCEPT_ATTEMPTS + 1,
          ):
              print("=" * 60)
              print(
                  f"CONCEPT ATTEMPT "
                  f"{concept_attempt}/{CONCEPT_ATTEMPTS}"
              )
              print("=" * 60)

              concept = call_groq(
                  concept_prompt(
                      concept_attempt,
                      previous_issues,
                  ),
                  concept_schema,
                  temperature=0.85,
                  max_tokens=3200,
              )

              concept_critique = call_groq(
                  concept_critic_prompt(concept),
                  concept_critic_schema,
                  temperature=0.15,
                  max_tokens=1800,
              )

              print(
                  json.dumps(
                      concept_critique,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

              if not concept_critique["pass"]:
                  previous_issues = concept_critique["issues"]
                  continue

              # --------------------------------------------------------
              # TURN THE APPROVED CONCEPT INTO A STORY
              # --------------------------------------------------------

              story = None

              for story_attempt in range(
                  1,
                  STORY_REPAIR_ATTEMPTS + 2,
              ):
                  print(
                      f"STORY BUILD ATTEMPT "
                      f"{story_attempt}/{STORY_REPAIR_ATTEMPTS + 1}"
                  )

                  try:
                      story = call_groq(
                          story_prompt(concept),
                          story_schema,
                          temperature=0.65,
                          max_tokens=5000,
                      )

                      # A short response is a recoverable drafting problem.
                      # Do not burn a concept attempt just because of word count.
                      if story_word_count(story) < MIN_WORDS:
                          short_story_prompt = f"""
          The following story is structurally good but too short.

          CONCEPT:
          {json.dumps(concept, ensure_ascii=False)}

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Expand it naturally to 140-260 spoken words.

          Add only useful material:
          - concrete actions,
          - necessary setup,
          - visible consequences,
          - character reaction,
          - stronger transition into the turning point,
          - stronger earned payoff.

          Do NOT add filler, philosophy, speeches,
          or a new subplot.

          Return ONLY corrected story JSON.
          """

                          story = call_groq(
                              short_story_prompt,
                              story_schema,
                              temperature=0.4,
                              max_tokens=4200,
                          )

                      validate_story(story)

                  except (
                      ValueError,
                      RuntimeError,
                  ) as exc:
                      print(
                          "STORY BUILD CHECK FAILED:",
                          exc,
                      )

                      if story is None:
                          continue

                      continue

                  critique = call_groq(
                      story_critic_prompt(
                          story,
                          concept,
                      ),
                      story_critic_schema,
                      temperature=0.12,
                      max_tokens=2200,
                  )

                  print(
                      json.dumps(
                          critique,
                          ensure_ascii=False,
                          indent=2,
                      )
                  )

                  score = (
                      critique["hook_score"]
                      + critique["originality_score"]
                      + critique["believability_score"]
                      + critique["emotional_score"]
                      + critique["conflict_score"]
                      + critique["ending_score"]
                      + critique["visual_score"]
                  )

                  if score > best_total_score:
                      best_total_score = score
                      best_story = story
                      best_concept = concept
                      best_critique = critique

                  if critique["pass"]:
                      break

                  # Repair ONLY after the critic has identified
                  # concrete problems.
                  repaired = call_groq(
                      repair_prompt(
                          story,
                          critique,
                          concept,
                      ),
                      story_schema,
                      temperature=0.55,
                      max_tokens=5200,
                  )

                  try:
                      validate_story(repaired)
                  except (
                      ValueError,
                      RuntimeError,
                  ) as exc:
                      print(
                          "REPAIRED STORY CHECK FAILED:",
                          exc,
                      )
                      continue

                  repaired_critique = call_groq(
                      story_critic_prompt(
                          repaired,
                          concept,
                      ),
                      story_critic_schema,
                      temperature=0.12,
                      max_tokens=2200,
                  )

                  print(
                      "REPAIRED STORY REVIEW:"
                  )

                  print(
                      json.dumps(
                          repaired_critique,
                          ensure_ascii=False,
                          indent=2,
                      )
                  )

                  repaired_score = (
                      repaired_critique["hook_score"]
                      + repaired_critique["originality_score"]
                      + repaired_critique["believability_score"]
                      + repaired_critique["emotional_score"]
                      + repaired_critique["conflict_score"]
                      + repaired_critique["ending_score"]
                      + repaired_critique["visual_score"]
                  )

                  if repaired_score > best_total_score:
                      best_total_score = repaired_score
                      best_story = repaired
                      best_concept = concept
                      best_critique = repaired_critique

                  if repaired_critique["pass"]:
                      story = repaired
                      critique = repaired_critique
                      break

              if (
                  best_critique
                  and best_critique.get("pass")
                  and best_story
              ):
                  break

              previous_issues = (
                  best_critique["issues"]
                  if best_critique
                  else ["Concept produced no acceptable story."]
              )

          # ============================================================
          # FINAL SAFETY NET
          # ============================================================

          # We deliberately do NOT fail the GitHub job merely because
          # a creative reviewer rejected a draft. The best candidate is
          # preserved so the automation itself stays operational.
          #
          # If no candidate exists at all, that means the API itself
          # failed repeatedly; that remains a genuine technical failure.

          if best_story is None:
              raise RuntimeError(
                  "No story was generated at all. "
                  "Groq did not return a usable candidate."
              )

          if best_critique is None:
              best_critique = {
                  "pass": False,
                  "hook_score": 0,
                  "originality_score": 0,
                  "believability_score": 0,
                  "emotional_score": 0,
                  "conflict_score": 0,
                  "ending_score": 0,
                  "visual_score": 0,
                  "issues": [
                      "No final critic result was available."
                  ],
              }

          publication_ready = bool(
              best_critique.get("pass")
          )

          # ============================================================
          # FINAL LOCAL VALIDATION
          # ============================================================

          try:
              validate_story(best_story)
          except (
              ValueError,
              RuntimeError,
          ) as exc:
              raise RuntimeError(
                  "Best available story failed local validation: "
                  f"{exc}"
              )

          # ============================================================
          # PRODUCTION METADATA
          # ============================================================

          total_words = story_word_count(best_story)

          duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  round(
                      total_words / WPM * 60
                  ),
              ),
          )

          scene_count = len(
              best_story["scenes"]
          )

          base_words = total_words // scene_count
          remainder = total_words % scene_count

          production_scenes = []

          for index, scene in enumerate(
              best_story["scenes"]
          ):
              estimated_words = (
                  base_words
                  + (
                      1
                      if index < remainder
                      else 0
                  )
              )

              scene_duration = max(
                  3,
                  round(
                      estimated_words / WPM * 60
                  ),
              )

              production_scenes.append({
                  "scene": scene["scene"],
                  "duration_seconds": scene_duration,
                  "narration": scene["narration"],
                  "visual_prompt": (
                      "Create a cinematic faceless vertical shot "
                      "that shows exactly what this narration describes: "
                      + scene["narration"]
                      + ". Never require an identifiable face. "
                        "Prefer hands, backs, silhouettes, posture, "
                        "tools, objects, reflections and environment. "
                        "Keep materials and physics realistic. "
                        "Natural cinematic lighting. "
                        "9:16 vertical composition."
                  ),
                  "camera": (
                      "Physically plausible subtle camera movement "
                      "that supports the visible action."
                  ),
                  "on_screen_text": "",
                  "sfx": (
                      "Natural location sound matching the visible action."
                  ),
              })

          # ============================================================
          # OUTPUTS
          # ============================================================

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )

          (OUTPUT_DIR / "story.json").write_text(
              json.dumps(
                  best_story,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "concept.json").write_text(
              json.dumps(
                  best_concept,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "quality_report.json").write_text(
              json.dumps(
                  {
                      **best_critique,
                      "publication_ready": publication_ready,
                      "selection_score": best_total_score,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "scenes.json").write_text(
              json.dumps(
                  {
                      "duration_seconds": duration,
                      "scenes": production_scenes,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "title.txt").write_text(
              best_story["title"] + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "script.txt").write_text(
              " ".join(
                  scene["narration"]
                  for scene in best_story["scenes"]
              ) + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "description.txt").write_text(
              best_story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": best_story["title"],
              "premise": best_story["description"],
              "setting": best_story["setting"],
          })

          HISTORY_FILE.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          HISTORY_FILE.write_text(
              json.dumps(
                  history[-100:],
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          # ============================================================
          # FINAL LOG
          # ============================================================

          print("=" * 60)
          print("STORY PIPELINE COMPLETE")
          print("=" * 60)
          print("Title:", best_story["title"])
          print("Words:", total_words)
          print("Estimated duration:", duration, "seconds")
          print("Scenes:", scene_count)
          print(
              "Publication-ready:",
              publication_ready,
          )
          print(
              "Best score:",
              best_total_score,
              "/ 70",
          )

          if not publication_ready:
              print(
                  "WARNING: The automation completed with the "
                  "highest-scoring available candidate after "
                  f"{CONCEPT_ATTEMPTS} concept attempts."
              )

          print(
              "Final quality:",
              json.dumps(
                  best_critique,
                  ensure_ascii=False,
              ),
          )

          PY

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          git diff --cached --quiet || git commit -m "Update story history"
          git push

      - name: Upload generated story
        uses: actions/upload-artifact@v4
        with:
          name: generated-story
          path: story-output/
