name: Generate Story

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate publication-ready story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"
          HISTORY_FILE = Path(".github/data/story_history.json")
          OUTPUT_DIR = Path("story-output")

          MIN_WORDS = 105
          MAX_WORDS = 405
          TARGET_MIN_WORDS = 140
          TARGET_MAX_WORDS = 300
          WPM = 135
          MIN_DURATION = 45
          MAX_DURATION = 180

          # Keep the run deliberately bounded for Groq free-tier limits.
          # Normal path: 6 calls across 3 candidates (generation + critic).
          # A candidate that is otherwise structurally valid but too short may
          # consume ONE additional targeted length-repair call before its critic.
          MAX_API_CALLS = 9
          MAX_STORY_ATTEMPTS = 3
          MIN_SECONDS_BETWEEN_CALLS = 20.0

          API_KEY = os.environ["GROQ_API_KEY"]
          rng = random.SystemRandom()

          MODES = [
              "quiet human drama",
              "regret after a practical mistake",
              "second chance earned through competence",
              "an ordinary person protecting something valuable",
              "a difficult promise under a deadline",
              "quiet reconciliation without a speech",
              "a person forced to admit they were wrong",
              "a small sacrifice with a concrete consequence",
              "unexpected responsibility",
              "a private choice that changes a relationship",
              "a practical decision with an emotional cost",
              "a routine task that exposes a hidden relationship",
          ]

          EMOTIONS = [
              "warmth",
              "relief",
              "regret",
              "gratitude",
              "wonder",
              "belonging",
              "bittersweet acceptance",
              "quiet joy",
              "determination",
              "compassion",
              "forgiveness",
              "surprise",
          ]

          SETTINGS = [
              "a small neighborhood repair shop",
              "a late-night grocery store",
              "a quiet public library",
              "a crowded train platform",
              "a small roadside restaurant",
              "a school corridor after closing time",
              "a modest flower shop",
              "a laundromat on a cold evening",
              "a corner bakery before opening",
              "a local market just before closing",
              "a small town post office",
              "a quiet cafe on a winter morning",
              "a mechanic's garage at closing time",
              "a small photography shop",
              "an apartment rooftop at sunset",
              "a public bus depot during a storm",
              "a neighborhood tailor's shop",
              "a small hardware store near closing",
          ]

          CONFLICTS = [
              "keeping a valuable item would solve the protagonist's immediate problem, but returning it costs them something real",
              "the protagonist must admit a mistake before a deadline or someone else will pay for it",
              "the protagonist has one chance to protect both a promise and an important responsibility, but the two demands collide",
              "a practical task becomes a choice between reputation and honesty",
              "helping one person means giving up a concrete opportunity the protagonist badly needs",
              "the protagonist discovers information that can protect them but would unfairly damage someone else",
              "a professional error can either be hidden temporarily or confessed immediately at a real personal cost",
              "the protagonist must choose between convenience and keeping a commitment that only they can honor",
              "two people need opposite outcomes and the protagonist's decision has an immediate consequence",
          ]

          BANNED_CLICHES = [
              "believe in yourself",
              "never give up",
              "the human spirit",
              "everything happens for a reason",
              "when one door closes",
              "follow your dreams",
              "little did they know",
              "the power of hope",
              "sometimes life",
              "in the end, it was not about",
          ]

          BANNED_PATTERNS = [
              "child in danger", "children in danger", "terminal illness", "hospital reveal",
              "anonymous benefactor", "secret benefactor", "lottery ticket", "hidden fortune",
              "miraculous rescue", "magic rescue", "magical", "supernatural",
              "mysteriously appeared", "miraculously", "destiny", "fate chose",
              "ancient box", "ancient wooden box", "only blooms when", "blooms when",
              "special power", "meant to be", "missing note", "missing letter",
              "secret message", "secret envelope", "stranger was secretly", "convenient stranger",
              "sudden promotion", "instant promotion", "scathing review", "regulatory investigation",
              "license revocation", "revoke her license", "revoke his license",
              "trapped in a freezer", "inside a freezer", "stuck in a freezer", "locked inside a freezer",
          ]

          STORY_SCHEMA = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "protagonist": {"type": "string"},
                  "desire": {"type": "string"},
                  "stakes": {"type": "string"},
                  "obstacle": {"type": "string"},
                  "choice": {"type": "string"},
                  "cost": {"type": "string"},
                  "consequence": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"},
                          },
                          "required": ["name", "role", "visual_identity"],
                          "additionalProperties": False,
                      },
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                          },
                          "required": ["scene", "narration"],
                          "additionalProperties": False,
                      },
                  },
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "protagonist",
                  "desire",
                  "stakes",
                  "obstacle",
                  "choice",
                  "cost",
                  "consequence",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes",
              ],
              "additionalProperties": False,
          }

          CRITIC_SCHEMA = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "emotional_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "ending_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues",
              ],
              "additionalProperties": False,
          }

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()

          # Keep history compact. Only high-level premise information is useful
          # for novelty checking; do not resend entire old stories to Groq.
          recent = history[-12:]
          recent_text = "\n".join(
              f"- {str(item.get('title', ''))[:100]} | "
              f"{str(item.get('premise', ''))[:220]} | "
              f"{str(item.get('setting', ''))[:100]}"
              for item in recent
          ) or "NONE"

          api_calls = 0
          last_call_started = 0.0

          def _parse_duration(value, default=10.0):
              if value is None:
                  return default
              text = str(value).strip().lower()
              try:
                  if text.endswith("ms"):
                      return float(text[:-2]) / 1000.0
                  if text.endswith("s") and "m" not in text:
                      return float(text[:-1])
              except Exception:
                  pass
              total = 0.0
              matched = False
              import re
              minute = re.search(r"(\d+(?:\.\d+)?)m", text)
              second = re.search(r"(\d+(?:\.\d+)?)s", text)
              if minute:
                  total += float(minute.group(1)) * 60.0
                  matched = True
              if second:
                  total += float(second.group(1))
                  matched = True
              if matched:
                  return total
              try:
                  return float(text)
              except Exception:
                  return default

          def _header_float(headers, name, default):
              return _parse_duration(headers.get(name), default)

          def call_groq(prompt, schema, temperature=0.6, max_tokens=4200):
              global api_calls, last_call_started

              if api_calls >= MAX_API_CALLS:
                  raise RuntimeError("Internal API-call budget exhausted.")

              gap = time.time() - last_call_started
              if gap < MIN_SECONDS_BETWEEN_CALLS:
                  time.sleep(MIN_SECONDS_BETWEEN_CALLS - gap)

              api_calls += 1
              last_call_started = time.time()

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a senior short-film writer. "
                              "Return ONLY valid JSON matching the supplied schema. "
                              "Never return markdown or commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema,
                      },
                  },
              }

              attempts = 0

              while True:
                  attempts += 1
                  request = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/3.0",
                      },
                      method="POST",
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          body = json.loads(response.read().decode("utf-8"))
                      content = body["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")
                      return json.loads(content)

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")

                      if exc.code == 429:
                          if attempts >= 2:
                              raise RuntimeError(
                                  "Groq rate limit remained active after one "
                                  "header-guided retry. Response: " + raw
                              )

                          retry_after = _header_float(exc.headers, "retry-after", 10.0)
                          reset_tokens = _header_float(
                              exc.headers,
                              "x-ratelimit-reset-tokens",
                              10.0,
                          )

                          wait_seconds = max(5.0, retry_after, reset_tokens) + 1.0
                          wait_seconds = min(wait_seconds, 75.0)

                          print(
                              f"Groq HTTP 429. Waiting {wait_seconds:.1f}s "
                              f"using Groq rate-limit headers..."
                          )
                          time.sleep(wait_seconds)
                          continue

                      if exc.code in (500, 502, 503, 504) and attempts < 2:
                          print(f"Groq HTTP {exc.code}. Retrying once in 5s...")
                          time.sleep(5)
                          continue

                      raise RuntimeError(
                          f"Groq HTTP {exc.code}: {raw}"
                      )

          def word_count(story):
              return sum(
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              )

          def local_story_check(story):
              scenes = story.get("scenes", [])

              if not 7 <= len(scenes) <= 18:
                  return "Story must contain 7-18 scenes."

              numbers = [s.get("scene") for s in scenes]
              if numbers != list(range(1, len(scenes) + 1)):
                  return "Scene numbers must be consecutive starting at 1."

              words = word_count(story)
              if words < MIN_WORDS:
                  return f"Story is too short at {words} words; minimum is {MIN_WORDS}."
              if words > MAX_WORDS:
                  return f"Story is too long at {words} words; maximum is {MAX_WORDS}."

              text = json.dumps(story, ensure_ascii=False).lower()

              for phrase in BANNED_CLICHES:
                  if phrase in text:
                      return f"Cliche detected: {phrase}"

              for phrase in BANNED_PATTERNS:
                  if phrase in text:
                      return f"Banned story pattern detected: {phrase}"

              required_quality = [
                  ("protagonist", 5),
                  ("desire", 5),
                  ("stakes", 6),
                  ("obstacle", 6),
                  ("choice", 6),
                  ("cost", 6),
                  ("consequence", 6),
                  ("turning_point", 6),
                  ("payoff", 6),
              ]

              for field, minimum_words in required_quality:
                  if len(str(story.get(field, "")).split()) < minimum_words:
                      return f"{field} is too vague."

              hook_text = str(story.get("hook", "")).strip()
              if len(hook_text.split()) < 8:
                  return "Hook is too short to establish a concrete premise."

              generic_resolution_phrases = [
                  "new beginning", "promise of renewal", "felt the weight lift",
                  "eyes moist", "tears in her eyes", "tears in his eyes",
                  "quiet gratitude", "new chapter", "everything changed",
              ]
              for phrase in generic_resolution_phrases:
                  if phrase in text:
                      return f"Generic emotional resolution detected: {phrase}"

              if "license" in text and any(term in text for term in ("review", "regulatory", "investigation", "revoke", "renewal")):
                  return "Artificial professional-stakes mechanism detected."

              if any(term in text for term in ("blooms when", "only blooms when", "magical", "supernatural", "mysteriously", "miraculously")):
                  return "Supernatural or magical story mechanism detected; keep the story realistic."

              if "cut corners" in text and "do the right thing" in text:
                  return "Conflict is framed as a generic moral choice instead of a specific costly dilemma."

              return None

          def make_master_prompt():
              seed = {
                  "mode": rng.choice(MODES),
                  "emotion": rng.choice(EMOTIONS),
                  "setting": rng.choice(SETTINGS),
                  "conflict": rng.choice(CONFLICTS),
              }

              return f"""
          Build ONE publication-ready original emotional micro-story for a
          faceless vertical YouTube Short.

          CREATIVE SEED:
          {json.dumps(seed, ensure_ascii=False)}

          RECENT CHANNEL HISTORY:
          {recent_text}

          First, privately test several possible premises. Do NOT output them.
          Choose the strongest premise and then write the final story directly.

          The chosen story must satisfy ALL of these:

          1. The protagonist is a specific ordinary person. Give them a concrete
             job, responsibility, habit, relationship, skill, or past mistake.

          2. The protagonist wants something concrete TODAY.

          3. The obstacle is external and specific. It must force a real choice.

          4. The choice must have an actual cost. Both options must be understandable
             to a reasonable person; avoid simple good-vs-bad moral tests.

          4A. Stay completely realistic. No magic, supernatural effects, prophetic
              objects, impossible coincidences, unexplained transformations, or
              emotionally convenient miracles. If an object matters, its importance
              must come from ordinary human history, evidence, skill, or practical use.

          5. Cause and effect must be visible: event -> choice -> consequence ->
             new problem -> turning point -> resolution.

          6. The turning point must be seeded by an earlier object, action,
             promise, mistake, skill, or piece of information.

          7. The ending must solve or transform the central problem and pay off
             something introduced near the beginning.

          8. The story should contain one distinctive visual motif tied directly
             to the conflict, not generic rain, handwriting, ink, clocks, kites,
             letters, photographs, or random objects.

          9. Avoid these common AI-story patterns:
             child in danger, hospital reveal, terminal illness, anonymous donor,
             lottery ticket, hidden fortune, magical rescue, miraculous coincidence,
             convenient stranger, secret benefactor, missing letter/note, sudden
             promotion because of one small action, supernatural objects, instant
             forgiveness, artificial license/regulatory threats, and "doing the right"
             thing with no concrete personal cost.

          10. Avoid love letters, lost-photo plots, recipe plots, bakery plots,
              violinist plots, kite plots, bus-station-departure plots, and generic
              post-office misunderstandings unless radically transformed.

          11. No moral speech. No generic motivational paragraph. Let the events
              carry the emotion.

          12. Faceless filming must work naturally. Use hands, backs, silhouettes,
              clothing, objects, body language, reflections, practical actions,
              and environments rather than identifiable faces.

          13. Target 140-300 spoken words. Never pad. Absolute allowed range is
              105-405 words.

          14. Use 7-12 scenes unless more are genuinely necessary.

          15. The hook must create a concrete unanswered question within the first
              sentence or action. A generic trembling hand, arrival scene, or
              ordinary opening is not enough.

          Return ONLY the final story JSON.
          """

          def make_fresh_story_prompt(rejected_story, critique, attempt_number):
              return f"""
          Create a COMPLETELY NEW original emotional micro-story for a faceless
          vertical YouTube Short. This is replacement attempt {attempt_number}.

          A previous story was rejected. DO NOT repair it and DO NOT reuse its
          premise, central object, setting, relationship, conflict, hook, reveal,
          or ending structure. Start from a different real-world situation.

          REJECTED STORY SUMMARY:
          {json.dumps({
              'title': rejected_story.get('title', ''),
              'setting': rejected_story.get('setting', ''),
              'description': rejected_story.get('description', ''),
              'conflict': rejected_story.get('conflict', ''),
              'turning_point': rejected_story.get('turning_point', ''),
              'payoff': rejected_story.get('payoff', ''),
          }, ensure_ascii=False)}

          WHY IT FAILED:
          {json.dumps(critique.get('issues', []), ensure_ascii=False)}

          RECENT CHANNEL HISTORY:
          {recent_text}

          HARD REQUIREMENTS:
          - Build a new premise, not a repaired version of the rejected one.
          - Use a believable ordinary human situation with a specific protagonist.
          - Give the protagonist a concrete goal that matters today.
          - Use a real external obstacle and a meaningful choice with a real cost.
          - The turning point must come from something established earlier.
          - The ending must resolve the central problem without a miracle, secret
            benefactor, magical object, hidden fortune, random coincidence, or sudden
            forgiveness.
          - Do not use race-against-the-clock mail delivery, jammed doors/slots,
            keys unlocking hidden things, school deadlines, florist/orchid symbolism,
            love letters, recipes, photographs, kites, violinists, child rescue,
            hospital reveals, illness reveals, lottery wins, or promotion/license
            punishment as the central engine.
          - Do not introduce fantasy, time loops, puzzles, secret codes, supernatural
            behavior, or implausible institutional rules merely to increase originality.
          - Prefer a grounded professional, family, neighbor, customer, craft, or
            responsibility conflict where both sides have understandable motives.
          - Change at least FOUR of these from the rejected story: setting, object,
            profession, relationship, immediate goal, source of conflict, and visual motif.
          - Faceless filming must work naturally.
          - Target 140-300 spoken words, 7-12 scenes. Absolute range 105-405.
          - The first scene must begin with a specific action/problem that raises an
            unanswered question immediately.
          - Let emotion come from consequences, not speeches.

          Return ONLY the new story JSON.
          """

          CRITIC_SCORE_KEYS = [
              "hook_score",
              "originality_score",
              "believability_score",
              "emotional_score",
              "conflict_score",
              "ending_score",
              "visual_score",
          ]
          CRITIC_MIN_AXIS = 7
          CRITIC_MIN_AVG = 6.8

          def critic_average(critique):
              scores = []
              for key in CRITIC_SCORE_KEYS:
                  value = critique.get(key)
                  if not isinstance(value, int) or isinstance(value, bool):
                      return 0.0
                  if value < 0 or value > 10:
                      return 0.0
                  scores.append(value)
              return sum(scores) / len(scores)

          def effective_critic_pass(critique):
              if not isinstance(critique, dict):
                  return False
              average = critic_average(critique)
              all_axes_pass = all(
                  critique.get(key, -1) >= CRITIC_MIN_AXIS
                  for key in CRITIC_SCORE_KEYS
              )
              return all_axes_pass and average >= CRITIC_MIN_AVG

          def normalize_critique(critique):
              normalized = dict(critique)
              average = critic_average(normalized)
              deterministic_pass = effective_critic_pass(normalized)
              model_pass = bool(normalized.get("pass"))
              issues = list(normalized.get("issues") or [])

              if model_pass != deterministic_pass:
                  issues.append(
                      "Critic boolean pass was inconsistent with its numeric scores; "
                      "publication gate used deterministic score validation."
                  )

              normalized["pass"] = deterministic_pass
              normalized["score_average"] = round(average, 2)
              normalized["all_axes_at_least_7"] = all(
                  normalized.get(key, -1) >= CRITIC_MIN_AXIS
                  for key in CRITIC_SCORE_KEYS
              )
              normalized["model_pass"] = model_pass
              normalized["issues"] = issues
              return normalized

          def make_length_repair_prompt(story):
              current_words = word_count(story)
              return f"""
          Repair the following ORIGINAL story only because its narration is too short.

          CURRENT WORD COUNT: {current_words}
          REQUIRED FINAL WORD COUNT: {MIN_WORDS}-{MAX_WORDS}
          TARGET: 140-240 spoken words when possible.

          IMPORTANT:
          - Keep the same title, protagonist, setting, central conflict, choice, cost,
            consequence, turning point and payoff.
          - Do NOT invent a new subplot.
          - Do NOT add generic motivation, moral speeches, filler, or a call to action.
          - Add only concrete actions, reactions, transitions, necessary context, and
            cause-and-effect beats that make the EXISTING story more complete and cinematic.
          - Preserve realistic human behavior and physical plausibility.
          - Keep it faceless-filmable.
          - Keep 7-12 scenes.
          - The final narration MUST be at least {MIN_WORDS} words.
          - Return ONLY corrected story JSON matching the supplied schema.

          STORY:
          {json.dumps(story, ensure_ascii=False)}
          """

          def make_critic_prompt(story):
              return f"""
          Ruthlessly review the following proposed YouTube Short as a professional
          short-film editor.

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Score 0-10 for:
          hook, originality, believability, emotional impact, conflict, ending,
          visual potential.

          The publication system independently checks the seven numeric scores.
          Mark pass=true ONLY when every score is >= 7 and the seven-score average
          is at least 6.8. Never mark pass=true when any score is below 7.

          Be especially strict about:
          - generic opening
          - generic protagonist
          - artificial moral dilemmas
          - no meaningful personal cost
          - random coincidence
          - weak setup/payoff connection
          - convenient reveals
          - predictable endings
          - common AI emotional tropes
          - visuals that are generic rather than story-specific
          - supernatural, magical, or miracle-like mechanisms
          - professional stakes that depend on implausible policy or instant punishment
          - binary "lie or do the right thing" conflicts with no nuanced alternative
          - emotional resolution that happens only because another character suddenly
            becomes forgiving

          Treat magical explanations, random coincidences, child-rescue clichés,
          illness reveals, anonymous benefactors, implausible promotions/licenses,
          and endings that simply reward honesty as fatal flaws.

          For every score below 7, explain the exact structural problem and what
          must change.

          Return ONLY critic JSON.
          """

          # ============================================================
          # BOUNDED STORY SEARCH
          # ============================================================

          # The critical fix: once a premise fails quality review, do NOT keep
          # repairing the same premise. Generate a genuinely different story.
          # This prevents the repeated-mail/key/slot style failures seen in
          # previous runs and uses far fewer tokens than repeated rewrites.

          approved_story = None
          approved_quality_report = None
          last_story = None
          last_critique = None
          rejection_log = []

          for attempt_number in range(1, MAX_STORY_ATTEMPTS + 1):
              print("=" * 60)
              print(f"STORY CANDIDATE {attempt_number}/{MAX_STORY_ATTEMPTS}")
              print("=" * 60)

              if attempt_number == 1:
                  prompt = make_master_prompt()
                  temperature = 0.68
              else:
                  prompt = make_fresh_story_prompt(
                      last_story or {},
                      last_critique or {"issues": []},
                      attempt_number,
                  )
                  temperature = 0.72

              try:
                  candidate = call_groq(
                      prompt,
                      STORY_SCHEMA,
                      temperature=temperature,
                      max_tokens=2200,
                  )
              except Exception as exc:
                  print(f"Candidate generation failed: {exc}")
                  rejection_log.append({
                      "attempt": attempt_number,
                      "stage": "generation",
                      "issues": [str(exc)],
                  })
                  last_story = {}
                  last_critique = {"pass": False, "issues": [str(exc)]}
                  continue

              last_story = candidate

              local_issue = local_story_check(candidate)

              # A short but otherwise valid candidate gets exactly one targeted
              # expansion pass. This is the only repair allowed in the bounded
              # candidate search; failed quality candidates still become fresh premises.
              if local_issue and local_issue.startswith("Story is too short at "):
                  print("CANDIDATE LENGTH CHECK:", local_issue)
                  print("RUNNING ONE TARGETED LENGTH REPAIR")
                  try:
                      repaired = call_groq(
                          make_length_repair_prompt(candidate),
                          STORY_SCHEMA,
                          temperature=0.35,
                          max_tokens=2600,
                      )
                  except Exception as exc:
                      print(f"Length repair failed: {exc}")
                      rejection_log.append({
                          "attempt": attempt_number,
                          "stage": "length_repair",
                          "issues": [str(exc)],
                      })
                      last_critique = {"pass": False, "issues": [str(exc)]}
                      continue

                  repaired_issue = local_story_check(repaired)
                  if repaired_issue:
                      print("REPAIRED CANDIDATE LOCAL CHECK:", repaired_issue)
                      rejection_log.append({
                          "attempt": attempt_number,
                          "stage": "local_after_repair",
                          "issues": [repaired_issue],
                      })
                      last_critique = {"pass": False, "issues": [repaired_issue]}
                      continue

                  candidate = repaired
                  last_story = candidate
                  print("LENGTH REPAIR PASSED — CONTINUING TO QUALITY REVIEW")

              elif local_issue:
                  print("CANDIDATE LOCAL CHECK:", local_issue)
                  rejection_log.append({
                      "attempt": attempt_number,
                      "stage": "local",
                      "issues": [local_issue],
                  })
                  last_critique = {"pass": False, "issues": [local_issue]}
                  continue

              print("=" * 60)
              print(f"QUALITY REVIEW FOR CANDIDATE {attempt_number}")
              print("=" * 60)

              try:
                  raw_critique = call_groq(
                      make_critic_prompt(candidate),
                      CRITIC_SCHEMA,
                      temperature=0.10,
                      max_tokens=900,
                  )
              except Exception as exc:
                  print(f"Critic call failed: {exc}")
                  rejection_log.append({
                      "attempt": attempt_number,
                      "stage": "critic",
                      "issues": [str(exc)],
                  })
                  last_critique = {"pass": False, "issues": [str(exc)]}
                  continue

              critique = normalize_critique(raw_critique)
              last_critique = critique

              print(json.dumps(critique, ensure_ascii=False, indent=2))
              print(
                  f"Deterministic quality result: pass={critique['pass']} "
                  f"average={critique['score_average']:.2f}"
              )

              if critique["pass"]:
                  approved_story = candidate
                  approved_quality_report = critique
                  print("CANDIDATE PASSED DETERMINISTIC QUALITY GATE")
                  break

              rejection_log.append({
                  "attempt": attempt_number,
                  "stage": "quality",
                  "score_average": critique["score_average"],
                  "issues": critique.get("issues", []),
              })

              print("CANDIDATE REJECTED — GENERATING A FRESH PREMISE")

              if attempt_number < MAX_STORY_ATTEMPTS:
                  time.sleep(2)

          if approved_story is None or approved_quality_report is None:
              summary = {
                  "attempts": MAX_STORY_ATTEMPTS,
                  "last_critique": last_critique,
                  "rejections": rejection_log,
              }
              raise RuntimeError(
                  "No publication-ready story passed all deterministic gates after "
                  f"{MAX_STORY_ATTEMPTS} independent candidates. "
                  "Nothing will be published. Diagnostic summary: "
                  + json.dumps(summary, ensure_ascii=False)
              )

          story = approved_story
          quality_report = approved_quality_report

          # The exact candidate selected for publication must still pass the
          # hard local validator immediately before any production output is made.
          final_local_issue = local_story_check(story)
          if final_local_issue:
              raise RuntimeError(
                  "Approved story unexpectedly failed final local validation: "
                  + final_local_issue
              )

          # Never trust an LLM boolean. Recompute the publication decision locally.
          if not effective_critic_pass(quality_report):
              raise RuntimeError(
                  "Internal safety check failed: approved quality report does not "
                  "satisfy deterministic score thresholds."
              )

          # ============================================================
          # FINAL LOCAL VALIDATION + PRODUCTION DATA
          # ============================================================

          total = word_count(story)

          duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  round(total / WPM * 60),
              ),
          )

          scene_count = len(story["scenes"])
          base_words = total // scene_count
          remainder = total % scene_count

          production_scenes = []

          for index, scene in enumerate(story["scenes"]):
              scene_words = base_words + (1 if index < remainder else 0)
              seconds = max(3, round(scene_words / WPM * 60))

              production_scenes.append({
                  "scene": scene["scene"],
                  "duration_seconds": seconds,
                  "narration": scene["narration"],
                  "visual_prompt": (
                      "Production-ready faceless cinematic shot for this exact narration: "
                      + scene["narration"]
                      + ". Preserve continuity of clothing, props, location, season and time. "
                        "Use backs, hands, silhouettes, body language, reflections, objects and "
                        "environment; never require an identifiable face. Realistic materials, "
                        "natural lighting, physically plausible action, strong composition, "
                        "vertical 9:16."
                  ),
                  "camera": "subtle physically plausible movement that reinforces the action",
                  "on_screen_text": "",
                  "sfx": "natural location sound synchronized to the visible action",
              })

          OUTPUT_DIR.mkdir(exist_ok=True)

          (OUTPUT_DIR / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "quality_report.json").write_text(
              json.dumps(quality_report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "scenes.json").write_text(
              json.dumps(
                  {
                      "duration_seconds": duration,
                      "scenes": production_scenes,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "title.txt").write_text(
              story["title"] + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "script.txt").write_text(
              " ".join(scene["narration"] for scene in story["scenes"]) + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["description"],
              "setting": story["setting"],
              "passed_critic": True,
              "score_average": quality_report["score_average"],
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-100:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60)
          print("STORY APPROVED — DETERMINISTIC QUALITY GATE PASSED")
          print("=" * 60)
          print("Title:", story["title"])
          print("Words:", total)
          print("Duration:", duration, "seconds")
          print("Scenes:", scene_count)
          print("Groq calls used:", api_calls)
          print("Deterministic quality gate: PASS")
          print("Quality:")
          print(json.dumps(quality_report, ensure_ascii=False, indent=2))
          PY

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          git diff --cached --quiet || git commit -m "Update story history"
          git push

      - name: Upload story artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-story
          path: story-output/
