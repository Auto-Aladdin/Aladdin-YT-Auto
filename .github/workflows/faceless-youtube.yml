name: Generate Story

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate publication-ready story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-20b"
          HISTORY_FILE = Path(".github/data/story_history.json")
          OUTPUT_DIR = Path("story-output")

          MIN_WORDS = 105
          MAX_WORDS = 405
          TARGET_MIN_WORDS = 160
          TARGET_MAX_WORDS = 240
          WPM = 135
          MIN_DURATION = 45
          MAX_DURATION = 180

          # Keep the run deliberately bounded for Groq free-tier limits.
          # Worst case: 4 candidates x (generation + critic + one repair + repair critic) = 16 calls.
          MAX_API_CALLS = 24
          MAX_STORY_ATTEMPTS = 4
          MAX_REPAIR_ROUNDS_PER_CANDIDATE = 1
          MAX_LENGTH_REPAIRS_PER_CANDIDATE = 1
          MIN_SECONDS_BETWEEN_CALLS = 12.0

          API_KEY = os.environ["GROQ_API_KEY"]
          rng = random.SystemRandom()

          MODES = [
              "practical problem with an unexpectedly personal consequence",
              "quiet competence under pressure",
              "an ordinary mistake that cannot be hidden for long",
              "a small responsibility nobody else notices",
              "two reasonable priorities colliding",
              "a useful object carrying human history without magical meaning",
              "a craft or skill being tested by a real-world problem",
              "a practical favor that becomes harder than expected",
              "a person repairing damage they helped cause",
              "a small local problem that reveals an important relationship",
              "a choice where every option has a believable downside",
              "a quiet act of responsibility with a concrete cost",
          ]

          EMOTIONS = [
              "relief",
              "regret turning into acceptance",
              "gratitude without sentimentality",
              "quiet pride",
              "belonging",
              "bittersweet relief",
              "surprise",
              "respect earned slowly",
              "warmth",
              "forgiveness after evidence",
              "determination",
              "quiet joy",
          ]

          SETTINGS = [
              "a neighborhood key-cutting and repair kiosk",
              "a small print shop preparing for opening",
              "a municipal maintenance room after hours",
              "a second-hand appliance shop",
              "a community workshop with tools on the wall",
              "a modest tailor's workroom",
              "a neighborhood hardware store before closing",
              "a small bookbinding workshop",
              "a local shoe-repair stall",
              "a quiet apartment building service room",
              "a small bicycle repair shop",
              "a community garden storage shed",
              "a modest photography lab",
              "a neighborhood ceramics studio",
              "a local market storage area before dawn",
              "a small packaging workspace behind a shop",
              "a public building's maintenance corridor",
              "a compact sign-making workshop",
          ]

          PREMISE_ENGINES = [
              "repairing or preserving something because of a practical obligation",
              "discovering a concrete error shortly before it affects another person",
              "having to choose how to allocate one scarce resource",
              "finishing a hands-on task while a second responsibility interrupts it",
              "correcting a mistake without creating a larger practical problem",
              "using a specific skill in an unexpected but realistic way",
              "protecting another person's work while accepting a personal setback",
              "deciding what to do with information that changes a practical decision",
              "solving a local problem while preserving trust with someone involved",
              "recovering from a failed attempt by changing the method, not making a speech",
          ]

          BANNED_CLICHES = [
              "believe in yourself",
              "never give up",
              "the human spirit",
              "everything happens for a reason",
              "when one door closes",
              "follow your dreams",
              "little did they know",
              "the power of hope",
              "sometimes life",
              "in the end, it was not about",
          ]

          BANNED_PATTERNS = [
              "child in danger", "children in danger", "terminal illness", "hospital reveal",
              "anonymous benefactor", "secret benefactor", "lottery ticket", "hidden fortune",
              "miraculous rescue", "magic rescue", "magical", "supernatural",
              "mysteriously appeared", "miraculously", "destiny", "fate chose",
              "ancient box", "ancient wooden box", "only blooms when", "blooms when",
              "special power", "meant to be", "missing note", "missing letter",
              "secret message", "secret envelope", "stranger was secretly", "convenient stranger",
              "sudden promotion", "instant promotion", "scathing review", "regulatory investigation",
              "license revocation", "revoke her license", "revoke his license",
              "trapped in a freezer", "inside a freezer", "stuck in a freezer", "locked inside a freezer",
              "stuck in an elevator", "trapped in an elevator", "elevator hatch", "emergency light",
              "power failure", "blackout", "abandoned concert hall", "last performance",
              "violin audition", "father's unfinished", "rooftop confession", "glowing receipt",
              "red ribbon", "countdown clock", "ticking clock", "coffee shop dilemma",
          ]

          STORY_SCHEMA = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "hook": {"type": "string"},
                  "setting": {"type": "string"},
                  "protagonist": {"type": "string"},
                  "desire": {"type": "string"},
                  "stakes": {"type": "string"},
                  "obstacle": {"type": "string"},
                  "choice": {"type": "string"},
                  "cost": {"type": "string"},
                  "consequence": {"type": "string"},
                  "turning_point": {"type": "string"},
                  "payoff": {"type": "string"},
                  "description": {"type": "string"},
                  "characters": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "name": {"type": "string"},
                              "role": {"type": "string"},
                              "visual_identity": {"type": "string"},
                          },
                          "required": ["name", "role", "visual_identity"],
                          "additionalProperties": False,
                      },
                  },
                  "scenes": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "scene": {"type": "integer"},
                              "narration": {"type": "string"},
                          },
                          "required": ["scene", "narration"],
                          "additionalProperties": False,
                      },
                  },
              },
              "required": [
                  "title",
                  "hook",
                  "setting",
                  "protagonist",
                  "desire",
                  "stakes",
                  "obstacle",
                  "choice",
                  "cost",
                  "consequence",
                  "turning_point",
                  "payoff",
                  "description",
                  "characters",
                  "scenes",
              ],
              "additionalProperties": False,
          }

          CRITIC_SCHEMA = {
              "type": "object",
              "properties": {
                  "pass": {"type": "boolean"},
                  "hook_score": {"type": "integer"},
                  "originality_score": {"type": "integer"},
                  "believability_score": {"type": "integer"},
                  "emotional_score": {"type": "integer"},
                  "conflict_score": {"type": "integer"},
                  "ending_score": {"type": "integer"},
                  "visual_score": {"type": "integer"},
                  "issues": {
                      "type": "array",
                      "items": {"type": "string"},
                  },
              },
              "required": [
                  "pass",
                  "hook_score",
                  "originality_score",
                  "believability_score",
                  "emotional_score",
                  "conflict_score",
                  "ending_score",
                  "visual_score",
                  "issues",
              ],
              "additionalProperties": False,
          }

          def load_history():
              try:
                  data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
                  return data if isinstance(data, list) else []
              except Exception:
                  return []

          history = load_history()

          # Keep history compact. Only high-level premise information is useful
          # for novelty checking; do not resend entire old stories to Groq.
          recent = history[-12:]
          recent_text = "\n".join(
              f"- {str(item.get('title', ''))[:100]} | "
              f"{str(item.get('premise', ''))[:220]} | "
              f"{str(item.get('setting', ''))[:100]}"
              for item in recent
          ) or "NONE"

          api_calls = 0
          last_call_started = 0.0

          def _parse_duration(value, default=10.0):
              if value is None:
                  return default
              text = str(value).strip().lower()
              try:
                  if text.endswith("ms"):
                      return float(text[:-2]) / 1000.0
                  if text.endswith("s") and "m" not in text:
                      return float(text[:-1])
              except Exception:
                  pass
              total = 0.0
              matched = False
              import re
              minute = re.search(r"(\d+(?:\.\d+)?)m", text)
              second = re.search(r"(\d+(?:\.\d+)?)s", text)
              if minute:
                  total += float(minute.group(1)) * 60.0
                  matched = True
              if second:
                  total += float(second.group(1))
                  matched = True
              if matched:
                  return total
              try:
                  return float(text)
              except Exception:
                  return default

          def _header_float(headers, name, default):
              return _parse_duration(headers.get(name), default)

          def call_groq(prompt, schema, temperature=0.6, max_tokens=4200):
              global api_calls, last_call_started

              if api_calls >= MAX_API_CALLS:
                  raise RuntimeError("Internal API-call budget exhausted.")

              gap = time.time() - last_call_started
              if gap < MIN_SECONDS_BETWEEN_CALLS:
                  time.sleep(MIN_SECONDS_BETWEEN_CALLS - gap)

              api_calls += 1
              last_call_started = time.time()

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are a senior short-film writer. "
                              "Return ONLY valid JSON matching the supplied schema. "
                              "Never return markdown or commentary."
                          ),
                      },
                      {"role": "user", "content": prompt},
                  ],
                  "reasoning_effort": "low",
                  "include_reasoning": False,
                  "temperature": temperature,
                  "max_completion_tokens": max_tokens,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "structured_output",
                          "strict": True,
                          "schema": schema,
                      },
                  },
              }

              attempts = 0

              while True:
                  attempts += 1
                  request = urllib.request.Request(
                      API_URL,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "Aladdin-YT-Auto/3.0",
                      },
                      method="POST",
                  )

                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          body = json.loads(response.read().decode("utf-8"))
                      content = body["choices"][0]["message"].get("content", "")
                      if not content:
                          raise RuntimeError("Groq returned empty content.")
                      return json.loads(content)

                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")

                      if exc.code == 429:
                          if attempts >= 2:
                              raise RuntimeError(
                                  "Groq rate limit remained active after one "
                                  "header-guided retry. Response: " + raw
                              )

                          retry_after = _header_float(exc.headers, "retry-after", 10.0)
                          reset_tokens = _header_float(
                              exc.headers,
                              "x-ratelimit-reset-tokens",
                              10.0,
                          )

                          wait_seconds = max(5.0, retry_after, reset_tokens) + 1.0
                          wait_seconds = min(wait_seconds, 75.0)

                          print(
                              f"Groq HTTP 429. Waiting {wait_seconds:.1f}s "
                              f"using Groq rate-limit headers..."
                          )
                          time.sleep(wait_seconds)
                          continue

                      if exc.code in (500, 502, 503, 504) and attempts < 2:
                          print(f"Groq HTTP {exc.code}. Retrying once in 5s...")
                          time.sleep(5)
                          continue

                      raise RuntimeError(
                          f"Groq HTTP {exc.code}: {raw}"
                      )

          def word_count(story):
              return sum(
                  len(scene["narration"].split())
                  for scene in story["scenes"]
              )

          def local_story_check(story):
              scenes = story.get("scenes", [])

              if not 7 <= len(scenes) <= 18:
                  return "Story must contain 7-18 scenes."

              numbers = [s.get("scene") for s in scenes]
              if numbers != list(range(1, len(scenes) + 1)):
                  return "Scene numbers must be consecutive starting at 1."

              words = word_count(story)
              if words < MIN_WORDS:
                  return f"Story is too short at {words} words; minimum is {MIN_WORDS}."
              if words > MAX_WORDS:
                  return f"Story is too long at {words} words; maximum is {MAX_WORDS}."

              text = json.dumps(story, ensure_ascii=False).lower()

              for phrase in BANNED_CLICHES:
                  if phrase in text:
                      return f"Cliche detected: {phrase}"

              for phrase in BANNED_PATTERNS:
                  if phrase in text:
                      return f"Banned story pattern detected: {phrase}"

              required_quality = [
                  ("protagonist", 8),
                  ("desire", 8),
                  ("stakes", 8),
                  ("obstacle", 8),
                  ("choice", 8),
                  ("cost", 8),
                  ("consequence", 8),
                  ("turning_point", 8),
                  ("payoff", 8),
              ]

              vague_protagonist_terms = {
                  "someone", "somebody", "a person", "an employee", "a worker",
                  "a young man", "a young woman", "a man", "a woman",
                  "the protagonist", "the worker", "the employee", "the driver",
              }
              protagonist = " ".join(str(story.get("protagonist", "")).lower().split())
              if any(term in protagonist for term in vague_protagonist_terms):
                  return "protagonist is too vague; use a named adult plus a specific role or skill."

              role_terms = {
                  "repair", "mechanic", "tailor", "printer", "technician", "cashier",
                  "cook", "baker", "bookbinder", "photographer", "gardener", "teacher",
                  "nurse", "carpenter", "electrician", "designer", "driver", "clerk",
                  "manager", "keeper", "artist", "craftsperson", "operator", "inspector",
                  "janitor", "barber", "seamstress", "welder", "plumber", "roofer",
                  "maker", "builder", "vendor", "shopkeeper", "installer", "technician",
              }
              if not any(term in protagonist for term in role_terms):
                  combined_identity = (
                      protagonist + " " +
                      str(story.get("description", "")).lower() + " " +
                      str(story.get("desire", "")).lower()
                  )
                  if not any(term in combined_identity for term in role_terms):
                      return "protagonist is too vague; include a concrete adult role, skill, or responsibility."

              for field, minimum_words in required_quality:
                  if len(str(story.get(field, "")).split()) < minimum_words:
                      return f"{field} is too vague."

              hook_text = str(story.get("hook", "")).strip()
              if len(hook_text.split()) < 8:
                  return "Hook is too short to establish a concrete premise."

              generic_resolution_phrases = [
                  "new beginning", "promise of renewal", "felt the weight lift",
                  "eyes moist", "tears in her eyes", "tears in his eyes",
                  "quiet gratitude", "new chapter", "everything changed",
              ]
              for phrase in generic_resolution_phrases:
                  if phrase in text:
                      return f"Generic emotional resolution detected: {phrase}"

              trope_combinations = [
                  (("parent", "child"), ("boss", "client", "shift", "job", "work"),
                   "Parent-versus-work emotional shortcut detected."),
                  (("barista", "coffee shop", "cafe"), ("delivery driver", "tip"),
                   "Coffee-shop delivery trope detected."),
                  (("train platform", "station"), ("miss the train", "catch the train"),
                   "Train-departure trope detected."),
                  (("honest", "honesty", "tell the truth"), ("bonus", "promotion", "reward"),
                   "Honesty-for-reward trope detected."),
              ]
              for left_terms, right_terms, message in trope_combinations:
                  if any(term in text for term in left_terms) and any(term in text for term in right_terms):
                      return message

              weak_payoff_phrases = [
                  "gave him a bonus", "gave her a bonus", "got a bonus",
                  "offered him a promotion", "offered her a promotion",
                  "left a thank-you note", "left a thank you note",
                  "gave him a tip", "gave her a tip",
                  "the client approved", "the customer approved",
              ]
              for phrase in weak_payoff_phrases:
                  if phrase in text:
                      return f"Convenient reward ending detected: {phrase}"

              if "license" in text and any(term in text for term in ("review", "regulatory", "investigation", "revoke", "renewal")):
                  return "Artificial professional-stakes mechanism detected."

              if any(term in text for term in ("blooms when", "only blooms when", "magical", "supernatural", "mysteriously", "miraculously")):
                  return "Supernatural or magical story mechanism detected; keep the story realistic."

              if "cut corners" in text and "do the right thing" in text:
                  return "Conflict is framed as a generic moral choice instead of a specific costly dilemma."

              return None

          def make_master_prompt(attempt_number=1):
              mode = rng.choice(MODES)
              emotion = rng.choice(EMOTIONS)
              setting = rng.choice(SETTINGS)
              engine = rng.choice(PREMISE_ENGINES)
              return f"""
          Write ONE original publication-ready emotional micro-story for a faceless
          vertical YouTube Short. This is candidate {attempt_number}.

          CREATIVE DIRECTION
          Mode: {mode}
          Primary emotion: {emotion}
          Setting: {setting}
          Story engine: {engine}

          RECENT CHANNEL HISTORY
          {recent_text}

          BEFORE WRITING, privately generate several premise options. Reject any
          option that resembles a common AI short-film template. Output only the
          strongest remaining premise as the final story.

          HARD STORY RULES
          1. The protagonist must be a specific ordinary adult with a concrete
             responsibility, skill, job, habit, or past mistake.
          2. The protagonist must want something concrete TODAY.
          3. The conflict must come from a physical, professional, logistical, or
             interpersonal problem that could genuinely happen.
          4. Avoid morality-test writing. The conflict must NOT be simply
             "lie vs tell the truth", "work vs child", "career vs family",
             "keep money vs return money", or "help a stranger vs do your own job".
          5. Give the protagonist at least TWO plausible options, each with a
             believable downside. Do not make one choice obviously virtuous.
          6. There must be a concrete cost that remains real after the choice.
          7. Cause and effect must be clear: setup -> complication -> choice ->
             consequence -> adaptation -> earned turning point -> payoff.
          8. The turning point must depend on a previously established fact, skill,
             object, mistake, constraint, or action.
          9. The ending must change the situation in a believable way. Do not solve
             everything perfectly. A useful consequence is better than a reward.
          10. Use one distinctive visual motif that is essential to the plot. Do NOT
              use red ribbons, glowing objects, clocks counting down, handwriting,
              random rain, kites, keys/slots, letters, photographs, coffee cups,
              train arrivals, or generic city skylines as the main motif.
          11. Do not use: child danger/rescue, illness, hospitals, terminal disease,
              secret benefactors, lottery wins, hidden fortunes, supernatural objects,
              miraculous rescues, prophecy, destiny, random coincidence, anonymous
              donors, instant promotions, implausible corporate bonuses, licenses being
              revoked, or strangers appearing with exactly the needed solution.
          12. Do not end with a tip, bonus, promotion, perfect client approval, sudden
              forgiveness, thank-you note, or a character saying a generic moral.
          13. Avoid parent-child emotional shortcuts. Avoid romance as the central
              engine. Prefer adult-to-adult relationships, craft, work, neighbors,
              customers, colleagues, or community responsibilities.
          14. No speeches about hope, courage, humanity, dreams, or life lessons.
              Let specific actions carry the emotion.
          15. The story must work as faceless footage using hands, backs, silhouettes,
              tools, objects, clothing, body language, reflections, and environments.
          16. Target {TARGET_MIN_WORDS}-{TARGET_MAX_WORDS} spoken words; do not finish
              below the target. Absolute allowed range: 105-405 words.
          17. Use 8-12 scenes. Every scene must advance the plot.
          18. The first sentence/action must create a concrete unanswered question
              tied to the central problem.
          19. Do not use blackout, elevator, concert, storm, red-ribbon, glowing-object,
              ticking-clock, coffee-shop, train-platform, or rooftop-confession setups.
          20. The protagonist identity must name the adult and state a concrete role,
              skill, or responsibility; never use labels like "a young woman" alone.
          21. Prefer practical cause-and-effect over theatrical emergencies. The story
              should still work if all dramatic music and narration were removed.

          NOVELTY TEST
          If the concept can be summarized as "ordinary worker helps someone and is
          rewarded" or "parent sacrifices job for child" or "person finds an object
          and learns its sentimental meaning", reject it privately and generate another.

          Return ONLY the final story JSON.
          """

          def make_fresh_story_prompt(rejected_story, critique, attempt_number):
              return f"""
          Create a COMPLETELY NEW original emotional micro-story for a faceless
          vertical YouTube Short. This is replacement candidate {attempt_number}.

          Do NOT repair or cosmetically rewrite the rejected story. Start from a
          different premise, different central mechanism, different setting, different
          relationship, and different visual motif.

          REJECTED STORY
          {json.dumps({
              'title': rejected_story.get('title', ''),
              'protagonist': rejected_story.get('protagonist', ''),
              'setting': rejected_story.get('setting', ''),
              'desire': rejected_story.get('desire', ''),
              'conflict': rejected_story.get('conflict', ''),
              'choice': rejected_story.get('choice', ''),
              'payoff': rejected_story.get('payoff', ''),
          }, ensure_ascii=False)}

          FAILED-CANDIDATE FINGERPRINT
          The previous candidate failed. Do not reuse its central mechanism, setting,
          occupation, relationship, visual motif, or ending pattern. Use the failure
          only as a signal to move farther away from that story family.

          RECENT CHANNEL HISTORY
          {recent_text}

          AVOID THE FAILED FAMILY OF IDEAS
          Do not use any premise structurally similar to the rejected story. Do not
          reuse its object, setting, occupation, relationship, hook mechanism, or payoff.
          Also avoid parent-vs-work, honesty-vs-lying, delivery-driver dilemmas,
          barista/coffee-shop dilemmas, train/platform dilemmas, rooftop confession
          stories, child-rescue plots, surprise bonuses, or perfect rewards.

          REQUIREMENTS
          - Specific adult protagonist.
          - Concrete immediate goal.
          - Real external obstacle.
          - At least two plausible options with different believable downsides.
          - Real consequence after the decision.
          - Turning point seeded earlier.
          - Distinctive plot-specific visual motif.
          - Believable human behavior and institutional rules.
          - No magic, miracle, prophecy, coincidence, benefactor, or sudden forgiveness.
          - No motivational speeches or moral-of-the-story paragraph.
          - No perfect ending; resolve the central problem with a believable consequence.
          - {TARGET_MIN_WORDS}-{TARGET_MAX_WORDS} spoken words target, 105-405 absolute range.
          - 8-12 scenes, faceless-filmable.
          - Do not use blackout, elevator, concert, storm, red-ribbon, glowing-object,
            ticking-clock, coffee-shop, train-platform, or rooftop-confession setups.
          - Name the adult protagonist and give a concrete role, skill, or responsibility.
          - Begin with an action/problem that creates immediate curiosity.

          Return ONLY the new story JSON.
          """

          def make_story_repair_prompt(story, critique):
              return f"""
          Rewrite the following story into a genuinely publication-ready short film.
          This is a STRUCTURAL REPAIR, not a proofreading pass.

          CURRENT STORY
          {json.dumps(story, ensure_ascii=False)}

          CRITIC ISSUES
          {json.dumps(critique.get('issues', []), ensure_ascii=False)}

          Repair every major issue by changing the underlying events where necessary.
          When the critic says the premise is generic, replace the premise rather than
          polishing it. When the average score is below 6, treat the draft as structurally
          failed and rebuild the plot around a new practical mechanism. Do not simply add
          adjectives or symbolic language. The repaired story must differ in at least three
          of these: central problem, choice, consequence, visual motif, setting, or ending.

          ABSOLUTE RULES
          - Keep the situation realistic and physically plausible.
          - Create a genuinely specific hook with immediate stakes.
          - Replace generic moral dilemmas with a concrete practical conflict.
          - Give the protagonist at least two plausible choices with meaningful downsides.
          - Make the cost and consequence persist after the choice.
          - Make the turning point depend on something planted earlier.
          - Make the ending earned and slightly imperfect rather than conveniently happy.
          - Do not use child danger, illness, hospitals, secret benefactors, lottery/fortune,
            magic, miracles, coincidence, instant rewards, promotions, surprise bonuses,
            sudden forgiveness, coffee-shop sentimentality, train-platform sentimentality,
            delivery-driver honesty dilemmas, or parent-vs-work dilemmas.
          - No generic moral speech, inspirational quote, or call to action.
          - Distinctive plot-specific visual motif.
          - {TARGET_MIN_WORDS}-{TARGET_MAX_WORDS} spoken words target; 105-405 absolute range.
          - 8-12 scenes, every scene advances the plot, faceless-filmable.
          - Never use blackout, elevator, concert, storm, red-ribbon, glowing-object,
            ticking-clock, coffee-shop, train-platform, or rooftop-confession setups.
          - Name the adult protagonist and give a concrete role, skill, or responsibility.

          Return ONLY corrected story JSON.
          """

          def make_identity_repair_prompt(story, issue):
              return f"""
          Make a MINIMAL structural correction to this story because the local validator
          found the following issue: {issue}

          CURRENT STORY
          {json.dumps(story, ensure_ascii=False)}

          REQUIREMENTS
          - Give the protagonist a specific adult name, approximate age, and concrete
            role, trade, skill, responsibility, or habit.
          - Preserve the story's existing plot, setting, conflict, choice, consequence,
            turning point, payoff, and scene narration unless a tiny wording change is
            necessary for consistency.
          - Do not add a subplot, moral speech, new emotional reveal, magic, coincidence,
            or a reward ending.
          - Keep the protagonist faceless-filmable.
          - Return ONLY corrected story JSON.
          """

          CRITIC_SCORE_KEYS = [
              "hook_score",
              "originality_score",
              "believability_score",
              "emotional_score",
              "conflict_score",
              "ending_score",
              "visual_score",
          ]
          CRITIC_MIN_AXIS = 7
          CRITIC_MIN_AVG = 6.8

          def critic_average(critique):
              scores = []
              for key in CRITIC_SCORE_KEYS:
                  value = critique.get(key)
                  if not isinstance(value, int) or isinstance(value, bool):
                      return 0.0
                  if value < 0 or value > 10:
                      return 0.0
                  scores.append(value)
              return sum(scores) / len(scores)

          def effective_critic_pass(critique):
              if not isinstance(critique, dict):
                  return False
              average = critic_average(critique)
              all_axes_pass = all(
                  critique.get(key, -1) >= CRITIC_MIN_AXIS
                  for key in CRITIC_SCORE_KEYS
              )
              return all_axes_pass and average >= CRITIC_MIN_AVG

          def normalize_critique(critique):
              normalized = dict(critique)
              average = critic_average(normalized)
              deterministic_pass = effective_critic_pass(normalized)
              model_pass = bool(normalized.get("pass"))
              issues = list(normalized.get("issues") or [])

              if model_pass != deterministic_pass:
                  issues.append(
                      "Critic boolean pass was inconsistent with its numeric scores; "
                      "publication gate used deterministic score validation."
                  )

              normalized["pass"] = deterministic_pass
              normalized["score_average"] = round(average, 2)
              normalized["all_axes_at_least_7"] = all(
                  normalized.get(key, -1) >= CRITIC_MIN_AXIS
                  for key in CRITIC_SCORE_KEYS
              )
              normalized["model_pass"] = model_pass
              normalized["issues"] = issues
              return normalized

          def make_length_repair_prompt(story):
              current_words = word_count(story)
              return f"""
          Repair the following ORIGINAL story only because its narration is too short.

          CURRENT WORD COUNT: {current_words}
          REQUIRED FINAL WORD COUNT: {MIN_WORDS}-{MAX_WORDS}
          TARGET: 140-240 spoken words when possible.

          IMPORTANT:
          - Keep the same title, protagonist, setting, central conflict, choice, cost,
            consequence, turning point and payoff.
          - Do NOT invent a new subplot.
          - Do NOT add generic motivation, moral speeches, filler, or a call to action.
          - Add only concrete actions, reactions, transitions, necessary context, and
            cause-and-effect beats that make the EXISTING story more complete and cinematic.
          - Preserve realistic human behavior and physical plausibility.
          - Keep it faceless-filmable.
          - Keep 7-12 scenes.
          - The final narration MUST be at least {MIN_WORDS} words.
          - Return ONLY corrected story JSON matching the supplied schema.

          STORY:
          {json.dumps(story, ensure_ascii=False)}
          """

          def make_critic_prompt(story):
              return f"""
          Ruthlessly review the following proposed YouTube Short as a professional
          short-film editor.

          STORY:
          {json.dumps(story, ensure_ascii=False)}

          Score 0-10 for:
          hook, originality, believability, emotional impact, conflict, ending,
          visual potential.

          The publication system independently checks the seven numeric scores.
          Mark pass=true ONLY when every score is >= 7 and the seven-score average
          is at least 6.8. Never mark pass=true when any score is below 7.

          Be especially strict about:
          - generic opening
          - generic protagonist
          - artificial moral dilemmas
          - no meaningful personal cost
          - random coincidence
          - weak setup/payoff connection
          - convenient reveals
          - predictable endings
          - common AI emotional tropes
          - visuals that are generic rather than story-specific
          - emotional impact that depends on facial expressions, since this channel is faceless;
            judge emotional impact from actions, choices, consequences, body language, sound,
            and plot-specific objects instead
          - supernatural, magical, or miracle-like mechanisms
          - professional stakes that depend on implausible policy or instant punishment
          - binary "lie or do the right thing" conflicts with no nuanced alternative
          - emotional resolution that happens only because another character suddenly
            becomes forgiving

          Treat magical explanations, random coincidences, child-rescue clichés,
          illness reveals, anonymous benefactors, implausible promotions/licenses,
          and endings that simply reward honesty as fatal flaws.

          For every score below 7, explain the exact structural problem and what
          must change.

          Return ONLY critic JSON.
          """

          def repair_is_too_similar(original, repaired):
              keys = ["setting", "protagonist", "choice", "consequence", "turning_point", "payoff"]
              same = 0
              considered = 0
              for key in keys:
                  a = " ".join(str(original.get(key, "")).lower().split())
                  b = " ".join(str(repaired.get(key, "")).lower().split())
                  if not a or not b:
                      continue
                  considered += 1
                  if a == b:
                      same += 1
              return considered >= 4 and same >= 4

          # ============================================================
          # QUALITY-GATED STORY SEARCH
          # ============================================================

          approved_story = None
          approved_quality_report = None
          last_story = None
          last_critique = None
          rejection_log = []

          for attempt_number in range(1, MAX_STORY_ATTEMPTS + 1):
              print("=" * 60)
              print(f"STORY CANDIDATE {attempt_number}/{MAX_STORY_ATTEMPTS}")
              print("=" * 60)

              if attempt_number == 1:
                  prompt = make_master_prompt(attempt_number)
              else:
                  prompt = make_fresh_story_prompt(
                      last_story or {},
                      last_critique or {"issues": []},
                      attempt_number,
                  )

              try:
                  candidate = call_groq(
                      prompt,
                      STORY_SCHEMA,
                      temperature=0.72,
                      max_tokens=3200,
                  )
              except Exception as exc:
                  print(f"Candidate generation failed: {exc}")
                  rejection_log.append({
                      "attempt": attempt_number,
                      "stage": "generation",
                      "issues": [str(exc)],
                  })
                  last_story = {}
                  last_critique = {"pass": False, "issues": [str(exc)]}
                  continue

              local_issue = local_story_check(candidate)

              if local_issue and local_issue.startswith("Story is too short") and MAX_LENGTH_REPAIRS_PER_CANDIDATE > 0:
                  print("CANDIDATE LENGTH CHECK:", local_issue)
                  print("RUNNING ONE TARGETED LENGTH REPAIR")
                  try:
                      repaired_length = call_groq(
                          make_length_repair_prompt(candidate),
                          STORY_SCHEMA,
                          temperature=0.45,
                          max_tokens=2600,
                      )
                  except Exception as exc:
                      print("Length repair failed:", exc)
                  else:
                      candidate = repaired_length
                      local_issue = local_story_check(candidate)
                      if local_issue:
                          print("LENGTH-REPAIRED CANDIDATE LOCAL CHECK:", local_issue)
                      else:
                          print("LENGTH REPAIR PASSED — CONTINUING TO QUALITY REVIEW")

              if local_issue and local_issue.startswith("protagonist is too vague"):
                  print("CANDIDATE IDENTITY CHECK:", local_issue)
                  print("RUNNING ONE TARGETED PROTAGONIST REPAIR")
                  try:
                      repaired_identity = call_groq(
                          make_identity_repair_prompt(candidate, local_issue),
                          STORY_SCHEMA,
                          temperature=0.35,
                          max_tokens=2100,
                      )
                  except Exception as exc:
                      print("Identity repair failed:", exc)
                  else:
                      candidate = repaired_identity
                      local_issue = local_story_check(candidate)
                      if local_issue:
                          print("IDENTITY-REPAIRED CANDIDATE LOCAL CHECK:", local_issue)
                      else:
                          print("IDENTITY REPAIR PASSED — CONTINUING TO QUALITY REVIEW")

              if local_issue:
                  print("CANDIDATE LOCAL CHECK:", local_issue)
                  rejection_log.append({
                      "attempt": attempt_number,
                      "stage": "local",
                      "issues": [local_issue],
                  })
                  last_story = candidate
                  last_critique = {"pass": False, "issues": [local_issue]}
                  continue

              last_story = candidate

              print("=" * 60)
              print(f"QUALITY REVIEW FOR CANDIDATE {attempt_number}")
              print("=" * 60)

              try:
                  raw_critique = call_groq(
                      make_critic_prompt(candidate),
                      CRITIC_SCHEMA,
                      temperature=0.10,
                      max_tokens=950,
                  )
              except Exception as exc:
                  print(f"Critic call failed: {exc}")
                  rejection_log.append({
                      "attempt": attempt_number,
                      "stage": "critic",
                      "issues": [str(exc)],
                  })
                  last_critique = {"pass": False, "issues": [str(exc)]}
                  continue

              critique = normalize_critique(raw_critique)
              last_critique = critique
              print(json.dumps(critique, ensure_ascii=False, indent=2))
              print(
                  f"Deterministic quality result: pass={critique['pass']} "
                  f"average={critique['score_average']:.2f}"
              )

              if critique["pass"]:
                  approved_story = candidate
                  approved_quality_report = critique
                  print("CANDIDATE PASSED DETERMINISTIC QUALITY GATE")
                  break

              rejection_log.append({
                  "attempt": attempt_number,
                  "stage": "quality",
                  "score_average": critique["score_average"],
                  "issues": critique.get("issues", []),
              })

              # Give the strongest failed candidate exactly one structural repair.
              # This is the important reliability change: good premises that score
              # 4-6 are not thrown away immediately; the critic's concrete failures
              # are fed back into one complete rewrite and checked again.
              if MAX_REPAIR_ROUNDS_PER_CANDIDATE > 0:
                  print("CANDIDATE FAILED — RUNNING ONE STRUCTURAL QUALITY REPAIR")
                  try:
                      repaired = call_groq(
                          make_story_repair_prompt(candidate, critique),
                          STORY_SCHEMA,
                          temperature=0.62,
                          max_tokens=2500,
                      )
                  except Exception as exc:
                      print(f"Structural repair failed: {exc}")
                      rejection_log.append({
                          "attempt": attempt_number,
                          "stage": "repair",
                          "issues": [str(exc)],
                      })
                  else:
                      if repair_is_too_similar(candidate, repaired):
                          repaired_issue = "Structural repair was too similar to the failed story."
                      else:
                          repaired_issue = local_story_check(repaired)
                      if repaired_issue:
                          print("REPAIRED CANDIDATE LOCAL CHECK:", repaired_issue)
                          rejection_log.append({
                              "attempt": attempt_number,
                              "stage": "local_after_repair",
                              "issues": [repaired_issue],
                          })
                      else:
                          try:
                              repaired_raw_critique = call_groq(
                                  make_critic_prompt(repaired),
                                  CRITIC_SCHEMA,
                                  temperature=0.10,
                                  max_tokens=950,
                              )
                              repaired_critique = normalize_critique(repaired_raw_critique)
                              print("=" * 60)
                              print(f"QUALITY REVIEW AFTER REPAIR FOR CANDIDATE {attempt_number}")
                              print("=" * 60)
                              print(json.dumps(repaired_critique, ensure_ascii=False, indent=2))
                              print(
                                  f"Deterministic quality result after repair: "
                                  f"pass={repaired_critique['pass']} "
                                  f"average={repaired_critique['score_average']:.2f}"
                              )

                              if repaired_critique["pass"]:
                                  approved_story = repaired
                                  approved_quality_report = repaired_critique
                                  print("REPAIRED CANDIDATE PASSED DETERMINISTIC QUALITY GATE")
                                  break

                              rejection_log.append({
                                  "attempt": attempt_number,
                                  "stage": "quality_after_repair",
                                  "score_average": repaired_critique["score_average"],
                                  "issues": repaired_critique.get("issues", []),
                              })
                              last_critique = repaired_critique
                              last_story = repaired
                          except Exception as exc:
                              print(f"Repair critic failed: {exc}")
                              rejection_log.append({
                                  "attempt": attempt_number,
                                  "stage": "repair_critic",
                                  "issues": [str(exc)],
                              })

              if approved_story is not None:
                  break

              last_story = candidate
              print("CANDIDATE REJECTED — GENERATING A FRESH PREMISE")
              if attempt_number < MAX_STORY_ATTEMPTS:
                  time.sleep(2)

          if approved_story is None or approved_quality_report is None:
              summary = {
                  "attempts": MAX_STORY_ATTEMPTS,
                  "api_calls_used": api_calls,
                  "last_critique": last_critique,
                  "rejections": rejection_log,
              }
              raise RuntimeError(
                  "No publication-ready story passed all deterministic gates after "
                  f"{MAX_STORY_ATTEMPTS} candidates plus bounded structural repair. "
                  "Nothing will be published. Diagnostic summary: "
                  + json.dumps(summary, ensure_ascii=False)
              )

          story = approved_story
          quality_report = approved_quality_report

          final_local_issue = local_story_check(story)
          if final_local_issue:
              raise RuntimeError(
                  "Approved story unexpectedly failed final local validation: "
                  + final_local_issue
              )

          if not effective_critic_pass(quality_report):
              raise RuntimeError(
                  "Internal safety check failed: approved quality report does not "
                  "satisfy deterministic score thresholds."
              )

          # ============================================================
          # FINAL LOCAL VALIDATION + PRODUCTION DATA
          # ============================================================

          total = word_count(story)

          duration = max(
              MIN_DURATION,
              min(
                  MAX_DURATION,
                  round(total / WPM * 60),
              ),
          )

          scene_count = len(story["scenes"])
          base_words = total // scene_count
          remainder = total % scene_count

          production_scenes = []

          for index, scene in enumerate(story["scenes"]):
              scene_words = base_words + (1 if index < remainder else 0)
              seconds = max(3, round(scene_words / WPM * 60))

              production_scenes.append({
                  "scene": scene["scene"],
                  "duration_seconds": seconds,
                  "narration": scene["narration"],
                  "visual_prompt": (
                      "Production-ready faceless cinematic shot for this exact narration: "
                      + scene["narration"]
                      + ". Preserve continuity of clothing, props, location, season and time. "
                        "Use backs, hands, silhouettes, body language, reflections, objects and "
                        "environment; never require an identifiable face. Realistic materials, "
                        "natural lighting, physically plausible action, strong composition, "
                        "vertical 9:16."
                  ),
                  "camera": "subtle physically plausible movement that reinforces the action",
                  "on_screen_text": "",
                  "sfx": "natural location sound synchronized to the visible action",
              })

          OUTPUT_DIR.mkdir(exist_ok=True)

          (OUTPUT_DIR / "story.json").write_text(
              json.dumps(story, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "quality_report.json").write_text(
              json.dumps(quality_report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "scenes.json").write_text(
              json.dumps(
                  {
                      "duration_seconds": duration,
                      "scenes": production_scenes,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          (OUTPUT_DIR / "title.txt").write_text(
              story["title"] + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "script.txt").write_text(
              " ".join(scene["narration"] for scene in story["scenes"]) + "\n",
              encoding="utf-8",
          )

          (OUTPUT_DIR / "description.txt").write_text(
              story["description"] + "\n",
              encoding="utf-8",
          )

          # ============================================================
          # HISTORY
          # ============================================================

          history.append({
              "title": story["title"],
              "premise": story["description"],
              "setting": story["setting"],
              "passed_critic": True,
              "score_average": quality_report["score_average"],
          })

          HISTORY_FILE.parent.mkdir(parents=True, exist_ok=True)
          HISTORY_FILE.write_text(
              json.dumps(history[-100:], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print("=" * 60)
          print("STORY APPROVED — DETERMINISTIC QUALITY GATE PASSED")
          print("=" * 60)
          print("Title:", story["title"])
          print("Words:", total)
          print("Duration:", duration, "seconds")
          print("Scenes:", scene_count)
          print("Groq calls used:", api_calls)
          print("Deterministic quality gate: PASS")
          print("Quality:")
          print(json.dumps(quality_report, ensure_ascii=False, indent=2))
          PY

      - name: Commit story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/story_history.json
          git diff --cached --quiet || git commit -m "Update story history"
          git push

      - name: Upload story artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-story
          path: story-output/
